# API responses are inferred from the scenarios and API models, not recorded.
version: 1
host_metadata: # Dummy host metadata.
  host_type: "workspace"
  cloud: "AWS"
  workspace_id: "12345"
steps:
  - name: "create"
    config: |
      locals {
        name = "pipeline-acceptance-replay"
      }
      resource "databricks_pipeline" "this" {
        name    = local.name
        storage = "/test/${local.name}"

        configuration = {
          key1 = "value1"
          key2 = "value2"
        }

        library {
          notebook {
            path = databricks_notebook.this.path
          }
        }

        cluster {
          instance_pool_id = "pool-1"
          label            = "default"
          num_workers      = 2
          custom_tags = {
            cluster_type = "default"
          }
        }

        cluster {
          instance_pool_id = "pool-1"
          label            = "maintenance"
          num_workers      = 1
          custom_tags = {
            cluster_type = "maintenance"
          }
        }

        continuous = false
      }
      resource "databricks_notebook" "this" {
        content_base64 = base64encode(<<-EOT
          CREATE LIVE TABLE clickstream_raw AS
          SELECT * FROM json.`/databricks-datasets/wikipedia-datasets/data-001/clickstream/raw-uncompressed-json/2015_2_clickstream.json`

          -- COMMAND ----------

          CREATE LIVE TABLE clickstream_clean(
            CONSTRAINT valid_current_page EXPECT (current_page_id IS NOT NULL and current_page_title IS NOT NULL),
            CONSTRAINT valid_count EXPECT (click_count > 0) ON VIOLATION FAIL UPDATE
          ) TBLPROPERTIES ("quality" = "silver")
          AS SELECT
            CAST (curr_id AS INT) AS current_page_id,
            curr_title AS current_page_title,
            CAST(n AS INT) AS click_count,
            CAST (prev_id AS INT) AS previous_page_id,
            prev_title AS previous_page_title
          FROM live.clickstream_raw

          -- COMMAND ----------

          CREATE LIVE TABLE top_spark_referers TBLPROPERTIES ("quality" = "gold")
          AS SELECT
            previous_page_title as referrer,
            click_count
          FROM live.clickstream_clean
          WHERE current_page_title = 'Apache_Spark'
          ORDER BY click_count DESC
          LIMIT 10
          EOT
        )
        path     = "/Shared/${local.name}"
        language = "SQL"
      }
    calls:
      - request:
          method: "POST"
          path: "/api/2.0/workspace/import"
          body:
            json:
              content: ""
              format: "SOURCE"
              language: "SQL"
              overwrite: true
              path: "/Shared/pipeline-acceptance-replay"
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              object_id: 200
      - request:
          method: "POST"
          path: "/api/2.0/pipelines"
          body:
            json:
              channel: "CURRENT"
              clusters:
                - custom_tags:
                    cluster_type: "default"
                  instance_pool_id: "pool-1"
                  label: "default"
                  num_workers: 2
                - custom_tags:
                    cluster_type: "maintenance"
                  instance_pool_id: "pool-1"
                  label: "maintenance"
                  num_workers: 1
              configuration:
                key1: "value1"
                key2: "value2"
              edition: "ADVANCED"
              libraries:
                - notebook:
                    path: "/Shared/pipeline-acceptance-replay"
              name: "pipeline-acceptance-replay"
              storage: "/test/pipeline-acceptance-replay"
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              pipeline_id: "pipeline-1"
      - &get_1
        request:
          method: "GET"
          path: "/api/2.0/pipelines/pipeline-1"
          body: null
        response: &response_1 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              creator_user_name: "tester@example.com"
              name: "pipeline-acceptance-replay"
              pipeline_id: "pipeline-1"
              spec:
                channel: "CURRENT"
                clusters:
                  - custom_tags:
                      cluster_type: "default"
                    instance_pool_id: "pool-1"
                    label: "default"
                    num_workers: 2
                  - custom_tags:
                      cluster_type: "maintenance"
                    instance_pool_id: "pool-1"
                    label: "maintenance"
                    num_workers: 1
                configuration:
                  key1: "value1"
                  key2: "value2"
                continuous: false
                edition: "ADVANCED"
                libraries:
                  - notebook:
                      path: "/Shared/pipeline-acceptance-replay"
                name: "pipeline-acceptance-replay"
                storage: "/test/pipeline-acceptance-replay"
              state: "IDLE"
      - *get_1
      - &get_2
        request:
          method: "GET"
          path: "/api/2.0/preview/scim/v2/Me"
          query:
            excludedAttributes: ["entitlements"]
          body: null
        response: &response_2 # Inferred API response; not recorded.
          status: 200
          headers:
            "X-Databricks-Org-Id": "12345"
          body:
            json:
              displayName: "Replay tester"
              id: "100"
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:User"]
              userName: "tester@example.com"
      - &get_3
        request:
          method: "GET"
          path: "/api/2.0/workspace/get-status"
          query:
            path: ["/Shared/pipeline-acceptance-replay"]
          body: null
        response: &response_3 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              language: "SQL"
              object_id: 200
              object_type: "NOTEBOOK"
              path: "/Shared/pipeline-acceptance-replay"
      - *get_1
destroy:
  calls:
    - *get_2
    - *get_3
    - *get_1
    - request:
        method: "DELETE"
        path: "/api/2.0/pipelines/pipeline-1"
        body: null
      response: # Inferred API response; not recorded.
        status: 200
        body: null
    - request:
        method: "GET"
        path: "/api/2.0/pipelines/pipeline-1"
        body: null
      response: &response_4 # Inferred API response; not recorded.
        status: 404
        body:
          json:
            error_code: "RESOURCE_DOES_NOT_EXIST"
            message: "Pipeline not found"
    - request:
        method: "POST"
        path: "/api/2.0/workspace/delete"
        body:
          json:
            path: "/Shared/pipeline-acceptance-replay"
      response: # Inferred API response; not recorded.
        status: 200
        body: null
