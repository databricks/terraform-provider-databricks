# Runs
# volume_routing/testdata/provider_config_mismatched_workspace_id_rejected_at_apply.yaml
# with databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same
# requests and behavior. The original's description:
#
# Pins provider_config.workspace_id different from the workspace of a workspace-level
# provider. The plan succeeds without any call, and apply fails on the mismatch before
# any volume call. Host metadata supplies the provider's workspace ID, so no SCIM /Me
# call happens either.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: plan_with_mismatched_workspace_id_succeeds
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: &config |
      resource "databricks_volume" "this" {
        name         = "mismatched_ws_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "67890"
        }
      }
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
          after:
            - path: [provider_config, 0, workspace_id]
              equals: "67890"
    calls: []
  - name: apply_with_mismatched_workspace_id_fails_before_volume_call
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'cannot create volume: failed to validate workspace_id: workspace_id
      mismatch: provider is configured for workspace 12345 but got 67890 in
      provider_config\. please check the workspace_id provided in provider_config'
    calls: []
destroy:
  calls: []
