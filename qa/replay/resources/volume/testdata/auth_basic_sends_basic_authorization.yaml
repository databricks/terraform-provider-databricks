# Pins the credentials of every databricks_volume call with basic auth. The POST, GET,
# PATCH and DELETE each send one Authorization: Basic header with base64 of
# replay-user:replay-password, no cloud credential header, and no token request comes
# first. A pattern matcher requires exactly one value, so a lost or duplicated header
# fails. API responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
auth:
  type: basic
  username: replay-user
  password: replay-password
steps:
  - name: create
    config: |
      resource "databricks_volume" "this" {
        name         = "auth_basic_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: &credentials
            headers:
              Authorization: {pattern: 'Basic cmVwbGF5LXVzZXI6cmVwbGF5LXBhc3N3b3Jk'}
              X-Databricks-Azure-Sp-Management-Token: absent
              X-Databricks-Azure-Workspace-Resource-Id: absent
              X-Databricks-Gcp-Sa-Access-Token: absent
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "auth_basic_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "auth_basic_volume",
                            "full_name": "main.replay.auth_basic_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-302",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000302"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.auth_basic_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: *credentials
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.auth_basic_volume
  - name: update
    config: |
      resource "databricks_volume" "this" {
        name         = "auth_basic_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "basic"
      }
    calls:
      - *read_created
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.auth_basic_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: *credentials
          body:
            json: {"comment": "basic"}
        response:
          status: 200
          body:
            json: &commented {"catalog_name": "main", "schema_name": "replay",
                              "name": "auth_basic_volume",
                              "full_name": "main.replay.auth_basic_volume",
                              "volume_type": "MANAGED", "comment": "basic",
                              "owner": "replay-admin@example.com",
                              "storage_location": "s3://replay-metastore/volume-302",
                              "metastore_id": "11111111-1111-1111-1111-111111111111",
                              "volume_id": "00000000-0000-4000-8000-000000000302"}
      - &read_commented
        request: *read_request
        response:
          status: 200
          body:
            json: *commented
      - *read_commented
destroy:
  calls:
    - *read_commented
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.auth_basic_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        matchers: *credentials
        body: null
      response:
        status: 200
        body:
          json: {}
