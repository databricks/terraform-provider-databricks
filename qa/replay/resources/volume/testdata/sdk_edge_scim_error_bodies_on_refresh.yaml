# Pins how the classic SDK turns SCIM-shaped (RFC 7644 section 3.12) refresh GET error
# bodies into diagnostics. Without a message, the SDK uses the detail, or "SCIM API
# Internal Error" when the detail is the string "null", prefixed with scimType when set.
# A message, when present, wins over the detail. A SCIM 404 still removes the volume from
# state, because the SDK's SCIM_<status> error code is not one it maps, so the HTTP status
# decides. Failing refreshes keep the volume in state, so the next step reads it again.
# None of these is retried. API responses are inferred from the Unity Catalog API
# contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_volume" "this" {
        name         = "scim_refresh_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "scim_refresh_volume", "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "scim_refresh_volume",
                   "full_name": "main.replay.scim_refresh_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-302",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000302"}
      - &read_volume
        request: &read
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.scim_refresh_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *volume
      - *read_volume
  - name: refresh_answered_scim_400_fails_with_scim_type_and_detail
    config: *config
    expect_error: 'Error: cannot read volume: invalidValue Volume name is not valid\.\n'
    calls:
      - request: *read
        response:
          status: 400
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "scimType": "invalidValue", "detail": "Volume name is not valid.",
                   "status": "400"}
  - name: refresh_answered_scim_500_with_null_detail_fails_with_internal_error_text
    config: *config
    expect_error: 'Error: cannot read volume: SCIM API Internal Error\n'
    calls:
      - request: *read
        response:
          status: 500
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "null", "status": "500"}
  - name: refresh_answered_scim_400_with_message_fails_with_message_only
    config: *config
    expect_error: 'Error: cannot read volume: Volume lookup failed\.\n'
    calls:
      - request: *read
        response:
          status: 400
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "message": "Volume lookup failed.", "scimType": "invalidValue",
                   "detail": "Volume name is not valid.", "status": "400"}
  - name: refresh_answered_scim_404_plans_create
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls:
      - request: *read
        response:
          status: 404
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Volume main.replay.scim_refresh_volume does not exist.",
                   "status": "404"}
  - name: refresh_answered_scim_404_with_null_detail_plans_create
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls:
      - request: *read
        response:
          status: 404
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "scimType": "invalidValue", "detail": "null", "status": "404"}
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.scim_refresh_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
