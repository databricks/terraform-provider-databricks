# Pins that a refresh adopts a remote owner change when owner isn't configured. The
# computed owner takes the new remote value and the plan stays empty. API responses are
# inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_without_owner
    config: &config |
      resource "databricks_volume" "this" {
        name         = "adopted_owner_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "adopted_owner_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "adopted_owner_volume",
                            "full_name": "main.replay.adopted_owner_volume",
                            "volume_type": "MANAGED",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-18913",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000018913"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.adopted_owner_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: remote_owner_change_is_adopted
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [owner]
              equals: new-owner@example.com
    calls:
      - &read_new_owner
        request: *read_request
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "adopted_owner_volume",
                   "full_name": "main.replay.adopted_owner_volume",
                   "volume_type": "MANAGED", "owner": "new-owner@example.com",
                   "storage_location": "s3://replay-metastore/volume-18913",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000018913"}
destroy:
  calls:
    - *read_new_owner
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.adopted_owner_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
