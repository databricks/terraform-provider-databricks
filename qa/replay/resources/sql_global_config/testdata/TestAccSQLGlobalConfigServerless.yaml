        method: "PUT"
        path: "/api/2.0/sql/config/warehouses"
        body:
          json:
            data_access_config: []
            enable_serverless_compute: true
            security_policy: "DATA_ACCESS_CONTROL"
      response: # Inferred API response; not recorded.
        status: 200
        body: null
