# Pins importing a model whose GET answers 404. The importer's read doesn't ignore a
# missing model, but the default importer in common/resource.go returns
# diags[0].Validate(), which is nil for any diagnostic with a summary, so the 404 is
# dropped and Terraform refreshes the imported ID. That refresh ignores the 404 and
# clears the ID, so the user sees Terraform's own error and the following plan creates
# the model because nothing was imported. API responses are inferred from the MLflow
# Model Registry API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: import_answered_404_fails_with_terraform_error
    config: &config |
      resource "databricks_mlflow_model" "this" {
        name = "missing-import-model"
      }
    import:
      resource: databricks_mlflow_model.this
      id: missing-import-model
      persist: true
    expect_error: 'Error: Cannot import non-existent remote object\n\nWhile attempting
      to import an existing object to\n"databricks_mlflow_model\.this", the provider
      detected that no object exists\nwith the given id\. Only pre-existing objects can
      be imported; check that the\nid is correct and that it is associated with the
      provider''s configured region\nor endpoint, or use "terraform apply" to create a
      new remote object for this\nresource\.\n'
    calls:
      # The importer's GET, then the refresh GET after import.
      - &read_missing
        request:
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [missing-import-model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 404
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "RegisteredModel 'missing-import-model' does not exist.
                     It might have been deleted."}
      - *read_missing
  - name: nothing_imported_so_plan_creates
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [create]
    calls: []
destroy:
  calls: []
