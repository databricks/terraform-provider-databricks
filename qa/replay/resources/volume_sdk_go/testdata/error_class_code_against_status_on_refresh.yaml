# Runs volume/testdata/error_class_code_against_status_on_refresh.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same requests
# and behavior. The original's description:
#
# Pins that the classic SDK classifies a refresh GET error by its error_code before its
# status. A 404 with INVALID_PARAMETER_VALUE fails and keeps the volume. A 429 with
# INVALID_PARAMETER_VALUE, and a 429 with a plain-text body (error code UNKNOWN), are sent
# once and not retried. A 400 with the numeric error_code 429 is not treated as rate
# limiting either. RESOURCE_DOES_NOT_EXIST counts as missing on a 500 and on a 409. API
# responses are handwritten for the classic SDK's error parser, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "code_status_refresh_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "code_status_refresh_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "code_status_refresh_volume",
                            "full_name": "main.replay.code_status_refresh_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-1963",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001963"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.code_status_refresh_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_answered_404_invalid_parameter_value_fails
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: Volume name is not valid\.\n'
    calls:
      - request: *read_request
        response:
          status: 404
          body:
            json: {"error_code": "INVALID_PARAMETER_VALUE",
                   "message": "Volume name is not valid."}
  - name: state_kept_after_404_invalid_parameter_value
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: &plan_empty
      expect: empty
      changes: {}
    state: &state_kept
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.code_status_refresh_volume
    calls:
      - *read_created
  - name: refresh_answered_429_invalid_parameter_value_is_not_retried
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: Volume name is not valid\.\n'
    calls:
      - request: *read_request
        response:
          status: 429
          body:
            json: {"error_code": "INVALID_PARAMETER_VALUE",
                   "message": "Volume name is not valid."}
  - name: state_kept_after_429_invalid_parameter_value
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *plan_empty
    state: *state_kept
    calls:
      - *read_created
  - name: refresh_answered_429_plain_text_is_not_retried
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: Too many requests, slow down\.\n'
    calls:
      - request: *read_request
        response:
          status: 429
          headers:
            Content-Type: text/plain; charset=utf-8
          body:
            text: Too many requests, slow down.
  - name: state_kept_after_429_plain_text
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *plan_empty
    state: *state_kept
    calls:
      - *read_created
  - name: refresh_answered_400_numeric_error_code_429_is_not_retried
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: Request rate is too high\.\n'
    calls:
      - request: *read_request
        response:
          status: 400
          body:
            json: {"error_code": 429, "message": "Request rate is too high."}
  - name: state_kept_after_400_numeric_error_code_429
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *plan_empty
    state: *state_kept
    calls:
      - *read_created
  - name: refresh_answered_500_resource_does_not_exist_is_missing
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: &plan_create
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Volume 'main.replay.code_status_refresh_volume' does not
                     exist."}
  - name: refresh_answered_409_resource_does_not_exist_is_missing
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *plan_create
    calls:
      - request: *read_request
        response:
          status: 409
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Volume 'main.replay.code_status_refresh_volume' does not
                     exist."}
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.code_status_refresh_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
