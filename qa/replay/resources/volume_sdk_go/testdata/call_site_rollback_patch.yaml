# Runs volume/testdata/call_site_rollback_patch.yaml with databricks_volume on sdk-go
# uc/volumes/v1 in every step, and expects the same behavior, except where noted. The
# volume POST, GET, PATCH and DELETE requests carry no Accept header, which an empty
# header expectation pins. Each PATCH body also carries full_name_arg, the full name in
# its path, because sdk-go serializes the path field into the body. When the rollback
# PATCH is answered 200 with malformed JSON, the owner-rollback message quotes the same
# unmarshal error, but without the existing client's request log. The original's
# description:
#
# Pins the owner rollback PATCH failing after an update's owner PATCH succeeded and its
# fields PATCH was rejected: 401, 404, 409, 500, 502, 504 with a message that matches no
# transient pattern, and 200 with malformed JSON. Each failure fails apply with the
# combined owner rollback error, which names the fields PATCH's error, the rollback's
# error, the new owner and the old owner, and sends no read. The volume keeps its ID and
# the new owner, so the next plan changes only the comment, and each later step moves the
# owner one further to reach the rollback again. API responses are inferred from the
# Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_owner
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "rollback_errors_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first"
        owner        = "owner-a@example.com"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "rollback_errors_volume", "volume_type": "MANAGED",
                   "comment": "first"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "rollback_errors_volume",
                   "full_name": "main.replay.rollback_errors_volume",
                   "volume_type": "MANAGED", "comment": "first",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-1926",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001926"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.rollback_errors_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.rollback_errors_volume",
                   "comment": "first", "owner": "owner-a@example.com"}
        response: &owner_a
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "rollback_errors_volume",
                   "full_name": "main.replay.rollback_errors_volume",
                   "volume_type": "MANAGED", "comment": "first",
                   "owner": "owner-a@example.com",
                   "storage_location": "s3://replay-metastore/volume-1926",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001926"}
      - &read_owner_a
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.rollback_errors_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response: *owner_a
      - *read_owner_a
  - name: rollback_patch_401_fails_with_the_owner_rollback_error
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_owner_b |
      resource "databricks_volume" "this" {
        name         = "rollback_errors_volume"
