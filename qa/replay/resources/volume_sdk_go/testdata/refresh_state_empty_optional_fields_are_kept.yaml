# Runs volume/testdata/refresh_state_empty_optional_fields_are_kept.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same behavior.
# The volume POST and GET requests carry no Accept header, which an empty header
# expectation pins. The original's description:
#
# Pins that a refresh skips empty optional fields. State holds a configured comment and
# the server-set owner and storage_location; reads that omit the three fields, return
# them as null or return them as "" keep the old values in state, and the plan stays
# empty. A value cleared outside Terraform is never detected; this is a suspected
# defect, pinned as-is. API responses are inferred from the Unity Catalog API contract,
# not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_comment
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "kept_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "managed comment"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "kept_volume", "volume_type": "MANAGED",
                   "comment": "managed comment"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "kept_volume",
                            "full_name": "main.replay.kept_volume",
                            "volume_type": "MANAGED", "comment": "managed comment",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-18909",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000018909"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.kept_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: omitted_fields_keep_state
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state: &kept_state
      resources:
        databricks_volume.this:
          attributes:
            - path: [comment]
              equals: managed comment
            - path: [owner]
              equals: replay-admin@example.com
            - path: [storage_location]
              equals: s3://replay-metastore/volume-18909
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "kept_volume", "full_name": "main.replay.kept_volume",
                   "volume_type": "MANAGED",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000018909"}
  - name: null_fields_keep_state
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state: *kept_state
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "kept_volume", "full_name": "main.replay.kept_volume",
                   "volume_type": "MANAGED", "comment": null, "owner": null,
                   "storage_location": null,
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000018909"}
  - name: empty_string_fields_keep_state
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state: *kept_state
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "kept_volume", "full_name": "main.replay.kept_volume",
                   "volume_type": "MANAGED", "comment": "", "owner": "",
                   "storage_location": "",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000018909"}
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.kept_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
