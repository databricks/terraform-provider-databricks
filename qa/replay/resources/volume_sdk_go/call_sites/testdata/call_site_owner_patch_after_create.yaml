# Runs volume_call_sites/testdata/call_site_owner_patch_after_create.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same behavior,
# except where noted. The volume POST, GET, PATCH and DELETE requests carry no Accept
# header, which an empty header expectation pins. Each PATCH body also carries
# full_name_arg, the full name in its path, because sdk-go serializes the path field into
# the body. An owner PATCH answered 200 with malformed JSON fails create with the same
# unmarshal error, but without the existing client's request log, so its pattern ends at
# the error. The original's description:
#
# Pins the owner PATCH that follows a successful create POST, for errors the classic SDK
# does not retry: 401, 403, 404 RESOURCE_DOES_NOT_EXIST, 409, 502, 504 with a message that
# matches no transient pattern, and 200 with malformed JSON. Each one fails apply with
# the PATCH's error and sends no read. The volume stays in state under the created full
# name and is tainted, so the next plan replaces it although the configuration is
# unchanged, and the next apply deletes it and creates it again. API responses are
# inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: owner_patch_401_fails_create_without_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "owner_on_create_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "data-engineers"
      }
    expect_error: 'Error: cannot create volume: Credential was not sent or was of an
      unsupported type for this API\.\n'
    calls:
      - &create
        request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "owner_on_create_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "owner_on_create_volume",
                            "full_name": "main.replay.owner_on_create_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-1921",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001921"}
      - request: &owner_patch_request
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_on_create_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.owner_on_create_volume",
                   "owner": "data-engineers"}
        response:
          status: 401
          body:
            json: {"error_code": "UNAUTHENTICATED",
                   "message": "Credential was not sent or was of an unsupported type for
                     this API."}
  - name: plan_after_401_replaces_the_tainted_volume
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: &replaces
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete, create]
    state: &created_id
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.owner_on_create_volume
    calls:
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_on_create_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
  - name: owner_patch_403_fails_the_replacing_create_without_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: User does not have MANAGE on Volume
      ''main\.replay\.owner_on_create_volume''\.\n'
    calls:
      - *read_created
      - &delete
        request:
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_on_create_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: {}
      - *create
      - request: *owner_patch_request
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "User does not have MANAGE on Volume
                     'main.replay.owner_on_create_volume'."}
  - name: plan_after_403_replaces_the_tainted_volume
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *replaces
    state: *created_id
    calls:
      - *read_created
  - name: owner_patch_404_resource_does_not_exist_fails_create_without_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: Volume
      ''main\.replay\.owner_on_create_volume'' does not exist\.\n'
    calls:
      - *read_created
      - *delete
      - *create
      - request: *owner_patch_request
        response:
          status: 404
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Volume 'main.replay.owner_on_create_volume' does not
                     exist."}
  - name: plan_after_404_replaces_the_tainted_volume
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *replaces
    state: *created_id
    calls:
      - *read_created
  - name: owner_patch_409_fails_create_without_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: Volume
      ''main\.replay\.owner_on_create_volume'' was modified concurrently\.\n'
    calls:
      - *read_created
      - *delete
      - *create
      - request: *owner_patch_request
        response:
          status: 409
          body:
            json: {"error_code": "RESOURCE_CONFLICT",
                   "message": "Volume 'main.replay.owner_on_create_volume' was modified
                     concurrently."}
  - name: plan_after_409_replaces_the_tainted_volume
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *replaces
    state: *created_id
    calls:
      - *read_created
  - name: owner_patch_502_fails_create_without_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: Bad gateway\.\n'
    calls:
      - *read_created
      - *delete
      - *create
      - request: *owner_patch_request
        response:
          status: 502
          body:
            json: {"error_code": "BAD_GATEWAY", "message": "Bad gateway."}
  - name: plan_after_502_replaces_the_tainted_volume
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *replaces
    state: *created_id
    calls:
      - *read_created
  - name: owner_patch_504_with_a_non_transient_message_fails_create_without_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: Upstream request timeout\.\n'
    calls:
      - *read_created
      - *delete
      - *create
      - request: *owner_patch_request
        response:
          status: 504
          body:
            json: {"error_code": "DEADLINE_EXCEEDED",
                   "message": "Upstream request timeout."}
  - name: plan_after_504_replaces_the_tainted_volume
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *replaces
    state: *created_id
    calls:
      - *read_created
  - name: owner_patch_200_with_malformed_json_fails_create_without_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: failed to unmarshal response body:
      unexpected end of JSON input\n'
    calls:
      - *read_created
      - *delete
      - *create
      - request: *owner_patch_request
        response:
          status: 200
          headers:
            Content-Type: application/json
          body:
            text: '{"full_name": "main.replay.owner_on_create_volume",'
  - name: plan_after_malformed_json_replaces_the_tainted_volume
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *replaces
    state: *created_id
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - *delete
