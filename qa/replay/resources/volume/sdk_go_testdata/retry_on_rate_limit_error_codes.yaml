# Runs retry_on_rate_limit_error_codes with reads through sdk-go uc/volumes/v1. The
# refresh GET is retried once when a 400 carries REQUEST_LIMIT_EXCEEDED or
# RESOURCE_EXHAUSTED. The GETs carry no Accept header, which the existing client sends.
# Writes stay on the existing path. API responses are inferred from the Unity Catalog API
# contract, not recorded. An empty header expectation matches only requests without that
# header.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: read_retries_request_limit_exceeded_and_resource_exhausted_codes
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "retry_volume",
                   "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "retry_volume",
                   "full_name": "main.replay.retry_volume", "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volumes/00000000-0000-4000-8000-000000000002",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000002"}
      - request: &read
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
          headers:
            Accept: ""
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 400
          body:
            json: {"error_code": "REQUEST_LIMIT_EXCEEDED", "message": "Rate limit hit in fixture"}
      - request: *read
        response: *volume
      - request: *read
        response:
          status: 400
          body:
            json: {"error_code": "RESOURCE_EXHAUSTED", "message": "Quota used up in fixture"}
      - request: *read
        response: *volume
destroy:
  calls:
    - request: *read
      response: *volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
