# Runs volume_errors/testdata/delete_success_body_is_not_decoded.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same requests
# and behavior. The original's description:
#
# Pins that a successful DELETE's body is never decoded. A DELETE answered 200 with plain
# text, with an HTML page or with a JSON array deletes the volume, where the same bodies
# fail a create, a refresh or an update. Each delete is followed by a create of the same
# volume. API responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "undecoded_delete_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls: &create_calls
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "undecoded_delete_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "undecoded_delete_volume",
                            "full_name": "main.replay.undecoded_delete_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-231",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000231"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.undecoded_delete_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: delete_answered_200_with_text_deletes
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_empty |
      provider "databricks" {}
    plan: &plans_delete
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete]
    calls:
      - *read_created
      - request: &delete_request
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.undecoded_delete_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          headers:
            Content-Type: text/plain
          body:
            text: volume deleted
  - name: create_after_text
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    calls: *create_calls
  - name: delete_answered_200_with_html_deletes
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_empty
    plan: *plans_delete
    calls:
      - *read_created
      - request: *delete_request
        response:
          status: 200
          headers:
            Content-Type: text/html
          body:
            text: <html><body>Volume deleted</body></html>
  - name: create_after_html
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    calls: *create_calls
  - name: delete_answered_200_with_a_json_array_deletes
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_empty
    plan: *plans_delete
    calls:
      - *read_created
      - request: *delete_request
        response:
          status: 200
          body:
            json: ["main.replay.undecoded_delete_volume"]
  - name: plan_after_delete_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_empty
    plan:
      expect: empty
      changes: {}
    calls: []
destroy:
  calls: []
