# Runs volume/testdata/import_unreadable_volume.yaml with databricks_volume on sdk-go
# uc/volumes/v1 in every step, and expects the same behavior. The volume requests carry no
# Accept header, which an empty header expectation pins. The original's description:
#
# Pins importing a volume whose GET answers 403 or 500. The default importer drops its
# own read error, so Terraform refreshes the imported ID; that refresh runs inside the
# CRUD wrappers and fails with the "cannot read volume" prefix. Each failure imports
# nothing, so the following plan creates the volume. API responses are inferred from
# the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: import_answered_403_fails_on_the_refresh
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "unreadable_import_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    import:
      resource: databricks_volume.this
      id: main.replay.unreadable_import_volume
      persist: true
    expect_error: 'Error: cannot read volume: User does not have READ VOLUME on Volume
      ''main\.replay\.unreadable_import_volume''\.\n'
    calls:
      # The importer's GET, then the refresh GET after import.
      - &read_forbidden
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.unreadable_import_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "User does not have READ VOLUME on Volume
                     'main.replay.unreadable_import_volume'."}
      - *read_forbidden
  - name: nothing_imported_after_403_so_plan_creates
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: &plans_create
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls: []
  - name: import_answered_500_fails_on_the_refresh
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    import:
      resource: databricks_volume.this
      id: main.replay.unreadable_import_volume
      persist: true
    expect_error: 'Error: cannot read volume: Internal error while reading volume
      ''main\.replay\.unreadable_import_volume''\.\n'
    calls:
      - &read_failing
        request: *read_request
        response:
          status: 500
          body:
            json: {"error_code": "INTERNAL_ERROR",
                   "message": "Internal error while reading volume
                     'main.replay.unreadable_import_volume'."}
      - *read_failing
  - name: nothing_imported_after_500_so_plan_creates
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *plans_create
    calls: []
destroy:
  calls: []
