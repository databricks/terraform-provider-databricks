# Pins SCIM /Me failing while Update builds the volume's workspace client, on a
# workspace-level provider whose host metadata has no workspace ID. The plan's refresh
# checks provider_config.workspace_id through /Me and plans a comment update. Apply
# starts a fresh client whose /Me call fails, so Update fails before any PATCH: with
# the 403's message, and with the 404's message too, because only refresh and delete
# treat a missing object as gone. Each failed apply still stores the planned comment,
# as SDKv2 does for every planned value: a refresh whose read has no comment keeps it,
# and the plan is empty. Only a refresh that reads the server's comment plans the
# update again, so an apply with -refresh=false wouldn't resend it. API responses are
# inferred from the Unity Catalog and SCIM API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
steps:
  - name: create_checks_workspace_id_through_me
    config: |
      resource "databricks_volume" "this" {
        name         = "me_update_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - &me
        request: &me_request
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          body: null
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: "12345"
          body:
            json: {"id": "1001", "userName": "replay-admin@example.com",
                   "schemas": ["urn:ietf:params:scim:schemas:core:2.0:User"]}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "me_update_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "me_update_volume",
                           "full_name": "main.replay.me_update_volume",
                           "volume_type": "MANAGED", "comment": "first comment",
                           "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1738",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001738"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.me_update_volume
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *me
      - *read_volume
  - name: update_fails_before_patch_when_me_is_forbidden
    config: &config_second |
      resource "databricks_volume" "this" {
        name         = "me_update_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second comment"
        provider_config {
          workspace_id = "12345"
        }
      }
    expect_error: 'Error: cannot update volume: failed to validate workspace_id: failed to
      get the workspace_id: Caller cannot read /Me'
    calls:
      # The plan's refresh.
      - *me
      - *read_volume
      # The apply: no PATCH follows the failing /Me.
      - request: *me_request
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "Caller cannot read /Me"}
  - name: update_fails_before_patch_when_me_is_not_found
    config: *config_second
    expect_error: 'Error: cannot update volume: failed to validate workspace_id: failed to
      get the workspace_id: User not found'
    calls:
      # The plan's refresh.
      - *me
      - *read_volume
      # The apply: no PATCH follows the failing /Me.
      - request: *me_request
        response:
          status: 404
          body:
            json: {"error_code": "NOT_FOUND",
                   "message": "User not found"}
  - name: state_stores_the_planned_comment
    plan_only: true
    config: *config_second
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.me_update_volume
            - path: [comment]
              equals: second comment
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
    calls:
      # The refresh plan. The read leaves out comment, which the refresh then keeps.
      - *me
      - request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.me_update_volume
          body: null
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "me_update_volume",
                   "full_name": "main.replay.me_update_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-1738",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001738"}
  - name: refresh_of_the_server_comment_plans_the_update
    plan_only: true
    config: *config_second
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [comment]
              equals: first comment
          after:
            - path: [comment]
              equals: second comment
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.me_update_volume
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
    calls:
      # The refresh plan.
      - *me
      - *read_volume
destroy:
  calls:
    - *me
    - *read_volume
    - *me
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.me_update_volume
        body: null
      response:
        status: 200
        body:
          json: {}
