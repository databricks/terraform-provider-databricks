# Pins that each retried databricks_volume attempt is authenticated again with OAuth
# M2M. The first token expires after one second. The create POST that uses it is
# answered 429, and the SDK backs off for 1.05 to 1.75 seconds, so the token has
# expired when the POST is retried: the retry fetches a second token and sends it, and
# the read after create reuses it. The token is fetched in the first call's request
# visitor, which runs at once, so the first POST still uses the first token. Token and
# API responses are inferred from the OAuth and Unity Catalog API contracts, not
# recorded.
version: 1
enforce_call_order: true
provider_host: workspace
hosts:
  workspace:
    url: https://replay-workspace.cloud.databricks.com
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
auth:
  type: oauth-m2m
  client_id: replay-sp
  client_secret: replay-secret
steps:
  - name: create_retry_fetches_a_new_token
    config: |
      resource "databricks_volume" "this" {
        name         = "auth_m2m_expiry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - &discovery
        request:
          method: GET
          path: /oidc/.well-known/oauth-authorization-server
          matchers:
            headers:
              Authorization: absent
          body: null
        response:
          status: 200
          body:
            json:
              authorization_endpoint: https://replay-workspace.cloud.databricks.com/oidc/v1/authorize
              token_endpoint: https://replay-workspace.cloud.databricks.com/oidc/v1/token
      - request: &token_request
          method: POST
          path: /oidc/v1/token
          headers:
            Content-Type: application/x-www-form-urlencoded
          matchers:
            headers:
              # base64 of replay-sp:replay-secret.
              Authorization: {pattern: 'Basic cmVwbGF5LXNwOnJlcGxheS1zZWNyZXQ='}
          body:
            text: grant_type=client_credentials&scope=all-apis
        response:
          status: 200
          body:
            json: {"access_token": "m2m-token-1", "token_type": "Bearer",
                   "expires_in": 1}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers:
            headers:
              Authorization: {pattern: 'Bearer m2m-token-1'}
          body:
            json: &create_body {"catalog_name": "main", "schema_name": "replay",
                                "name": "auth_m2m_expiry_volume",
                                "volume_type": "MANAGED"}
        response:
          status: 429
          body:
            json: {"error_code": "TOO_MANY_REQUESTS",
                   "message": "Too many requests. Please wait a moment and try again."}
      - &token
        request: *token_request
        response:
          status: 200
          body:
            json: {"access_token": "m2m-token-2", "token_type": "Bearer",
                   "expires_in": 3600}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: &credentials
            headers:
              Authorization: {pattern: 'Bearer m2m-token-2'}
          body:
            json: *create_body
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "auth_m2m_expiry_volume",
                            "full_name": "main.replay.auth_m2m_expiry_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-302",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000302"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.auth_m2m_expiry_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: *credentials
          body: null
        response:
          status: 200
          body:
            json: *created
      # Terraform's post-apply plan.
      - *discovery
      - *token
      - *read_created
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.auth_m2m_expiry_volume
destroy:
  calls:
    # The refresh, then the destroy.
    - *discovery
    - *token
    - *read_created
    - *discovery
    - *token
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.auth_m2m_expiry_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        matchers: *credentials
        body: null
      response:
        status: 200
        body:
          json: {}
