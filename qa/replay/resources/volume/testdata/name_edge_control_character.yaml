# Pins importing a volume full name that contains a control character on the existing
# path. The classic client formats the full name into the path unescaped, so building the
# GET fails with net/url's invalid control character error and nothing is sent. The
# error quotes the URL, so the tab shows as \t. Nothing is imported, and the next plan
# creates the volume. A full name with a control character in a create response is
# pinned by TestVolumeCreateWithControlCharacterInReturnedFullNameFailsTheRead in the
# catalog package, because no later refresh or destroy could remove that volume from a
# journey's state.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: import_with_a_tab_fails_before_the_get
    config: &config |
      resource "databricks_volume" "this" {
        name         = "raw\t1"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    import:
      resource: databricks_volume.this
      id: "main.replay.raw\t1"
      persist: true
    expect_error: 'Error: cannot read volume: failed creating new request: parse
      "/api/2\.1/unity-catalog/volumes/main\.replay\.raw\\t1\?": net/url: invalid control
      character in URL\n'
    calls: []
  - name: plan_after_failed_import_creates_the_volume
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
          after:
            - path: [name]
              equals: "raw\t1"
            - path: [id]
              unknown: true
    calls: []
destroy:
  calls: []
