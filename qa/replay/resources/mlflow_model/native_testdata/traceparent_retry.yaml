# Supplies registered model calls for TestMlflowModelTraceparent, which checks their
# traceparent headers in Go. Each of the four calls fails once with a 503 and is retried
# by the classic SDK client. API responses are inferred from the MLflow Model Registry
# API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_retries_the_post_and_the_get_once
    config: |
      resource "databricks_mlflow_model" "this" {
        name        = "traceparent_model"
        description = "created"
      }
    calls:
      - request: &create
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "traceparent_model", "description": "created"}
        response: &unavailable
          status: 503
          body:
            json: {"error_code": "TEMPORARILY_UNAVAILABLE",
                   "message": "The service is temporarily unavailable."}
      - request: *create
        response:
          status: 200
          body:
            json: {"registered_model": {"name": "traceparent_model",
                                        "description": "created",
                                        "creation_timestamp": 1700000000000,
                                        "last_updated_timestamp": 1700000000000,
                                        "user_id": "replay-admin@example.com"}}
      - request: &read
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [traceparent_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *unavailable
      - &read_created
        request: *read
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "traceparent_model", "description": "created",
                     "id": "0123456789abcdef0123456789abcdef",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "replay-admin@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read_created
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: traceparent_model
  - name: update_retries_the_patch_once
    config: |
      resource "databricks_mlflow_model" "this" {
        name        = "traceparent_model"
        description = "updated"
      }
    calls:
      - *read_created
      - request: &update
          method: PATCH
          path: /api/2.0/mlflow/registered-models/update
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "traceparent_model", "description": "updated"}
        response: *unavailable
      - request: *update
        response:
          status: 200
          body:
            json: {"registered_model": {"name": "traceparent_model",
                                        "description": "updated",
                                        "creation_timestamp": 1700000000000,
                                        "last_updated_timestamp": 1700000060000,
                                        "user_id": "replay-admin@example.com"}}
      - &read_updated
        request: *read
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "traceparent_model", "description": "updated",
                     "id": "0123456789abcdef0123456789abcdef",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000060000,
                     "user_id": "replay-admin@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read_updated
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [description]
              equals: updated
destroy:
  calls:
    - *read_updated
    - request: &delete
        method: DELETE
        path: /api/2.0/mlflow/registered-models/delete
        query:
          name: [traceparent_model]
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response: *unavailable
    - request: *delete
      response:
        status: 200
        body:
          json: {}
