# Pins the refresh errors that keep the model. A GET answered 403, 500 with a JSON body
# or 500 with a non-JSON body fails the plan with its exact diagnostic and is not
# retried; the model stays in state, and the next plan is empty once the GET succeeds.
# A 404 with a non-JSON body does the same: the classic SDK gives such a body the error
# code UNKNOWN, which it classes as an internal error, not as a missing model. API
# responses are synthetic: inferred from the MLflow Model Registry API and from proxy
# error pages, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_mlflow_model" "this" {
        name        = "error_refresh_keeps_model"
        description = "Pins refresh errors that keep the model"
      }
    calls:
      - &create
        request:
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "error_refresh_keeps_model",
                   "description": "Pins refresh errors that keep the model"}
        response:
          status: 200
          body:
            json: {"registered_model": {
                     "name": "error_refresh_keeps_model",
                     "description": "Pins refresh errors that keep the model",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "tester@example.com"}}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [error_refresh_keeps_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "error_refresh_keeps_model",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e831",
                     "description": "Pins refresh errors that keep the model",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "tester@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read_created
  - name: refresh_answered_403_fails
    config: *config
    expect_error: 'Error: cannot read mlflow model: User does not have permission
      ''CAN_READ'' on registered model ''error_refresh_keeps_model''\.\n'
    calls:
      - request: *read_request
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "User does not have permission 'CAN_READ' on registered
                     model 'error_refresh_keeps_model'."}
  - name: state_kept_after_403
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: error_refresh_keeps_model
    calls:
      - *read_created
  - name: refresh_answered_500_with_json_body_fails
    config: *config
    expect_error: 'Error: cannot read mlflow model: An internal error occurred while
      reading the registered model\.\n'
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            json: {"error_code": "INTERNAL_ERROR",
                   "message": "An internal error occurred while reading the registered
                     model."}
  - name: state_kept_after_500_with_json_body
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: error_refresh_keeps_model
    calls:
      - *read_created
  - name: refresh_answered_500_with_non_json_body_fails
    config: *config
    expect_error: 'Error: cannot read mlflow model: upstream connect error or
      disconnect/reset before headers\n'
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            text: upstream connect error or disconnect/reset before headers
  - name: state_kept_after_500_with_non_json_body
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: error_refresh_keeps_model
    calls:
      - *read_created
  - name: refresh_answered_404_with_non_json_body_fails
    config: *config
    expect_error: 'Error: cannot read mlflow model: 404 page not found\n'
    calls:
      - request: *read_request
        response:
          status: 404
          body:
            text: 404 page not found
  - name: state_kept_after_404_with_non_json_body
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: error_refresh_keeps_model
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.0/mlflow/registered-models/delete
        query:
          name: [error_refresh_keeps_model]
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
