# Runs volume_retries/testdata/write_retry_exhaustion_on_delete.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same requests
# and behavior. The original's description:
#
# This journey pins a DELETE that gets a 503 until retry_timeout_seconds ends. One second
# is shorter than the SDK's first backoff (1.05 to 1.75 seconds), so exactly one DELETE
# is sent. Apply fails with the 503's message and the volume stays in state, so planning
# the volume's configuration again shows no change. API responses are inferred from the
# Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      provider "databricks" {
        retry_timeout_seconds = 1
      }
      resource "databricks_volume" "this" {
        name         = "write_retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "write_retry_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "write_retry_volume",
                            "full_name": "main.replay.write_retry_volume",
                            "volume_type": "MANAGED",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-194",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000194"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.write_retry_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: delete_retries_until_the_retry_timeout_ends
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {
        retry_timeout_seconds = 1
      }
    expect_error: 'Error: cannot delete volume: The service is temporarily
      unavailable\.\n'
    calls:
      - *read_created
      - request: &delete
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.write_retry_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 503
          body:
            json: {"error_code": "TEMPORARILY_UNAVAILABLE",
                   "message": "The service is temporarily unavailable."}
  - name: plan_after_exhausted_delete_keeps_the_volume
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.write_retry_volume
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request: *delete
      response:
        status: 200
        body:
          json: {}
