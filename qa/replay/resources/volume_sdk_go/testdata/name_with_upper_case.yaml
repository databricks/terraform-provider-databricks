# Runs volume/testdata/name_with_upper_case.yaml with databricks_volume on sdk-go
# uc/volumes/v1 in every step, and expects the same behavior. The volume requests carry no
# Accept header, which an empty header expectation pins. The PATCH bodies also carry
# full_name_arg, the full name in their path, because sdk-go serializes the path field
# into the body. The original's description:
#
# Pins the request paths for a volume name with upper case. Unity Catalog stores names in
# lower case, so a created volume takes the lower-case full name as its ID and later
# calls use it. A comment change then sends no new_name: diff suppression keeps the
# stored lower-case name, which matches the name in the ID. Importing by an upper-case
# full name keeps it in the GET, PATCH and DELETE paths as is. A comment change after
# that import also sends new_name with the stored lower-case name, and the PATCH
# response replaces the ID with the lower-case full name. That new_name is a known
# defect: Update compares the configured name with the name in the ID case-sensitively.
# A fix is expected to drop it; update the last step with it. API responses are inferred
# from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_takes_the_lower_case_full_name_as_id
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "Raw_Upper"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "Raw_Upper",
                   "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "raw_upper", "full_name": "main.replay.raw_upper",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-167",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000167"}
      - &read_created
        request: &read_lower_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw_upper
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.raw_upper
            - path: [name]
              equals: raw_upper
  - name: update_comment_patches_the_lower_case_path_without_new_name
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_commented |
      resource "databricks_volume" "this" {
        name         = "Raw_Upper"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "upper"
      }
    calls:
      - *read_created
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.raw_upper
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.raw_upper",
                   "comment": "upper"}
        response:
          status: 200
          body:
            json: &commented {"catalog_name": "main", "schema_name": "replay",
                              "name": "raw_upper", "full_name": "main.replay.raw_upper",
                              "volume_type": "MANAGED", "comment": "upper",
                              "owner": "replay-admin@example.com",
                              "storage_location": "s3://replay-metastore/volume-167",
                              "metastore_id": "11111111-1111-1111-1111-111111111111",
                              "volume_id": "00000000-0000-4000-8000-000000000167"}
      - &read_commented
        request: *read_lower_request
        response:
          status: 200
          body:
            json: *commented
      - *read_commented
  - name: delete_deletes_the_lower_case_path
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_empty |
      provider "databricks" {}
    calls:
      - *read_commented
      - request: &delete_lower_request
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.raw_upper
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: {}
  - name: import_by_upper_case_full_name_reads_the_upper_case_path
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    import:
      resource: databricks_volume.this
      id: main.replay.Raw_Upper
      persist: true
    calls:
      - &read_upper
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.Raw_Upper
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_upper
  - name: delete_after_import_deletes_the_upper_case_path
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_empty
    calls:
      - *read_upper
      - request:
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.Raw_Upper
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: {}
  - name: import_by_upper_case_full_name_again
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    import:
      resource: databricks_volume.this
      id: main.replay.Raw_Upper
      persist: true
    calls:
      - *read_upper
      - *read_upper
  - name: update_comment_after_import_patches_the_upper_case_path_with_new_name
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_commented
    calls:
      - *read_upper
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.Raw_Upper
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.Raw_Upper",
                   "comment": "upper", "new_name": "raw_upper"}
        response:
          status: 200
          body:
            json: *commented
      - *read_commented
      - *read_commented
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.raw_upper
destroy:
  calls:
    - *read_commented
    - request: *delete_lower_request
      response:
        status: 200
        body:
          json: {}
