# API responses are inferred from the scenarios and API models, not recorded.
version: 1
host_metadata: # Dummy host metadata.
  host_type: workspace
  cloud: AWS
  workspace_id: '12345'
steps:
  - name: filter_by_source
    config: |2

      data "databricks_clusters" "this" {
        filter_by {
          cluster_sources = ["UI", "API"]
        }
      }
      # Inspect the selected cluster through the corresponding data source.
      data "databricks_cluster" "first" {
        cluster_id = one(data.databricks_clusters.this.ids)
      }
    calls:
      - &call_1
        request:
          body: null
          headers:
            X-Databricks-Workspace-Id: '12345'
          method: GET
          path: /api/2.1/clusters/list
          query:
            filter_by.cluster_sources: [UI, API]
        response: &response_1 # Inferred API response; not recorded.
          body:
            json:
              clusters:
                - cluster_id: 0123-456789-replay
                  cluster_name: Default
                  cluster_source: API
                  node_type_id: i3.xlarge
                  num_workers: 1
                  policy_id: abc-123
                  spark_version: 17.3.x-scala2.13
                  state: RUNNING
          status: 200
      - &call_2
        request:
          body: null
          headers:
            X-Databricks-Workspace-Id: '12345'
          method: GET
          path: /api/2.1/clusters/get
          query:
            cluster_id: [0123-456789-replay]
        response: # Inferred API response; not recorded.
          body:
            json:
              cluster_id: 0123-456789-replay
              cluster_name: Default
              cluster_source: API
              node_type_id: i3.xlarge
              num_workers: 1
              policy_id: abc-123
              spark_version: 17.3.x-scala2.13
              state: RUNNING
          status: 200
      - *call_1
      - *call_2
      - *call_1
      - *call_2
    state:
      resources:
        data.databricks_cluster.first:
          attributes:
            - path: [cluster_info, 0, cluster_source]
              equals: API
  - name: filter_by_state
    config: |2

      data "databricks_clusters" "this" {
        filter_by {
          cluster_states = ["RUNNING", "RESIZING"]
        }
      }
      data "databricks_cluster" "first" {
        cluster_id = one(data.databricks_clusters.this.ids)
      }
    calls:
      - &call_3
        request:
          body: null
          headers:
            X-Databricks-Workspace-Id: '12345'
          method: GET
          path: /api/2.1/clusters/list
          query:
            filter_by.cluster_states: [RUNNING, RESIZING]
        response: *response_1 # Inferred API response; not recorded.
      - *call_2
      - *call_3
      - *call_2
      - *call_3
      - *call_2
    state:
      resources:
        data.databricks_cluster.first:
          attributes:
            - path: [cluster_info, 0, state]
              equals: RUNNING
  - name: filter_pinned
    config: |2

      data "databricks_clusters" "this" {
        filter_by {
          is_pinned = true
        }
      }
    calls:
      - &call_4
        request:
          body: null
          headers:
            X-Databricks-Workspace-Id: '12345'
          method: GET
          path: /api/2.1/clusters/list
          query:
            filter_by.is_pinned: ['true']
        response: *response_1 # Inferred API response; not recorded.
      - *call_4
      - *call_4
  - name: filter_by_policy
    config: |2

      resource "databricks_cluster_policy" "this" {
        name = "test replay"
        definition = jsonencode({
          "spark_conf.spark.hadoop.javax.jdo.option.ConnectionURL" : {
            "type" : "fixed",
            "value" : "jdbc:sqlserver://<jdbc-url>"
          }
        })
      }
      data "databricks_clusters" "this" {
        filter_by {
          policy_id = databricks_cluster_policy.this.id
        }
      }
      data "databricks_cluster" "first" {
        cluster_id = one(data.databricks_clusters.this.ids)
      }
    calls:
      - request:
          body:
            json:
              definition: '{"spark_conf.spark.hadoop.javax.jdo.option.ConnectionURL":{"type":"fixed","value":"jdbc:sqlserver://\u003cjdbc-url\u003e"}}'
              name: test replay
          headers:
            X-Databricks-Workspace-Id: '12345'
          method: POST
          path: /api/2.0/policies/clusters/create
        response: # Inferred API response; not recorded.
          body:
            json:
              policy_id: abc-123
          status: 200
      - &call_6
        request:
          body: null
          headers:
            X-Databricks-Workspace-Id: '12345'
          method: GET
          path: /api/2.0/policies/clusters/get
          query:
            policy_id: [abc-123]
        response: # Inferred API response; not recorded.
          body:
            json:
              definition: '{"spark_conf.spark.hadoop.javax.jdo.option.ConnectionURL":{"type":"fixed","value":"jdbc:sqlserver://\u003cjdbc-url\u003e"}}'
              name: test replay
              policy_id: abc-123
          status: 200
      - &call_5
        request:
          body: null
          headers:
            X-Databricks-Workspace-Id: '12345'
          method: GET
          path: /api/2.1/clusters/list
          query:
            filter_by.policy_id: [abc-123]
        response: *response_1 # Inferred API response; not recorded.
      - *call_2
      - *call_5
      - *call_2
      - *call_6
      - *call_5
      - *call_2
    state:
      resources:
        data.databricks_cluster.first:
          attributes:
            - path: [cluster_info, 0, policy_id]
              equals: abc-123
destroy:
  calls:
    - *call_6
    - *call_5
    - *call_2
    - request:
        body:
          json:
            policy_id: abc-123
        headers:
          X-Databricks-Workspace-Id: '12345'
        method: POST
        path: /api/2.0/policies/clusters/delete
      response: # Inferred API response; not recorded.
        body: null
        status: 200
