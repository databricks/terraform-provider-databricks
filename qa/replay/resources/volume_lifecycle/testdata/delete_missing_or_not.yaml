# Pins which DELETE errors count as already deleted (apierr.IsMissing). NOT_FOUND and
# PERMISSION_DENIED with 400 or 403 fail the delete and keep the volume. The error_code
# RESOURCE_DOES_NOT_EXIST with any status, and a 404 with any error_code, remove the
# volume from state, so each of those is followed by a create. API responses are
# inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_volume" "this" {
        name         = "missing_delete_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls: &create_calls
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "missing_delete_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "missing_delete_volume",
                            "full_name": "main.replay.missing_delete_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-141",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000141"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.missing_delete_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: delete_answered_400_not_found_fails
    config: &config_empty |
      provider "databricks" {}
    expect_error: 'Error: cannot delete volume: Volume
      ''main\.replay\.missing_delete_volume'' was not found\.\n'
    calls:
      - *read_created
      - request: &delete_request
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.missing_delete_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 400
          body:
            json: {"error_code": "NOT_FOUND",
                   "message": "Volume 'main.replay.missing_delete_volume' was not
                     found."}
  - name: delete_answered_400_permission_denied_fails
    config: *config_empty
    expect_error: 'Error: cannot delete volume: User does not have MANAGE on Volume
      ''main\.replay\.missing_delete_volume''\.\n'
    calls:
      - *read_created
      - request: *delete_request
        response:
          status: 400
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "User does not have MANAGE on Volume
                     'main.replay.missing_delete_volume'."}
  - name: delete_answered_403_not_found_fails
    config: *config_empty
    expect_error: 'Error: cannot delete volume: Volume
      ''main\.replay\.missing_delete_volume'' was not found\.\n'
    calls:
      - *read_created
      - request: *delete_request
        response:
          status: 403
          body:
            json: {"error_code": "NOT_FOUND",
                   "message": "Volume 'main.replay.missing_delete_volume' was not
                     found."}
  - name: delete_answered_403_permission_denied_fails
    config: *config_empty
    expect_error: 'Error: cannot delete volume: User does not have MANAGE on Volume
      ''main\.replay\.missing_delete_volume''\.\n'
    calls:
      - *read_created
      - request: *delete_request
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "User does not have MANAGE on Volume
                     'main.replay.missing_delete_volume'."}
  - name: delete_answered_404_resource_does_not_exist_counts_as_deleted
    config: *config_empty
    plan: &plans_delete
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete]
    calls:
      - *read_created
      - request: *delete_request
        response:
          status: 404
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Volume 'main.replay.missing_delete_volume' does not
                     exist."}
  - name: create_after_404_resource_does_not_exist
    config: *config
    calls: *create_calls
  - name: delete_answered_404_not_found_counts_as_deleted
    config: *config_empty
    plan: *plans_delete
    calls:
      - *read_created
      - request: *delete_request
        response:
          status: 404
          body:
            json: {"error_code": "NOT_FOUND",
                   "message": "Volume 'main.replay.missing_delete_volume' was not
                     found."}
  - name: create_after_404_not_found
    config: *config
    calls: *create_calls
  - name: delete_answered_404_permission_denied_counts_as_deleted
    config: *config_empty
    plan: *plans_delete
    calls:
      - *read_created
      - request: *delete_request
        response:
          status: 404
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "User does not have MANAGE on Volume
                     'main.replay.missing_delete_volume'."}
  - name: create_after_404_permission_denied
    config: *config
    calls: *create_calls
  - name: delete_answered_400_resource_does_not_exist_counts_as_deleted
    config: *config_empty
    plan: *plans_delete
    calls:
      - *read_created
      - request: *delete_request
        response:
          status: 400
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Volume 'main.replay.missing_delete_volume' does not
                     exist."}
  - name: create_after_400_resource_does_not_exist
    config: *config
    calls: *create_calls
  - name: delete_answered_403_resource_does_not_exist_counts_as_deleted
    config: *config_empty
    plan: *plans_delete
    calls:
      - *read_created
      - request: *delete_request
        response:
          status: 403
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Volume 'main.replay.missing_delete_volume' does not
                     exist."}
  - name: plan_after_delete_is_empty
    plan_only: true
    config: *config_empty
    plan:
      expect: empty
      changes: {}
    calls: []
destroy:
  calls: []
