# Supplies the two GETs of an import for TestVolumeImportUserAgent, which checks their
# User-Agent in Go. API responses are inferred from the Unity Catalog API contract, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: import_reads_the_volume_twice
    config: |
      resource "databricks_volume" "this" {
        name         = "import_user_agent_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    import:
      resource: databricks_volume.this
      id: main.replay.import_user_agent_volume
      persist: false
    calls:
      # The importer's GET, then the refresh GET after import.
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.import_user_agent_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "import_user_agent_volume",
                   "full_name": "main.replay.import_user_agent_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-192",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000192"}
      - *read_volume
destroy:
  calls: []
