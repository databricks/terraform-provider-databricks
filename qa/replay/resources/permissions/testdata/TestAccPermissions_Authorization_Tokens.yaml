# API responses are placeholders based on the API models, not recorded.
version: 1
host_metadata:
  cloud: AWS
  host_type: workspace
  workspace_id: '12345'
steps:
- name: group_can_use_tokens
  config: |
    data "databricks_current_user" "me" {}
    resource "databricks_group" "_0" {
      display_name = "permissions-replay-0"
    }
    resource "databricks_permissions" "this" {
      authorization = "tokens"
      access_control {
        group_name       = databricks_group._0.display_name
        permission_level = "CAN_USE"
      }
    }
  calls:
  - &id002
    request:
      method: GET
      path: /api/2.0/preview/scim/v2/Me
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      headers:
        X-Databricks-Org-Id: '12345'
      body:
        json:
          active: true
          displayName: Replay runner
          groups:
          - display: admins
            value: '901'
          id: '900'
          schemas:
          - urn:ietf:params:scim:schemas:core:2.0:User
          userName: 11111111-1111-4111-8111-000000000000
  - request:
      method: POST
      path: /api/2.0/preview/scim/v2/Groups
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          displayName: permissions-replay-0
          entitlements:
          - {}
          schemas:
          - urn:ietf:params:scim:schemas:core:2.0:Group
    response:
      status: 200
      body:
        json:
          displayName: permissions-replay-0
          id: '1000'
          schemas:
          - urn:ietf:params:scim:schemas:core:2.0:Group
  - &id003
    request:
      method: GET
      path: /api/2.0/preview/scim/v2/Groups/1000
      query:
        attributes:
        - displayName,externalId,entitlements
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          displayName: permissions-replay-0
          id: '1000'
          schemas:
          - urn:ietf:params:scim:schemas:core:2.0:Group
  - &id001
    request:
      method: GET
      path: /api/2.0/preview/scim/v2/Me
      query:
        excludedAttributes:
        - entitlements
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      headers:
        X-Databricks-Org-Id: '12345'
      body:
        json:
          active: true
          displayName: Replay runner
          groups:
          - display: admins
            value: '901'
          id: '900'
          schemas:
          - urn:ietf:params:scim:schemas:core:2.0:User
          userName: 11111111-1111-4111-8111-000000000000
  - request:
      method: PUT
      path: /api/2.0/permissions/authorization/tokens
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          access_control_list:
          - group_name: permissions-replay-0
            permission_level: CAN_USE
          - group_name: admins
            permission_level: CAN_MANAGE
    response:
      status: 200
      body:
        json:
          access_control_list:
          - all_permissions:
            - inherited: false
              permission_level: CAN_USE
            group_name: permissions-replay-0
          object_id: /authorization/tokens
          object_type: tokens
  - *id001
  - &id004
    request:
      method: GET
      path: /api/2.0/permissions/authorization/tokens
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          access_control_list:
          - all_permissions:
            - inherited: false
              permission_level: CAN_USE
            group_name: permissions-replay-0
          object_id: /authorization/tokens
          object_type: tokens
  - *id002
  - *id002
  - *id003
  - *id001
  - *id004
- name: users_can_use_tokens
  config: |
    data "databricks_current_user" "me" {}
    resource "databricks_permissions" "this" {
      authorization = "tokens"
      access_control {
        group_name       = "users"
        permission_level = "CAN_USE"
      }
    }
  calls:
  - *id002
  - *id003
  - *id001
  - *id004
  - request:
      method: DELETE
      path: /api/2.0/preview/scim/v2/Groups/1000
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body: null
  - *id001
  - request:
      method: PUT
      path: /api/2.0/permissions/authorization/tokens
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          access_control_list:
          - group_name: users
            permission_level: CAN_USE
          - group_name: admins
            permission_level: CAN_MANAGE
    response:
      status: 200
      body:
        json:
          access_control_list:
          - all_permissions:
            - inherited: false
              permission_level: CAN_USE
            group_name: users
          object_id: /authorization/tokens
          object_type: tokens
  - *id001
  - &id005
    request:
      method: GET
      path: /api/2.0/permissions/authorization/tokens
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          access_control_list:
          - all_permissions:
            - inherited: false
              permission_level: CAN_USE
            group_name: users
          object_id: /authorization/tokens
          object_type: tokens
  - *id002
  - *id002
  - *id001
  - *id005
- name: reset_to_admins
  config: |
    data "databricks_current_user" "me" {}
  calls:
  - *id002
  - *id001
  - *id005
  - request:
      method: GET
      path: /api/2.0/permissions/authorization/tokens
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          access_control_list: []
          object_id: /authorization/tokens
          object_type: tokens
  - request:
      method: PUT
      path: /api/2.0/permissions/authorization/tokens
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json: {}
    response:
      status: 200
      body:
        json:
          access_control_list: []
          object_id: /authorization/tokens
          object_type: tokens
  - *id002
  - *id002
destroy:
  calls:
  - *id002
