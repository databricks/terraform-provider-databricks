              applicationId: "00000000-0000-4000-8000-000000000002"
      - request:
          method: "GET"
          path: "/api/2.0/preview/scim/v2/ServicePrincipals/202"
          headers:
            Accept: ""
            Content-Type: ""
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"]
              id: "202"
              displayName: "SPN Renamed updated"
              active: true
              entitlements: []
              applicationId: "00000000-0000-4000-8000-000000000002"
