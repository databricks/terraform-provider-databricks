# This journey pins a create POST that gets a 503 until retry_timeout_seconds ends. One
# second is shorter than the SDK's first backoff (1.05 to 1.75 seconds), so exactly one
# POST is sent and the timeout ends during the backoff. Apply fails with the 503's
# message, no ID is stored, and the next plan creates the model again. API responses are
# synthetic, inferred from the MLflow Model Registry API, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_post_retries_until_the_retry_timeout_ends
    config: &config |
      provider "databricks" {
        retry_timeout_seconds = 1
      }
      resource "databricks_mlflow_model" "this" {
        name        = "write-retry-model"
        description = "first"
      }
    expect_error: 'Error: cannot create mlflow model: The service is temporarily
      unavailable\.\n'
    calls:
      - request:
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "write-retry-model", "description": "first"}
        response:
          status: 503
          body:
            json: {"error_code": "TEMPORARILY_UNAVAILABLE",
                   "message": "The service is temporarily unavailable."}
  # Nothing is in state, so the plan reads nothing and creates the model.
  - name: plan_after_exhausted_create_creates_the_model
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [create]
    calls: []
destroy:
  calls: []
