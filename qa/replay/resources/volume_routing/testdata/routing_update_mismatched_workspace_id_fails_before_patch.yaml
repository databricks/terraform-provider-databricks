# Pins an in-place change of provider_config.workspace_id to a workspace other than
# the provider's, on a workspace-level provider whose host metadata has no workspace ID.
# The plan refreshes through the old ID and plans an update. Apply's SCIM /Me call
# returns the provider's workspace, so Update fails on the mismatch before any PATCH.
# The failed apply still stores the new ID in state, so even with the old configuration
# back, the refresh fails on the same mismatch before the volume GET. Cleanup answers
# /Me with the stored ID, as a provider pointed at that workspace would, because no
# configuration of this provider can refresh the volume again. API responses are
# inferred from the Unity Catalog and SCIM API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
steps:
  - name: create_in_provider_workspace
    config: &config_12345 |
      resource "databricks_volume" "this" {
        name         = "update_mismatch_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - &me_12345
        request: &me_request
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          body: null
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: "12345"
          body:
            json: {"id": "1001", "userName": "replay-admin@example.com",
                   "schemas": ["urn:ietf:params:scim:schemas:core:2.0:User"]}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "update_mismatch_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "update_mismatch_volume",
                           "full_name": "main.replay.update_mismatch_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1736",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001736"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.update_mismatch_volume
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *me_12345
      - *read_volume
  - name: workspace_id_change_plans_update
    plan_only: true
    config: &config_67890 |
      resource "databricks_volume" "this" {
        name         = "update_mismatch_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "67890"
        }
      }
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
          after:
            - path: [provider_config, 0, workspace_id]
              equals: "67890"
    calls:
      # The refresh plan.
      - *me_12345
      - *read_volume
  - name: update_fails_on_mismatch_before_patch
    config: *config_67890
    expect_error: 'Error: cannot update volume: failed to validate workspace_id:
      workspace_id mismatch: provider is configured for workspace 12345 but got 67890 in
      provider_config\. please check the workspace_id provided in provider_config'
    calls:
      # The plan's refresh.
      - *me_12345
      - *read_volume
      # The apply: no PATCH follows the mismatch.
      - *me_12345
  - name: refresh_with_old_configuration_fails_on_stored_workspace_id
    config: *config_12345
    expect_error: 'Error: cannot read volume: failed to validate workspace_id:
      workspace_id mismatch: provider is configured for workspace 12345 but got 67890 in
      provider_config\.'
    calls:
      - *me_12345
destroy:
  calls:
    - &me_67890
      request: *me_request
      response:
        status: 200
        headers:
          X-Databricks-Org-Id: "67890"
        body:
          json: {"id": "1001", "userName": "replay-admin@example.com",
                 "schemas": ["urn:ietf:params:scim:schemas:core:2.0:User"]}
    - *read_volume
    - *me_67890
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.update_mismatch_volume
        body: null
      response:
        status: 200
        body:
          json: {}
