# Pins how provider_config is validated and defaulted: an empty workspace_id fails, and
# so do two provider_config blocks, each before any API call. An empty provider_config {}
# block is accepted: its workspace_id stays unset, so the calls go to the provider's
# workspace, which host metadata supplies, create writes that ID to
# provider_config.workspace_id, and the next plan is empty. API responses are inferred
# from the MLflow Model Registry API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: empty_workspace_id_fails_without_calls
    config: |
      resource "databricks_mlflow_model" "this" {
        name = "routed-model"
        provider_config {
          workspace_id = ""
        }
      }
    expect_error: 'Error: expected "provider_config\.0\.workspace_id" to not be an empty string, got \n'
    calls: []
  - name: two_provider_config_blocks_fail_without_calls
    config: |
      resource "databricks_mlflow_model" "this" {
        name = "routed-model"
        provider_config {
          workspace_id = "12345"
        }
        provider_config {
          workspace_id = "12345"
        }
      }
    expect_error: 'Error: Too many provider_config blocks(?s:.*)No more than 1 "provider_config" blocks are allowed'
    calls: []
  - name: create_with_empty_provider_config_uses_provider_workspace_id
    config: &config_empty_block |
      resource "databricks_mlflow_model" "this" {
        name = "routed-model"
        provider_config {}
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "routed-model"}
        response:
          status: 200
          body:
            json: {"registered_model": {"name": "routed-model",
                                        "creation_timestamp": 1700000000000,
                                        "last_updated_timestamp": 1700000000000,
                                        "user_id": "replay-admin@example.com"}}
      - &read_model
        request:
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [routed-model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "routed-model",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "replay-admin@example.com",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e8f8",
                     "permission_level": "CAN_MANAGE"}}
      - *read_model
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: routed-model
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: plan_after_create_with_empty_provider_config_is_empty
    plan_only: true
    config: *config_empty_block
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_model
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
destroy:
  calls:
    - *read_model
    - request:
        method: DELETE
        path: /api/2.0/mlflow/registered-models/delete
        query:
          name: [routed-model]
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
