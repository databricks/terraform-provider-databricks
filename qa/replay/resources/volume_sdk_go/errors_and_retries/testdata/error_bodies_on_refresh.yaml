# Runs volume/testdata/error_bodies_on_refresh.yaml with databricks_volume on sdk-go
# uc/volumes/v1 in every step, and expects the same behavior. The volume requests carry no
# Accept header, which an empty header expectation pins. The original's description:
#
# Pins how the classic SDK turns refresh GET error bodies into diagnostics. Each failing
# refresh keeps the volume in state, so the next step reads it again. An empty 404 body
# counts as missing and plans a create; a non-JSON 404 body does not. API responses are
# inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "refresh_errors_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "refresh_errors_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "refresh_errors_volume",
                            "full_name": "main.replay.refresh_errors_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-101",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000101"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.refresh_errors_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_answered_500_with_empty_body_fails_with_status_text
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: Internal Server Error\n'
    calls:
      - request: *read_request
        response:
          status: 500
          body: null
  - name: refresh_answered_404_with_empty_body_plans_create
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls:
      - request: *read_request
        response:
          status: 404
          body: null
  - name: refresh_answered_html_fails_with_pre_message
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: Request processing failed\n'
    calls:
      - request: *read_request
        response:
          status: 500
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: "<html><head><title>Error 500</title></head><body><h2>HTTP ERROR
              500</h2><pre>Request processing failed.</pre></body></html>"
  - name: refresh_answered_plain_text_error_code_fails_with_message
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: Volume main\.replay\.refresh_errors_volume
      is being moved\.\n'
    calls:
      - request: *read_request
        response:
          status: 400
          body:
            text: "INVALID_STATE: Volume main.replay.refresh_errors_volume is being
              moved."
  - name: refresh_answered_api_1_2_error_fails_with_error_field
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: Volume lookup failed\.\n'
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            json: {"error": "Volume lookup failed."}
  - name: refresh_answered_integer_error_code_fails_with_message
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: Malformed volume request\.\n'
    calls:
      - request: *read_request
        response:
          status: 400
          body:
            json: {"error_code": 400, "message": "Malformed volume request."}
  - name: refresh_answered_error_details_fails_with_message_only
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: Volume name is not valid\.\n'
    calls:
      - request: *read_request
        response:
          status: 400
          body:
            json: {"error_code": "INVALID_PARAMETER_VALUE",
                   "message": "Volume name is not valid.",
                   "details": [{"@type": "type.googleapis.com/google.rpc.ErrorInfo",
                                "reason": "INVALID_VOLUME_NAME",
                                "domain": "unity-catalog.databricks.com",
                                "metadata": {"volume": "refresh_errors_volume"}},
                               {"@type": "type.googleapis.com/google.rpc.RetryInfo",
                                "retry_delay": "1s"}]}
  - name: refresh_answered_non_json_404_fails_and_keeps_volume
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: 404 page not found\n'
    calls:
      - request: *read_request
        response:
          status: 404
          body:
            text: 404 page not found
  - name: refresh_answered_unparseable_json_fails_with_raw_body
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: \{"error_code": "INTERNAL_ERROR", "message":
      "Volume lookup\n'
    calls:
      - request: *read_request
        response:
          status: 500
          headers:
            Content-Type: application/json
          body:
            text: '{"error_code": "INTERNAL_ERROR", "message": "Volume lookup'
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.refresh_errors_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
          Accept: ""
        body: null
      response:
        status: 200
        body:
          json: {}
