# Pins response fields sent with the wrong JSON type. The classic client retries a
# field that fails to decode as a quoted string, so a number sent for a string is taken
# as its digits: a numeric name in the create response becomes the ID, and the read
# that follows asks for that name; a numeric name or id on the GET goes to the state as
# a string. tags sent as an object fails on the POST and on the GET. The retry's error
# replaces the first one, so the message names neither the field nor the type; it does
# name an encoding/json type that Go 1.27 renamed, so its pattern takes both spellings.
# Each such pattern checks the message, the request line and the echoed body, and skips
# the generated headers in between. Taking a number as a name is a suspected defect; if
# it is fixed, update those steps. API responses are synthetic: inferred from the
# MLflow Model Registry API, not recorded; the answer to the get for 42 is the
# registry's usual reply to a name it doesn't have.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_answered_numeric_name_takes_it_as_the_id_and_reads_that_name
    config: &config |
      resource "databricks_mlflow_model" "this" {
        name        = "decode_model"
        description = "first description"

        tags {
          key   = "team"
          value = "replay"
        }
      }
    expect_error: 'Error: cannot read mlflow model: RegisteredModel ''42'' does not
      exist\. It might have been deleted\.\n'
    calls:
      - request: &create_request
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "decode_model", "description": "first description",
                   "tags": [{"key": "team", "value": "replay"}]}
        response:
          status: 200
          body:
            json: {"registered_model": {
                     "name": 42,
                     "description": "first description",
                     "tags": [{"key": "team", "value": "replay"}],
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000}}
      - &read_42_not_found
        request:
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: ["42"]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 404
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "RegisteredModel '42' does not exist. It might have been
                     deleted."}
  - name: plan_after_numeric_name_reads_42_drops_it_and_plans_the_create_again
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [create]
          after:
            - path: [name]
              equals: decode_model
            - path: [id]
              unknown: true
    calls:
      - *read_42_not_found
  - name: create_answered_tags_as_object_fails_with_masked_error
    config: *config
    expect_error: 'Error: cannot create mlflow model: failed to unmarshal response body:
      json: cannot unmarshal string into Go value of type
      map\[string\](json\.RawMessage|jsontext\.Value)\. This is likely a bug in the
      Databricks SDK for Go or the underlying REST API\. Please report this issue with
      the following debugging information to the SDK issue tracker at
      https://github\.com/databricks/databricks-sdk-go/issues\. Request
      log:\n```\nPOST /api/2\.0/mlflow/registered-models/create\n(?s:.*)<
      \{\n<   "registered_model": \{\n<     "description": "first
      description",\n<     "name": "decode_model",\n<     "tags":
      \{\n<       "team": "replay"\n<     \}\n<   \}\n< \}\n```\n'
    calls:
      - *read_42_not_found
      - request: *create_request
        response:
          status: 200
          body:
            json: {"registered_model": {
                     "name": "decode_model",
                     "description": "first description",
                     "tags": {"team": "replay"}}}
  - name: create_answered_with_tags_as_array_sends_the_post_again_and_succeeds
    config: *config
    plan:
      changes:
        databricks_mlflow_model.this:
          actions: [create]
    calls:
      - request: *create_request
        response:
          status: 200
          body:
            json: {"registered_model": {
                     "name": "decode_model",
                     "description": "first description",
                     "tags": [{"key": "team", "value": "replay"}],
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000}}
      - &read
        request: &read_request
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [decode_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "decode_model",
                     "id": "0123456789abcdef0123456789abcdef",
                     "description": "first description",
                     "tags": [{"key": "team", "value": "replay"}],
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "permission_level": "CAN_MANAGE"}}
      - *read
    state: &state
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: decode_model
            - path: [name]
              equals: decode_model
            - path: [registered_model_id]
              equals: 0123456789abcdef0123456789abcdef
            - path: [tags, 0, key]
              equals: team
            - path: [tags, 0, value]
              equals: replay
  - name: refresh_answered_tags_as_object_fails_with_masked_error
    config: *config
    expect_error: 'Error: cannot read mlflow model: failed to unmarshal response body:
      json: cannot unmarshal string into Go value of type
      map\[string\](json\.RawMessage|jsontext\.Value)\. This is likely a bug in the
      Databricks SDK for Go or the underlying REST API\. Please report this issue with
      the following debugging information to the SDK issue tracker at
      https://github\.com/databricks/databricks-sdk-go/issues\. Request
      log:\n```\nGET
      /api/2\.0/mlflow/databricks/registered-models/get\?name=decode_model\n(?s:.*)<
      \{\n<   "registered_model_databricks": \{\n<     "description": "first
      description",\n<     "id": "0123456789abcdef0123456789abcdef",\n<     "name":
      "decode_model",\n<     "tags": \{\n<       "team":
      "replay"\n<     \}\n<   \}\n< \}\n```\n'
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "decode_model",
                     "id": "0123456789abcdef0123456789abcdef",
                     "description": "first description",
                     "tags": {"team": "replay"}}}
  - name: refresh_answered_numeric_name_puts_its_digits_in_state_and_plans_replacement
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [delete, create]
          before:
            - path: [id]
              equals: decode_model
            - path: [name]
              equals: "42"
          after:
            - path: [name]
              equals: decode_model
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: decode_model
            - path: [name]
              equals: "42"
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": 42,
                     "id": "0123456789abcdef0123456789abcdef",
                     "description": "first description",
                     "tags": [{"key": "team", "value": "replay"}],
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "permission_level": "CAN_MANAGE"}}
  - name: refresh_answered_numeric_id_puts_its_digits_in_state_and_plans_nothing
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: decode_model
            - path: [name]
              equals: decode_model
            - path: [registered_model_id]
              equals: "123456789"
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "decode_model",
                     "id": 123456789,
                     "description": "first description",
                     "tags": [{"key": "team", "value": "replay"}],
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "permission_level": "CAN_MANAGE"}}
  - name: plan_after_failed_refresh_keeps_the_model_and_plans_nothing
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state: *state
    calls:
      - *read
destroy:
  calls:
    - *read
    - request:
        method: DELETE
        path: /api/2.0/mlflow/registered-models/delete
        query:
          name: [decode_model]
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
