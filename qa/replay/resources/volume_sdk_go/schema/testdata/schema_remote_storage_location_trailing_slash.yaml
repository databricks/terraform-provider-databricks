# Runs volume_schema/testdata/schema_remote_storage_location_trailing_slash.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same requests
# and behavior. The original's description:
#
# Pins diff suppression when the API returns storage_location with a trailing slash
# that the configuration omits: state keeps the API's value with the slash, and the
# next plan is empty instead of replacing the volume. API responses are inferred from
# the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_external_keeps_the_remote_trailing_slash
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name             = "slashed_volume"
        catalog_name     = "main"
        schema_name      = "replay"
        volume_type      = "EXTERNAL"
        storage_location = "s3://replay-bucket/volumes/slashed"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "slashed_volume", "volume_type": "EXTERNAL",
                   "storage_location": "s3://replay-bucket/volumes/slashed"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "slashed_volume",
                           "full_name": "main.replay.slashed_volume",
                           "volume_type": "EXTERNAL", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-bucket/volumes/slashed/",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001883"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.slashed_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [storage_location]
              equals: s3://replay-bucket/volumes/slashed/
  - name: plan_with_remote_trailing_slash_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [storage_location]
              equals: s3://replay-bucket/volumes/slashed/
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.slashed_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
