# Pins how a refresh decodes created_at and updated_at, which the SDK decodes as int64 but
# the resource doesn't map. Quoted numbers are accepted and change nothing. A quoted
# non-numeric value and a quoted value that overflows int64 fail with the SDK's ParseInt
# error. An unquoted number that overflows fails with the error of the SDK's retry as a
# quoted string. Each failure has a request log, and the pattern checks its message and
# request line. A failed refresh leaves the state as it was, so the next plan is empty. API
# responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_volume" "this" {
        name         = "timestamp_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "timestamp_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "timestamp_volume",
                            "full_name": "main.replay.timestamp_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-197",
                            "created_at": 1767225600000, "updated_at": 1767312000000}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.timestamp_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_with_quoted_numeric_timestamps_keeps_the_state
    plan_only: true
    config: *config
    plan: &empty_plan
      expect: empty
      changes: {}
    state: &created_state
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.timestamp_volume
            - path: [comment]
              equals: first comment
            - path: [volume_path]
              equals: /Volumes/main/replay/timestamp_volume
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "timestamp_volume",
                   "full_name": "main.replay.timestamp_volume",
                   "volume_type": "MANAGED", "comment": "first comment",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-197",
                   "created_at": "1767225600000", "updated_at": "1767312000000"}
  - name: refresh_with_non_numeric_created_at_fails_with_parse_int_error
    config: *config
    expect_error: 'Error: cannot read volume: failed to unmarshal response body:
      strconv\.ParseInt: parsing "yesterday": invalid syntax\. This is likely a bug in the
      Databricks SDK for Go or the underlying REST API\. Please report this issue with the
      following debugging information to the SDK issue tracker at
      https://github\.com/databricks/databricks-sdk-go/issues\. Request log:\n```\nGET
      /api/2\.1/unity-catalog/volumes/main\.replay\.timestamp_volume\n'
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "timestamp_volume",
                   "full_name": "main.replay.timestamp_volume",
                   "volume_type": "MANAGED", "comment": "first comment",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-197",
                   "created_at": "yesterday", "updated_at": 1767312000000}
  - &plan_after_failed_refresh
    name: plan_after_the_failed_refresh_is_empty
    plan_only: true
    config: *config
    plan: *empty_plan
    state: *created_state
    calls:
      - *read_created
  - name: refresh_with_quoted_overflowing_updated_at_fails_with_parse_int_error
    config: *config
    expect_error: 'Error: cannot read volume: failed to unmarshal response body:
      strconv\.ParseInt: parsing "99999999999999999999": value out of range\. This is
      likely a bug in the Databricks SDK for Go or the underlying REST API\. Please report
      this issue with the following debugging information to the SDK issue tracker at
      https://github\.com/databricks/databricks-sdk-go/issues\. Request log:\n```\nGET
      /api/2\.1/unity-catalog/volumes/main\.replay\.timestamp_volume\n'
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "timestamp_volume",
                   "full_name": "main.replay.timestamp_volume",
                   "volume_type": "MANAGED", "comment": "first comment",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-197",
                   "created_at": 1767225600000, "updated_at": "99999999999999999999"}
  - *plan_after_failed_refresh
  - name: refresh_with_unquoted_overflowing_updated_at_fails_with_the_quoted_retry_error
    config: *config
    expect_error: 'Error: cannot read volume: failed to unmarshal response body: json:
      cannot unmarshal string into Go value of type int64\. This is likely a bug in the
      Databricks SDK for Go or the underlying REST API\. Please report this issue with the
      following debugging information to the SDK issue tracker at
      https://github\.com/databricks/databricks-sdk-go/issues\. Request log:\n```\nGET
      /api/2\.1/unity-catalog/volumes/main\.replay\.timestamp_volume\n'
    calls:
      - request: *read_request
        response:
          status: 200
          headers:
            Content-Type: application/json
          body:
            text: '{"catalog_name": "main", "schema_name": "replay", "name":
              "timestamp_volume", "full_name": "main.replay.timestamp_volume",
              "volume_type": "MANAGED", "comment": "first comment", "owner":
              "replay-admin@example.com", "storage_location":
              "s3://replay-metastore/volume-197", "created_at": 1767225600000,
              "updated_at": 99999999999999999999}'
  - *plan_after_failed_refresh
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.timestamp_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
