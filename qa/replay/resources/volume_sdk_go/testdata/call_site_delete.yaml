# Runs volume/testdata/call_site_delete.yaml with databricks_volume on sdk-go
# uc/volumes/v1 in every step, and expects the same behavior. The volume POST, GET and
# DELETE requests carry no Accept header, which an empty header expectation pins. The
# original's description:
#
# Pins the DELETE failing with errors the classic SDK does not retry and does not count as
# already deleted: 401, 409, 502, and 504 with a message that matches no transient
# pattern. Each failure sends one DELETE and fails apply with its error. The volume stays
# in state under its ID, so the next plan still plans its deletion and the next apply
# refreshes and deletes it again. API responses are inferred from the Unity Catalog API
# contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "delete_call_site_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "delete_call_site_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "delete_call_site_volume",
                            "full_name": "main.replay.delete_call_site_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-1927",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001927"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.delete_call_site_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: delete_401_fails_without_retry
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_empty |
      provider "databricks" {}
    expect_error: 'Error: cannot delete volume: Credential was not sent or was of an
      unsupported type for this API\.\n'
    calls:
      - *read_created
      - request: &delete_request
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.delete_call_site_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 401
          body:
            json: {"error_code": "UNAUTHENTICATED",
                   "message": "Credential was not sent or was of an unsupported type for
                     this API."}
  - name: plan_after_401_keeps_the_volume_and_plans_its_deletion
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_empty
    plan: &plans_deletion
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete]
    state: &kept_id
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.delete_call_site_volume
    calls:
      - *read_created
  - name: delete_409_fails_without_retry
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_empty
    expect_error: 'Error: cannot delete volume: Volume
      ''main\.replay\.delete_call_site_volume'' is in use by a running operation\.\n'
    calls:
      - *read_created
      - request: *delete_request
        response:
          status: 409
          body:
            json: {"error_code": "RESOURCE_CONFLICT",
                   "message": "Volume 'main.replay.delete_call_site_volume' is in use by a
                     running operation."}
  - name: plan_after_409_keeps_the_volume_and_plans_its_deletion
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_empty
    plan: *plans_deletion
    state: *kept_id
    calls:
      - *read_created
  - name: delete_502_fails_without_retry
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_empty
    expect_error: 'Error: cannot delete volume: Bad gateway\.\n'
    calls:
      - *read_created
      - request: *delete_request
        response:
          status: 502
          body:
            json: {"error_code": "BAD_GATEWAY", "message": "Bad gateway."}
  - name: plan_after_502_keeps_the_volume_and_plans_its_deletion
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_empty
    plan: *plans_deletion
    state: *kept_id
    calls:
      - *read_created
  - name: delete_504_with_a_non_transient_message_fails_without_retry
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_empty
    expect_error: 'Error: cannot delete volume: Upstream request timeout\.\n'
    calls:
      - *read_created
      - request: *delete_request
        response:
          status: 504
          body:
            json: {"error_code": "DEADLINE_EXCEEDED",
                   "message": "Upstream request timeout."}
  - name: plan_after_504_keeps_the_volume_and_plans_its_deletion
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_empty
    plan: *plans_deletion
    state: *kept_id
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request: *delete_request
      response:
        status: 200
        body:
          json: {}
