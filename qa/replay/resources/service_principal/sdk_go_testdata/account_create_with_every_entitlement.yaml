# Runs account_create_with_every_entitlement with reads and writes through sdk-go scim/v1.
# No sdk-go request carries an Accept header, and its GETs carry no Content-Type header.
# Reads by ID send no attributes query. Writes send Content-Type application/json. PATCH
# bodies also carry the ID. Account-level POST bodies have no schemas, entitlements or
# groups, which the account-level scim/v1 model doesn't have. An empty header expectation
# matches only requests without that header.
#
# Pins the account-level create body on AWS with external_id, active = false and every
# entitlement that can be combined with workspace_access, none of which the body carries.
# workspace_consume conflicts with workspace_access and databricks_sql_access, so
# account_create_with_workspace_consume covers it. API responses are inferred from the
# SCIM API contract, not recorded. An empty X-Databricks-Workspace-Id expectation matches
# only requests without that header.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_with_every_entitlement_external_id_and_inactive
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_service_principal" "this" {
        display_name               = "SPN entitled"
        external_id                = "external-201"
        active                     = false
        allow_cluster_create       = true
        allow_instance_pool_create = true
        databricks_sql_access      = true
        workspace_access           = true
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: ""
            Accept: ""
          body:
            json: {"displayName": "SPN entitled", "active": false,
                   "externalId": "external-201"}
        response:
          status: 201
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN entitled", "active": false,
                   "externalId": "external-201",
                   "entitlements": [{"value": "allow-cluster-create"},
                                    {"value": "allow-instance-pool-create"},
                                    {"value": "databricks-sql-access"},
                                    {"value": "workspace-access"}]}
      - &read_created
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201
          headers:
            X-Databricks-Workspace-Id: ""
            Accept: ""
            Content-Type: ""
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN entitled", "active": false,
                   "externalId": "external-201",
                   "entitlements": [{"value": "allow-cluster-create"},
                                    {"value": "allow-instance-pool-create"},
                                    {"value": "databricks-sql-access"},
                                    {"value": "workspace-access"}]}
      - *read_created
    state:
      resources:
        databricks_service_principal.this:
          attributes:
            - path: [id]
              equals: "201"
            - path: [application_id]
              equals: 00000000-0000-4000-8000-000000000001
            - path: [acl_principal_id]
              equals: servicePrincipals/00000000-0000-4000-8000-000000000001
            - path: [home]
              equals: /Users/00000000-0000-4000-8000-000000000001
            - path: [repos]
              equals: /Repos/00000000-0000-4000-8000-000000000001
  - name: plan_after_create_is_empty
    sdk_implementations:
      databricks_service_principal: sdk_go
    plan_only: true
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_service_principal" "this" {
        display_name               = "SPN entitled"
        external_id                = "external-201"
        active                     = false
        allow_cluster_create       = true
        allow_instance_pool_create = true
        databricks_sql_access      = true
        workspace_access           = true
      }
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: PATCH
        path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201
        headers:
          Content-Type: application/json
          X-Databricks-Workspace-Id: ""
          Accept: ""
        body:
          json: {"id": "201",
                 "schemas": ["urn:ietf:params:scim:api:messages:2.0:PatchOp"],
                 "Operations": [{"op": "replace", "path": "active",
                                 "value": [{"value": "false"}]}]}
      response:
        status: 200
        body: null
