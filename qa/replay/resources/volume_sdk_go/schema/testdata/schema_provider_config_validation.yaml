# Runs volume/testdata/schema_provider_config_validation.yaml with databricks_volume on
# sdk-go uc/volumes/v1 in every step, and expects the same behavior. Its fixtures match
# the requests of both paths unchanged. The original's description:
#
# Pins plan-time validation of provider_config: an empty workspace_id fails, and so do
# two provider_config blocks, each before any API call.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: empty_workspace_id_fails_without_calls
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "routed_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = ""
        }
      }
    expect_error: 'Error: expected "provider_config\.0\.workspace_id" to not be an empty string, got \n'
    calls: []
  - name: two_provider_config_blocks_fail_without_calls
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "routed_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
        provider_config {
          workspace_id = "12345"
        }
      }
    expect_error: 'Error: Too many provider_config blocks(?s:.*)No more than 1 "provider_config" blocks are allowed'
    calls: []
destroy:
  calls: []
