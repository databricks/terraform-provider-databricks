# This journey pins a refresh after the provider host changes from workspace 12345's
# host to workspace 67890's while state records workspace 12345. The new host's
# metadata seeds the provider's workspace ID, so the refresh fails with a workspace_id
# mismatch without any call to either host. Destroy uses the last successful
# configuration, so it runs on workspace 12345's host. API responses are inferred from
# the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
provider_host: workspace_12345
hosts:
  workspace_12345:
    url: https://replay-workspace-12345.cloud.databricks.com
  workspace_67890:
    url: https://replay-workspace-67890.cloud.databricks.com
    metadata:
      host_type: workspace
      cloud: AWS
      workspace_id: "67890"
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_on_workspace_12345
    config: |
      resource "databricks_volume" "this" {
        name         = "routing_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "routing_volume", "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "routing_volume", "full_name": "main.replay.routing_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-1920",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001920"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.routing_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *volume
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: refresh_on_workspace_67890_fails_before_the_read
    config: |
      provider "databricks" {
        host = "https://replay-workspace-67890.cloud.databricks.com"
      }
      resource "databricks_volume" "this" {
        name         = "routing_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    expect_error: 'Error: cannot read volume: failed to validate workspace_id:
      workspace_id mismatch: provider is configured for workspace 67890 but got 12345 in
      provider_config\. please check the workspace_id provided in provider_config\n'
    calls: []
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.routing_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
