# Runs volume_retries/testdata/transport_faults_on_refresh.yaml with databricks_volume on
# sdk-go uc/volumes/v1 in every step, and expects the same behavior. The volume requests
# carry no Accept header, which an empty header expectation pins. The original's
# description:
#
# Pins how a refresh GET handles a broken connection, with http_timeout_seconds = 1. A
# body cut off halfway fails with "response body: unexpected EOF", a body that stalls
# halfway for longer than the timeout fails with "response body: context canceled", and
# a connection closed before any response fails with EOF; none of them is retried, so
# each fails the plan once and keeps the volume. A reset connection is retried, and the
# retry's answer refreshes the volume. API responses are inferred from the Unity
# Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      provider "databricks" {
        http_timeout_seconds = 1
      }
      resource "databricks_volume" "this" {
        name         = "faulty_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "faulty_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "faulty_volume",
                           "full_name": "main.replay.faulty_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-2315",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000002315"}
      - &read_volume
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.faulty_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read_volume
  - name: refresh_with_truncated_body_fails_without_retry
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: response body: unexpected EOF\n'
    calls:
      - request: *read_request
        response:
          status: 200
          fault: truncate_body
          body:
            json: *volume
  - name: refresh_with_stalled_body_times_out_without_retry
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: response body: context canceled\n'
    calls:
      - request: *read_request
        response:
          status: 200
          fault: stall_body
          body:
            json: *volume
  - name: refresh_on_closed_connection_fails_without_retry
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: Get "[^"]+/main\.replay\.faulty_volume\??":
      EOF\n'
    calls:
      - request: *read_request
        response:
          fault: close
  - name: refresh_on_reset_connection_is_retried
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - request: *read_request
        response:
          fault: reset
      - *read_volume
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.faulty_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
          Accept: ""
        body: null
      response:
        status: 200
        body:
          json: {}
