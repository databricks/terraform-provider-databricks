# Pins the order of every dimension when the environment sets them all. The provider's
# extras follow the OS dimension and precede Terraform's, the upstream dimensions follow
# Terraform's, and the CI/CD, runtime, agent and meta-harness dimensions follow the auth
# type in that order. DATABRICKS_USER_AGENT_EXTRA makes the runner run this journey in a
# new test process.
# The folded pattern joins its lines with single spaces and must match the whole
# header. API responses are inferred from the Unity Catalog API contract, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
environment:
  DATABRICKS_USER_AGENT_EXTRA: "partner-a/1.2.3"
  DATABRICKS_SDK_UPSTREAM: "databricks-cli"
  DATABRICKS_SDK_UPSTREAM_VERSION: "0.250.0"
  GITHUB_ACTIONS: "true"
  DATABRICKS_RUNTIME_VERSION: "15.4"
  CLAUDECODE: "1"
  OMNIGENT: "1"
steps:
  - name: create_with_owner
    config: |
      resource "databricks_volume" "this" {
        name         = "user_agent_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "data-engineers"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          matchers: &user_agent
            headers:
              User-Agent:
                pattern: >-
                  databricks-tf-provider/\d+\.\d+\.\d+\S*
                  databricks-sdk-go/\d+\.\d+\.\d+\S* go/\d+\.\d+\.\d+ os/[a-z0-9]+
                  partner-a/1\.2\.3
                  terraform/\d+\.\d+\.\d+\S*
                  upstream/databricks-cli upstream-version/0\.250\.0
                  sdk/sdkv2 resource/volume auth/pat
                  cicd/github runtime/15\.4 agent/claude-code meta-harness/omnigent
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "user_agent_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "user_agent_volume",
                   "full_name": "main.replay.user_agent_volume", "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-303",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000303"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.user_agent_volume
          matchers: *user_agent
          body:
            json: {"owner": "data-engineers"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "user_agent_volume",
                           "full_name": "main.replay.user_agent_volume",
                           "volume_type": "MANAGED", "owner": "data-engineers",
                           "storage_location": "s3://replay-metastore/volume-303",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000303"}
      - &read
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.user_agent_volume
          matchers: *user_agent
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.user_agent_volume
destroy:
  calls:
    - *read
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.user_agent_volume
        matchers: *user_agent
        body: null
      response:
        status: 200
        body:
          json: {}
