# This journey pins connection resets on the DELETE. The SDK retries "connection reset by
# peer" as a transient URL error. When every DELETE is reset, apply fails with the last
# reset once retry_timeout_seconds ends and the volume stays in state, so planning the
# volume's configuration again shows no change. The destroy then deletes the volume on
# the retry after one reset. Three seconds allow exactly two attempts: the retry starts
# 1.05 to 1.75 seconds after the first attempt, and a third attempt could start no
# sooner than 3.1 seconds after it. API responses are inferred from the Unity Catalog
# API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      provider "databricks" {
        retry_timeout_seconds = 3
      }
      resource "databricks_volume" "this" {
        name         = "connection_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "connection_volume", "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "connection_volume",
                   "full_name": "main.replay.connection_volume",
                   "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-299",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000299"}
      - &read
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.connection_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *volume
      - *read
  - name: delete_reset_until_the_retry_timeout_ends
    config: |
      provider "databricks" {
        retry_timeout_seconds = 3
      }
    expect_error: 'Error: cannot delete volume: Delete
      "http://127\.0\.0\.1:\d+/api/2\.1/unity-catalog/volumes/main\.replay\.connection_volume\?":
      read tcp 127\.0\.0\.1:\d+->127\.0\.0\.1:\d+: read: connection reset by peer\n'
    calls:
      - *read
      - request: &delete
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.connection_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          fault: reset
        times: 2
        min_gap: 1s
        max_gap: 3s
  - name: plan_after_exhausted_delete_keeps_the_volume
    plan_only: true
    config: *config
    plan:
      expect: empty
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.connection_volume
    calls:
      - *read
destroy:
  calls:
    - *read
    - request: *delete
      response:
        fault: reset
    - request: *delete
      response:
        status: 200
        body:
          json: {}
      min_gap: 1s
      max_gap: 3s
