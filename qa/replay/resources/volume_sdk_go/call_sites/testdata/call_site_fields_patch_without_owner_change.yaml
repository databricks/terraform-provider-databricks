# Runs volume_call_sites/testdata/call_site_fields_patch_without_owner_change.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same requests
# and behavior. The original's description:
#
# Pins the fields PATCH of an update that leaves the owner unchanged, failing with errors
# the classic SDK does not retry: 401, 403, 502, and 504 with a message that matches no
# transient pattern. Each update renames the volume and changes its comment. Every
# failure fails apply with the PATCH's error after one PATCH to the old name, and sends
# no owner PATCH, no owner rollback and no read. The volume keeps its old ID, so the
# next plan refreshes the old name and plans the same update again. API responses are
# inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_owner
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "fields_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first"
        owner        = "owner-a@example.com"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "fields_volume", "volume_type": "MANAGED", "comment": "first"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "fields_volume", "full_name": "main.replay.fields_volume",
                   "volume_type": "MANAGED", "comment": "first",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-1924",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001924"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.fields_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "first", "owner": "owner-a@example.com"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "fields_volume",
                            "full_name": "main.replay.fields_volume",
                            "volume_type": "MANAGED", "comment": "first",
                            "owner": "owner-a@example.com",
                            "storage_location": "s3://replay-metastore/volume-1924",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001924"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.fields_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: fields_patch_401_fails_update_without_rollback_or_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_updated |
      resource "databricks_volume" "this" {
        name         = "fields_renamed"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second"
        owner        = "owner-a@example.com"
      }
    expect_error: 'Error: cannot update volume: Credential was not sent or was of an
      unsupported type for this API\.\n'
    calls:
      - *read_created
      - request: &fields_patch_request
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.fields_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"new_name": "fields_renamed", "comment": "second"}
        response:
          status: 401
          body:
            json: {"error_code": "UNAUTHENTICATED",
                   "message": "Credential was not sent or was of an unsupported type for
                     this API."}
  - name: plan_after_401_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: &plans_the_same_update
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [name]
              equals: fields_volume
            - path: [comment]
              equals: first
            - path: [owner]
              equals: owner-a@example.com
          after:
            - path: [name]
              equals: fields_renamed
            - path: [comment]
              equals: second
            - path: [owner]
              equals: owner-a@example.com
    state: &old_id
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.fields_volume
    calls:
      - *read_created
  - name: fields_patch_403_fails_update_without_rollback_or_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: User does not have MODIFY on Volume
      ''main\.replay\.fields_volume''\.\n'
    calls:
      - *read_created
      - request: *fields_patch_request
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "User does not have MODIFY on Volume
                     'main.replay.fields_volume'."}
  - name: plan_after_403_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: *plans_the_same_update
    state: *old_id
    calls:
      - *read_created
  - name: fields_patch_502_fails_update_without_rollback_or_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Bad gateway\.\n'
    calls:
      - *read_created
      - request: *fields_patch_request
        response:
          status: 502
          body:
            json: {"error_code": "BAD_GATEWAY", "message": "Bad gateway."}
  - name: plan_after_502_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: *plans_the_same_update
    state: *old_id
    calls:
      - *read_created
  - name: fields_patch_504_with_a_non_transient_message_fails_update_without_retry
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Upstream request timeout\.\n'
    calls:
      - *read_created
      - request: *fields_patch_request
        response:
          status: 504
          body:
            json: {"error_code": "DEADLINE_EXCEEDED",
                   "message": "Upstream request timeout."}
  - name: plan_after_504_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: *plans_the_same_update
    state: *old_id
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.fields_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
