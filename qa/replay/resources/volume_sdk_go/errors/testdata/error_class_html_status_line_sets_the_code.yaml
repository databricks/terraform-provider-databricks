# Runs volume_errors/testdata/error_class_html_status_line_sets_the_code.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same requests
# and behavior. The original's description:
#
# Pins that the reason phrase of an HTML error's status line sets its error code. The
# same 400 with a <pre> message counts as missing when its status line reads "400
# Resource Does Not Exist", which plans a create, and fails the refresh with the <pre>
# message when it reads "400 Bad Request". API responses are handwritten for the classic
# SDK's error parser, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "status_line_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "status_line_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "status_line_volume",
                            "full_name": "main.replay.status_line_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-234"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.status_line_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_answered_400_resource_does_not_exist_plans_create
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls:
      - request: *read_request
        response:
          status: 400
          status_line: HTTP/1.1 400 Resource Does Not Exist
          headers:
            Content-Type: text/html
          body:
            text: &html <html><body><pre>Volume main.replay.status_line_volume does not
              exist.</pre></body></html>
  - name: refresh_answered_400_bad_request_fails
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: Volume main\.replay\.status_line_volume does
      not exist\n'
    calls:
      - request: *read_request
        response:
          status: 400
          status_line: HTTP/1.1 400 Bad Request
          headers:
            Content-Type: text/html
          body:
            text: *html
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.status_line_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
