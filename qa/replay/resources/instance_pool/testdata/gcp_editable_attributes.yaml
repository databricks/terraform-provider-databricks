              idle_instance_autotermination_minutes: 10
              max_capacity: 1
              enable_elastic_disk: true
              custom_tags: null
              gcp_attributes: *id003
              instance_pool_id: pool-1
              min_idle_instances: 0
      - *id004
    plan:
      changes:
