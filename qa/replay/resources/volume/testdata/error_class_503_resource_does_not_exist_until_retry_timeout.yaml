# Pins a refresh GET that answers 503 with RESOURCE_DOES_NOT_EXIST until the retry
# timeout. The classic SDK retries by the 503 status, and when retry_timeout_seconds runs
# out it returns the last error, which counts as missing: the refresh removes the volume
# and plans a create. The provider default retries without limit, so the provider block
# sets a 3 second timeout. Backoff waits 1s plus 50-750ms of jitter, then 2s plus jitter,
# so exactly two GETs fit before the timeout. API responses are handwritten for the
# classic SDK's error parser, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      provider "databricks" {
        retry_timeout_seconds = 3
      }

      resource "databricks_volume" "this" {
        name         = "retry_timeout_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "retry_timeout_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "retry_timeout_volume",
                            "full_name": "main.replay.retry_timeout_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-1965",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001965"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.retry_timeout_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_answered_503_resource_does_not_exist_until_timeout_is_missing
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls:
      - &read_unavailable
        request: *read_request
        response:
          status: 503
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Volume 'main.replay.retry_timeout_volume' does not
                     exist."}
      - *read_unavailable
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.retry_timeout_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
