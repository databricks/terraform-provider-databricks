# Pins private-link login redirects on the two PATCHes that follow a successful owner
# PATCH. When the comment PATCH is redirected, the owner rollback PATCH follows and
# apply fails with the exact AWS PrivateLink message. When the comment PATCH fails and
# the rollback PATCH is redirected, apply fails with the owner-rollback message that
# joins the comment error and the PrivateLink message. Each redirect is followed with a
# GET that drops Content-Type. API responses are inferred from the private-link
# redirect contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_owner_and_comment
    config: &config_created |
      resource "databricks_volume" "this" {
        name         = "redirect_rollback_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
        owner        = "data-engineers"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "redirect_rollback_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "redirect_rollback_volume",
                   "full_name": "main.replay.redirect_rollback_volume",
                   "volume_type": "MANAGED", "comment": "first comment",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-1933",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001933"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_rollback_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "first comment", "owner": "data-engineers"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "redirect_rollback_volume",
                            "full_name": "main.replay.redirect_rollback_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "owner": "data-engineers",
                            "storage_location": "s3://replay-metastore/volume-1933",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001933"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_rollback_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: comment_patch_redirected_to_login_rolls_back_owner
    config: &config_updated |
      resource "databricks_volume" "this" {
        name         = "redirect_rollback_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second comment"
        owner        = "analysts"
      }
    expect_error: 'Error: cannot update volume: The requested workspace has AWS
      PrivateLink enabled and is not accessible from the current network\. Ensure that
      AWS PrivateLink is properly configured and that your device has access to the AWS
      VPC endpoint\. For more information, see
      https://docs\.databricks\.com/en/security/network/classic/privatelink\.html\.\n'
    calls:
      - *read_created
      - &owner_patch
        request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_rollback_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"owner": "analysts"}
        response:
          status: 200
          body:
            json: &owner_changed {"catalog_name": "main", "schema_name": "replay",
                                  "name": "redirect_rollback_volume",
                                  "full_name": "main.replay.redirect_rollback_volume",
                                  "volume_type": "MANAGED", "comment": "first comment",
                                  "owner": "analysts",
                                  "storage_location": "s3://replay-metastore/volume-1933",
                                  "metastore_id": "11111111-1111-1111-1111-111111111111",
                                  "volume_id": "00000000-0000-4000-8000-000000001933"}
      - request: &comment_patch_request
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_rollback_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "second comment"}
        response: &login_redirect
          status: 302
          headers:
            Location: /login.html?error=private-link-validation-error
          body: null
      - &login_page
        request:
          method: GET
          path: /login.html
          query:
            error: [private-link-validation-error]
          headers:
            Content-Type: ""
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: <html><body>Sign in</body></html>
      - request: &rollback_patch_request
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_rollback_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"owner": "data-engineers"}
        response:
          status: 200
          body:
            json: *created
  - name: plan_after_rollback_shows_update
    plan_only: true
    config: *config_updated
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [owner]
              equals: data-engineers
            - path: [comment]
              equals: first comment
          after:
            - path: [owner]
              equals: analysts
            - path: [comment]
              equals: second comment
    calls:
      - *read_created
  - name: rollback_patch_redirected_to_login_fails_with_owner_rollback_error
    config: *config_updated
    expect_error: 'Error: cannot update volume: User does not have MODIFY on Volume
      ''main\.replay\.redirect_rollback_volume''\.\. Owner rollback also failed: The
      requested workspace has AWS PrivateLink enabled and is not accessible from the
      current network\. Ensure that AWS PrivateLink is properly configured and that your
      device has access to the AWS VPC endpoint\. For more information, see
      https://docs\.databricks\.com/en/security/network/classic/privatelink\.html\.\.
      Owner of this resource was updated but other fields couldn''t be updated and owner
      couldn''t be rolled back\.\s+As a result, the owner of this resource is updated to
      analysts but other attributes aren''t\. To revert the owner change, please manually
      change the owner to data-engineers\.\s+You can also use the databricks cli
      \(https://docs\.databricks\.com/en/dev-tools/cli/install\.html\) to update the
      owner\.'
    calls:
      - *read_created
      - *owner_patch
      - request: *comment_patch_request
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "User does not have MODIFY on Volume
                     'main.replay.redirect_rollback_volume'."}
      - request: *rollback_patch_request
        response: *login_redirect
      - *login_page
  - name: plan_after_redirected_rollback_shows_comment_update
    plan_only: true
    config: *config_updated
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [owner]
              equals: analysts
            - path: [comment]
              equals: first comment
          after:
            - path: [owner]
              equals: analysts
            - path: [comment]
              equals: second comment
    calls:
      - &read_owner_changed
        request: *read_request
        response:
          status: 200
          body:
            json: *owner_changed
destroy:
  calls:
    - *read_owner_changed
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.redirect_rollback_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
