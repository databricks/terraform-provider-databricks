# Runs volume_updates/testdata/update_shape_owner_cleared_with_comment_change.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same behavior.
# The volume POST, GET, PATCH and DELETE requests carry no Accept header, which an empty
# header expectation pins. Each PATCH body also carries full_name_arg, the full name in
# its path, because sdk-go serializes the path field into the body. The original's
# description:
#
# Pins changing owner to "" together with comment. SDKv2 treats the empty computed owner
# as unset, so the plan keeps the remote owner and apply sends only the comment PATCH,
# without owner. API responses are inferred from the Unity Catalog API contract, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_owner_and_comment
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "owner_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
        owner        = "data-engineers"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "owner_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "owner_volume", "full_name": "main.replay.owner_volume",
                   "volume_type": "MANAGED", "comment": "first comment",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-18903",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000018903"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.owner_volume",
                   "comment": "first comment", "owner": "data-engineers"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "owner_volume",
                            "full_name": "main.replay.owner_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "owner": "data-engineers",
                            "storage_location": "s3://replay-metastore/volume-18903",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000018903"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: empty_owner_and_new_comment_send_only_the_comment_patch
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_updated |
      resource "databricks_volume" "this" {
        name         = "owner_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second comment"
        owner        = ""
      }
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [owner]
              equals: data-engineers
            - path: [comment]
              equals: first comment
          after:
            - path: [owner]
              equals: data-engineers
            - path: [comment]
              equals: second comment
    calls:
      - *read_created
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.owner_volume",
                   "comment": "second comment"}
        response:
          status: 200
          body:
            json: &updated {"catalog_name": "main", "schema_name": "replay",
                            "name": "owner_volume",
                            "full_name": "main.replay.owner_volume",
                            "volume_type": "MANAGED", "comment": "second comment",
                            "owner": "data-engineers",
                            "storage_location": "s3://replay-metastore/volume-18903",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000018903"}
      - &read_updated
        request: *read_request
        response:
          status: 200
          body:
            json: *updated
      - *read_updated
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [owner]
              equals: data-engineers
  - name: plan_after_update_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_updated
destroy:
  calls:
    - *read_updated
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.owner_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
          Accept: ""
        body: null
      response:
        status: 200
        body:
          json: {}
