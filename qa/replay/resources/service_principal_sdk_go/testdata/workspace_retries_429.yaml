# Runs workspace_retries_429 with reads and writes through sdk-go scim/v1. The GETs carry
# no attributes query, Accept or Content-Type header, so the API returns the full object.
# The create POST, the refresh GET, the read before the PUT, the PUT, the disable PATCH
# and the DELETE each get one 429 and are retried once with the same request, as on the
# existing path. Writes send Content-Type application/json and no Accept header, and PATCH
# and PUT bodies also carry the ID. API responses are inferred from the SCIM API contract,
# not recorded. An empty header expectation matches only requests without that header.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_retries_post
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: &disable_config |
      resource "databricks_service_principal" "this" {
        display_name             = "SPN retries"
        disable_as_user_deletion = true
      }
    calls:
      - request: &create_request
          method: POST
          path: /api/2.0/preview/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "displayName": "SPN retries", "active": true, "entitlements": [{}]}
        response: &too_many_requests
          status: 429
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Too many requests.", "status": "429"}
      - request: *create_request
        response:
          status: 201
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN retries", "active": true}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.0/preview/scim/v2/ServicePrincipals/201
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
            Content-Type: ""
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN retries", "active": true}
      - *read_created
  - name: refresh_retries_get
    sdk_implementations:
      databricks_service_principal: sdk_go
    plan_only: true
    config: *disable_config
    plan:
      expect: empty
      changes: {}
    calls:
      - request: *read_request
        response: *too_many_requests
      - *read_created
  - name: update_retries_get_and_put
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: |
      resource "databricks_service_principal" "this" {
        display_name             = "SPN retries renamed"
        disable_as_user_deletion = true
      }
    calls:
      - *read_created
      - request: &read_groups_and_roles_request
          method: GET
          path: /api/2.0/preview/scim/v2/ServicePrincipals/201
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
            Content-Type: ""
          body: null
        response: *too_many_requests
      - request: *read_groups_and_roles_request
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN retries", "active": true,
                   "groups": [{"display": "data-engineers", "type": "direct",
                               "value": "301", "$ref": "Groups/301"}]}
      - request: &update_request
          method: PUT
          path: /api/2.0/preview/scim/v2/ServicePrincipals/201
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"id": "201",
                   "schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "displayName": "SPN retries renamed", "active": true,
                   "entitlements": [{}],
                   "groups": [{"display": "data-engineers", "type": "direct",
                               "value": "301", "$ref": "Groups/301"}]}
        response: *too_many_requests
      - request: *update_request
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN retries renamed", "active": true}
      - &read_renamed
        request: *read_request
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN retries renamed", "active": true}
      - *read_renamed
  - name: delete_with_disable_retries_patch
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: &empty_config |
      provider "databricks" {}
    calls:
      - *read_renamed
      - request: &disable_request
          method: PATCH
          path: /api/2.0/preview/scim/v2/ServicePrincipals/201
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"id": "201",
                   "schemas": ["urn:ietf:params:scim:api:messages:2.0:PatchOp"],
                   "Operations": [{"op": "replace", "path": "active",
                                   "value": [{"value": "false"}]}]}
        response: *too_many_requests
      - request: *disable_request
        response:
          status: 200
          body: null
  - name: create_without_disable
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: |
      resource "databricks_service_principal" "this" {
        display_name = "SPN retries"
      }
    calls:
      - request: *create_request
        response:
          status: 201
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "202", "applicationId": "00000000-0000-4000-8000-000000000002",
                   "displayName": "SPN retries", "active": true}
      - &read_recreated
        request: &read_recreated_request
          method: GET
          path: /api/2.0/preview/scim/v2/ServicePrincipals/202
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
            Content-Type: ""
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "202", "applicationId": "00000000-0000-4000-8000-000000000002",
                   "displayName": "SPN retries", "active": true}
      - *read_recreated
destroy:
  calls:
    - *read_recreated
    - request: &delete_request
        method: DELETE
        path: /api/2.0/preview/scim/v2/ServicePrincipals/202
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response: *too_many_requests
    - request: *delete_request
      response:
        status: 204
        body: null
