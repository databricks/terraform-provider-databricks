# Pins a refresh GET answered 200 with a top-level JSON value that isn't an object: an
# array, a string, a number and a boolean. The SDK decodes the body into a map of fields
# first, so each fails with that map's type error and a request log. The pattern checks its
# message and request line. A failed refresh leaves the state as it was, so the next plan
# is empty. API responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_volume" "this" {
        name         = "non_object_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "non_object_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "non_object_volume",
                            "full_name": "main.replay.non_object_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-197"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.non_object_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_answered_200_with_a_top_level_array_fails_with_request_log
    config: *config
    expect_error: 'Error: cannot read volume: failed to unmarshal response body: json:
      cannot unmarshal array into Go value of type map\[string\]json\.RawMessage\. This
      is likely a bug in the Databricks SDK for Go or the underlying REST API\. Please
      report this issue with the following debugging information to the SDK issue tracker
      at https://github\.com/databricks/databricks-sdk-go/issues\. Request
      log:\n```\nGET /api/2\.1/unity-catalog/volumes/main\.replay\.non_object_volume\n'
    calls:
      - request: *read_request
        response:
          status: 200
          headers:
            Content-Type: application/json
          body:
            text: '[{"catalog_name": "main", "schema_name": "replay", "name":
              "non_object_volume", "full_name": "main.replay.non_object_volume",
              "volume_type": "MANAGED"}]'
  - &plan_after_failed_refresh
    name: plan_after_the_failed_refresh_is_empty
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.non_object_volume
            - path: [volume_path]
              equals: /Volumes/main/replay/non_object_volume
    calls:
      - *read_created
  - name: refresh_answered_200_with_a_top_level_string_fails_with_request_log
    config: *config
    expect_error: 'Error: cannot read volume: failed to unmarshal response body: json:
      cannot unmarshal string into Go value of type map\[string\]json\.RawMessage\. This
      is likely a bug in the Databricks SDK for Go or the underlying REST API\. Please
      report this issue with the following debugging information to the SDK issue tracker
      at https://github\.com/databricks/databricks-sdk-go/issues\. Request
      log:\n```\nGET /api/2\.1/unity-catalog/volumes/main\.replay\.non_object_volume\n'
    calls:
      - request: *read_request
        response:
          status: 200
          headers:
            Content-Type: application/json
          body:
            text: '"main.replay.non_object_volume"'
  - *plan_after_failed_refresh
  - name: refresh_answered_200_with_a_top_level_number_fails_with_request_log
    config: *config
    expect_error: 'Error: cannot read volume: failed to unmarshal response body: json:
      cannot unmarshal number into Go value of type map\[string\]json\.RawMessage\. This
      is likely a bug in the Databricks SDK for Go or the underlying REST API\. Please
      report this issue with the following debugging information to the SDK issue tracker
      at https://github\.com/databricks/databricks-sdk-go/issues\. Request
      log:\n```\nGET /api/2\.1/unity-catalog/volumes/main\.replay\.non_object_volume\n'
    calls:
      - request: *read_request
        response:
          status: 200
          headers:
            Content-Type: application/json
          body:
            text: '42'
  - *plan_after_failed_refresh
  - name: refresh_answered_200_with_a_top_level_boolean_fails_with_request_log
    config: *config
    expect_error: 'Error: cannot read volume: failed to unmarshal response body: json:
      cannot unmarshal bool into Go value of type map\[string\]json\.RawMessage\. This
      is likely a bug in the Databricks SDK for Go or the underlying REST API\. Please
      report this issue with the following debugging information to the SDK issue tracker
      at https://github\.com/databricks/databricks-sdk-go/issues\. Request
      log:\n```\nGET /api/2\.1/unity-catalog/volumes/main\.replay\.non_object_volume\n'
    calls:
      - request: *read_request
        response:
          status: 200
          headers:
            Content-Type: application/json
          body:
            text: 'true'
  - *plan_after_failed_refresh
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.non_object_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
