name: build

on:
  pull_request:
    types: [opened, synchronize]
  merge_group:
    types: [checks_requested]

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      suites: ${{ steps.matrix.outputs.suites }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Test suite discovery
        run: python3 -m unittest discover -s .github/scripts -p 'test_suites_test.py'

      - name: Discover replay suites
        id: matrix
        run: |
          suites=$(python3 .github/scripts/test_suites.py matrix)
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  lint:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: lint

  unit:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: unit
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  replay:
    name: replay (${{ matrix.shard }}/8)
    needs: discover
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover.outputs.suites) }}
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: replay-${{ matrix.shard }}
      packages: ${{ join(matrix.packages, ' ') }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Preserve the required check name across changes to the matrix.
  tests:
    needs: [discover, lint, unit, replay]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all test jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

          # No need to download cached dependencies when running gofmt.
          cache: false

      - name: Run gofmt
        run: |
          # -l: list files that were reformatted
          # -w: write back formatted files to disk
          gofmt -l -w ./

      - name: Run whitespace validation
        run: make ws

      - name: Fail on differences
        run: |
          # Exit with status code 1 if there are differences (i.e. unformatted files)
          git diff --exit-code
