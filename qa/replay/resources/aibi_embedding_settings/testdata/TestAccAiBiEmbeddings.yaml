        response: *response_1
      - request:
          method: "PATCH"
          path: "/api/2.0/settings/types/aibi_dash_embed_ws_apprvd_domains/names/default"
          body:
            json:
              allow_missing: true
              field_mask: "aibi_dashboard_embedding_approved_domains.approved_domains"
              setting:
                aibi_dashboard_embedding_approved_domains:
                  approved_domains: ["test.com"]
                setting_name: "default"
        response: &response_2 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              aibi_dashboard_embedding_approved_domains:
                approved_domains: ["test.com"]
              etag: "domains-1"
              setting_name: "default"
      - &get_2
        request: {method: "GET", path: "/api/2.0/settings/types/aibi_dash_embed_ws_apprvd_domains/names/default", query: {"etag": ["domains-1"]}, body: null}
        response: *response_2
      - *get_1
      - *get_2
