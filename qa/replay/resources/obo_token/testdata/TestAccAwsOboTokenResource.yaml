          status: 200
          body:
            json:
              Resources:
                - displayName: admins
                  id: '9600'
                  members: []
                  schemas: ['urn:ietf:params:scim:schemas:core:2.0:Group']
              totalResults: 1
      - request:
          method: POST
          path: /api/2.0/preview/scim/v2/ServicePrincipals
          body:
            json:
              active: true
              displayName: tf-replay
              entitlements:
                - {}
              schemas: ['urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal']
        response: &response_1 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              active: true
              applicationId: 11111111-1111-4111-8111-000000009601
              displayName: tf-replay
              id: '9601'
              schemas: ['urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal']
      - &call_2
        request:
          method: GET
          path: /api/2.0/preview/scim/v2/ServicePrincipals/9601
          body: null
          query:
            attributes: ['userName,displayName,active,externalId,entitlements']
        response: *response_1 # Inferred API response; not recorded.
      - request:
          method: PATCH
          path: /api/2.0/preview/scim/v2/Groups/9600
          body:
            json:
              Operations:
                - op: add
                  path: members
                  value:
                    - value: '9601'
              schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
        response: &response_2 # Inferred API response; not recorded.
          status: 200
          body: null
      - request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups/9600
          body: null
          query:
            attributes: [members]
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              displayName: admins
              id: '9600'
              members:
                - $ref: ServicePrincipals/9601
                  value: '9601'
              schemas: ['urn:ietf:params:scim:schemas:core:2.0:Group']
      - request:
          method: POST
          path: /api/2.0/token-management/on-behalf-of/tokens
          body:
            json:
              application_id: 11111111-1111-4111-8111-000000009601
              comment: PAT on behalf of tf-replay
              lifetime_seconds: 3600
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              token_info:
                comment: PAT on behalf of tf-replay
                creation_time: 4102441200000
                expiry_time: 4102444800000
                token_id: obo-1
              token_value: fixture-token
      - &call_3
        request:
          method: GET
          path: /api/2.0/token-management/tokens/obo-1
