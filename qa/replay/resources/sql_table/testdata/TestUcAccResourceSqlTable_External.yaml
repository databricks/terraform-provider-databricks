version: 1
host_metadata: # Dummy host metadata.
  host_type: workspace
  cloud: AWS
  workspace_id: '12345'
steps:
  - name: create_external_table
    config: |
      resource "databricks_storage_credential" "external" {
        name = "cred-replay"
        aws_iam_role {
          role_arn = "arn:aws:iam::123456789012:role/replay-metastore"
        }
        comment = "Managed by TF"
      }

      resource "databricks_external_location" "some" {
        name            = "external-replay"
        url             = "s3://replay-bucket/somereplay"
        credential_name = databricks_storage_credential.external.id
        comment         = "Managed by TF"
        force_destroy   = true
      }

      resource "databricks_schema" "this" {
        name         = "replay"
        catalog_name = "main"
      }

      resource "databricks_sql_table" "this" {
        name               = "bar"
        catalog_name       = "main"
        schema_name        = databricks_schema.this.name
        table_type         = "EXTERNAL"
        data_source_format = "DELTA"
        storage_location   = databricks_external_location.some.url
        comment            = "this table is managed by terraform"
        owner              = "account users"
        warehouse_id       = "warehouse-1"

        column {
          name = "id"
          type = "int"
        }
        column {
          name = "name"
          type = "string"
        }

        depends_on = [
          databricks_external_location.some
        ]
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/schemas
          headers:
            X-Databricks-Workspace-Id: '12345'
          body:
            json:
              catalog_name: main
              name: replay
        response: &response_1 # Inferred API response; not recorded.
          body:
            json:
              catalog_name: main
              enable_predictive_optimization: INHERIT
              full_name: main.replay
              name: replay
              owner: tester@example.com
          status: 200
      - &call_2
        request:
          method: GET
          path: /api/2.1/unity-catalog/schemas/main.replay
          headers:
            X-Databricks-Workspace-Id: '12345'
          body: null
        response: *response_1 # Inferred API response; not recorded.
      - request:
          method: POST
          path: /api/2.1/unity-catalog/storage-credentials
          headers:
            X-Databricks-Workspace-Id: '12345'
          body:
            json:
              aws_iam_role:
                role_arn: arn:aws:iam::123456789012:role/replay-metastore
              comment: Managed by TF
              name: cred-replay
        response: &response_2 # Inferred API response; not recorded.
          body:
