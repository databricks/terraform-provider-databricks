# This journey pins an account lookup answered 200 without deployment_name, for an
# account-level provider on an AWS account domain. The SDK builds the workspace host
# from the empty deployment name, so it asks https://.cloud.databricks.com for its host
# metadata and sends the volume POST there, still with the workspace's
# X-Databricks-Workspace-Id header. A live run fails to resolve that host. The journey
# names the host so that it can pin both calls, and closes each connection in place of
# the DNS failure. The SDK goes on without the metadata, and create fails with the
# POST's transport error, so nothing is stored. API responses are inferred from the
# account API contract, not recorded.
version: 1
enforce_call_order: true
provider_host: account
hosts:
  account:
    url: https://accounts.cloud.databricks.com
  empty_deployment:
    url: https://.cloud.databricks.com
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_posts_to_a_host_without_a_deployment_name
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "databricks_volume" "this" {
        name         = "routing_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    expect_error: 'Error: cannot create volume: Post
      "https://\.cloud\.databricks\.com/api/2\.1/unity-catalog/volumes": EOF\n'
    calls:
      - request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          matchers:
            headers:
              X-Databricks-Workspace-Id: absent
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 12345,
                   "workspace_name": "replay-workspace-12345",
                   "workspace_status": "RUNNING"}
      - request:
          method: GET
          host: empty_deployment
          path: /.well-known/databricks-config
          body: null
        response:
          fault: close
      - request:
          method: POST
          host: empty_deployment
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "routing_volume", "volume_type": "MANAGED"}
        response:
          fault: close
destroy:
  calls: []
