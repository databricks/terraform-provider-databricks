# Runs volume_updates/testdata/update_shape_owner_rollback_to_empty_owner.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same requests
# and behavior. The original's description:
#
# Pins the owner rollback when state holds an empty owner. The volume is created from
# responses without owner, so owner stays null in state. Changing owner and comment
# sends the owner PATCH, then the comment PATCH; when that fails, the rollback PATCH to
# the old empty owner has the body {}, so it restores nothing. Apply fails with the
# comment PATCH's error, and the next refresh adopts the new remote owner. This is a
# suspected defect, pinned as-is. API responses are inferred from the Unity Catalog API
# contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_from_responses_without_owner
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "ownerless_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "ownerless_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "ownerless_volume",
                            "full_name": "main.replay.ownerless_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "storage_location": "s3://replay-metastore/volume-18904",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000018904"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.ownerless_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: plan_after_create_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: |
      resource "databricks_volume" "this" {
        name         = "ownerless_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
      }
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [owner]
              equals: null
    calls:
      - *read_created
  - name: failed_update_sends_empty_rollback_patch
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_updated |
      resource "databricks_volume" "this" {
        name         = "ownerless_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second comment"
        owner        = "analysts"
      }
    expect_error: 'Error: cannot update volume: Comment exceeds the maximum length\.'
    calls:
      - *read_created
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.ownerless_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"owner": "analysts"}
        response:
          status: 200
          body:
            json: &owner_changed {"catalog_name": "main", "schema_name": "replay",
                                  "name": "ownerless_volume",
                                  "full_name": "main.replay.ownerless_volume",
                                  "volume_type": "MANAGED", "comment": "first comment",
                                  "owner": "analysts",
                                  "storage_location":
                                    "s3://replay-metastore/volume-18904",
                                  "metastore_id": "11111111-1111-1111-1111-111111111111",
                                  "volume_id": "00000000-0000-4000-8000-000000018904"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.ownerless_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "second comment"}
        response:
          status: 400
          body:
            json: {"error_code": "INVALID_PARAMETER_VALUE",
                   "message": "Comment exceeds the maximum length."}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.ownerless_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {}
        response:
          status: 200
          body:
            json: *owner_changed
  - name: plan_after_rollback_keeps_the_new_owner
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [owner]
              equals: analysts
            - path: [comment]
              equals: first comment
          after:
            - path: [owner]
              equals: analysts
            - path: [comment]
              equals: second comment
    calls:
      - &read_owner_changed
        request: *read_request
        response:
          status: 200
          body:
            json: *owner_changed
destroy:
  calls:
    - *read_owner_changed
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.ownerless_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
