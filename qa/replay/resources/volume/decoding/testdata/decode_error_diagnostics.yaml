# Pins the request log in a decode error's message. Its request headers include
# Authorization as REDACTED, never the token; the trace and user agent values vary by run
# and environment, so the pattern skips them, as it skips the response's Date. The rest of
# the first log is exact. A response body over 10 KiB is cut to its first 10240 bytes: a
# non-JSON body as a whole, and a JSON body per string value, each followed by the number
# of bytes cut. The long bodies are folded YAML, so each line break is one space in the
# body. The long body and the long comment are each 10261 bytes: LAST-LOGGED-BYTES ends at
# byte 10240, and the 21 bytes of " DROPPED-FROM-THE-LOG" after it are cut. A failed
# refresh leaves the state as it was, so the next plan is empty. API responses are inferred
# from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_volume" "this" {
        name         = "diagnostics_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "diagnostics_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "diagnostics_volume",
                            "full_name": "main.replay.diagnostics_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-197"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.diagnostics_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_decode_error_logs_the_request_with_authorization_redacted
    config: *config
    expect_error: 'Error: cannot read volume: failed to unmarshal response body:
      unexpected end of JSON input\. This is likely a bug in the Databricks SDK for Go or
      the underlying REST API\. Please report this issue with the following debugging
      information to the SDK issue tracker at
      https://github\.com/databricks/databricks-sdk-go/issues\. Request log:\n```\nGET
      /api/2\.1/unity-catalog/volumes/main\.replay\.diagnostics_volume\n> \* Host: \n>
      \* Accept: application/json\n> \* Authorization: REDACTED\n> \* Traceparent:
      [^\n]+\n> \* User-Agent: [^\n]+\n> \* X-Databricks-Workspace-Id: 12345\n<
      HTTP/1\.1 200 OK\n< \* Content-Length: 47\n< \* Content-Type: application/json\n<
      \* Date: [^\n]+\n< \{"full_name": "main\.replay\.diagnostics_volume",\n```\n'
    calls:
      - request: *read_request
        response:
          status: 200
          headers:
            Content-Type: application/json
          body:
            text: '{"full_name": "main.replay.diagnostics_volume",'
  - &plan_after_failed_refresh
    name: plan_after_the_failed_refresh_is_empty
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.diagnostics_volume
            - path: [comment]
              equals: first comment
    calls:
      - *read_created
