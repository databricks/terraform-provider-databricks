      status: 200
      body:
        json:
          account_id: replay-account
          name: tf-replay1
          network_connectivity_config_id: ncc-1
          region: eastus2
  - request:
      method: POST
      path: /api/2.0/accounts/replay-account/network-connectivity-configs/ncc-1/private-endpoint-rules
      body:
        json:
          group_id: blob
          resource_id: /subscriptions/2a5a4578-9ca9-47e2-ba46-f6ee6cc731f2/resourceGroups/deco-prod-azure-eastus2-rg/providers/Microsoft.Storage/storageAccounts/decotestprodunity
    response:
      status: 200
      body:
        json:
          account_id: replay-account
          connection_state: ESTABLISHED
          deactivated: false
          enabled: true
          group_id: blob
          network_connectivity_config_id: ncc-1
          resource_id: /subscriptions/2a5a4578-9ca9-47e2-ba46-f6ee6cc731f2/resourceGroups/deco-prod-azure-eastus2-rg/providers/Microsoft.Storage/storageAccounts/decotestprodunity
          rule_id: rule-1
  - &id002
    request:
      method: GET
      path: /api/2.0/accounts/replay-account/network-connectivity-configs/ncc-1/private-endpoint-rules/rule-1
      body: null
    response:
