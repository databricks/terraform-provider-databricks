# Runs volume_updates/testdata/update_with_two_part_id_fails.yaml with databricks_volume
# on sdk-go uc/volumes/v1 in every step, and expects the same requests and behavior. The
# original's description:
#
# Pins an update of a volume whose state ID isn't catalog.schema.volume. Importing a
# two-part ID keeps it as the ID, and refreshes and the DELETE put it in the path. An
# update fails with the exact invalid id error before any PATCH. The fixtures answer the
# two-part GET with the volume because the importer needs a successful read to reach
# the update; the ID handling is what this journey pins. API responses are inferred from
# the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: import_by_two_part_id_keeps_it_as_the_id
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "two_part_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    import:
      resource: databricks_volume.this
      id: replay.two_part_volume
      persist: true
    calls:
      - &read_two_part
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/replay.two_part_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "two_part_volume", "full_name": "main.replay.two_part_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-211",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000211"}
      - *read_two_part
  - name: plan_after_import_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: |
      resource "databricks_volume" "this" {
        name         = "two_part_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: replay.two_part_volume
    calls:
      - *read_two_part
  - name: update_fails_with_invalid_id_before_any_patch
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "two_part_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "two parts"
      }
    expect_error: 'Error: cannot update volume: invalid id <replay\.two_part_volume>: id
      should be in the format catalog\.schema\.volume\n'
    calls:
      - *read_two_part
destroy:
  calls:
    - *read_two_part
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/replay.two_part_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
