# Pins that a DELETE answered 404 does not count as a deleted model when the JSON body's
# error_code is INVALID_PARAMETER_VALUE. The classic SDK classes an error by its
# error_code before its status, and this code is a bad request, not a missing model: the
# apply fails with the API message, the DELETE is sent once, the model stays in state and
# the next plan deletes it again. API responses are synthetic: inferred from the MLflow
# Model Registry API, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: |
      resource "databricks_mlflow_model" "this" {
        name        = "error_body_delete_code_model"
        description = "Pins a delete 404 with INVALID_PARAMETER_VALUE"
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "error_body_delete_code_model",
                   "description": "Pins a delete 404 with INVALID_PARAMETER_VALUE"}
        response:
          status: 200
          body:
            json: {"registered_model": {
                     "name": "error_body_delete_code_model",
                     "description": "Pins a delete 404 with INVALID_PARAMETER_VALUE",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "tester@example.com"}}
      - &read_created
        request:
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [error_body_delete_code_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "error_body_delete_code_model",
                     "id": "9f8e7d6c5b4a39281706f5e4d3c2b191",
                     "description": "Pins a delete 404 with INVALID_PARAMETER_VALUE",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "tester@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read_created
  - name: delete_answered_404_invalid_parameter_value_fails
    config: &config_empty |
      provider "databricks" {}
    expect_error: 'Error: cannot delete mlflow model: Registered model name
      ''error_body_delete_code_model'' is not valid\.\n'
    calls:
      - *read_created
      - request: &delete_request
          method: DELETE
          path: /api/2.0/mlflow/registered-models/delete
          query:
            name: [error_body_delete_code_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 404
          body:
            json: {"error_code": "INVALID_PARAMETER_VALUE",
                   "message": "Registered model name 'error_body_delete_code_model' is
                     not valid."}
  - name: plan_after_404_invalid_parameter_value_deletes_again
    plan_only: true
    config: *config_empty
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [delete]
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: error_body_delete_code_model
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request: *delete_request
      response:
        status: 200
        body:
          json: {}
