# Runs volume_routing/testdata/routing_me_response_without_numeric_org_id.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same behavior.
# It makes no volume call, so its fixtures are unchanged. The original's description:
#
# Pins SCIM /Me answering 200 without a usable X-Databricks-Org-Id header, on a
# workspace-level provider whose host metadata has no workspace ID. Create checks
# provider_config.workspace_id against the provider's workspace through /Me, so both a
# missing header and a non-numeric one fail apply with the parse error before any
# volume call. API responses are inferred from the SCIM API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
steps:
  - name: me_without_org_id_header_fails_create
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "me_shape_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    expect_error: 'cannot create volume: failed to validate workspace_id: failed to get
      the workspace_id: strconv\.ParseInt: parsing "": invalid syntax'
    calls:
      - request: &me_request
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          body: null
        response:
          status: 200
          body:
            json: &me_body {"id": "1001", "userName": "replay-admin@example.com",
                            "schemas": ["urn:ietf:params:scim:schemas:core:2.0:User"]}
  - name: me_with_non_numeric_org_id_fails_create
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'cannot create volume: failed to validate workspace_id: failed to get
      the workspace_id: strconv\.ParseInt: parsing "replay-org": invalid syntax'
    calls:
      - request: *me_request
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: replay-org
          body:
            json: *me_body
destroy:
  calls: []
