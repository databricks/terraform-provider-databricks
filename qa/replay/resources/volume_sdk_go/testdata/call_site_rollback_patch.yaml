                   "message": "Credential was not sent or was of an unsupported type for
                     this API."}
  - name: plan_after_401_keeps_the_new_owner_and_plans_only_the_comment
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_owner_b
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [owner]
              equals: owner-b@example.com
            - path: [comment]
              equals: first
          after:
            - path: [owner]
              equals: owner-b@example.com
            - path: [comment]
              equals: second
