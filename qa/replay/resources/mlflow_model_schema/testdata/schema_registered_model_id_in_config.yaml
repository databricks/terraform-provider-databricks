# Pins plan-time validation of registered_model_id: it is computed only, so setting it
# in the configuration fails before any API call.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: setting_registered_model_id_fails_without_calls
    config: |
      resource "databricks_mlflow_model" "this" {
        name                = "configured-id-model"
        registered_model_id = "0a1b2c3d4e5f60718293a4b5c6d7e8f7"
      }
    expect_error: 'Error: Value for unconfigurable attribute(?s:.*)Can''t configure a value for "registered_model_id": its value will be decided\s+automatically based on the result of applying this configuration\.'
    calls: []
destroy:
  calls: []
