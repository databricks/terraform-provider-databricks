# API responses are inferred from the scenarios and API models, not recorded.
version: 1
host_metadata: # Dummy host metadata.
  host_type: "unified"
  cloud: "AWS"
  account_id: "replay-account"
steps:
  - name: "create_in_workspace"
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_job" "j1" {
        name = "tf-replay-job-1"
        provider_config { workspace_id = "12345" }
        task {
          task_key = "check"
          condition_task {
            left  = "true"
            op    = "EQUAL_TO"
            right = "true"
          }
        }
      }
    calls:
      - &lookup_workspace_12345
        request: {method: "GET", path: "/api/2.0/accounts/replay-account/workspaces/12345", body: null}
        response: &response_1 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              account_id: "replay-account"
              deployment_name: "replay-workspace-12345"
              workspace_id: 12345
              workspace_name: "replay-workspace-12345"
              workspace_status: "RUNNING"
      - request:
          method: "POST"
          path: "/api/2.2/jobs/create"
          body:
            json:
              max_concurrent_runs: 1
              name: "tf-replay-job-1"
              queue:
                enabled: false
              tasks:
                - condition_task:
                    left: "true"
                    op: "EQUAL_TO"
                    right: "true"
                  task_key: "check"
          headers:
            "X-Databricks-Workspace-Id": "12345"
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              job_id: 101
      - &get_1
        request:
          method: "GET"
          path: "/api/2.2/jobs/get"
          body: null
          query:
            job_id: ["101"]
          headers:
            "X-Databricks-Workspace-Id": "12345"
        response: &response_2 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              creator_user_name: "tester@example.com"
              job_id: 101
              settings:
                format: "MULTI_TASK"
                max_concurrent_runs: 1
                name: "tf-replay-job-1"
                queue:
                  enabled: false
                tasks:
                  - condition_task:
                      left: "true"
                      op: "EQUAL_TO"
                      right: "true"
                    task_key: "check"
      - *lookup_workspace_12345
      - *get_1
    state:
      resources:
        databricks_job.j1:
          attributes:
            - path: ["name"]
              equals: "tf-replay-job-1"
destroy:
  calls:
    - *lookup_workspace_12345
    - *get_1
    - *lookup_workspace_12345
    - request:
        method: "POST"
        path: "/api/2.2/jobs/delete"
        body:
          json:
            job_id: 101
        headers:
          "X-Databricks-Workspace-Id": "12345"
      response: # Inferred API response; not recorded.
        status: 200
        body: null
