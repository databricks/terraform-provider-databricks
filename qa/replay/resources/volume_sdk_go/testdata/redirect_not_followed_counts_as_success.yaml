# Runs volume/testdata/redirect_not_followed_counts_as_success.yaml with databricks_volume
# on sdk-go uc/volumes/v1 in every step, and expects the same behavior. The volume POST,
# GET and DELETE requests carry no Accept header, which an empty header expectation pins.
# The original's description:
#
# Pins refresh answers in the 3xx range that Go's client returns without following: a
# 302 without Location and a 304. The classic SDK counts any status below 400 as
# success unless the final URL is the private-link login page, so it decodes the body
# as the volume. A 302 body with another comment refreshes the state to that comment
# and plans an update; an empty 304 body blanks every field and plans a replacement.
# API responses are inferred from the HTTP redirect contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "redirect_unfollowed_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "redirect_unfollowed_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "redirect_unfollowed_volume",
                            "full_name": "main.replay.redirect_unfollowed_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-1940",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001940"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_unfollowed_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_answered_302_without_location_decodes_its_body
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [comment]
              equals: comment from redirect
          after:
            - path: [comment]
              equals: first comment
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.redirect_unfollowed_volume
            - path: [comment]
              equals: comment from redirect
    calls:
      - request: *read_request
        response:
          status: 302
          headers:
            Content-Type: application/json
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "redirect_unfollowed_volume",
                   "full_name": "main.replay.redirect_unfollowed_volume",
                   "volume_type": "MANAGED", "comment": "comment from redirect",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-1940",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001940"}
  - name: refresh_answered_304_blanks_state_and_plans_replacement
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete, create]
          before:
            - path: [name]
              equals: ""
            - path: [catalog_name]
              equals: ""
            - path: [volume_path]
              equals: /Volumes/
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.redirect_unfollowed_volume
            - path: [name]
              equals: ""
    calls:
      - request: *read_request
        response:
          status: 304
          body: null
  - name: plan_after_unfollowed_redirects_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.redirect_unfollowed_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
          Accept: ""
        body: null
      response:
        status: 200
        body:
          json: {}
