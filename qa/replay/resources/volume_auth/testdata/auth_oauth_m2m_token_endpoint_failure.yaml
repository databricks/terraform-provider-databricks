# Pins a failing OAuth M2M token endpoint on the create POST and the refresh GET of
# databricks_volume. The token is fetched in the volume call's request visitor, so a
# token endpoint that rejects the client fails that call before it is sent: the step
# sends one token request and no volume request, and nothing is retried. The create
# leaves no volume in state. The failed refresh keeps the volume, and the next plan is
# empty. Token and API responses are inferred from the OAuth and Unity Catalog API
# contracts, not recorded.
version: 1
enforce_call_order: true
provider_host: workspace
hosts:
  workspace:
    url: https://replay-workspace.cloud.databricks.com
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
auth:
  type: oauth-m2m
  client_id: replay-sp
  client_secret: replay-secret
steps:
  - name: create_fails_before_the_post
    config: &config |
      resource "databricks_volume" "this" {
        name         = "auth_m2m_failure_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    expect_error: 'Error: cannot create volume: failed during request visitor: error
      getting token: Post "https://replay-workspace\.cloud\.databricks\.com/oidc/v1/token":
      \{"error":"invalid_client","error_description":"Client authentication failed"\}\n'
    calls:
      - &discovery
        request:
          method: GET
          path: /oidc/.well-known/oauth-authorization-server
          matchers:
            headers:
              Authorization: absent
          body: null
        response:
          status: 200
          body:
            json:
              authorization_endpoint: https://replay-workspace.cloud.databricks.com/oidc/v1/authorize
              token_endpoint: https://replay-workspace.cloud.databricks.com/oidc/v1/token
      - &rejected_token
        request: &token_request
          method: POST
          path: /oidc/v1/token
          headers:
            Content-Type: application/x-www-form-urlencoded
          matchers:
            headers:
              # base64 of replay-sp:replay-secret.
              Authorization: {pattern: 'Basic cmVwbGF5LXNwOnJlcGxheS1zZWNyZXQ='}
          body:
            text: grant_type=client_credentials&scope=all-apis
        response:
          status: 401
          body:
            json: {"error": "invalid_client",
                   "error_description": "Client authentication failed"}
  - name: create
    config: *config
    calls:
      - *discovery
      - &token
        request: *token_request
        response:
          status: 200
          body:
            json: {"access_token": "m2m-token", "token_type": "Bearer",
                   "expires_in": 3600}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: &credentials
            headers:
              Authorization: {pattern: 'Bearer m2m-token'}
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "auth_m2m_failure_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "auth_m2m_failure_volume",
                            "full_name": "main.replay.auth_m2m_failure_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-302",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000302"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.auth_m2m_failure_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: *credentials
          body: null
        response:
          status: 200
          body:
            json: *created
      # Terraform's post-apply plan.
      - *discovery
      - *token
      - *read_created
  - name: refresh_fails_before_the_get
    config: *config
    expect_error: 'Error: cannot read volume: failed during request visitor: error getting
      token: Post "https://replay-workspace\.cloud\.databricks\.com/oidc/v1/token":
      \{"error":"invalid_client","error_description":"Client authentication failed"\}\n'
    calls:
      - *discovery
      - *rejected_token
  - name: state_kept_after_the_failed_refresh
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.auth_m2m_failure_volume
            - path: [storage_location]
              equals: s3://replay-metastore/volume-302
    calls:
      - *discovery
      - *token
      - *read_created
destroy:
  calls:
    # The refresh, then the destroy.
    - *discovery
    - *token
    - *read_created
    - *discovery
    - *token
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.auth_m2m_failure_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        matchers: *credentials
        body: null
      response:
        status: 200
        body:
          json: {}
