- name: create_permissions
  config: |
    locals {
      name = "pipeline-acceptance-replay"
    }
    resource "databricks_pipeline" "this" {
      name    = local.name
      storage = "/test/${local.name}"


      library {
        notebook {
          path = databricks_notebook.this.path
        }
      }



      continuous = false
    }
    resource "databricks_notebook" "this" {
      content_base64 = base64encode("# replay\n")
      path           = "/Shared/${local.name}"
      language       = "SQL"
    }
    data "databricks_current_user" "me" {}
    resource "databricks_group" "_0" {
      display_name = "permissions-replay-0"
    }
    resource "databricks_permissions" "this" {
      pipeline_id = databricks_pipeline.this.id
      access_control {
        group_name       = databricks_group._0.display_name
        permission_level = "CAN_VIEW"
      }
    }
  calls:
  - &id003
    request:
      method: GET
      path: /api/2.0/preview/scim/v2/Me
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      headers:
        X-Databricks-Org-Id: '12345'
      body:
        json:
          active: true
          displayName: Replay runner
          groups:
          - display: admins
            value: '901'
          id: '900'
          schemas:
          - urn:ietf:params:scim:schemas:core:2.0:User
          userName: 11111111-1111-4111-8111-000000000000
  - request:
      method: POST
      path: /api/2.0/workspace/import
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          content: IyByZXBsYXkK
          format: SOURCE
          language: SQL
          overwrite: true
          path: /Shared/pipeline-acceptance-replay
    response:
      status: 200
      body: null
  - &id016
    request:
      method: POST
      path: /api/2.0/preview/scim/v2/Groups
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
