# Pins SCIM /Me answering 404 while a refresh builds the volume's workspace client, on
# a workspace-level provider whose host metadata has no workspace ID. The refresh treats
# the routing error as a missing volume: it drops the volume from the refreshed state
# without a volume GET and plans to create it again. API responses are inferred from
# the Unity Catalog and SCIM API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
steps:
  - name: create_checks_workspace_id_through_me
    config: &config |
      resource "databricks_volume" "this" {
        name         = "me_not_found_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - &me
        request: &me_request
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          body: null
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: "12345"
          body:
            json: {"id": "1001", "userName": "replay-admin@example.com",
                   "schemas": ["urn:ietf:params:scim:schemas:core:2.0:User"]}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "me_not_found_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "me_not_found_volume",
                           "full_name": "main.replay.me_not_found_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1913",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001913"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.me_not_found_volume
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *me
      - *read_volume
  - name: refresh_drops_volume_when_me_is_not_found
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
          after:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
    calls:
      # The refresh plan.
      - request: *me_request
        response:
          status: 404
          body:
            json: {"error_code": "NOT_FOUND",
                   "message": "User not found"}
destroy:
  calls:
    - *me
    - *read_volume
    - *me
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.me_not_found_volume
        body: null
      response:
        status: 200
        body:
          json: {}
