# Runs volume/testdata/error_bodies_on_update.yaml with databricks_volume on sdk-go
# uc/volumes/v1 in every step, and expects the same behavior. The volume POST, GET, PATCH
# and DELETE requests carry no Accept header, which an empty header expectation pins. Each
# PATCH body also carries full_name_arg, the full name in its path, because sdk-go
# serializes the path field into the body. The original's description:
#
# Pins how the classic SDK turns update PATCH error bodies into diagnostics. Each step
# changes the comment, the refresh still returns the old comment, and the PATCH fails, so
# the next step sends the same PATCH again. An empty 404 body fails the update too; only
# refresh and delete treat it as missing. API responses are inferred from the Unity
# Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "update_errors_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "update_errors_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "update_errors_volume",
                            "full_name": "main.replay.update_errors_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-111",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000111"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.update_errors_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: update_answered_404_with_empty_body_fails_with_status_text
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_updated |
      resource "databricks_volume" "this" {
        name         = "update_errors_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second comment"
      }
    expect_error: 'Error: cannot update volume: Not Found\n'
    calls:
      - *read_created
      - request: &patch_request
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.update_errors_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.update_errors_volume",
                   "comment": "second comment"}
        response:
          status: 404
          body: null
  - name: update_answered_500_with_empty_body_fails_with_status_text
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Internal Server Error\n'
    calls:
      - *read_created
      - request: *patch_request
        response:
          status: 500
          body: null
  - name: update_answered_html_fails_with_pre_message
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Request processing failed\n'
    calls:
      - *read_created
      - request: *patch_request
        response:
          status: 500
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: "<html><head><title>Error 500</title></head><body><h2>HTTP ERROR
              500</h2><pre>Request processing failed.</pre></body></html>"
  - name: update_answered_plain_text_error_code_fails_with_message
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Volume main\.replay\.update_errors_volume
      is being moved\.\n'
    calls:
      - *read_created
      - request: *patch_request
        response:
          status: 400
          body:
            text: "INVALID_STATE: Volume main.replay.update_errors_volume is being
              moved."
  - name: update_answered_api_1_2_error_fails_with_error_field
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Volume update failed\.\n'
    calls:
      - *read_created
      - request: *patch_request
        response:
          status: 500
          body:
            json: {"error": "Volume update failed."}
  - name: update_answered_integer_error_code_fails_with_message
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Malformed volume request\.\n'
    calls:
      - *read_created
      - request: *patch_request
        response:
          status: 400
          body:
            json: {"error_code": 400, "message": "Malformed volume request."}
  - name: update_answered_error_details_fails_with_message_only
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Comment is not valid\.\n'
    calls:
      - *read_created
      - request: *patch_request
        response:
          status: 400
          body:
            json: {"error_code": "INVALID_PARAMETER_VALUE",
                   "message": "Comment is not valid.",
                   "details": [{"@type": "type.googleapis.com/google.rpc.ErrorInfo",
                                "reason": "INVALID_COMMENT",
                                "domain": "unity-catalog.databricks.com",
                                "metadata": {"volume": "update_errors_volume"}},
                               {"@type": "type.googleapis.com/google.rpc.RetryInfo",
                                "retry_delay": "1s"}]}
  - name: update_answered_non_json_404_fails_with_body
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: 404 page not found\n'
    calls:
      - *read_created
      - request: *patch_request
        response:
          status: 404
          body:
            text: 404 page not found
  - name: update_answered_unparseable_json_fails_with_raw_body
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: \{"error_code": "INTERNAL_ERROR",
      "message": "Volume update\n'
    calls:
      - *read_created
      - request: *patch_request
        response:
          status: 500
          headers:
            Content-Type: application/json
          body:
            text: '{"error_code": "INTERNAL_ERROR", "message": "Volume update'
  - name: plan_after_failed_updates_plans_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [comment]
              equals: first comment
          after:
            - path: [comment]
              equals: second comment
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.update_errors_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
          Accept: ""
        body: null
      response:
        status: 200
        body:
          json: {}
