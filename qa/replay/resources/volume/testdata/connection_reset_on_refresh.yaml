# This journey pins connection resets on the refresh GET. The SDK retries "connection
# reset by peer" as a transient URL error, so a refresh whose first GET is reset reads
# the volume on the retry and plans no change. When every GET is reset, the plan fails
# with the last reset once retry_timeout_seconds ends, and the volume stays in state, so
# the next plan reads it again and plans no change. Three seconds allow exactly two
# attempts: the retry starts 1.05 to 1.75 seconds after the first attempt, and a third
# attempt could start no sooner than 3.1 seconds after it. API responses are inferred
# from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      provider "databricks" {
        retry_timeout_seconds = 3
      }
      resource "databricks_volume" "this" {
        name         = "connection_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "connection_volume", "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "connection_volume",
                   "full_name": "main.replay.connection_volume",
                   "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-299",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000299"}
      - &read
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.connection_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *volume
      - *read
  - name: refresh_get_retried_once_after_a_reset
    plan_only: true
    config: *config
    plan: &no_change
      expect: empty
    state: &kept
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.connection_volume
            - path: [volume_path]
              equals: /Volumes/main/replay/connection_volume
    calls:
      - request: *read_request
        response:
          fault: reset
      - request: *read_request
        response: *volume
        min_gap: 1s
        max_gap: 3s
  # An apply refreshes first, so its plan fails at the refresh.
  - name: refresh_get_reset_until_the_retry_timeout_ends
    config: *config
    expect_error: 'Error: cannot read volume: Get
      "http://127\.0\.0\.1:\d+/api/2\.1/unity-catalog/volumes/main\.replay\.connection_volume\?":
      read tcp 127\.0\.0\.1:\d+->127\.0\.0\.1:\d+: read: connection reset by peer\n'
    calls:
      - request: *read_request
        response:
          fault: reset
        times: 2
        min_gap: 1s
        max_gap: 3s
  - name: plan_after_exhausted_refresh_keeps_the_volume
    plan_only: true
    config: *config
    plan: *no_change
    state: *kept
    calls:
      - *read
destroy:
  calls:
    - *read
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.connection_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
