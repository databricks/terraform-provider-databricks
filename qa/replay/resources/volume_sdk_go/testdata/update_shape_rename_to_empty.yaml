# Runs volume_updates/testdata/update_shape_rename_to_empty.yaml with databricks_volume on
# sdk-go uc/volumes/v1 in every step, and expects the same behavior. The volume POST, GET,
# PATCH and DELETE requests carry no Accept header, which an empty header expectation
# pins. Each PATCH body also carries full_name_arg, the full name in its path, because
# sdk-go serializes the path field into the body. The original's description:
#
# Pins renaming to "". The PATCH omits new_name, so its body is {} and the volume keeps
# its name. The read back skips the remote name because name is empty in the applied
# configuration, so state holds the empty name, the ID is unchanged and the next plan
# is empty. This is a suspected defect, pinned as-is. API responses are inferred from
# the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "original_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "original_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &original {"catalog_name": "main", "schema_name": "replay",
                             "name": "original_volume",
                             "full_name": "main.replay.original_volume",
                             "volume_type": "MANAGED",
                             "owner": "replay-admin@example.com",
                             "storage_location": "s3://replay-metastore/volume-18905",
                             "metastore_id": "11111111-1111-1111-1111-111111111111",
                             "volume_id": "00000000-0000-4000-8000-000000018905"}
      - &read_original
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.original_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *original
      - *read_original
  - name: rename_to_empty_sends_empty_patch
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_empty_name |
      resource "databricks_volume" "this" {
        name         = ""
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [name]
              equals: original_volume
          after:
            - path: [name]
              equals: ""
    calls:
      - *read_original
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.original_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.original_volume",
                   }
        response:
          status: 200
          body:
            json: *original
      - *read_original
      - *read_original
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.original_volume
            - path: [name]
              equals: ""
            - path: [volume_path]
              equals: /Volumes/main/replay/original_volume
  - name: plan_after_rename_to_empty_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_empty_name
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [name]
              equals: ""
    calls:
      - *read_original
destroy:
  calls:
    - *read_original
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.original_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
          Accept: ""
        body: null
      response:
        status: 200
        body:
          json: {}
