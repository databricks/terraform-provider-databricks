# API responses are inferred from the scenarios and API models, not recorded.
version: 1
host_metadata: # Dummy host metadata.
  host_type: workspace
  cloud: Azure
  workspace_id: '12345'
steps:
  - name: create_keyvault_scope
    config: |
      resource "databricks_secret_scope" "my_scope" {
        name = "tf-replay"
        keyvault_metadata {
          resource_id = "/subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/replay/providers/Microsoft.KeyVault/vaults/replay"
          dns_name    = "https://replay.vault.azure.net/"
        }
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/secrets/scopes/create
          headers:
            X-Databricks-Workspace-Id: '12345'
          body:
            json:
              backend_azure_keyvault:
                dns_name: https://replay.vault.azure.net/
                resource_id: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/replay/providers/Microsoft.KeyVault/vaults/replay
              scope: tf-replay
              scope_backend_type: AZURE_KEYVAULT
        response: &response_1 # Inferred API response; not recorded.
          body: null
          status: 200
      - &call_1
        request:
          method: GET
          path: /api/2.0/secrets/scopes/list
          headers:
            X-Databricks-Workspace-Id: '12345'
          body: null
        response: # Inferred API response; not recorded.
          body:
            json:
              scopes:
                - backend_type: AZURE_KEYVAULT
                  keyvault_metadata:
                    dns_name: https://replay.vault.azure.net/
                    resource_id: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/replay/providers/Microsoft.KeyVault/vaults/replay
                  name: tf-replay
          status: 200
      - *call_1
destroy:
  calls:
    - *call_1
    - request:
        method: POST
        path: /api/2.0/secrets/scopes/delete
        headers:
          X-Databricks-Workspace-Id: '12345'
        body:
          json:
            scope: tf-replay
      response: *response_1 # Inferred API response; not recorded.
