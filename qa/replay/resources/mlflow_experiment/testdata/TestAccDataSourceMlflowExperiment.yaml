      resources:
        data.databricks_mlflow_experiment.by_name:
          attributes:
            - path: ["id"]
              equals: "123"
            - path: ["artifact_location"]
              equals: "dbfs:/tmp/my-experiment"
  - name: "lookup_id"
    config: |
      data "databricks_current_user" "me" {}
      resource "databricks_mlflow_experiment" "this" {
        name = "${data.databricks_current_user.me.home}/experiment-replay-2"
        artifact_location = "dbfs:/tmp/my-experiment"
        description = "My MLflow experiment description"
      }
      data "databricks_mlflow_experiment" "by_id" {
        depends_on = [databricks_mlflow_experiment.this]
        experiment_id = databricks_mlflow_experiment.this.experiment_id
      }
    calls:
      - *get_1
      - *get_3
      - request:
          method: "POST"
          path: "/api/2.0/mlflow/experiments/update"
          body:
            json:
              experiment_id: "123"
              new_name: "/Users/replay@example.com/experiment-replay-2"
