# Pins a refresh GET answered with a volume_type the SDK doesn't define. The SDK decodes it
# without validation, the refreshed state holds it, and because volume_type forces a new
# volume, the next plan replaces the volume. API responses are inferred from the Unity
# Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_volume" "this" {
        name         = "typed_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "typed_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "typed_volume", "full_name": "main.replay.typed_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-197"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.typed_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_with_unknown_volume_type_keeps_it_and_plans_replacement
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete, create]
          before:
            - path: [volume_type]
              equals: MANAGED_SNAPSHOT
          after:
            - path: [volume_type]
              equals: MANAGED
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.typed_volume
            - path: [volume_type]
              equals: MANAGED_SNAPSHOT
            - path: [volume_path]
              equals: /Volumes/main/replay/typed_volume
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "typed_volume", "full_name": "main.replay.typed_volume",
                   "volume_type": "MANAGED_SNAPSHOT",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-197"}
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.typed_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
