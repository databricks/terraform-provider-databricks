# This journey pins a create POST whose response is held past http_timeout_seconds. The
# classic SDK client gives up with its inactivity timeout and does not retry, because the
# error matches none of its transient URL error messages, so a second POST would be an
# unexpected call. Apply fails with the timeout, no ID is stored, and the next plan
# creates the volume again. API responses are inferred from the Unity Catalog API
# contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_post_times_out_without_a_retry
    config: &config |
      provider "databricks" {
        http_timeout_seconds = 1
      }
      resource "databricks_volume" "this" {
        name         = "write_retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    expect_error: 'Error: cannot create volume: Post
      "http://127\.0\.0\.1:\d+/api/2\.1/unity-catalog/volumes": request timed out after
      1s of inactivity\n'
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "write_retry_volume", "volume_type": "MANAGED"}
        response:
          delay: 10s
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "write_retry_volume",
                   "full_name": "main.replay.write_retry_volume",
                   "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-301",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000301"}
  # Nothing is in state, so the plan reads nothing and creates the volume.
  - name: plan_after_timed_out_create_creates_the_volume
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls: []
destroy:
  calls: []
