# Pins SCIM /Me answering 404 while destroy builds the volume's workspace client, on a
# workspace-level provider whose host metadata has no workspace ID. The destroy plan's
# refresh reads the volume, then Delete treats the routing error as an already deleted
# volume: it sends no DELETE and destroy succeeds with empty state. API responses are
# inferred from the Unity Catalog and SCIM API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
steps:
  - name: create_checks_workspace_id_through_me
    config: |
      resource "databricks_volume" "this" {
        name         = "me_destroy_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - &me
        request: &me_request
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          body: null
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: "12345"
          body:
            json: {"id": "1001", "userName": "replay-admin@example.com",
                   "schemas": ["urn:ietf:params:scim:schemas:core:2.0:User"]}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "me_destroy_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "me_destroy_volume",
                           "full_name": "main.replay.me_destroy_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1914",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001914"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.me_destroy_volume
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *me
      - *read_volume
destroy:
  calls:
    # The destroy plan's refresh.
    - *me
    - *read_volume
    # The apply: no DELETE follows the failing /Me.
    - request: *me_request
      response:
        status: 404
        body:
          json: {"error_code": "NOT_FOUND",
                 "message": "User not found"}
