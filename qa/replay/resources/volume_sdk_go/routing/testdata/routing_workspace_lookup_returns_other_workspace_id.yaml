# Runs volume_routing/testdata/routing_workspace_lookup_returns_other_workspace_id.yaml
# with databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same
# requests and behavior. The original's description:
#
# Pins account workspace lookups whose 200 response doesn't echo the requested
# workspace ID, on an account-level provider with provider_config.workspace_id 12345.
# The volume calls carry the response's workspace_id in the X-Databricks-Workspace-Id
# header: 67890 when the response names another workspace, and 0 when it has no
# workspace_id. State keeps the configured 12345 either way. API responses are inferred
# from the account and Unity Catalog API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_routes_with_lookup_response_workspace_id
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "databricks_volume" "this" {
        name         = "lookup_mismatch_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - &lookup_other
        request: &lookup_request
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 67890,
                   "workspace_name": "replay-workspace-67890",
                   "deployment_name": "replay-workspace-67890",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "67890"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "lookup_mismatch_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "lookup_mismatch_volume",
                           "full_name": "main.replay.lookup_mismatch_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1915",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001915"}
      - &read_in_67890
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.lookup_mismatch_volume
          headers:
            X-Databricks-Workspace-Id: "67890"
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *lookup_other
      - *read_in_67890
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: refresh_routes_with_workspace_id_0_when_lookup_omits_it
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      # The refresh plan.
      - request: *lookup_request
        response:
          status: 200
          body:
            json: {"account_id": "replay-account",
                   "workspace_name": "replay-workspace-12345",
                   "deployment_name": "replay-workspace-12345",
                   "workspace_status": "RUNNING"}
      - request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.lookup_mismatch_volume
          headers:
            X-Databricks-Workspace-Id: "0"
          body: null
        response:
          status: 200
          body:
            json: *volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
destroy:
  calls:
    - *lookup_other
    - *read_in_67890
    - *lookup_other
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.lookup_mismatch_volume
        headers:
          X-Databricks-Workspace-Id: "67890"
        body: null
      response:
        status: 200
        body:
          json: {}
