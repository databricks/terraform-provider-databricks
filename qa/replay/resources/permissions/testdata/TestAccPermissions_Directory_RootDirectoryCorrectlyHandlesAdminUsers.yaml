        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          access_control_list:
          - group_name: permissions-replay-0
            permission_level: CAN_RUN
          - group_name: admins
            permission_level: CAN_MANAGE
    response:
      status: 200
      body:
        json:
          access_control_list:
          - all_permissions:
