# Runs volume_lifecycle/testdata/request_headers.yaml with databricks_volume on sdk-go
# uc/volumes/v1 in every step, and expects the same behavior, except where noted. Unlike
# the existing client, sdk-go sends no Accept header on the POST, GET, PATCH or DELETE, so
# each Accept expectation is empty instead of application/json. The other headers are the
# same. The PATCH body also carries full_name_arg, the full name in its path, because
# sdk-go serializes the path field into the body. The original's description:
#
# Pins the headers on every volume call of the classic client. POST, GET, PATCH and
# DELETE all send Accept: application/json; the SDK adds it to the DELETE too because
# that call decodes no response type. POST and PATCH send Content-Type:
# application/json, and GET and DELETE send none. Every call sends
# X-Databricks-Workspace-Id, the runner's PAT as Authorization: Bearer fixture-token, and
# one traceparent header. An empty header expectation matches a request without that
# header, or with an empty value. traceparent is generated per request, so any_string
# checks only that exactly one is present. API responses are inferred from the Unity
# Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_sends_json_headers_on_the_post
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "headers_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Accept: ""
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Authorization: Bearer fixture-token
          matchers: &traceparent
            headers:
              traceparent: any_string
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "headers_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "headers_volume",
                            "full_name": "main.replay.headers_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-171",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000171"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.headers_volume
          headers:
            Accept: ""
            Content-Type: ""
            X-Databricks-Workspace-Id: "12345"
            Authorization: Bearer fixture-token
          matchers: *traceparent
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: update_sends_json_headers_on_the_patch
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "headers_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "headers"
      }
    calls:
      - *read_created
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.headers_volume
          headers:
            Accept: ""
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Authorization: Bearer fixture-token
          matchers: *traceparent
          body:
            json: {"full_name_arg": "main.replay.headers_volume",
                   "comment": "headers"}
        response:
          status: 200
          body:
            json: &commented {"catalog_name": "main", "schema_name": "replay",
                              "name": "headers_volume",
                              "full_name": "main.replay.headers_volume",
                              "volume_type": "MANAGED", "comment": "headers",
                              "owner": "replay-admin@example.com",
                              "storage_location": "s3://replay-metastore/volume-171",
                              "metastore_id": "11111111-1111-1111-1111-111111111111",
                              "volume_id": "00000000-0000-4000-8000-000000000171"}
      - &read_commented
        request: *read_request
        response:
          status: 200
          body:
            json: *commented
      - *read_commented
  - name: delete_sends_accept_but_no_content_type
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {}
    calls:
      - *read_commented
      - request:
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.headers_volume
          headers:
            Accept: ""
            Content-Type: ""
            X-Databricks-Workspace-Id: "12345"
            Authorization: Bearer fixture-token
          matchers: *traceparent
          body: null
        response:
          status: 200
          body:
            json: {}
destroy:
  calls: []
