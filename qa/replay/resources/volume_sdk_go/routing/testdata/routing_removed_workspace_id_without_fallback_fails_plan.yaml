# Runs
# volume_routing/testdata/routing_removed_workspace_id_without_fallback_fails_plan.yaml
# with databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same
# behavior. The volume POST and GET requests carry no Accept header, which an empty header
# expectation pins. The original's description:
#
# Pins removing the provider_config block on an account-level provider without a
# provider-level workspace_id. The plan refreshes through the old workspace, then
# CustomizeDiff calls SCIM /Me on the account host, without a workspace header, to find
# a fallback. A failing /Me and a /Me whose X-Databricks-Org-Id header is 0 both fail
# the plan with the error for a removed workspace_id, so state keeps the old ID. API
# responses are inferred from the account, Unity Catalog and SCIM API contracts, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_through_provider_config_12345
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "databricks_volume" "this" {
        name         = "removed_ws_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - &lookup_12345
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 12345,
                   "workspace_name": "replay-workspace-12345",
                   "deployment_name": "replay-workspace-12345",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "removed_ws_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "removed_ws_volume",
                           "full_name": "main.replay.removed_ws_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1907",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001907"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.removed_ws_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *lookup_12345
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: removing_provider_config_fails_when_me_fails
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_without_block |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "databricks_volume" "this" {
        name         = "removed_ws_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    expect_error: 'Error: managing a workspace-level resource requires a workspace_id,
      but the previously configured workspace_id was removed'
    calls:
      # The plan's refresh.
      - *lookup_12345
      - *read_volume
      - request: &me_request
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          body: null
        response:
          status: 404
          body:
            json: {"error_code": "ENDPOINT_NOT_FOUND",
                   "message": "No API found for 'GET /preview/scim/v2/Me'"}
  - name: removing_provider_config_fails_when_me_returns_workspace_id_0
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_without_block
    expect_error: 'Error: managing a workspace-level resource requires a workspace_id,
      but the previously configured workspace_id was removed'
    calls:
      # The plan's refresh.
      - *lookup_12345
      - *read_volume
      - request: *me_request
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: "0"
          body:
            json: {"id": "1001", "userName": "replay-admin@example.com",
                   "schemas": ["urn:ietf:params:scim:schemas:core:2.0:User"]}
  - name: state_keeps_the_old_workspace_id
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "databricks_volume" "this" {
        name         = "removed_ws_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    plan:
      expect: empty
      changes: {}
    calls:
      # The refresh plan.
      - *lookup_12345
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
destroy:
  calls:
    - *lookup_12345
    - *read_volume
    - *lookup_12345
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.removed_ws_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
