# Runs volume/testdata/redirect_post_becomes_get.yaml with databricks_volume on sdk-go
# uc/volumes/v1 in every step, and expects the same behavior. The volume requests and the
# requests that follow their redirects carry no Accept header, which an empty header
# expectation pins. The original's description:
#
# Pins a 301, 302 or 303 answer to the create POST. Go's client follows each one with a
# GET to the Location, without the body or Content-Type, so the create request never
# reaches the target. A 400 from that GET fails the create and leaves nothing in state.
# A 200 from it counts as a created volume: its body sets the ID and the state, and no
# POST is sent again. API responses are inferred from the Unity Catalog API contract,
# not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_answered_301_follows_with_get_and_fails
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "redirect_post_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    expect_error: 'Error: cannot create volume: Missing required field: catalog_name\.\n'
    calls:
      - request: &create_request
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "redirect_post_volume", "volume_type": "MANAGED"}
        response:
          status: 301
          headers:
            Location: &target /redirected/api/2.1/unity-catalog/volumes
          body: null
      - &redirected_get_fails
        request: &redirected_get_request
          method: GET
          path: *target
          headers:
            Content-Type: ""
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 400
          body:
            json: {"error_code": "INVALID_PARAMETER_VALUE",
                   "message": "Missing required field: catalog_name."}
  - name: create_answered_302_follows_with_get_and_fails
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: Missing required field: catalog_name\.\n'
    calls:
      - request: *create_request
        response:
          status: 302
          headers:
            Location: *target
          body: null
      - *redirected_get_fails
  - name: create_answered_303_follows_with_get_and_fails
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: Missing required field: catalog_name\.\n'
    calls:
      - request: *create_request
        response:
          status: 303
          headers:
            Location: *target
          body: null
      - *redirected_get_fails
  - name: create_answered_303_with_volume_from_get_counts_as_created
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    calls:
      - request: *create_request
        response:
          status: 303
          headers:
            Location: *target
          body: null
      - request: *redirected_get_request
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "redirect_post_volume",
                            "full_name": "main.replay.redirect_post_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-1936",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001936"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_post_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.redirect_post_volume
            - path: [volume_path]
              equals: /Volumes/main/replay/redirect_post_volume
  - name: plan_after_redirected_create_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.redirect_post_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
          Accept: ""
        body: null
      response:
        status: 200
        body:
          json: {}
