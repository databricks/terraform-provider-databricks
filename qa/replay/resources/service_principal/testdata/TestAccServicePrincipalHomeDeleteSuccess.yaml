# API responses are placeholders based on the API models, not recorded.
version: 1
host_metadata:
  cloud: Azure
  host_type: workspace
  workspace_id: '12345'
steps:
- name: create_identity
  config: |
    resource "databricks_service_principal" "a" {
      application_id        = "11111111-1111-4111-8111-111111111111"
      force_delete_home_dir = true
    }
  calls:
  - request:
      method: POST
      path: /api/2.0/preview/scim/v2/ServicePrincipals
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          active: true
          applicationId: 11111111-1111-4111-8111-111111111111
          entitlements:
          - {}
          schemas:
          - urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal
    response:
      status: 200
      body:
        json:
          active: true
          applicationId: 11111111-1111-4111-8111-111111111111
          displayName: 11111111-1111-4111-8111-111111111111
          id: '102'
          schemas:
          - urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal
  - &id001
    request:
      method: GET
      path: /api/2.0/preview/scim/v2/ServicePrincipals/102
      query:
        attributes:
        - userName,displayName,active,externalId,entitlements
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          active: true
          applicationId: 11111111-1111-4111-8111-111111111111
          displayName: 11111111-1111-4111-8111-111111111111
          id: '102'
          schemas:
          - urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal
  - *id001
destroy:
  calls:
  - *id001
  - request:
      method: DELETE
      path: /api/2.0/preview/scim/v2/ServicePrincipals/102
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body: null
  - request:
      method: POST
      path: /api/2.0/workspace/delete
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          path: /Users/11111111-1111-4111-8111-111111111111
          recursive: true
    response:
      status: 200
      body: null
