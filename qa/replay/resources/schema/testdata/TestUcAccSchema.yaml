# API responses are placeholders based on the API models, not recorded.
version: 1
host_metadata:
  cloud: AWS
  host_type: workspace
  workspace_id: '12345'
steps:
- name: schemas_and_grants
  config: |
    resource "databricks_catalog" "sandbox" {
      name       = "sandbox-replay"
      comment    = "this catalog is managed by terraform"
      properties = { purpose = "testing" }
    }
    data "databricks_catalogs" "all" {
      depends_on = [databricks_catalog.sandbox]
    }
    resource "databricks_grants" "sandbox" {
      catalog = databricks_catalog.sandbox.name
      grant {
        principal  = "data-scientists"
        privileges = ["USE_CATALOG", "CREATE_SCHEMA"]
      }
      grant {
        principal  = "data-engineers"
        privileges = ["USE_CATALOG"]
      }
    }
    resource "databricks_schema" "things" {
      catalog_name                   = databricks_catalog.sandbox.id
      name                           = "things-replay"
      comment                        = "this database is managed by terraform"
      properties                     = { kind = "various" }
      enable_predictive_optimization = "DISABLE"
    }
    resource "databricks_schema" "stuff" {
      catalog_name = databricks_catalog.sandbox.id
      name         = "stuff-replay"
      comment      = "this database is managed by terraform"
      properties   = { kind = "various" }
    }
    data "databricks_schemas" "sandbox" {
      catalog_name = databricks_catalog.sandbox.id
      depends_on   = [databricks_schema.things]
    }
    resource "databricks_grants" "things" {
      schema = databricks_schema.things.id
      grant {
        principal  = "data-engineers"
        privileges = ["USE_SCHEMA"]
      }
    }
    resource "databricks_grant" "stuff_test_eng_group" {
      schema     = databricks_schema.stuff.id
      principal  = "data-engineers"
      privileges = ["USE_SCHEMA"]
    }
  calls:
  - request:
      method: POST
      path: /api/2.1/unity-catalog/catalogs
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          comment: this catalog is managed by terraform
          name: sandbox-replay
          properties:
            purpose: testing
    response:
      status: 200
      body:
        json:
          catalog_type: MANAGED_CATALOG
          comment: this catalog is managed by terraform
          enable_predictive_optimization: INHERIT
          isolation_mode: OPEN
          metastore_id: 11111111-1111-1111-1111-111111111111
          name: sandbox-replay
          owner: replay-admin
          properties:
            purpose: testing
  - request:
