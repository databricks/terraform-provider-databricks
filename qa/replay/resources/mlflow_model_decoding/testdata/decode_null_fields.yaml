# Pins name, description, tags and id each sent as JSON null. The classic client
# decodes null like a missing field. A null name in the create response sets an empty
# ID, so the read that follows asks for an empty name and the create fails with the
# registry's answer; nothing reaches the state although the service accepted the POST.
# A null description or tags in the create response don't matter, because Create reads
# only the name. On the GET, a null name blanks name in the state and plans a
# replacement; a null description or tags leave the old value in the state, because
# Read skips empty optional fields, so a description or tags removed outside Terraform
# never show up as drift; a null id blanks registered_model_id, which plans nothing.
# The empty ID and the hidden drift are suspected defects. API responses are synthetic:
# inferred from the MLflow Model Registry API, not recorded; the answer to the get
# without a name is the registry's usual reply to a missing required parameter.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_answered_null_name_sets_an_empty_id_and_reads_an_empty_name
    config: &config |
      resource "databricks_mlflow_model" "this" {
        name        = "decode_model"
        description = "first description"

        tags {
          key   = "team"
          value = "replay"
        }
      }
    expect_error: 'Error: cannot read mlflow model: Missing value for required parameter
      ''name''\. See the API docs for more information on request parameters\.\n'
    calls:
      - request: &create_request
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "decode_model", "description": "first description",
                   "tags": [{"key": "team", "value": "replay"}]}
        response:
          status: 200
          body:
            json: {"registered_model": {
                     "name": null,
                     "description": "first description",
                     "tags": [{"key": "team", "value": "replay"}],
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000}}
      - request:
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [""]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 400
          body:
            json: {"error_code": "INVALID_PARAMETER_VALUE",
                   "message": "Missing value for required parameter 'name'. See the API
                     docs for more information on request parameters."}
  - name: create_answered_null_description_and_tags_sends_the_post_again_and_succeeds
    config: *config
    plan:
      changes:
        databricks_mlflow_model.this:
          actions: [create]
    calls:
      - request: *create_request
        response:
          status: 200
          body:
            json: {"registered_model": {
                     "name": "decode_model",
                     "description": null,
                     "tags": null,
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000}}
      - &read
        request: &read_request
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [decode_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "decode_model",
                     "id": "0123456789abcdef0123456789abcdef",
                     "description": "first description",
                     "tags": [{"key": "team", "value": "replay"}],
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "permission_level": "CAN_MANAGE"}}
      - *read
    state: &state
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: decode_model
            - path: [name]
              equals: decode_model
            - path: [registered_model_id]
              equals: 0123456789abcdef0123456789abcdef
            - path: [description]
              equals: first description
            - path: [tags, 0, key]
              equals: team
            - path: [tags, 0, value]
              equals: replay
  - name: refresh_answered_null_name_blanks_the_name_and_plans_replacement
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [delete, create]
          before:
            - path: [id]
              equals: decode_model
            - path: [name]
              equals: ""
          after:
            - path: [name]
              equals: decode_model
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: decode_model
            - path: [name]
              equals: ""
            - path: [registered_model_id]
              equals: 0123456789abcdef0123456789abcdef
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": null,
                     "id": "0123456789abcdef0123456789abcdef",
                     "description": "first description",
                     "tags": [{"key": "team", "value": "replay"}],
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "permission_level": "CAN_MANAGE"}}
  - name: refresh_answered_null_description_keeps_the_description_and_plans_nothing
    plan_only: true
    config: *config
    plan: &plans_nothing
      expect: empty
      changes: {}
    state: *state
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "decode_model",
                     "id": "0123456789abcdef0123456789abcdef",
                     "description": null,
                     "tags": [{"key": "team", "value": "replay"}],
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "permission_level": "CAN_MANAGE"}}
  - name: refresh_answered_null_tags_keeps_the_tags_and_plans_nothing
    plan_only: true
    config: *config
    plan: *plans_nothing
    state: *state
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "decode_model",
                     "id": "0123456789abcdef0123456789abcdef",
                     "description": "first description",
                     "tags": null,
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "permission_level": "CAN_MANAGE"}}
  - name: refresh_answered_null_id_blanks_registered_model_id_and_plans_nothing
    plan_only: true
    config: *config
    plan: *plans_nothing
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: decode_model
            - path: [name]
              equals: decode_model
            - path: [registered_model_id]
              equals: ""
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "decode_model",
                     "id": null,
                     "description": "first description",
                     "tags": [{"key": "team", "value": "replay"}],
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "permission_level": "CAN_MANAGE"}}
destroy:
  calls:
    - *read
    - request:
        method: DELETE
        path: /api/2.0/mlflow/registered-models/delete
        query:
          name: [decode_model]
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
