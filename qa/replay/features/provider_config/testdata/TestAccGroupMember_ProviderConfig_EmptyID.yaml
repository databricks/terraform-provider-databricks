# Source: scim/group_member_provider_config_test.go#TestAccGroupMember_ProviderConfig_EmptyID
# Generic provider_config validation; the resource is only a schema carrier.
# Random names are fixed because replay has no shared server.
# The original plan-only case fails in validation, before any apply or API call.
version: 1
# Dummy host metadata, not captured from a live workspace.
host_metadata:
  workspace_id: "12345"
steps:
  - name: reject_empty_workspace_id
    config: |
      resource "databricks_group" "parent" {
        display_name = "tf-test-parent"
      }
      resource "databricks_group" "child" {
        display_name = "tf-test-child"
      }
      resource "databricks_group_member" "this" {
        group_id  = databricks_group.parent.id
        member_id = databricks_group.child.id
        provider_config {
          workspace_id = ""
        }
      }
    expect_error: 'expected "provider_config.0.workspace_id" to not be an empty string'
    calls: []
destroy:
  calls: []
