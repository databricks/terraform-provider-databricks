# API responses are inferred from the scenarios and API models, not recorded.
version: 1
host_metadata: # Dummy host metadata.
  host_type: workspace
  cloud: AWS
  workspace_id: '12345'
steps:
  - name: create
    config: |
      resource "databricks_notebook" "this" {
        source = abspath("${path.module}/notebook.ipynb")
        path   = "/Shared/provider-test/jupiter_replay"
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/workspace/import
          headers:
            X-Databricks-Workspace-Id: '12345'
          body:
            json:
              content: 
              format: JUPYTER
              overwrite: true
              path: /Shared/provider-test/jupiter_replay
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              object_id: 200
      - &call_1
        request:
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          headers:
            X-Databricks-Workspace-Id: '12345'
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          headers:
            X-Databricks-Org-Id: '12345'
          body:
            json:
              id: '100'
              schemas: ['urn:ietf:params:scim:schemas:core:2.0:User']
              userName: tester@example.com
      - &call_2
        request:
          method: GET
          path: /api/2.0/workspace/get-status
          query:
            path: [/Shared/provider-test/jupiter_replay]
          headers:
            X-Databricks-Workspace-Id: '12345'
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              language: PYTHON
              object_id: 200
              object_type: NOTEBOOK
              path: /Shared/provider-test/jupiter_replay
      - *call_1
      - *call_2
    files:
      notebook.ipynb: ../../../testdata/files/notebook.ipynb
  - name: set_workspace_override
    config: |
      resource "databricks_notebook" "this" {
        provider_config { workspace_id = "12345" }
        source = abspath("${path.module}/notebook.ipynb")
        path   = "/Shared/provider-test/jupiter_replay"
      }
    calls:
      - *call_1
      - *call_2
      - *call_1
      - *call_2
    plan:
      changes:
        databricks_notebook.this:
          actions: [no-op]
destroy:
  calls:
    - *call_1
    - *call_2
    - request:
        method: POST
        path: /api/2.0/workspace/delete
        headers:
          X-Databricks-Workspace-Id: '12345'
        body:
          json:
            path: /Shared/provider-test/jupiter_replay
      response: # Inferred API response; not recorded.
        status: 200
        body: null
