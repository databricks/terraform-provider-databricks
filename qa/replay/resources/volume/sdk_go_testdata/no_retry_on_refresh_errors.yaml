# Runs no_retry_on_refresh_errors with reads through sdk-go uc/volumes/v1. The refresh GET
# is sent exactly once and reports the API message for 400, 401, 409, 502 and 504, and
# none of the errors removes the volume from state. The GETs carry no Accept header, which
# the existing client sends. Writes stay on the existing path. API responses are inferred
# from the Unity Catalog API contract, not recorded. An empty header expectation matches
# only requests without that header.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "retry_volume",
                   "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "retry_volume",
                   "full_name": "main.replay.retry_volume", "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volumes/00000000-0000-4000-8000-000000000002",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000002"}
      - request: &read
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
          headers:
            Accept: ""
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *volume
      - request: *read
        response: *volume
  - name: refresh_400_is_not_retried
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: '(?s)cannot\s+read\s+volume:\s+Invalid\s+volume\s+name\s+from\s+fixture'
    calls:
      - request: *read
        response:
          status: 400
          body:
            json: {"error_code": "INVALID_PARAMETER_VALUE",
                   "message": "Invalid volume name from fixture"}
  - name: refresh_401_is_not_retried
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: '(?s)cannot\s+read\s+volume:\s+Credential\s+was\s+not\s+sent\s+by\s+fixture'
    calls:
      - request: *read
        response:
          status: 401
          body:
            json: {"error_code": "UNAUTHENTICATED",
                   "message": "Credential was not sent by fixture"}
  - name: refresh_409_is_not_retried
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: '(?s)cannot\s+read\s+volume:\s+Conflicting\s+change\s+from\s+fixture'
    calls:
      - request: *read
        response:
          status: 409
          body:
            json: {"error_code": "ABORTED", "message": "Conflicting change from fixture"}
  - name: refresh_502_is_not_retried
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: '(?s)cannot\s+read\s+volume:\s+Bad\s+gateway\s+from\s+fixture'
    calls:
      - request: *read
        response:
          status: 502
          body:
            json: {"error_code": "BAD_GATEWAY", "message": "Bad gateway from fixture"}
  - name: refresh_504_is_not_retried
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: '(?s)cannot\s+read\s+volume:\s+Gateway\s+timeout\s+from\s+fixture'
    calls:
      - request: *read
        response:
          status: 504
          body:
            json: {"error_code": "DEADLINE_EXCEEDED", "message": "Gateway timeout from fixture"}
destroy:
  calls:
    - request: *read
      response: *volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
