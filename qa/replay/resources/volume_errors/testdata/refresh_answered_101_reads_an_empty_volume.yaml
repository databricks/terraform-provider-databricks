# Pins a refresh GET answered with an unsolicited 101 Switching Protocols, which only a
# server that breaks HTTP sends, since the provider never asks to upgrade. Like an empty
# 200 body, it reads as an empty volume without an error: the refreshed state is blank,
# and the plan replaces the volume. API responses are inferred from the Unity Catalog
# API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_volume" "this" {
        name         = "switched_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "switched_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "switched_volume",
                            "full_name": "main.replay.switched_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-233"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.switched_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_answered_101_blanks_the_state_and_plans_replacement
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete, create]
          before:
            - path: [catalog_name]
              equals: ""
            - path: [name]
              equals: ""
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.switched_volume
            - path: [volume_path]
              equals: /Volumes/
    calls:
      - request: *read_request
        response:
          status: 101
          status_line: HTTP/1.1 101 Switching Protocols
          body:
            json: *created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.switched_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
