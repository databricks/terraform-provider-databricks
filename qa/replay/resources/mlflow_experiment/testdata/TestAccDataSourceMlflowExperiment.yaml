  calls:
    - *get_1
    - *get_5
    - *get_5
    - request:
        method: "POST"
        path: "/api/2.0/mlflow/experiments/delete"
        body:
          json:
            experiment_id: "123"
      response: # Inferred API response; not recorded.
        status: 200
        body: null
