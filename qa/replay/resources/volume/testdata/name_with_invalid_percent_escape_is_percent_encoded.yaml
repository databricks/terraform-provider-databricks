# Pins the request paths for a volume name with a "%" that doesn't start a valid escape.
# The journey imports the volume by full name, updates its comment and destroys it. The
# provider escapes the full name before the classic client puts it in the path, so the
# GET, the PATCH and the DELETE send "%" as %25. Unescaped, building each request fails
# with an invalid URL escape and nothing is sent. API responses are inferred from the
# Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: import_by_full_name_reads_the_encoded_path
    config: |
      resource "databricks_volume" "this" {
        name         = "50%_raw"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    import:
      resource: databricks_volume.this
      id: main.replay.50%_raw
      persist: true
    calls:
      - &read_imported
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.50%25_raw
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "50%_raw",
                   "full_name": "main.replay.50%_raw", "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-168",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000168"}
      - *read_imported
  - name: update_comment_patches_the_encoded_path
    config: |
      resource "databricks_volume" "this" {
        name         = "50%_raw"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "encoded"
      }
    calls:
      - *read_imported
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.50%25_raw
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "encoded"}
        response:
          status: 200
          body:
            json: &commented {"catalog_name": "main", "schema_name": "replay",
                              "name": "50%_raw", "full_name": "main.replay.50%_raw",
                              "volume_type": "MANAGED", "comment": "encoded",
                              "owner": "replay-admin@example.com",
                              "storage_location": "s3://replay-metastore/volume-168",
                              "metastore_id": "11111111-1111-1111-1111-111111111111",
                              "volume_id": "00000000-0000-4000-8000-000000000168"}
      - &read_commented
        request: *read_request
        response:
          status: 200
          body:
            json: *commented
      - *read_commented
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.50%_raw
            - path: [volume_path]
              equals: /Volumes/main/replay/50%_raw
destroy:
  calls:
    - *read_commented
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.50%25_raw
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
