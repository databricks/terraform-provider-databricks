        databricks_instance_pool.this:
          actions: [update]
          after:
            - path: [azure_attributes, 0, availability]
              equals: SPOT_WITH_FALLBACK_AZURE
            - path: [azure_attributes, 0, spot_bid_max_price]
              equals: 0.25
destroy:
  calls:
    - *id006
    - request:
        method: POST
        path: /api/2.0/instance-pools/delete
        body:
          json:
            instance_pool_id: pool-1
      response:
        status: 200
        body: null
