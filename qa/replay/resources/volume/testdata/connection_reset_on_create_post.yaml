# This journey pins connection resets on the create POST. The fixture server resets the
# connection after reading the request, and the SDK retries "connection reset by peer"
# as a transient URL error, resending the same body. When every attempt is reset, apply
# fails with the last reset once retry_timeout_seconds ends, no ID is stored, and the
# next plan creates the volume again. Three seconds allow exactly two attempts: the
# retry starts 1.05 to 1.75 seconds after the first attempt, and a third attempt could
# start no sooner than 3.1 seconds after it. API responses are inferred from the Unity
# Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_post_reset_until_the_retry_timeout_ends
    config: &config |
      provider "databricks" {
        retry_timeout_seconds = 3
      }
      resource "databricks_volume" "this" {
        name         = "connection_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    expect_error: 'Error: cannot create volume: Post
      "http://[\d.:]+/api/2\.1/unity-catalog/volumes": read tcp [\d.:]+->[\d.:]+:
      read: connection reset by peer\n'
    calls:
      - request: &create
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "connection_volume", "volume_type": "MANAGED"}
        response:
          fault: reset
        times: 2
        min_gap: 1s
        max_gap: 3s
  # Nothing is in state, so the plan reads nothing and creates the volume.
  - name: plan_after_exhausted_create_creates_the_volume
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls: []
  - name: create_post_retried_once_after_a_reset
    config: *config
    calls:
      - request: *create
        response:
          fault: reset
      # The retry carries the same body as the reset attempt.
      - request: *create
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "connection_volume",
                            "full_name": "main.replay.connection_volume",
                            "volume_type": "MANAGED",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-299",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000299"}
        min_gap: 1s
        max_gap: 3s
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.connection_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.connection_volume
            - path: [volume_path]
              equals: /Volumes/main/replay/connection_volume
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.connection_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
