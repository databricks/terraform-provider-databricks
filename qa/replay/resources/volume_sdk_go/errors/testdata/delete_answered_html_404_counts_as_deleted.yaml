# Runs volume_errors/testdata/delete_answered_html_404_counts_as_deleted.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same requests
# and behavior. The original's description:
#
# Pins that a DELETE answered with an HTML 404 page counts the volume as already deleted.
# The classic SDK reads the HTML page's status line as NOT_FOUND, so the destroy succeeds,
# the volume leaves state, and the next plan is empty. API responses are inferred from the
# Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "html_404_delete_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "html_404_delete_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "html_404_delete_volume",
                            "full_name": "main.replay.html_404_delete_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-345",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000345"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.html_404_delete_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: delete_answered_html_404_counts_as_deleted
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_empty |
      provider "databricks" {}
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete]
    calls:
      - *read_created
      - request:
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.html_404_delete_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 404
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: "<html><head><title>Error 404</title></head><body><h2>HTTP ERROR
              404</h2><pre>Volume not found.</pre></body></html>"
  - name: plan_after_delete_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_empty
    plan:
      expect: empty
      changes: {}
    calls: []
destroy:
  calls: []
