# Pins the delete errors that count as an already deleted model. A DELETE answered 404
# with an error code other than RESOURCE_DOES_NOT_EXIST, or 400 RESOURCE_DOES_NOT_EXIST,
# raises no diagnostic: the apply succeeds, the model leaves state, and the next plan is
# empty without a read. API responses are synthetic: inferred from the MLflow Model
# Registry API, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_mlflow_model" "this" {
        name        = "error_delete_gone_model"
        description = "Pins delete errors that count as deleted"
      }
    calls:
      - &create
        request:
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "error_delete_gone_model",
                   "description": "Pins delete errors that count as deleted"}
        response:
          status: 200
          body:
            json: {"registered_model": {
                     "name": "error_delete_gone_model",
                     "description": "Pins delete errors that count as deleted",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "tester@example.com"}}
      - &read_first
        request: &read_request
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [error_delete_gone_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "error_delete_gone_model",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e871",
                     "description": "Pins delete errors that count as deleted",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "tester@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read_first
  - name: delete_answered_404_with_another_error_code_counts_as_deleted
    config: &config_empty |
      provider "databricks" {}
    plan: &plan_delete
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [delete]
    calls:
      - *read_first
      - request: &delete_request
          method: DELETE
          path: /api/2.0/mlflow/registered-models/delete
          query:
            name: [error_delete_gone_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 404
          body:
            json: {"error_code": "NOT_FOUND",
                   "message": "Registered model 'error_delete_gone_model' not found."}
  - name: plan_after_404_is_empty
    plan_only: true
    config: *config_empty
    plan: &plan_empty
      expect: empty
      changes: {}
    calls: []
  - name: create_again
    config: *config
    calls:
      - *create
      - &read_second
        request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "error_delete_gone_model",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e872",
                     "description": "Pins delete errors that count as deleted",
                     "creation_timestamp": 1700000100000,
                     "last_updated_timestamp": 1700000100000,
                     "user_id": "tester@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read_second
  - name: delete_answered_400_resource_does_not_exist_counts_as_deleted
    config: *config_empty
    plan: *plan_delete
    calls:
      - *read_second
      - request: *delete_request
        response:
          status: 400
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "RegisteredModel 'error_delete_gone_model' does not exist.
                     It might have been deleted."}
  - name: plan_after_400_is_empty
    plan_only: true
    config: *config_empty
    plan: *plan_empty
    calls: []
destroy:
  calls: []
