# Runs volume/testdata/error_class_html.yaml with databricks_volume on sdk-go
# uc/volumes/v1 in every step, and expects the same requests and behavior. The original's
# description:
#
# Pins how the classic SDK classifies an HTML error body. With a <pre> message, the error
# code comes from the status line ("404 Not Found" becomes NOT_FOUND), so a 404 counts as
# missing: refresh removes the volume and DELETE succeeds. Without <pre>, the raw body
# becomes the message with error code UNKNOWN, so the same 404 fails both refresh and
# DELETE and keeps the volume. API responses are handwritten for the classic SDK's error
# parser, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "html_errors_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "html_errors_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "html_errors_volume",
                            "full_name": "main.replay.html_errors_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-1962",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001962"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.html_errors_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_answered_404_html_with_pre_is_missing
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls:
      - request: *read_request
        response: &html_with_pre_404
          status: 404
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: "<html><head><title>Error 404</title></head><body><h2>HTTP ERROR
              404</h2><pre>Volume not found.</pre></body></html>"
  - name: refresh_answered_404_html_without_pre_fails_with_raw_body
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: <html><head><title>Error
      404</title></head><body><h2>Volume not found</h2></body></html>\n'
    calls:
      - request: *read_request
        response: &html_without_pre_404
          status: 404
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: "<html><head><title>Error 404</title></head><body><h2>Volume not
              found</h2></body></html>"
  - name: state_kept_after_404_html_without_pre
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state: &state_kept
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.html_errors_volume
    calls:
      - *read_created
  - name: delete_answered_404_html_without_pre_fails_and_keeps_volume
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_empty |
      provider "databricks" {}
    expect_error: 'Error: cannot delete volume: <html><head><title>Error
      404</title></head><body><h2>Volume not found</h2></body></html>\n'
    calls:
      - *read_created
      - request: &delete_request
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.html_errors_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *html_without_pre_404
  - name: state_kept_after_delete_404_html_without_pre
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_empty
    plan: &plan_delete
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete]
    state: *state_kept
    calls:
      - *read_created
  - name: delete_answered_404_html_with_pre_counts_as_deleted
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_empty
    plan: *plan_delete
    calls:
      - *read_created
      - request: *delete_request
        response: *html_with_pre_404
  - name: plan_after_delete_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_empty
    plan:
      expect: empty
      changes: {}
    calls: []
destroy:
  calls: []
