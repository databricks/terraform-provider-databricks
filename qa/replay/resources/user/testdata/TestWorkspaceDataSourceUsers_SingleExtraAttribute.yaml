            filter: [userName eq "tf-replay-1@databricks.com"]
            startIndex: ['1']
          headers:
            X-Databricks-Workspace-Id: '12345'
          body: null
        response: # Inferred API response; not recorded.
          body:
            json:
              Resources:
                - active: true
