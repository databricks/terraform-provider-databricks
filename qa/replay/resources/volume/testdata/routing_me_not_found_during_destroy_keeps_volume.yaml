# Pins SCIM /Me answering 404 while destroy builds the volume's workspace client, on a
# workspace-level provider whose host metadata has no workspace ID. Removing the volume
# from the configuration destroys it: the plan's refresh reads the volume, then Delete
# fails on the 404, which is about the caller, not the volume. No DELETE is sent and
# state keeps the volume and its workspace ID. A 404 from the volume DELETE still
# removes the volume; delete_missing_or_not.yaml pins that. API responses are inferred
# from the Unity Catalog and SCIM API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
steps:
  - name: create_checks_workspace_id_through_me
    config: &config |
      resource "databricks_volume" "this" {
        name         = "me_destroy_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - &me
        request: &me_request
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          body: null
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: "12345"
          body:
            json: {"id": "1001", "userName": "replay-admin@example.com",
                   "schemas": ["urn:ietf:params:scim:schemas:core:2.0:User"]}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "me_destroy_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "me_destroy_volume",
                           "full_name": "main.replay.me_destroy_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1914",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001914"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.me_destroy_volume
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *me
      - *read_volume
  - name: destroy_fails_when_me_is_not_found
    config: |
      provider "databricks" {}
    expect_error: 'Error: cannot delete volume: failed to validate workspace_id: failed
      to get the workspace_id: User not found\n'
    calls:
      # The plan's refresh.
      - *me
      - *read_volume
      # The apply: no DELETE follows the failing /Me.
      - request: *me_request
        response:
          status: 404
          body:
            json: {"error_code": "NOT_FOUND",
                   "message": "User not found"}
  - name: state_keeps_volume_and_workspace_id
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      # The refresh plan.
      - *me
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.me_destroy_volume
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
destroy:
  calls:
    - *me
    - *read_volume
    - *me
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.me_destroy_volume
        body: null
      response:
        status: 200
        body:
          json: {}
