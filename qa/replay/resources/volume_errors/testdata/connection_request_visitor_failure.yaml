# This journey pins a volume call whose request visitor fails: the provider uses OAuth
# M2M, and the token endpoint rejects the client when the visitor fetches the token for
# the call. The SDK fails the call with "failed during request visitor" before sending
# it and does not retry it, so each failure has one token request and no volume
# request. A failed create stores no ID, so the next plan creates the volume. A failed
# refresh keeps the volume in state, so the next plan, with a token, reads it again and
# plans no change. Each Terraform operation configures a new provider, which discovers
# the token endpoint and fetches its own token. API responses are inferred from the
# Unity Catalog and OAuth API contracts, not recorded.
version: 1
enforce_call_order: true
provider_host: workspace
hosts:
  workspace:
    url: https://replay-workspace.cloud.databricks.com
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
auth:
  type: oauth-m2m
  client_id: replay-sp
  client_secret: replay-secret
steps:
  - name: create_post_never_sent_when_the_token_endpoint_fails
    config: &config |
      resource "databricks_volume" "this" {
        name         = "connection_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    expect_error: 'Error: cannot create volume: failed during request visitor: error
      getting token: Post
      "https://replay-workspace\.cloud\.databricks\.com/oidc/v1/token":
      \{"error":"invalid_client","error_description":"Client authentication failed"\}\n'
    calls:
      - &discovery
        request:
          method: GET
          path: /oidc/.well-known/oauth-authorization-server
          matchers:
            headers:
              Authorization: absent
          body: null
        response:
          status: 200
          body:
            json:
              authorization_endpoint:
                https://replay-workspace.cloud.databricks.com/oidc/v1/authorize
              token_endpoint: https://replay-workspace.cloud.databricks.com/oidc/v1/token
      - &token_rejected
        request: &token_request
          method: POST
          path: /oidc/v1/token
          headers:
            Authorization: Basic cmVwbGF5LXNwOnJlcGxheS1zZWNyZXQ=
            Content-Type: application/x-www-form-urlencoded
          body:
            text: grant_type=client_credentials&scope=all-apis
        response:
          status: 401
          body:
            json:
              error: invalid_client
              error_description: Client authentication failed
  # Nothing is in state, so the plan calls nothing and creates the volume.
  - name: plan_after_failed_create_creates_the_volume
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls: []
  - name: create
    config: *config
    calls:
      - *discovery
      - &token
        request: *token_request
        response:
          status: 200
          body:
            json:
              access_token: m2m-token
              token_type: Bearer
              expires_in: 3600
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Authorization: Bearer m2m-token
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "connection_volume", "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "connection_volume",
                   "full_name": "main.replay.connection_volume",
                   "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-299",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000299"}
      - &read
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.connection_volume
          headers:
            Authorization: Bearer m2m-token
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *volume
      # Terraform's post-apply plan.
      - *discovery
      - *token
      - *read
  # An apply refreshes first, so its plan fails at the refresh.
  - name: refresh_get_never_sent_when_the_token_endpoint_fails
    config: *config
    expect_error: 'Error: cannot read volume: failed during request visitor: error
      getting token: Post
      "https://replay-workspace\.cloud\.databricks\.com/oidc/v1/token":
      \{"error":"invalid_client","error_description":"Client authentication failed"\}\n'
    calls:
      - *discovery
      - *token_rejected
  - name: plan_after_failed_refresh_keeps_the_volume
    plan_only: true
    config: *config
    plan:
      expect: empty
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.connection_volume
    calls:
      - *discovery
      - *token
      - *read
destroy:
  calls:
    # The refresh, then the destroy.
    - *discovery
    - *token
    - *read
    - *discovery
    - *token
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.connection_volume
        headers:
          Authorization: Bearer m2m-token
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
