# Runs
# volume_routing/testdata/routing_provider_config_removed_falls_back_to_same_workspace.yaml
# with databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same
# requests and behavior. The original's description:
#
# Pins removing the provider_config block when the provider-level workspace_id names
# the same workspace, on an account-level provider. The plan without refresh makes no
# call, the refresh plan looks up and reads through that workspace, and both plans are
# empty, so state keeps the ID. API responses are inferred from the account and Unity
# Catalog API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_through_provider_config_12345
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {
        account_id   = "replay-account"
        workspace_id = "12345"
      }
      resource "databricks_volume" "this" {
        name         = "same_fallback_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - &lookup_12345
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 12345,
                   "workspace_name": "replay-workspace-12345",
                   "deployment_name": "replay-workspace-12345",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "same_fallback_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "same_fallback_volume",
                           "full_name": "main.replay.same_fallback_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1905",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001905"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.same_fallback_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *lookup_12345
      - *read_volume
  - name: removing_provider_config_plans_nothing
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: |
      provider "databricks" {
        account_id   = "replay-account"
        workspace_id = "12345"
      }
      resource "databricks_volume" "this" {
        name         = "same_fallback_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    plan:
      expect: empty
      changes: {}
    calls:
      # The refresh plan.
      - *lookup_12345
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
destroy:
  calls:
    - *lookup_12345
    - *read_volume
    - *lookup_12345
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.same_fallback_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
