# Pins a 307 answer to the create POST, the owner PATCH after it and an update's comment
# PATCH. Go's client follows each one to the Location with the same method, body,
# Content-Type and workspace header, and the target's 200 completes the call as if no
# redirect had happened. Reads are not redirected. API responses are inferred from the
# Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_owner_follows_307_on_post_and_patch
    config: |
      resource "databricks_volume" "this" {
        name         = "redirect_307_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
        owner        = "data-engineers"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: &create_body {"catalog_name": "main", "schema_name": "replay",
                                "name": "redirect_307_volume", "volume_type": "MANAGED",
                                "comment": "first comment"}
        response:
          status: 307
          headers:
            Location: /redirected/api/2.1/unity-catalog/volumes
          body: null
      - request:
          method: POST
          path: /redirected/api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: *create_body
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "redirect_307_volume",
                   "full_name": "main.replay.redirect_307_volume",
                   "volume_type": "MANAGED", "comment": "first comment",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-1937",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001937"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_307_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: &owner_body {"comment": "first comment", "owner": "data-engineers"}
        response:
          status: 307
          headers:
            Location: &redirected_volume
              /redirected/api/2.1/unity-catalog/volumes/main.replay.redirect_307_volume
          body: null
      - request:
          method: PATCH
          path: *redirected_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: *owner_body
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "redirect_307_volume",
                            "full_name": "main.replay.redirect_307_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "owner": "data-engineers",
                            "storage_location": "s3://replay-metastore/volume-1937",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001937"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_307_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.redirect_307_volume
            - path: [owner]
              equals: data-engineers
  - name: update_comment_follows_307_on_patch
    config: &config_updated |
      resource "databricks_volume" "this" {
        name         = "redirect_307_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second comment"
        owner        = "data-engineers"
      }
    calls:
      - *read_created
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_307_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: &comment_body {"comment": "second comment"}
        response:
          status: 307
          headers:
            Location: *redirected_volume
          body: null
      - request:
          method: PATCH
          path: *redirected_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: *comment_body
        response:
          status: 200
          body:
            json: &updated {"catalog_name": "main", "schema_name": "replay",
                            "name": "redirect_307_volume",
                            "full_name": "main.replay.redirect_307_volume",
                            "volume_type": "MANAGED", "comment": "second comment",
                            "owner": "data-engineers",
                            "storage_location": "s3://replay-metastore/volume-1937",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001937"}
      - &read_updated
        request: *read_request
        response:
          status: 200
          body:
            json: *updated
      - *read_updated
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [comment]
              equals: second comment
  - name: plan_after_redirected_update_is_empty
    plan_only: true
    config: *config_updated
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_updated
destroy:
  calls:
    - *read_updated
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.redirect_307_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
