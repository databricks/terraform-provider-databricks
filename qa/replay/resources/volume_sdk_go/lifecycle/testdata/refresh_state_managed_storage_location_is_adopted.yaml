# Runs volume_lifecycle/testdata/refresh_state_managed_storage_location_is_adopted.yaml
# with databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same
# requests and behavior. The original's description:
#
# Pins that a refresh adopts a remote change of a MANAGED volume's unconfigured
# storage_location. State takes the new location, and diff suppression keeps the plan
# empty instead of replacing the volume. API responses are inferred from the Unity
# Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_managed
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "relocated_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "relocated_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "relocated_volume",
                            "full_name": "main.replay.relocated_volume",
                            "volume_type": "MANAGED",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-18914",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000018914"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.relocated_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [storage_location]
              equals: s3://replay-metastore/volume-18914
  - name: remote_storage_location_change_is_adopted
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [storage_location]
              equals: s3://replay-metastore/relocated/volume-18914
    calls:
      - &read_relocated
        request: *read_request
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "relocated_volume",
                   "full_name": "main.replay.relocated_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/relocated/volume-18914",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000018914"}
destroy:
  calls:
    - *read_relocated
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.relocated_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
