# API responses are inferred from the scenarios and API models, not recorded.
# Metadata fixtures are dummy account/workspace configuration.
# The expected failure occurs during planning; no apply follows it.
version: 1
steps:
  - name: "create"
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_notebook" "test" {
        path = "/Shared/dwsid-test-replay"
        content_base64 = "IyBEYXRhYnJpY2tzIG5vdGVib29rIHNvdXJjZQpwcmludCgnaGVsbG8nKQ=="
        language = "PYTHON"
        provider_config {
          workspace_id = "1001"
        }
      }
    calls:
      - &metadata_account
        request:
          method: "GET"
          path: "/.well-known/databricks-config"
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              host_type: "account"
              account_id: "replay-account"
              cloud: "AWS"
      - *metadata_account
      - *metadata_account
      - *metadata_account
      - &metadata_workspace_1001
        request:
          method: "GET"
          path: "/.well-known/databricks-config"
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              host_type: "workspace"
              workspace_id: "1001"
              cloud: "AWS"
      - &lookup_workspace_1001
        request:
          method: "GET"
          path: "/api/2.0/accounts/replay-account/workspaces/1001"
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              account_id: "replay-account"
              workspace_id: 1001
              deployment_name: "replay-workspace-1001"
              workspace_name: "replay-workspace-1001"
              workspace_status: "RUNNING"
      - request:
          method: "POST"
          path: "/api/2.0/workspace/import"
          body:
            json:
              content: "IyBEYXRhYnJpY2tzIG5vdGVib29rIHNvdXJjZQpwcmludCgnaGVsbG8nKQ=="
              path: "/Shared/dwsid-test-replay"
              language: "PYTHON"
              format: "SOURCE"
              overwrite: true
          headers:
            "X-Databricks-Workspace-Id": "1001"
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              object_id: 2001
      - *metadata_account
      - *metadata_account
      - *metadata_account
      - *metadata_account
      - *metadata_workspace_1001
      - *lookup_workspace_1001
      - &read_notebook
        request:
          method: "GET"
          path: "/api/2.0/workspace/get-status"
          query:
            path: ["/Shared/dwsid-test-replay"]
          body: null
          headers:
            "X-Databricks-Workspace-Id": "1001"
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              path: "/Shared/dwsid-test-replay"
              object_type: "NOTEBOOK"
              object_id: 2001
              language: "PYTHON"
      - &workspace_me
        request:
          method: "GET"
          path: "/api/2.0/preview/scim/v2/Me"
          query:
            excludedAttributes: ["entitlements"]
          body: null
          headers:
            "X-Databricks-Workspace-Id": "1001"
        response: # Inferred API response; not recorded.
          status: 200
          headers:
            "X-Databricks-Org-Id": "1001"
          body:
            json:
              id: "100"
              userName: "replay@example.com"
    state:
      resources:
        databricks_notebook.test:
          attributes:
            - path: ["provider_config",0,"workspace_id"]
              equals: "1001"
  - name: "reject_removed_workspace"
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_notebook" "test" {
        path = "/Shared/dwsid-test-replay"
        content_base64 = "IyBEYXRhYnJpY2tzIG5vdGVib29rIHNvdXJjZQpwcmludCgnaGVsbG8nKQ=="
        language = "PYTHON"
      }
    calls:
      - *metadata_account
      - *metadata_account
      - *metadata_workspace_1001
      - *lookup_workspace_1001
      # Refresh still reads the workspace saved in state.
      - *workspace_me
      - *read_notebook
      # Resolving a fallback on the account host has no workspace routing.
      - request:
          method: "GET"
          path: "/api/2.0/preview/scim/v2/Me"
          query:
            excludedAttributes: ["entitlements"]
          body: null
          headers:
            "X-Databricks-Workspace-Id": ""
        response: # Inferred API response; not recorded.
          status: 404
          body:
            json:
              error_code: "ENDPOINT_NOT_FOUND"
              message: "SCIM /Me is only available on workspace hosts"
    expect_error: '(?s)managing a workspace-level resource requires a workspace_id.*previously\s+configured\s+workspace_id\s+was\s+removed'
destroy:
  calls:
    - *metadata_account
    - *metadata_account
    - *metadata_workspace_1001
    - *lookup_workspace_1001
    - *read_notebook
    - *metadata_account
    - *metadata_account
    - *metadata_account
    - *metadata_account
    - *metadata_workspace_1001
    - *lookup_workspace_1001
    - request:
        method: "POST"
        path: "/api/2.0/workspace/delete"
        body:
          json:
            path: "/Shared/dwsid-test-replay"
        headers:
          "X-Databricks-Workspace-Id": "1001"
      response: # Inferred API response; not recorded.
        status: 200
        body: null
    - *workspace_me
