# Pins the create of a model with a description and two tags. The POST body carries name,
# description and both tags, and the tags keep their config order, here zone before
# alpha. API responses are synthetic, inferred from the MLflow Model Registry API, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_sends_description_and_tags_in_config_order
    config: &config |
      resource "databricks_mlflow_model" "this" {
        name        = "lifecycle-description-and-tags"
        description = "Scores churn risk"
        tags {
          key   = "zone"
          value = "west"
        }
        tags {
          key   = "alpha"
          value = "one"
        }
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          body:
            json: {"name": "lifecycle-description-and-tags",
                   "description": "Scores churn risk",
                   "tags": [{"key": "zone", "value": "west"},
                            {"key": "alpha", "value": "one"}]}
        response:
          status: 200
          body:
            json: {"registered_model": {
                     "name": "lifecycle-description-and-tags",
                     "description": "Scores churn risk",
                     "tags": [{"key": "zone", "value": "west"},
                              {"key": "alpha", "value": "one"}],
                     "creation_timestamp": 1700000000201,
                     "last_updated_timestamp": 1700000000201,
                     "user_id": "replay-admin@example.com"}}
      - &read
        request:
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: ["lifecycle-description-and-tags"]
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "lifecycle-description-and-tags",
                     "id": "b2c3d4e5f60718293a4b5c6d7e8f0102",
                     "description": "Scores churn risk",
                     "tags": [{"key": "zone", "value": "west"},
                              {"key": "alpha", "value": "one"}],
                     "creation_timestamp": 1700000000201,
                     "last_updated_timestamp": 1700000000201,
                     "user_id": "replay-admin@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: lifecycle-description-and-tags
            - path: [registered_model_id]
              equals: b2c3d4e5f60718293a4b5c6d7e8f0102
  - name: plan_after_create_is_empty
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read
destroy:
  calls:
    - *read
    - request:
        method: DELETE
        path: /api/2.0/mlflow/registered-models/delete
        query:
          name: ["lifecycle-description-and-tags"]
        body: null
      response:
        status: 200
        body:
          json: {}
