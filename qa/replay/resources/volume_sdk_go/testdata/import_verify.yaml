# Runs volume/testdata/import_verify.yaml with databricks_volume on sdk-go uc/volumes/v1
# in every step, and expects the same behavior. The volume POST, GET and PATCH requests
# carry no Accept header, which an empty header expectation pins. Each PATCH body also
# carries full_name_arg, the full name in its path, because sdk-go serializes the path
# field into the body. The original's description:
#
# Pins the importer: importing into separate state reads the volume twice by its full
# name and matches the created state. API responses are inferred from the Unity Catalog
# API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_external_with_comment_and_owner
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name             = "import_volume"
        catalog_name     = "main"
        schema_name      = "replay"
        volume_type      = "EXTERNAL"
        storage_location = "s3://replay-bucket/volumes/import"
        comment          = "imported comment"
        owner            = "data-engineers"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "import_volume", "volume_type": "EXTERNAL",
                   "storage_location": "s3://replay-bucket/volumes/import",
                   "comment": "imported comment"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "import_volume", "full_name": "main.replay.import_volume",
                   "volume_type": "EXTERNAL",
                   "storage_location": "s3://replay-bucket/volumes/import",
                   "comment": "imported comment", "owner": "replay-admin@example.com",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000051"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.import_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.import_volume",
                   "comment": "imported comment", "owner": "data-engineers"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "import_volume",
                           "full_name": "main.replay.import_volume",
                           "volume_type": "EXTERNAL",
                           "storage_location": "s3://replay-bucket/volumes/import",
                           "comment": "imported comment", "owner": "data-engineers",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000051"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.import_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read_volume
  - name: import_into_separate_state_matches_created_state
    sdk_implementations:
      databricks_volume: sdk_go
    import:
      resource: databricks_volume.this
      persist: false
      verify: true
    calls:
      - *read_volume
      - *read_volume
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.import_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
