# Pins an empty tags {} block. key and value are optional, so the block passes plan-time
# validation and create sends it as one tag object without a key or a value. State keeps
# one tag whose key and value are null, and the next plan is empty. The API specification
# marks a tag's key and value optional, so the fixtures accept the tag and return it as
# it was sent; whether the service accepts such a tag is not verified. API responses are
# inferred from the MLflow Model Registry API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_empty_tags_block_sends_an_empty_tag
    config: &config |
      resource "databricks_mlflow_model" "this" {
        name = "empty-tags-model"
        tags {}
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "empty-tags-model", "tags": [{}]}
        response:
          status: 200
          body:
            json: {"registered_model": {"name": "empty-tags-model",
                                        "tags": [{}],
                                        "creation_timestamp": 1700000000000,
                                        "last_updated_timestamp": 1700000000000,
                                        "user_id": "replay-admin@example.com"}}
      - &read_model
        request:
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [empty-tags-model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "empty-tags-model",
                     "tags": [{}],
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "replay-admin@example.com",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e8f9",
                     "permission_level": "CAN_MANAGE"}}
      - *read_model
    state: &state_with_one_empty_tag
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: empty-tags-model
            - path: [tags, 0, key]
              equals: null
            - path: [tags, 0, value]
              equals: null
  - name: plan_after_create_with_empty_tags_block_is_empty
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state: *state_with_one_empty_tag
    calls:
      - *read_model
destroy:
  calls:
    - *read_model
    - request:
        method: DELETE
        path: /api/2.0/mlflow/registered-models/delete
        query:
          name: [empty-tags-model]
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
