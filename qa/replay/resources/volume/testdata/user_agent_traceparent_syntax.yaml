# Pins the W3C traceparent header that the classic SDK adds to every volume call:
# exactly one value of version 00, a 32-digit trace ID and a 16-digit parent ID in
# lowercase hex, and the sampled flag, 01. The SDK sends no tracestate header. The
# IDs are random, so the pattern checks their format. API responses are inferred from
# the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_owner
    config: |
      resource "databricks_volume" "this" {
        name         = "traceparent_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "data-engineers"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          matchers: &traceparent
            headers:
              traceparent: {pattern: '00-[0-9a-f]{32}-[0-9a-f]{16}-01'}
              tracestate: absent
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "traceparent_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "traceparent_volume",
                   "full_name": "main.replay.traceparent_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-304",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000304"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.traceparent_volume
          matchers: *traceparent
          body:
            json: {"owner": "data-engineers"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "traceparent_volume",
                           "full_name": "main.replay.traceparent_volume",
                           "volume_type": "MANAGED", "owner": "data-engineers",
                           "storage_location": "s3://replay-metastore/volume-304",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000304"}
      - &read
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.traceparent_volume
          matchers: *traceparent
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.traceparent_volume
destroy:
  calls:
    - *read
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.traceparent_volume
        matchers: *traceparent
        body: null
      response:
        status: 200
        body:
          json: {}
