# Runs volume/testdata/delete.yaml with databricks_volume on sdk-go uc/volumes/v1 in every
# step, and expects the same behavior. The volume POST and GET requests carry no Accept
# header, which an empty header expectation pins. The original's description:
#
# Pins deletes by full name: a DELETE answered 200, and a DELETE answered 404, which the
# provider treats as already gone. API responses are inferred from the Unity Catalog API
# contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "deleted_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request: &create_request
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "deleted_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &first {"catalog_name": "main", "schema_name": "replay",
                          "name": "deleted_volume",
                          "full_name": "main.replay.deleted_volume",
                          "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                          "storage_location": "s3://replay-metastore/volume-71",
                          "metastore_id": "11111111-1111-1111-1111-111111111111",
                          "volume_id": "00000000-0000-4000-8000-000000000071"}
      - &read_first
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.deleted_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *first
      - *read_first
  - name: plan_after_create_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_first
  - name: delete_answered_200
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_empty |
      provider "databricks" {}
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete]
    calls:
      - *read_first
      - request: &delete_request
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.deleted_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {}
  - name: plan_after_delete_answered_200_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_empty
    plan:
      expect: empty
      changes: {}
    calls: []
  - name: create_again
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    calls:
      - request: *create_request
        response:
          status: 200
          body:
            json: &second {"catalog_name": "main", "schema_name": "replay",
                           "name": "deleted_volume",
                           "full_name": "main.replay.deleted_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-72",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000072"}
      - &read_second
        request: *read_request
        response:
          status: 200
          body:
            json: *second
      - *read_second
  - name: plan_after_create_again_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_second
destroy:
  calls:
    - *read_second
    - request: *delete_request
      response:
        status: 404
        body:
          json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                 "message": "Volume 'main.replay.deleted_volume' does not exist."}
