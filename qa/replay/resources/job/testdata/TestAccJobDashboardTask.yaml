              update_time: "2025-01-01T00:00:00Z"
              warehouse_id: "warehouse-1"
      - request:
          method: "POST"
          path: "/api/2.0/lakeview/dashboards/dashboard-1/published"
          body:
            json:
              embed_credentials: true
              warehouse_id: "warehouse-1"
        response: &response_2 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              dashboard_id: "dashboard-1"
              display_name: "Dashboard Task Test replay1"
              warehouse_id: "warehouse-1"
      - &get_1
        request: {method: "GET", path: "/api/2.0/lakeview/dashboards/dashboard-1", body: null}
        response: *response_1
      - request:
          method: "POST"
          path: "/api/2.2/jobs/create"
          body:
            json:
              max_concurrent_runs: 1
              name: "Dashboard Task Test replay1"
              queue:
                enabled: false
              tasks:
                - dashboard_task:
                    dashboard_id: "dashboard-1"
                    warehouse_id: "warehouse-1"
                  task_key: "d"
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              job_id: 101
      - &get_2
        request: {method: "GET", path: "/api/2.2/jobs/get", query: {"job_id": ["101"]}, body: null}
        response: &response_3 # Inferred API response; not recorded.
