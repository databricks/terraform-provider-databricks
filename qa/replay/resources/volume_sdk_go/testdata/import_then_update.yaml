# Runs volume/testdata/import_then_update.yaml with databricks_volume on sdk-go
# uc/volumes/v1 in every step, and expects the same behavior. The volume GET and PATCH
# requests carry no Accept header, which an empty header expectation pins. Each PATCH body
# also carries full_name_arg, the full name in its path, because sdk-go serializes the
# path field into the body. The original's description:
#
# Pins adopting an existing volume by importing it into the journey's state by full
# name, then updating its comment with a PATCH to that name. API responses are inferred
# from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: import_existing_volume
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_imported |
      resource "databricks_volume" "this" {
        name         = "existing_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "created outside terraform"
      }
    import:
      resource: databricks_volume.this
      id: main.replay.existing_volume
      persist: true
    calls:
      - &read_existing
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.existing_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "existing_volume", "full_name": "main.replay.existing_volume",
                   "volume_type": "MANAGED", "comment": "created outside terraform",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-61",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000061"}
      - *read_existing
  - name: plan_after_import_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_imported
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.existing_volume
            - path: [volume_path]
              equals: /Volumes/main/replay/existing_volume
            - path: [owner]
              equals: replay-admin@example.com
    calls:
      - *read_existing
  - name: update_comment_after_import
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_updated |
      resource "databricks_volume" "this" {
        name         = "existing_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "managed by terraform"
      }
    calls:
      - *read_existing
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.existing_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.existing_volume",
                   "comment": "managed by terraform"}
        response:
          status: 200
          body:
            json: &updated {"catalog_name": "main", "schema_name": "replay",
                            "name": "existing_volume",
                            "full_name": "main.replay.existing_volume",
                            "volume_type": "MANAGED", "comment": "managed by terraform",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-61",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000061"}
      - &read_updated
        request: *read_request
        response:
          status: 200
          body:
            json: *updated
      - *read_updated
  - name: plan_after_update_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_updated
destroy:
  calls:
    - *read_updated
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.existing_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
