# Runs volume/testdata/name_with_hash_drops_the_fragment.yaml with databricks_volume on
# sdk-go uc/volumes/v1 in every step, and expects the same requests and behavior. The
# original's description:
#
# Pins a known defect: the request paths for a volume name with "#". The classic client
# puts the full name in the path unescaped, so "#2" becomes a URL fragment that is never
# sent, and the GET, the PATCH and the DELETE all go to main.replay.raw. If a volume
# named raw exists in that schema, they read, change and delete it instead. The fixtures
# answer those requests with raw#2's own data because a stateless fixture can't model
# which volume the workspace resolves main.replay.raw to, so this journey can't show the
# wrong volume. The planned existing-path escaping fix is expected to change these
# paths; update this journey with it. API responses are inferred from the Unity Catalog
# API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "raw#2"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "raw#2",
                   "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "raw#2", "full_name": "main.replay.raw#2",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-165",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000165"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.raw#2
            - path: [volume_path]
              equals: /Volumes/main/replay/raw#2
  - name: update_comment_wrongly_patches_the_name_before_the_hash
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "raw#2"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "truncated"
      }
    calls:
      - *read_created
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.raw
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "truncated"}
        response:
          status: 200
          body:
            json: &commented {"catalog_name": "main", "schema_name": "replay",
                              "name": "raw#2", "full_name": "main.replay.raw#2",
                              "volume_type": "MANAGED", "comment": "truncated",
                              "owner": "replay-admin@example.com",
                              "storage_location": "s3://replay-metastore/volume-165",
                              "metastore_id": "11111111-1111-1111-1111-111111111111",
                              "volume_id": "00000000-0000-4000-8000-000000000165"}
      - &read_commented
        request: *read_request
        response:
          status: 200
          body:
            json: *commented
      - *read_commented
  - name: delete_wrongly_deletes_the_name_before_the_hash
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {}
    calls:
      - *read_commented
      - request:
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.raw
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {}
destroy:
  calls: []
