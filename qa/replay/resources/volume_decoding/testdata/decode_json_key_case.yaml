# Pins that a refresh GET answered with keys in other cases decodes them as the SDK's
# fields: the SDK rewrites a key that matches a field name case-insensitively to that name
# before decoding. A body with every key upper-case, and one with mixed-case keys, give the
# same state as the lower-case body and an empty plan. The bodies are text so the keys are
# exact. API responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_volume" "this" {
        name         = "key_case_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "key_case_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "key_case_volume",
                            "full_name": "main.replay.key_case_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-197"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.key_case_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
    state: &same_state
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.key_case_volume
            - path: [catalog_name]
              equals: main
            - path: [name]
              equals: key_case_volume
            - path: [comment]
              equals: first comment
            - path: [owner]
              equals: replay-admin@example.com
            - path: [storage_location]
              equals: s3://replay-metastore/volume-197
            - path: [volume_path]
              equals: /Volumes/main/replay/key_case_volume
  - name: refresh_with_upper_case_keys_keeps_the_same_state
    plan_only: true
    config: *config
    plan: &empty_plan
      expect: empty
      changes: {}
    state: *same_state
    calls:
      - request: *read_request
        response:
          status: 200
          headers:
            Content-Type: application/json
          body:
            text: '{"CATALOG_NAME": "main", "SCHEMA_NAME": "replay", "NAME":
              "key_case_volume", "FULL_NAME": "main.replay.key_case_volume",
              "VOLUME_TYPE": "MANAGED", "COMMENT": "first comment", "OWNER":
              "replay-admin@example.com", "STORAGE_LOCATION":
              "s3://replay-metastore/volume-197"}'
  - name: refresh_with_mixed_case_keys_keeps_the_same_state
    plan_only: true
    config: *config
    plan: *empty_plan
    state: *same_state
    calls:
      - request: *read_request
        response:
          status: 200
          headers:
            Content-Type: application/json
          body:
            text: '{"Catalog_Name": "main", "Schema_NAME": "replay", "Name":
              "key_case_volume", "Full_name": "main.replay.key_case_volume",
              "volume_TYPE": "MANAGED", "Comment": "first comment", "oWNER":
              "replay-admin@example.com", "Storage_Location":
              "s3://replay-metastore/volume-197"}'
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.key_case_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
