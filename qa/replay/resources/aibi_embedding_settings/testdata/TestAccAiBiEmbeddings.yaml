    config: |
      resource "databricks_aibi_dashboard_embedding_access_policy_setting" "this" {
        aibi_dashboard_embedding_access_policy {
          access_policy_type = "ALLOW_APPROVED_DOMAINS"
        }
      }

      resource "databricks_aibi_dashboard_embedding_approved_domains_setting" "this" {
        aibi_dashboard_embedding_approved_domains {
          approved_domains = ["test.com"]
        }
        depends_on = [databricks_aibi_dashboard_embedding_access_policy_setting.this]
      }
    calls:
      - request:
          method: "PATCH"
          path: "/api/2.0/settings/types/aibi_dash_embed_ws_acc_policy/names/default"
          body:
            json:
              allow_missing: true
              field_mask: "aibi_dashboard_embedding_access_policy.access_policy_type"
              setting:
                aibi_dashboard_embedding_access_policy:
                  access_policy_type: "ALLOW_APPROVED_DOMAINS"
                setting_name: "default"
        response: &response_1 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              aibi_dashboard_embedding_access_policy:
                access_policy_type: "ALLOW_APPROVED_DOMAINS"
              etag: "policy-1"
              setting_name: "default"
      - &get_1
