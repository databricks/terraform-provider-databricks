              workspace_id: 1001
              deployment_name: "replay-workspace-1001"
              workspace_name: "replay-workspace-1001"
              workspace_status: "RUNNING"
      - request:
          method: "POST"
          path: "/api/2.1/tag-policies"
          body:
            json:
              tag_key: "dwsid-tp-replay"
              description: "workspace_id acceptance test"
          headers:
            "X-Databricks-Workspace-Id": "1001"
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              tag_key: "dwsid-tp-replay"
              description: "workspace_id acceptance test"
              id: "tag-1001"
      - *metadata_account
      - *metadata_account
      - *metadata_account
      - *metadata_account
      - *metadata_workspace_1001
      - *lookup_workspace_1001
      - &get_1
        request:
          method: "GET"
          path: "/api/2.1/tag-policies/dwsid-tp-replay"
          body: null
          headers:
            "X-Databricks-Workspace-Id": "1001"
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
