      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body: null
  - request:
      method: GET
      path: /api/2.0/pipelines/pipeline-1
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
