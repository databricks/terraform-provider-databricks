# Runs account_read_errors with reads and writes through sdk-go scim/v1. A 403, a 500 with
# a non-JSON body and a 200 with a body that can't be decoded fail with their exact
# diagnostics and keep the resource in state; a 404 removes it, and the same apply
# recreates it. The GETs carry no attributes query, Accept or Content-Type header. Writes
# send Content-Type application/json and no Accept header, PATCH bodies also carry the ID,
# and account-level POST bodies have no schemas, entitlements or groups, which the
# account-level scim/v1 model doesn't have. API responses are inferred from the SCIM API
# contract, not recorded. An empty header expectation matches only requests without that
# header.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: &config |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_service_principal" "this" {
        display_name = "SPN read errors"
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: ""
            Accept: ""
          body:
            json: {"displayName": "SPN read errors", "active": true}
        response:
          status: 201
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN read errors", "active": true}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201
          headers:
            X-Databricks-Workspace-Id: ""
            Accept: ""
            Content-Type: ""
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN read errors", "active": true}
      - *read_created
  - name: refresh_answered_403_fails
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: *config
    expect_error: 'Error: cannot read service principal: User is not authorized to access
      this service principal\.'
    calls:
      - request: *read_request
        response:
          status: 403
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "User is not authorized to access this service principal.",
                   "status": "403"}
  - name: state_kept_after_403
    sdk_implementations:
      databricks_service_principal: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_service_principal.this:
          attributes:
            - path: [id]
              equals: "201"
    calls:
      - *read_created
  - name: refresh_answered_500_with_non_json_body_fails
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: *config
    expect_error: 'Error: cannot read service principal: upstream connect error or
      disconnect/reset before headers'
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            text: upstream connect error or disconnect/reset before headers
  - name: state_kept_after_500
    sdk_implementations:
      databricks_service_principal: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_service_principal.this:
          attributes:
            - path: [id]
              equals: "201"
    calls:
      - *read_created
  - name: refresh_answered_200_with_undecodable_body_fails
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: *config
    expect_error: 'Error: cannot read service principal: failed to unmarshal response
      body: invalid character ''u'' looking for beginning of value'
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            text: upstream returned an empty page
  - name: state_kept_after_undecodable_body
    sdk_implementations:
      databricks_service_principal: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_service_principal.this:
          attributes:
            - path: [id]
              equals: "201"
    calls:
      - *read_created
  - name: refresh_answered_404_removes_and_recreates
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_service_principal.this:
          actions: [create]
    calls:
      - request: *read_request
        response:
          status: 404
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Service Principal with id 201 not found.", "status": "404"}
      - request:
          method: POST
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: ""
            Accept: ""
          body:
            json: {"displayName": "SPN read errors", "active": true}
        response:
          status: 201
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "202", "applicationId": "00000000-0000-4000-8000-000000000002",
                   "displayName": "SPN read errors", "active": true}
      - &read_recreated
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/202
          headers:
            X-Databricks-Workspace-Id: ""
            Accept: ""
            Content-Type: ""
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "202", "applicationId": "00000000-0000-4000-8000-000000000002",
                   "displayName": "SPN read errors", "active": true}
      - *read_recreated
    state:
      resources:
        databricks_service_principal.this:
          attributes:
            - path: [id]
              equals: "202"
            - path: [application_id]
              equals: 00000000-0000-4000-8000-000000000002
  - name: plan_after_recreate_is_empty
    sdk_implementations:
      databricks_service_principal: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_recreated
destroy:
  calls:
    - *read_recreated
    - request:
        method: PATCH
        path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/202
        headers:
          Content-Type: application/json
          X-Databricks-Workspace-Id: ""
          Accept: ""
        body:
          json: {"id": "202",
                 "schemas": ["urn:ietf:params:scim:api:messages:2.0:PatchOp"],
                 "Operations": [{"op": "replace", "path": "active",
                                 "value": [{"value": "false"}]}]}
      response:
        status: 200
        body: null
