# Runs volume/testdata/call_site_read_after_update.yaml with databricks_volume on sdk-go
# uc/volumes/v1 in every step, and expects the same behavior. The volume POST, GET, PATCH
# and DELETE requests carry no Accept header, which an empty header expectation pins. Each
# PATCH body also carries full_name_arg, the full name in its path, because sdk-go
# serializes the path field into the body. The original's description:
#
# Pins the GET that follows a successful update PATCH. A 404 after a rename whose PATCH
# returned the new full name, a 403 and a 500 each fail apply with "cannot read volume"
# and the GET's error. Unlike a refresh, the read after an update does not treat the 404
# as missing. The update is kept in state: the ID is the PATCH's full name and the
# attributes are the configured ones, so the next plan refreshes the new name and is
# empty. API responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "read_after_update_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "read_after_update_volume", "volume_type": "MANAGED",
                   "comment": "first"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "read_after_update_volume",
                            "full_name": "main.replay.read_after_update_volume",
                            "volume_type": "MANAGED", "comment": "first",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-1928",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001928"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.read_after_update_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: read_after_rename_answered_404_fails_and_keeps_the_new_id
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_renamed |
      resource "databricks_volume" "this" {
        name         = "read_after_update_renamed"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first"
      }
    expect_error: 'Error: cannot read volume: Volume
      ''main\.replay\.read_after_update_renamed'' does not exist\.\n'
    calls:
      - *read_created
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.read_after_update_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.read_after_update_volume",
                   "new_name": "read_after_update_renamed", "comment": "first"}
        response:
          status: 200
          body:
            json: &renamed {"catalog_name": "main", "schema_name": "replay",
                            "name": "read_after_update_renamed",
                            "full_name": "main.replay.read_after_update_renamed",
                            "volume_type": "MANAGED", "comment": "first",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-1928",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001928"}
      - request: &read_renamed_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.read_after_update_renamed
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 404
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Volume 'main.replay.read_after_update_renamed' does not
                     exist."}
  - name: plan_after_404_refreshes_the_new_name_and_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_renamed
    plan: &empty
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.read_after_update_renamed
            - path: [volume_path]
              equals: /Volumes/main/replay/read_after_update_renamed
    calls:
      - &read_renamed
        request: *read_renamed_request
        response:
          status: 200
          body:
            json: *renamed
  - name: read_after_update_answered_403_fails_and_keeps_the_update
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_second |
      resource "databricks_volume" "this" {
        name         = "read_after_update_renamed"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second"
      }
    expect_error: 'Error: cannot read volume: User does not have READ VOLUME on Volume
      ''main\.replay\.read_after_update_renamed''\.\n'
    calls:
      - *read_renamed
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.read_after_update_renamed
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.read_after_update_renamed",
                   "comment": "second"}
        response:
          status: 200
          body:
            json: &second {"catalog_name": "main", "schema_name": "replay",
                           "name": "read_after_update_renamed",
                           "full_name": "main.replay.read_after_update_renamed",
                           "volume_type": "MANAGED", "comment": "second",
                           "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1928",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001928"}
      - request: *read_renamed_request
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "User does not have READ VOLUME on Volume
                     'main.replay.read_after_update_renamed'."}
  - name: plan_after_403_keeps_the_updated_comment_and_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_second
    plan: *empty
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.read_after_update_renamed
            - path: [comment]
              equals: second
    calls:
      - &read_second
        request: *read_renamed_request
        response:
          status: 200
          body:
            json: *second
  - name: read_after_update_answered_500_fails_and_keeps_the_update
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_third |
      resource "databricks_volume" "this" {
        name         = "read_after_update_renamed"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "third"
      }
    expect_error: 'Error: cannot read volume: Internal error while reading the volume\.\n'
    calls:
      - *read_second
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.read_after_update_renamed
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.read_after_update_renamed",
                   "comment": "third"}
        response:
          status: 200
          body:
            json: &third {"catalog_name": "main", "schema_name": "replay",
                          "name": "read_after_update_renamed",
                          "full_name": "main.replay.read_after_update_renamed",
                          "volume_type": "MANAGED", "comment": "third",
                          "owner": "replay-admin@example.com",
                          "storage_location": "s3://replay-metastore/volume-1928",
                          "metastore_id": "11111111-1111-1111-1111-111111111111",
                          "volume_id": "00000000-0000-4000-8000-000000001928"}
      - request: *read_renamed_request
        response:
          status: 500
          body:
            json: {"error_code": "INTERNAL_ERROR",
                   "message": "Internal error while reading the volume."}
  - name: plan_after_500_keeps_the_updated_comment_and_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_third
    plan: *empty
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.read_after_update_renamed
            - path: [comment]
              equals: third
    calls:
      - &read_third
        request: *read_renamed_request
        response:
          status: 200
          body:
            json: *third
destroy:
  calls:
    - *read_third
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.read_after_update_renamed
        headers:
          X-Databricks-Workspace-Id: "12345"
          Accept: ""
        body: null
      response:
        status: 200
        body:
          json: {}
