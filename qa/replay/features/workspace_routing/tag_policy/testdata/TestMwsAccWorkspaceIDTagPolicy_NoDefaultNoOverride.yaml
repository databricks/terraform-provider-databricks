# API responses are inferred from the scenarios and API models, not recorded.
# Metadata fixtures are dummy account/workspace configuration.
version: 1
steps:
  - name: "create"
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_tag_policy" "test" {
        tag_key = "dwsid-tp-replay"
        description = "workspace_id acceptance test"
      }
    calls:
      - &metadata_account
        request:
          method: "GET"
          path: "/.well-known/databricks-config"
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              host_type: "account"
              account_id: "replay-account"
              cloud: "AWS"
      - *metadata_account
      - *metadata_account
      - *metadata_account
    expect_error: "(?s)managing a workspace-level resource requires a workspace_id.*none\\s+was\\s+found"
destroy:
  calls: []
