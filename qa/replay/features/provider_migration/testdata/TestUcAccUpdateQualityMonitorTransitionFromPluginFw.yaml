version: 1
host_metadata:
  cloud: AWS
  host_type: workspace
  workspace_id: '12345'
steps:
- name: create_monitors
  config: |
    resource "databricks_catalog" "sandbox" {
      name    = "sandboxreplay"
      comment = "this catalog is managed by terraform"
      properties = {
        purpose = "testing"
      }
      force_destroy = true
    }

    resource "databricks_schema" "things" {
      catalog_name = databricks_catalog.sandbox.id
      name         = "thingsreplay"
      comment      = "this database is managed by terraform"
      properties = {
        kind = "various"
      }
    }

    resource "databricks_sql_table" "myInferenceTable" {
      catalog_name       = databricks_catalog.sandbox.id
      schema_name        = databricks_schema.things.name
      name               = "barreplay_inference"
      table_type         = "MANAGED"
      data_source_format = "DELTA"
      warehouse_id       = "warehouse-1"

      column {
        name = "model_id"
        type = "int"
      }
      column {
        name = "timestamp"
        type = "int"
      }
      column {
        name = "prediction"
        type = "int"
      }
    }


    resource "databricks_quality_monitor" "testMonitorInference" {
      table_name         = databricks_sql_table.myInferenceTable.id
      assets_dir         = "/Shared/provider-test/databricks_quality_monitoring/${databricks_sql_table.myInferenceTable.name}"
      output_schema_name = databricks_schema.things.id
      inference_log {
        granularities  = ["1 day"]
        timestamp_col  = "timestamp"
        prediction_col = "prediction"
        model_id_col   = "model_id"
        problem_type   = "PROBLEM_TYPE_REGRESSION"
      }
    }
  calls:
  - request:
      method: POST
      path: /api/2.1/unity-catalog/catalogs
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
