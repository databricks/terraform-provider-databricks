# Pins volume names containing a control character on the existing path. The journey
# imports a full name with a tab, renames the volume to another name with a tab, which
# the PATCH response returns as the new full name, and destroys it. The provider escapes
# the tab as %09 before the classic client builds the URL, so every call is sent and none
# fails with net/url's invalid control character error. The ID and volume_path keep the
# raw tab. API responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: import_by_full_name_reads_the_escaped_tab
    config: &config_imported |
      resource "databricks_volume" "this" {
        name         = "raw\t1"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    import:
      resource: databricks_volume.this
      id: "main.replay.raw\t1"
      persist: true
    calls:
      - &read_imported
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%091
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "raw\t1",
                   "full_name": "main.replay.raw\t1", "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-19803",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000019803"}
      - *read_imported
  - name: plan_after_import_is_empty
    plan_only: true
    config: *config_imported
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: "main.replay.raw\t1"
            - path: [volume_path]
              equals: "/Volumes/main/replay/raw\t1"
    calls:
      - *read_imported
  - name: rename_patches_the_escaped_tab_and_reads_the_returned_name
    config: &config_renamed |
      resource "databricks_volume" "this" {
        name         = "raw\t2"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - *read_imported
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%091
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"new_name": "raw\t2"}
        response:
          status: 200
          body:
            json: &renamed {"catalog_name": "main", "schema_name": "replay",
                            "name": "raw\t2", "full_name": "main.replay.raw\t2",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-19803",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000019803"}
      - &read_renamed
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%092
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *renamed
      - *read_renamed
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: "main.replay.raw\t2"
            - path: [volume_path]
              equals: "/Volumes/main/replay/raw\t2"
  - name: plan_after_rename_is_empty
    plan_only: true
    config: *config_renamed
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_renamed
destroy:
  calls:
    - *read_renamed
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.raw%092
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
