# Pins the token calls and credentials of databricks_volume calls with Azure MSI. Each
# Terraform operation configures a new provider, whose first volume call asks the
# instance metadata service for a token for Azure Databricks and then for one for Azure
# management. The POST, GET and DELETE send the same three headers as with an Azure
# client secret: Authorization: Bearer, X-Databricks-Azure-SP-Management-Token and
# X-Databricks-Azure-Workspace-Resource-Id. A pattern matcher requires exactly one
# value, so a lost or duplicated header fails. The metadata service is a plain HTTP
# named host. Token and API responses are inferred from the Azure instance metadata
# and Unity Catalog API contracts, not recorded.
version: 1
enforce_call_order: true
provider_host: workspace
hosts:
  workspace:
    url: https://adb-12345.6.azuredatabricks.net
  imds:
    url: http://169.254.169.254
host_metadata:
  host_type: workspace
  cloud: Azure
  workspace_id: "12345"
auth:
  type: azure-msi
  azure_use_msi: "true"
  azure_workspace_resource_id: /subscriptions/replay-subscription/resourceGroups/replay-group/providers/Microsoft.Databricks/workspaces/replay-workspace
steps:
  - name: create
    config: |
      resource "databricks_volume" "this" {
        name         = "auth_msi_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - &databricks_token
        request:
          method: GET
          host: imds
          path: /metadata/identity/oauth2/token
          query:
            api-version: ["2018-02-01"]
            resource: [2ff814a6-3304-4ab8-85cb-cd0e6f879c1d]
          headers:
            Metadata: "true"
          matchers: &no_authorization
            headers:
              Authorization: absent
          body: null
        response:
          status: 200
          body:
            json: {"access_token": "msi-token", "token_type": "Bearer",
                   "expires_on": 4102444800}
      - &management_token
        request:
          method: GET
          host: imds
          path: /metadata/identity/oauth2/token
          query:
            api-version: ["2018-02-01"]
            resource: ["https://management.core.windows.net/"]
          headers:
            Metadata: "true"
          matchers: *no_authorization
          body: null
        response:
          status: 200
          body:
            json: {"access_token": "msi-management-token", "token_type": "Bearer",
                   "expires_on": 4102444800}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: &credentials
            headers:
              Authorization: {pattern: 'Bearer msi-token'}
              X-Databricks-Azure-Sp-Management-Token: {pattern: 'msi-management-token'}
              X-Databricks-Azure-Workspace-Resource-Id:
                pattern: '/subscriptions/replay-subscription/resourceGroups/replay-group/providers/Microsoft\.Databricks/workspaces/replay-workspace'
              X-Databricks-Gcp-Sa-Access-Token: absent
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "auth_msi_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "auth_msi_volume",
                            "full_name": "main.replay.auth_msi_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "abfss://metastore@replaystorage.dfs.core.windows.net/volume-302",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000302"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.auth_msi_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: *credentials
          body: null
        response:
          status: 200
          body:
            json: *created
      # Terraform's post-apply plan.
      - *databricks_token
      - *management_token
      - *read_created
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.auth_msi_volume
destroy:
  calls:
    # The refresh, then the destroy.
    - *databricks_token
    - *management_token
    - *read_created
    - *databricks_token
    - *management_token
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.auth_msi_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        matchers: *credentials
        body: null
      response:
        status: 200
        body:
          json: {}
