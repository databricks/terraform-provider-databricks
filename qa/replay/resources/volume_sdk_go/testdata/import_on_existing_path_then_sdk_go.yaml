# Imports an existing volume by full name with databricks_volume on the existing client,
# then plans, updates comment and owner, and destroys it on sdk-go uc/volumes/v1. The
# first plan after the switch is empty, state keeps the imported ID, volume_path and
# owner, and the update sends the owner PATCH first and then the comment PATCH.
# Existing-path requests carry Accept application/json; sdk-go requests carry no Accept
# header, which an empty header expectation pins, and their PATCH bodies also carry
# full_name_arg, the full name in their path. API responses are inferred from the Unity
# Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: import_on_existing_path
    sdk_implementations:
      databricks_volume: classic
    config: &config_imported |
      resource "databricks_volume" "this" {
        name         = "existing_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "created outside terraform"
      }
    import:
      resource: databricks_volume.this
      id: main.replay.existing_volume
      persist: true
    calls:
      - &first_read_existing
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.existing_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: application/json
          body: null
        response: &existing
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "existing_volume", "full_name": "main.replay.existing_volume",
                   "volume_type": "MANAGED", "comment": "created outside terraform",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-92",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000092"}
      - *first_read_existing
  - name: plan_on_sdk_go_after_import_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_imported
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.existing_volume
            - path: [volume_path]
              equals: /Volumes/main/replay/existing_volume
            - path: [owner]
              equals: replay-admin@example.com
            - path: [comment]
              equals: created outside terraform
    calls:
      - &second_read_existing
        request: &second_read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.existing_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response: *existing
  - name: update_comment_and_owner_on_sdk_go
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_updated |
      resource "databricks_volume" "this" {
        name         = "existing_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "managed by terraform"
        owner        = "data-engineers"
      }
    calls:
      - *second_read_existing
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.existing_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.existing_volume",
                   "owner": "data-engineers"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "existing_volume", "full_name": "main.replay.existing_volume",
                   "volume_type": "MANAGED", "comment": "created outside terraform",
                   "owner": "data-engineers",
                   "storage_location": "s3://replay-metastore/volume-92",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000092"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.existing_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.existing_volume",
                   "comment": "managed by terraform"}
        response:
          status: 200
          body:
            json: &updated {"catalog_name": "main", "schema_name": "replay",
                            "name": "existing_volume",
                            "full_name": "main.replay.existing_volume",
                            "volume_type": "MANAGED", "comment": "managed by terraform",
                            "owner": "data-engineers",
                            "storage_location": "s3://replay-metastore/volume-92",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000092"}
      - &second_read_updated
        request: *second_read_request
        response:
          status: 200
          body:
            json: *updated
      - *second_read_updated
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.existing_volume
            - path: [owner]
              equals: data-engineers
            - path: [comment]
              equals: managed by terraform
  - name: plan_on_sdk_go_after_update_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan:
      expect: empty
      changes: {}
    calls:
      - *second_read_updated
destroy:
  calls:
    - *second_read_updated
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.existing_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
