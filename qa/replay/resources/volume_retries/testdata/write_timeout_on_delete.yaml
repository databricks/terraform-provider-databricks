# This journey pins a DELETE whose response is held past http_timeout_seconds. The SDK
# fails the DELETE with its inactivity timeout and doesn't retry it, although the
# provider's default retry timeout never ends: a second DELETE would be an unexpected
# call. Apply fails and the volume stays in state, so planning its configuration again
# shows no change. API responses are inferred from the Unity Catalog API contract, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      provider "databricks" {
        http_timeout_seconds = 1
      }
      resource "databricks_volume" "this" {
        name         = "retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "retry_volume", "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "retry_volume", "full_name": "main.replay.retry_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-191",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000191"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *volume
      - *read_volume
  - name: delete_past_the_http_timeout_is_not_retried
    config: |
      provider "databricks" {
        http_timeout_seconds = 1
      }
    expect_error: 'Error: cannot delete volume: Delete
      "http://[^"]+/api/2\.1/unity-catalog/volumes/main\.replay\.retry_volume\?":
      request timed out after 1s of inactivity\n'
    calls:
      - *read_volume
      - request: &delete
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          delay: 10s
          status: 200
          body:
            json: {}
  - name: plan_after_timed_out_delete_keeps_the_volume
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.retry_volume
    calls:
      - *read_volume
destroy:
  calls:
    - *read_volume
    - request: *delete
      response:
        status: 200
        body:
          json: {}
