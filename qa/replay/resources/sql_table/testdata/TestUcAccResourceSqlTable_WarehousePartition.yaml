# API responses are placeholders based on the API models, not recorded.
version: 1
host_metadata:
  cloud: AWS
  host_type: workspace
  workspace_id: '12345'
steps:
- name: create
  config: |
    resource "databricks_schema" "this" {
      name         = "replay"
      catalog_name = "main"
    }

    resource "databricks_sql_table" "this" {
      name         = "bar"
      catalog_name = "main"
      schema_name  = databricks_schema.this.name
      table_type   = "MANAGED"
      warehouse_id = "warehouse-1"
      properties = {
        them      = "that"
        something = "else"
      }
      options = {
        this = "blue"
        that = "green"
      }
      column {
        name = "id"
        type = "int"
      }
      column {
        name = "name"
        type = "string"
      }
      partitions = ["id"]
      comment    = "this table is managed by terraform"
    }
  calls:
  - request:
      method: POST
      path: /api/2.1/unity-catalog/schemas
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          catalog_name: main
          name: replay
    response:
      status: 200
      body:
        json:
          catalog_name: main
          enable_predictive_optimization: INHERIT
          full_name: main.replay
          name: replay
          owner: replay-admin
  - &id002
    request:
      method: GET
      path: /api/2.1/unity-catalog/schemas/main.replay
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          catalog_name: main
          enable_predictive_optimization: INHERIT
          full_name: main.replay
          name: replay
          owner: replay-admin
  - request:
      method: POST
      path: /api/2.0/sql/statements
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          on_wait_timeout: CANCEL
          statement: |-
            CREATE TABLE `main`.`replay`.`bar` (`id` int, `name` string)
            PARTITIONED BY (id)
            COMMENT 'this table is managed by terraform'
            TBLPROPERTIES ('something'='else', 'them'='that')
            OPTIONS ('that'='green', 'this'='blue');
          wait_timeout: 50s
          warehouse_id: warehouse-1
    response:
      status: 200
      body:
        json:
          statement_id: statement-1
          status:
            state: SUCCEEDED
  - &id001
    request:
      method: GET
      path: /api/2.1/unity-catalog/tables/main.replay.bar
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          catalog_name: main
          cluster_keys: []
          columns:
          - name: id
            nullable: true
            partition_index: 0
            type_text: int
          - name: name
            nullable: true
            type_text: string
          comment: this table is managed by terraform
          data_source_format: DELTA
          full_name: main.replay.bar
          name: bar
          owner: replay-admin
          properties:
            option.that: green
            option.this: blue
            something: else
            them: that
          schema_name: replay
          table_id: table-bar
          table_type: MANAGED
  - *id001
  - *id002
  - *id001
  - *id001
destroy:
  calls:
  - *id002
  - *id001
  - *id001
  - request:
      method: POST
      path: /api/2.0/sql/statements
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          on_wait_timeout: CANCEL
          statement: |-
            DROP TABLE `main`.`replay`.`bar`
          wait_timeout: 50s
          warehouse_id: warehouse-1
    response:
      status: 200
      body:
        json:
          statement_id: statement-1
          status:
            state: SUCCEEDED
  - request:
      method: DELETE
      path: /api/2.1/unity-catalog/schemas/main.replay
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body: null
