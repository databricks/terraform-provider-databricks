version: 1
host_metadata:
  workspace_id: "12345"
steps:
  - name: create
    terraform: |
      resource "databricks_group" "this" {
        display_name = "Lifecycle group"
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/preview/scim/v2/Groups
          body:
            json:
              displayName: Lifecycle group
              schemas:
                - urn:ietf:params:scim:schemas:core:2.0:Group
              entitlements:
                - {}
        response:
          status: 201
          body:
            json:
              id: group-id
      - request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups/group-id
          query:
            attributes: ["displayName,externalId,entitlements"]
          body: null
        response:
          status: 200
          body:
            json:
              id: group-id
              displayName: Lifecycle group
      - request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups/group-id
          query:
            attributes: ["displayName,externalId,entitlements"]
          body: null
        response:
          status: 200
          body:
            json:
              id: group-id
              displayName: Lifecycle group
    state:
      resources:
        databricks_group.this:
          attributes:
            - path: [id]
              equals: group-id
            - path: [display_name]
              equals: Lifecycle group
  - name: rename
    terraform: |
      resource "databricks_group" "this" {
        display_name = "Renamed lifecycle group"
      }
    calls:
      - request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups/group-id
          query:
            attributes: ["displayName,externalId,entitlements"]
          body: null
        response:
          status: 200
          body:
            json:
              id: group-id
              displayName: Lifecycle group
      - request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups/group-id
          query:
            attributes: ["displayName,entitlements,groups,members,externalId"]
          body: null
        response:
          status: 200
          body:
            json:
              id: group-id
              displayName: Lifecycle group
      - request:
          method: PUT
          path: /api/2.0/preview/scim/v2/Groups/group-id
          body:
            json:
              displayName: Renamed lifecycle group
              schemas:
                - urn:ietf:params:scim:schemas:core:2.0:Group
              entitlements:
                - {}
        response:
          status: 200
          body: null
      - request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups/group-id
          query:
            attributes: ["displayName,externalId,entitlements"]
          body: null
        response:
          status: 200
          body:
            json:
              id: group-id
              displayName: Renamed lifecycle group
      - request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups/group-id
          query:
            attributes: ["displayName,externalId,entitlements"]
          body: null
        response:
          status: 200
          body:
            json:
              id: group-id
              displayName: Renamed lifecycle group
    state:
      resources:
        databricks_group.this:
          attributes:
            - path: [id]
              equals: group-id
            - path: [display_name]
              equals: Renamed lifecycle group
destroy:
  calls:
    - request:
        method: GET
        path: /api/2.0/preview/scim/v2/Groups/group-id
        query:
          attributes: ["displayName,externalId,entitlements"]
        body: null
      response:
        status: 200
        body:
          json:
            id: group-id
            displayName: Renamed lifecycle group
    - request:
        method: DELETE
        path: /api/2.0/preview/scim/v2/Groups/group-id
        body: null
      response:
        status: 204
        body: null
