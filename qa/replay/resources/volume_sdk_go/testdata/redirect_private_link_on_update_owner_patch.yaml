# Runs volume/testdata/redirect_private_link_on_update_owner_patch.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same behavior.
# The volume requests and the requests that follow their redirects carry no Accept header,
# which an empty header expectation pins. Each PATCH body also carries full_name_arg, the
# full name in its path, because sdk-go serializes the path field into the body. The
# original's description:
#
# Pins a private-link login redirect on the owner PATCH of an update that also changes
# the comment. The client follows the 302 with a GET, and apply fails with the exact AWS
# PrivateLink message. No comment PATCH and no owner rollback PATCH follow, so the
# refreshed volume keeps its old owner and comment, and the next plan shows the same
# update. API responses are inferred from the private-link redirect contract, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_owner_and_comment
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_created |
      resource "databricks_volume" "this" {
        name         = "redirect_owner_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
        owner        = "data-engineers"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "redirect_owner_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "redirect_owner_volume",
                   "full_name": "main.replay.redirect_owner_volume",
                   "volume_type": "MANAGED", "comment": "first comment",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-1932",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001932"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_owner_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.redirect_owner_volume",
                   "comment": "first comment", "owner": "data-engineers"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "redirect_owner_volume",
                            "full_name": "main.replay.redirect_owner_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "owner": "data-engineers",
                            "storage_location": "s3://replay-metastore/volume-1932",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001932"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_owner_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: owner_patch_redirected_to_login_fails_with_private_link_error
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_updated |
      resource "databricks_volume" "this" {
        name         = "redirect_owner_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second comment"
        owner        = "analysts"
      }
    expect_error: 'Error: cannot update volume: The requested workspace has AWS
      PrivateLink enabled and is not accessible from the current network\. Ensure that
      AWS PrivateLink is properly configured and that your device has access to the AWS
      VPC endpoint\. For more information, see
      https://docs\.databricks\.com/en/security/network/classic/privatelink\.html\.\n'
    calls:
      - *read_created
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_owner_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.redirect_owner_volume",
                   "owner": "analysts"}
        response:
          status: 302
          headers:
            Location: /login.html?error=private-link-validation-error
          body: null
      - request:
          method: GET
          path: /login.html
          query:
            error: [private-link-validation-error]
          headers:
            Content-Type: ""
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: <html><body>Sign in</body></html>
  - name: plan_after_redirected_owner_patch_shows_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [owner]
              equals: data-engineers
            - path: [comment]
              equals: first comment
          after:
            - path: [owner]
              equals: analysts
            - path: [comment]
              equals: second comment
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.redirect_owner_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
          Accept: ""
        body: null
      response:
        status: 200
        body:
          json: {}
