# Runs
# volume_routing/testdata/provider_config_absent_workspace_id_resolved_through_me.yaml
# with databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same
# behavior. The volume POST requests carry no Accept header, which an empty header
# expectation pins. The original's description:
#
# Pins provider_config population without a provider_config block when host metadata
# has no workspace ID. After create reads the volume, the provider resolves the ID
# from the X-Databricks-Org-Id header of SCIM /Me and writes it to
# provider_config.workspace_id. Every later Terraform command starts a fresh client and
# calls /Me again: a plan without refresh calls it from CustomizeDiff, and a refresh or
# delete calls it to check the state ID against the provider's workspace before the
# volume call. API responses are inferred from the Unity Catalog and SCIM API
# contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
steps:
  - name: create_resolves_workspace_id_through_me_after_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "me_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "me_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "me_volume", "full_name": "main.replay.me_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-72",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000072"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.me_volume
          body: null
        response:
          status: 200
          body:
            json: *volume
      # provider_config population after create's read.
      - &me
        request:
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          body: null
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: "12345"
          body:
            json: {"id": "1001", "userName": "replay-admin@example.com",
                   "schemas": ["urn:ietf:params:scim:schemas:core:2.0:User"]}
      # The post-apply plan without refresh.
      - *me
      # The post-apply refresh plan.
      - *me
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: refresh_checks_state_workspace_id_through_me
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      # The plan without refresh.
      - *me
      # The refresh plan.
      - *me
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
destroy:
  calls:
    # The destroy plan's refresh.
    - *me
    - *read_volume
    # The apply.
    - *me
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.me_volume
        body: null
      response:
        status: 200
        body:
          json: {}
