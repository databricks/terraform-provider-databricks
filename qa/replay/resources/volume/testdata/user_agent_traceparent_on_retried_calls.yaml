# Pins the traceparent header on both attempts of a retried volume call. The create
# POST and the destroy DELETE each fail once with a 503 and are retried by the classic
# SDK client, and each attempt sends exactly one W3C traceparent of version 00 with
# the sampled flag and no tracestate. A pattern cannot compare values across calls, so
# TestVolumeTraceparent pins in Go that the retry carries a new trace and parent ID.
# API responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_retries_the_post_once
    config: |
      resource "databricks_volume" "this" {
        name         = "traceparent_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request: &create
          method: POST
          path: /api/2.1/unity-catalog/volumes
          matchers: &traceparent
            headers:
              traceparent: {pattern: '00-[0-9a-f]{32}-[0-9a-f]{16}-01'}
              tracestate: absent
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "traceparent_volume", "volume_type": "MANAGED"}
        response: &unavailable
          status: 503
          body:
            json: {"error_code": "TEMPORARILY_UNAVAILABLE",
                   "message": "The service is temporarily unavailable."}
      - request: *create
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "traceparent_volume",
                           "full_name": "main.replay.traceparent_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-305",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000305"}
      - &read
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.traceparent_volume
          matchers: *traceparent
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.traceparent_volume
destroy:
  calls:
    - *read
    - request: &delete
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.traceparent_volume
        matchers: *traceparent
        body: null
      response: *unavailable
    - request: *delete
      response:
        status: 200
        body:
          json: {}
