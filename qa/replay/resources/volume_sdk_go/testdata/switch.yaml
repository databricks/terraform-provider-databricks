# Switches databricks_volume between the existing client and sdk-go uc/volumes/v1. It
# creates an EXTERNAL volume with comment and owner on the existing path, refreshes and
# plans with sdk-go reads, then refreshes and plans on the existing path again, with no
# plan changes and the same state throughout. The existing GETs send
# Accept: application/json and the sdk-go GETs send no Accept header; both read the same
# full response, including fields the resource doesn't keep. API responses are inferred
# from the Unity Catalog API contract, not recorded. An empty header expectation matches
# only requests without that header.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_on_existing_path
    sdk_implementations:
      databricks_volume: classic
    config: &config |
      resource "databricks_volume" "this" {
        name             = "switch_volume"
        catalog_name     = "main"
        schema_name      = "replay"
        volume_type      = "EXTERNAL"
        storage_location = "s3://replay-bucket/volumes/switch"
        comment          = "switch comment"
        owner            = "data-engineers"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "switch_volume", "volume_type": "EXTERNAL",
                   "storage_location": "s3://replay-bucket/volumes/switch",
                   "comment": "switch comment"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "switch_volume", "full_name": "main.replay.switch_volume",
                   "volume_type": "EXTERNAL",
                   "storage_location": "s3://replay-bucket/volumes/switch",
                   "comment": "switch comment", "owner": "replay-admin@example.com",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000061"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.switch_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "switch comment", "owner": "data-engineers"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "switch_volume",
                           "full_name": "main.replay.switch_volume",
                           "volume_type": "EXTERNAL",
                           "storage_location": "s3://replay-bucket/volumes/switch",
                           "comment": "switch comment", "owner": "data-engineers",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000061",
                           "created_at": 1762905600000,
                           "created_by": "replay-admin@example.com",
                           "updated_at": 1762909200000,
                           "updated_by": "replay-admin@example.com",
                           "browse_only": false}
      - &read_existing_path
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.switch_volume
          headers:
            Accept: application/json
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read_existing_path
    state: &expected_state
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.switch_volume
            - path: [name]
              equals: switch_volume
            - path: [catalog_name]
              equals: main
            - path: [schema_name]
              equals: replay
            - path: [volume_type]
              equals: EXTERNAL
            - path: [storage_location]
              equals: s3://replay-bucket/volumes/switch
            - path: [comment]
              equals: switch comment
            - path: [owner]
              equals: data-engineers
            - path: [volume_path]
              equals: /Volumes/main/replay/switch_volume
  - name: refresh_with_sdk_go
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - &read_sdk_go
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.switch_volume
          headers:
            Accept: ""
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read_sdk_go
    state: *expected_state
  - name: plan_with_sdk_go
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_sdk_go
  - name: refresh_on_existing_path
    sdk_implementations:
      databricks_volume: classic
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_existing_path
      - *read_existing_path
    state: *expected_state
  - name: plan_on_existing_path
    sdk_implementations:
      databricks_volume: classic
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_existing_path
destroy:
  calls:
    - *read_existing_path
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.switch_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
