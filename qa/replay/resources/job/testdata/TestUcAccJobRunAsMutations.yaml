            json:
              content: "sample"
              format: "SOURCE"
              language: "PYTHON"
              overwrite: true
              path: "/Users/tester@example.com/Terraformreplay1"
          matchers:
            json:
              # The notebook embeds abspath(path.module), which changes with Terraform's working directory.
