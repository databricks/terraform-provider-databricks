# Pins a volume name with "#", which Unity Catalog allows, on sdk-go uc/volumes/v1. Like
# the existing path, sdk-go puts the full name in the URL unescaped, so "#2" becomes a URL
# fragment that is never sent: the GETs, the PATCH and the DELETE go to main.replay.raw on
# both paths, and plans have no changes. name_with_hash_drops_the_fragment.yaml pins this
# defect on the existing path. Destroy follows the last sdk-go apply, so its refresh and
# DELETE go through sdk-go. API responses are inferred from the Unity Catalog API
# contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_sdk_go
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "raw#2"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "raw#2",
                   "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "raw#2", "full_name": "main.replay.raw#2",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-71",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000071"}
      - &read
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw
          headers:
            Accept: application/json
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.raw#2
            - path: [volume_path]
              equals: /Volumes/main/replay/raw#2
  - name: plan_with_sdk_go_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read
  - name: update_comment_with_sdk_go_patches_the_same_url
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_commented |
      resource "databricks_volume" "this" {
        name         = "raw#2"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "fragment"
      }
    calls:
      - *read
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.raw
          headers:
            Accept: application/json
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "fragment"}
        response:
          status: 200
          body:
            json: &commented {"catalog_name": "main", "schema_name": "replay",
                              "name": "raw#2", "full_name": "main.replay.raw#2",
                              "volume_type": "MANAGED", "comment": "fragment",
                              "owner": "replay-admin@example.com",
                              "storage_location": "s3://replay-metastore/volume-71",
                              "metastore_id": "11111111-1111-1111-1111-111111111111",
                              "volume_id": "00000000-0000-4000-8000-000000000071"}
      - &read_commented
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw
          headers:
            Accept: application/json
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *commented
      - *read_commented
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.raw#2
            - path: [comment]
              equals: fragment
  - name: plan_on_existing_path_is_empty
    sdk_implementations:
      databricks_volume: classic
    plan_only: true
    config: *config_commented
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_commented
destroy:
  calls:
    - *read_commented
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.raw
        headers:
          Accept: application/json
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
