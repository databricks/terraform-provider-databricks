# Pins a volume name with "%", which Unity Catalog names may contain, on the existing
# path. Every call puts it in the URL as "%25": the owner PATCH after create, the
# refreshes, the rename and the DELETE. Unescaped, "%41" is decoded to "A", so the calls
# would go to main.replay.rawA, another volume's name. The ID and volume_path keep "%".
# API responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_owner_patches_the_escaped_name
    config: &config_created |
      resource "databricks_volume" "this" {
        name         = "raw%41"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "data-engineers"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "raw%41",
                   "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "raw%41",
                   "full_name": "main.replay.raw%41", "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-74",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000074"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%2541
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"owner": "data-engineers"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "raw%41", "full_name": "main.replay.raw%41",
                            "volume_type": "MANAGED", "owner": "data-engineers",
                            "storage_location": "s3://replay-metastore/volume-74",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000074"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%2541
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.raw%41
            - path: [volume_path]
              equals: /Volumes/main/replay/raw%41
  - name: plan_after_create_is_empty
    plan_only: true
    config: *config_created
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_created
  - name: rename_moves_calls_to_the_escaped_new_name
    config: &config_renamed |
      resource "databricks_volume" "this" {
        name         = "raw%42"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "data-engineers"
      }
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [name]
              equals: raw%41
          after:
            - path: [name]
              equals: raw%42
    calls:
      - *read_created
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%2541
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"new_name": "raw%42"}
        response:
          status: 200
          body:
            json: &renamed {"catalog_name": "main", "schema_name": "replay",
                            "name": "raw%42", "full_name": "main.replay.raw%42",
                            "volume_type": "MANAGED", "owner": "data-engineers",
                            "storage_location": "s3://replay-metastore/volume-74",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000074"}
      - &read_renamed
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%2542
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *renamed
      - *read_renamed
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.raw%42
            - path: [volume_path]
              equals: /Volumes/main/replay/raw%42
  - name: plan_after_rename_is_empty
    plan_only: true
    config: *config_renamed
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_renamed
destroy:
  calls:
    - *read_renamed
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.raw%2542
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
