# API responses are placeholders based on the API models, not recorded.
version: 1
host_metadata:
  cloud: AWS
  host_type: workspace
  workspace_id: '12345'
steps:
- name: grant_group_read
  config: |
    resource "databricks_group" "ds" {
      display_name = "data-scientists-replay"
    }
    resource "databricks_secret_scope" "app" {
      name = "app-replay"
    }
    resource "databricks_secret_acl" "ds_can_read_app" {
      principal  = databricks_group.ds.display_name
      permission = "READ"
      scope      = databricks_secret_scope.app.name
    }
  calls:
  - request:
      method: POST
      path: /api/2.0/secrets/scopes/create
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          scope: app-replay
          scope_backend_type: DATABRICKS
    response:
      status: 200
      body: null
  - &id001
    request:
      method: GET
      path: /api/2.0/secrets/scopes/list
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          scopes:
          - backend_type: DATABRICKS
            name: app-replay
  - request:
      method: POST
      path: /api/2.0/preview/scim/v2/Groups
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          displayName: data-scientists-replay
          entitlements:
          - {}
          schemas:
          - urn:ietf:params:scim:schemas:core:2.0:Group
    response:
      status: 200
      body:
        json:
          displayName: data-scientists-replay
          id: '83101'
          schemas:
          - urn:ietf:params:scim:schemas:core:2.0:Group
  - &id002
    request:
      method: GET
      path: /api/2.0/preview/scim/v2/Groups/83101
      query:
        attributes:
        - displayName,externalId,entitlements
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          displayName: data-scientists-replay
          id: '83101'
          schemas:
          - urn:ietf:params:scim:schemas:core:2.0:Group
  - request:
      method: POST
      path: /api/2.0/secrets/acls/put
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          permission: READ
          principal: data-scientists-replay
          scope: app-replay
    response:
      status: 200
      body: null
  - &id003
    request:
      method: GET
      path: /api/2.0/secrets/acls/get
      query:
        principal:
        - data-scientists-replay
        scope:
        - app-replay
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          permission: READ
          principal: data-scientists-replay
  - *id001
  - *id002
  - *id003
  state:
    resources:
      databricks_secret_acl.ds_can_read_app:
        attributes:
        - path:
          - principal
          equals: data-scientists-replay
        - path:
          - permission
          equals: READ
destroy:
  calls:
  - *id001
  - *id002
  - *id003
  - request:
      method: POST
      path: /api/2.0/secrets/acls/delete
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          principal: data-scientists-replay
          scope: app-replay
    response:
      status: 200
      body: null
  - request:
      method: POST
      path: /api/2.0/secrets/scopes/delete
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          scope: app-replay
    response:
      status: 200
      body: null
  - request:
      method: DELETE
      path: /api/2.0/preview/scim/v2/Groups/83101
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body: null
