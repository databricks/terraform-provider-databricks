# This journey pins a create POST that gets a 503 until retry_timeout_seconds ends. Three
# seconds fit the retry after the SDK's first backoff (1.05 to 1.75 seconds) but end
# during its second (2.05 to 2.75 seconds), so exactly two identical POSTs are sent and
# the timeout ends during the second backoff. Apply fails with the last 503's message, no
# ID is stored, and the next plan creates the volume again. API responses are inferred
# from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_post_retries_until_the_retry_timeout_ends
    config: &config |
      provider "databricks" {
        retry_timeout_seconds = 3
      }
      resource "databricks_volume" "this" {
        name         = "write_retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    expect_error: 'Error: cannot create volume: The service is temporarily
      unavailable\.\n'
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "write_retry_volume", "volume_type": "MANAGED"}
        response:
          status: 503
          body:
            json: {"error_code": "TEMPORARILY_UNAVAILABLE",
                   "message": "The service is temporarily unavailable."}
        times: 2
        min_gap: 1s
        max_gap: 3s
  # Nothing is in state, so the plan reads nothing and creates the volume.
  - name: plan_after_exhausted_create_creates_the_volume
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls: []
destroy:
  calls: []
