# Destroy pins the account-level default: a PATCH that deactivates the service principal.
destroy:
  calls:
    - request:
        method: "GET"
        path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201"
        headers:
          X-Databricks-Workspace-Id: ""
          Accept: ""
          Content-Type: ""
        body: null
      response: # Inferred API response; not recorded.
        status: 200
        body:
          json:
            schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"]
            id: "201"
            displayName: "SPN Renamed updated"
            active: true
            entitlements: []
            applicationId: "00000000-0000-4000-8000-000000000001"
    - request:
        method: "PATCH"
        path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201"
        headers:
          Content-Type: application/scim+json; charset=utf-8
          X-Databricks-Workspace-Id: ""
        body:
          json:
            schemas: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
            Operations:
              - op: "replace"
                path: "active"
                value:
                  - value: "false"
      response: # Inferred API response; not recorded.
        status: 200
        body: null
