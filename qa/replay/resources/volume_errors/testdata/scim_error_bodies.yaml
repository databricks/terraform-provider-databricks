# Pins how the classic SDK turns SCIM-shaped error bodies (schemas, detail, status and
# scimType) into diagnostics on the create POST and the refresh GET. The message is the
# scimType and the detail joined by a space, and a detail of "null" becomes "SCIM API
# Internal Error". The SDK sets the error code SCIM_<status>, which it does not map to
# an error, so the HTTP status decides what the error means: a SCIM-shaped 404 refresh
# still removes the volume from state. Bodies follow the SCIM error shape of RFC 7644
# section 3.12, not recorded responses.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_answered_scim_error_fails_with_scim_type_and_detail
    config: &config |
      resource "databricks_volume" "this" {
        name         = "scim_errors_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    expect_error: 'Error: cannot create volume: invalidValue Volume name is not valid\.\n'
    calls:
      - request: &create_request
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "scim_errors_volume", "volume_type": "MANAGED"}
        response:
          status: 400
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Volume name is not valid.", "status": "400",
                   "scimType": "invalidValue"}
  - name: create_answered_scim_null_detail_fails_with_internal_error
    config: *config
    expect_error: 'Error: cannot create volume: SCIM API Internal Error\n'
    calls:
      - request: *create_request
        response:
          status: 500
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "null", "status": "500"}
  - name: create
    config: *config
    calls:
      - request: *create_request
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "scim_errors_volume",
                            "full_name": "main.replay.scim_errors_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-171",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000171"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.scim_errors_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_answered_scim_error_fails_with_detail
    config: *config
    expect_error: 'Error: cannot read volume: User does not have READ VOLUME on Volume
      main\.replay\.scim_errors_volume\.\n'
    calls:
      - request: *read_request
        response:
          status: 403
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "User does not have READ VOLUME on Volume
                     main.replay.scim_errors_volume.",
                   "status": "403"}
  - name: refresh_answered_scim_null_detail_fails_with_scim_type_and_internal_error
    config: *config
    expect_error: 'Error: cannot read volume: invalidSyntax SCIM API Internal Error\n'
    calls:
      - request: *read_request
        response:
          status: 400
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "null", "status": "400", "scimType": "invalidSyntax"}
  - name: refresh_answered_scim_404_plans_create
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls:
      - request: *read_request
        response:
          status: 404
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Volume main.replay.scim_errors_volume does not exist.",
                   "status": "404"}
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.scim_errors_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
