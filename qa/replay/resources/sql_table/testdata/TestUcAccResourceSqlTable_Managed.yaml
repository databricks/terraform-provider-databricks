      body:
        json:
          owner: account users
    response:
      status: 200
      body:
        json:
          catalog_name: main
          cluster_keys: []
          columns:
          - name: id
            nullable: true
            type_text: int
          - name: name
            nullable: true
            type_text: string
          comment: this table is managed by terraform
          data_source_format: DELTA
          full_name: main.replay.bar
          name: bar
          owner: account users
          properties:
            something: else
            this: that
          schema_name: replay
          table_id: table-bar
          table_type: MANAGED
  - &id001
    request:
