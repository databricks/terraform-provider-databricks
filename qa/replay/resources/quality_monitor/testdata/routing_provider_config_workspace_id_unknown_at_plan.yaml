# Pins provider_config.workspace_id taken from another resource, so it is unknown at
# plan time, on an account-level provider without a provider-level workspace_id. On
# create the plan leaves workspace_id unknown without looking up a workspace client,
# and apply routes through the resolved ID. A monitor belongs to its workspace's
# metastore, so when its workspace_id becomes unknown the plan replaces it, and apply
# deletes it from the old workspace and creates it in the new one. API responses are
# inferred from the account and Quality Monitors API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_with_unknown_workspace_id
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "terraform_data" "workspace" {
        input = "12345"
      }
      resource "databricks_quality_monitor" "this" {
        table_name         = "sandbox.things.bar"
        assets_dir         = "/Shared/monitors/bar"
        output_schema_name = "sandbox.things"
        provider_config {
          workspace_id = terraform_data.workspace.output
        }
        snapshot {}
      }
    plan:
      expect: non_empty
      changes:
        databricks_quality_monitor.this:
          actions: [create]
          after:
            - path: [provider_config, 0, workspace_id]
              unknown: true
    calls:
      - &lookup_12345
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 12345,
                   "workspace_name": "replay-workspace-12345",
                   "deployment_name": "replay-workspace-12345",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/tables/sandbox.things.bar/monitor
          headers:
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"assets_dir": "/Shared/monitors/bar", "output_schema_name": "sandbox.things",
                   "snapshot": {}}
        response: &monitor_12345
          status: 200
          body:
            json: {"table_name": "sandbox.things.bar", "assets_dir": "/Shared/monitors/bar",
                   "output_schema_name": "sandbox.things", "snapshot": {},
                   "status": "MONITOR_STATUS_ACTIVE", "monitor_version": 1,
                   "dashboard_id": "dashboard-in-12345",
                   "drift_metrics_table_name": "sandbox.things.bar_drift_metrics",
                   "profile_metrics_table_name": "sandbox.things.bar_profile_metrics"}
      # The create waits for the monitor to become active.
      - &read_in_12345
        request:
          method: GET
          path: /api/2.1/unity-catalog/tables/sandbox.things.bar/monitor
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *monitor_12345
      # The post-apply plan validates the resolved workspace_id, then the refresh plan reads.
      - *lookup_12345
      - *lookup_12345
      - *read_in_12345
    state:
      resources:
        databricks_quality_monitor.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: change_to_unknown_workspace_id
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "terraform_data" "workspace" {
        input = "67890"
      }
      resource "databricks_quality_monitor" "this" {
        table_name         = "sandbox.things.bar"
        assets_dir         = "/Shared/monitors/bar"
        output_schema_name = "sandbox.things"
        provider_config {
          workspace_id = terraform_data.workspace.output
        }
        snapshot {}
      }
    plan:
      expect: non_empty
      changes:
        databricks_quality_monitor.this:
          actions: [delete, create]
          before:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
          after:
            - path: [provider_config, 0, workspace_id]
              unknown: true
    calls:
      # The plan's refresh.
      - *lookup_12345
      - *read_in_12345
      # The apply deletes the monitor from the old workspace.
      - *lookup_12345
      - request:
          method: DELETE
          path: /api/2.1/unity-catalog/tables/sandbox.things.bar/monitor
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body: null
      # It creates the monitor in the new workspace.
      - &lookup_67890
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/67890
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 67890,
                   "workspace_name": "replay-workspace-67890",
                   "deployment_name": "replay-workspace-67890",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/tables/sandbox.things.bar/monitor
          headers:
            X-Databricks-Workspace-Id: "67890"
          body:
            json: {"assets_dir": "/Shared/monitors/bar", "output_schema_name": "sandbox.things",
                   "snapshot": {}}
        response: &monitor_67890
          status: 200
          body:
            json: {"table_name": "sandbox.things.bar", "assets_dir": "/Shared/monitors/bar",
                   "output_schema_name": "sandbox.things", "snapshot": {},
                   "status": "MONITOR_STATUS_ACTIVE", "monitor_version": 1,
                   "dashboard_id": "dashboard-in-67890",
                   "drift_metrics_table_name": "sandbox.things.bar_drift_metrics",
                   "profile_metrics_table_name": "sandbox.things.bar_profile_metrics"}
      - &read_in_67890
        request:
          method: GET
          path: /api/2.1/unity-catalog/tables/sandbox.things.bar/monitor
          headers:
            X-Databricks-Workspace-Id: "67890"
          body: null
        response: *monitor_67890
      # The post-apply plan validates the resolved workspace_id, then the refresh plan reads.
      - *lookup_67890
      - *lookup_67890
      - *read_in_67890
    state:
      resources:
        databricks_quality_monitor.this:
          attributes:
            - path: [dashboard_id]
              equals: dashboard-in-67890
            - path: [provider_config, 0, workspace_id]
              equals: "67890"
destroy:
  calls:
    - *lookup_67890
    - *read_in_67890
    - *lookup_67890
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/tables/sandbox.things.bar/monitor
        headers:
          X-Databricks-Workspace-Id: "67890"
        body: null
      response:
        status: 200
        body: null
