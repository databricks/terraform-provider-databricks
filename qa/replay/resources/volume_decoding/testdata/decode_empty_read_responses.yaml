# Pins a refresh GET answered 200 with {} and with JSON null. Both decode to an empty volume
# without an error. The required catalog_name, schema_name, name and volume_type are
# blanked in the refreshed state, the optional comment and owner keep their old values, the
# ID is kept and volume_path becomes /Volumes/. The next plan replaces the volume. The
# existing response_decoding_errors journey pins a GET answered with no body. API
# responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_volume" "this" {
        name         = "empty_read_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "empty_read_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "empty_read_volume",
                            "full_name": "main.replay.empty_read_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-197"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.empty_read_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_answered_200_with_empty_object_blanks_required_fields_and_plans_replacement
    plan_only: true
    config: *config
    plan: &replacement_plan
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete, create]
          before:
            - path: [catalog_name]
              equals: ""
            - path: [schema_name]
              equals: ""
            - path: [name]
              equals: ""
            - path: [volume_type]
              equals: ""
          after:
            - path: [catalog_name]
              equals: main
            - path: [volume_path]
              unknown: true
    state: &blanked_state
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.empty_read_volume
            - path: [catalog_name]
              equals: ""
            - path: [schema_name]
              equals: ""
            - path: [name]
              equals: ""
            - path: [volume_type]
              equals: ""
            - path: [comment]
              equals: first comment
            - path: [owner]
              equals: replay-admin@example.com
            - path: [storage_location]
              equals: s3://replay-metastore/volume-197
            - path: [volume_path]
              equals: /Volumes/
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {}
  - name: refresh_answered_200_with_json_null_blanks_required_fields_and_plans_replacement
    plan_only: true
    config: *config
    plan: *replacement_plan
    state: *blanked_state
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: null
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.empty_read_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
