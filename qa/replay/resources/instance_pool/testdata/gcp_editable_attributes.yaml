version: 1
host_metadata:
  host_type: workspace
  cloud: GCP
  workspace_id: '12345'
steps:
  - name: create_with_fallback
    config: |
      resource "databricks_instance_pool" "this" {
        instance_pool_name                    = "editable-pool"
        node_type_id                          = "n1-standard-4"
        idle_instance_autotermination_minutes = 10
        max_capacity                          = 1
        gcp_attributes {
          gcp_availability = "PREEMPTIBLE_WITH_FALLBACK_GCP"
          zone_id          = "auto"
          local_ssd_count  = 1
        }
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/instance-pools/create
          body:
            json:
              instance_pool_name: editable-pool
              node_type_id: n1-standard-4
              idle_instance_autotermination_minutes: 10
              max_capacity: 1
              enable_elastic_disk: true
              custom_tags: null
              gcp_attributes: &id001
                gcp_availability: PREEMPTIBLE_WITH_FALLBACK_GCP
                zone_id: auto
                local_ssd_count: 1
        response:
          status: 200
          body:
            json:
              instance_pool_id: pool-1
      - &id002
        request:
          method: GET
          path: /api/2.0/instance-pools/get
          query:
            instance_pool_id:
              - pool-1
          body: null
        response:
