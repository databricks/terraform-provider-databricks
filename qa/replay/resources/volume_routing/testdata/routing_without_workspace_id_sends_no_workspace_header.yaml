# This journey pins that a workspace-level provider without any known workspace ID, from
# its configuration or host metadata, sends no X-Databricks-Workspace-Id header on any
# call: not on the volume calls, and not on the SCIM /Me calls that resolve the ID into
# state after create and check it in each later command. API responses are inferred
# from the Unity Catalog and SCIM API contracts, not recorded.
version: 1
enforce_call_order: true
provider_host: workspace
hosts:
  workspace:
    url: https://replay-workspace-12345.cloud.databricks.com
host_metadata:
  host_type: workspace
  cloud: AWS
steps:
  - name: create_with_owner_sends_no_workspace_header
    config: |
      resource "databricks_volume" "this" {
        name         = "routing_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "data-engineers"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
          matchers: &no_workspace_header
            headers:
              X-Databricks-Workspace-Id: absent
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "routing_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "routing_volume", "full_name": "main.replay.routing_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-1920",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001920"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.routing_volume
          headers:
            Content-Type: application/json
          matchers: *no_workspace_header
          body:
            json: {"owner": "data-engineers"}
        response: &volume_data_engineers
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "routing_volume", "full_name": "main.replay.routing_volume",
                   "volume_type": "MANAGED", "owner": "data-engineers",
                   "storage_location": "s3://replay-metastore/volume-1920",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001920"}
      - &read_data_engineers
        request: &read
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.routing_volume
          matchers: *no_workspace_header
          body: null
        response: *volume_data_engineers
      # provider_config population after create's read.
      - &me
        request:
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          matchers: *no_workspace_header
          body: null
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: "12345"
          body:
            json: {"id": "1001", "userName": "replay-admin@example.com",
                   "schemas": ["urn:ietf:params:scim:schemas:core:2.0:User"]}
      # The post-apply plan without refresh.
      - *me
      # The post-apply refresh plan.
      - *me
      - *read_data_engineers
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: update_owner_and_comment_sends_no_workspace_header
    config: |
      resource "databricks_volume" "this" {
        name         = "routing_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "data-stewards"
        comment      = "routed comment"
      }
    calls:
      - *me
      - *read_data_engineers
      - *me
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.routing_volume
          headers:
            Content-Type: application/json
          matchers: *no_workspace_header
          body:
            json: {"owner": "data-stewards"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "routing_volume", "full_name": "main.replay.routing_volume",
                   "volume_type": "MANAGED", "owner": "data-stewards",
                   "storage_location": "s3://replay-metastore/volume-1920",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001920"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.routing_volume
          headers:
            Content-Type: application/json
          matchers: *no_workspace_header
          body:
            json: {"comment": "routed comment"}
        response: &volume_data_stewards
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "routing_volume", "full_name": "main.replay.routing_volume",
                   "volume_type": "MANAGED", "owner": "data-stewards",
                   "comment": "routed comment",
                   "storage_location": "s3://replay-metastore/volume-1920",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001920"}
      - &read_data_stewards
        request: *read
        response: *volume_data_stewards
      - *me
      - *me
      - *read_data_stewards
destroy:
  calls:
    - *me
    - *read_data_stewards
    - *me
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.routing_volume
        matchers: *no_workspace_header
        body: null
      response:
        status: 200
        body:
          json: {}
