# Runs volume/testdata/TestUcAccVolumesResourceWithInitialOwnerAWSFullLifecycle.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same behavior.
# The volume POST, GET and PATCH requests carry no Accept header, which an empty header
# expectation pins. Each PATCH body also carries full_name_arg, the full name in its path,
# because sdk-go serializes the path field into the body. The original's description:
#
# API responses are inferred from the scenarios and API models, not recorded.
# Volume requests pin Content-Type and X-Databricks-Workspace-Id, and each apply is
# followed by a no-op plan. Calls stay unordered because Terraform handles the
# independent schema and storage credential concurrently.
version: 1
host_metadata: # Dummy host metadata.
  host_type: "workspace"
  cloud: "AWS"
  workspace_id: "12345"
steps:
  - name: "create"
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_create |
      resource "databricks_schema" "this" {
        name         = "schema-replay"
        catalog_name = "main"
      }

      resource "databricks_storage_credential" "external" {
        name = "cred-replay"
        aws_iam_role {
          role_arn = "arn:aws:iam::123456789012:role/replay-storage"
        }
        comment = "Managed by TF"
      }

      resource "databricks_external_location" "some" {
        name            = "external-replay"
        url             = "s3://replay-bucket/somepath-replay"
        credential_name = databricks_storage_credential.external.id
        comment         = "Managed by TF"
      }
      resource "databricks_volume" "this" {
        name             = "name-abc"
        comment          = "comment-abc"
        owner            = "account users"
        catalog_name     = "main"
        schema_name      = databricks_schema.this.name
        volume_type      = "EXTERNAL"
        storage_location = databricks_external_location.some.url
      }
    calls:
      - request:
          method: "POST"
          path: "/api/2.1/unity-catalog/schemas"
          body:
            json:
              catalog_name: "main"
              name: "schema-replay"
        response: &response_1 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              catalog_name: "main"
              enable_predictive_optimization: "INHERIT"
              full_name: "main.schema-replay"
              metastore_id: "11111111-1111-1111-1111-111111111111"
              name: "schema-replay"
              owner: "replay-admin"
              schema_id: "22222222-2222-4222-8222-000000000001"
      - &get_1
        request: {method: "GET", path: "/api/2.1/unity-catalog/schemas/main.schema-replay", body: null}
        response: *response_1
      - request:
          method: "POST"
          path: "/api/2.1/unity-catalog/storage-credentials"
          body:
            json:
              aws_iam_role:
                role_arn: "arn:aws:iam::123456789012:role/replay-storage"
              comment: "Managed by TF"
              name: "cred-replay"
        response: &response_2 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              aws_iam_role:
                external_id: "replay-external"
                role_arn: "arn:aws:iam::123456789012:role/replay-storage"
                unity_catalog_iam_arn: "arn:aws:iam::999999999999:role/unity-catalog"
              comment: "Managed by TF"
              id: "33333333-3333-3333-3333-333333333333"
              isolation_mode: "ISOLATION_MODE_OPEN"
              metastore_id: "11111111-1111-1111-1111-111111111111"
              name: "cred-replay"
              owner: "replay-admin"
      - &get_2
        request: {method: "GET", path: "/api/2.1/unity-catalog/storage-credentials/cred-replay", body: null}
        response: *response_2
      - request:
          method: "POST"
          path: "/api/2.1/unity-catalog/external-locations"
          body:
            json:
              comment: "Managed by TF"
              credential_name: "cred-replay"
              name: "external-replay"
              url: "s3://replay-bucket/somepath-replay"
        response: &response_3 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              comment: "Managed by TF"
              credential_name: "cred-replay"
              metastore_id: "11111111-1111-1111-1111-111111111111"
              name: "external-replay"
              owner: "replay-admin"
              url: "s3://replay-bucket/somepath-replay"
      - &get_3
        request: {method: "GET", path: "/api/2.1/unity-catalog/external-locations/external-replay", body: null}
        response: *response_3
      - request:
          method: "POST"
          path: "/api/2.1/unity-catalog/volumes"
          headers:
            Content-Type: "application/json"
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json:
              catalog_name: "main"
              comment: "comment-abc"
              name: "name-abc"
              schema_name: "schema-replay"
              storage_location: "s3://replay-bucket/somepath-replay"
              volume_type: "EXTERNAL"
        response: &response_4 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              catalog_name: "main"
              comment: "comment-abc"
              full_name: "main.schema-replay.name-abc"
              metastore_id: "11111111-1111-1111-1111-111111111111"
              name: "name-abc"
              owner: "replay-admin"
              schema_name: "schema-replay"
              storage_location: "s3://replay-bucket/somepath-replay"
              volume_id: "volume-1"
              volume_type: "EXTERNAL"
      - request:
          method: "PATCH"
          path: "/api/2.1/unity-catalog/volumes/main.schema-replay.name-abc"
          headers:
            Content-Type: "application/json"
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json:
              full_name_arg: "main.schema-replay.name-abc"
              comment: "comment-abc"
              owner: "account users"
        response: &response_5 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              catalog_name: "main"
              comment: "comment-abc"
              full_name: "main.schema-replay.name-abc"
              metastore_id: "11111111-1111-1111-1111-111111111111"
              name: "name-abc"
              owner: "account users"
              schema_name: "schema-replay"
              storage_location: "s3://replay-bucket/somepath-replay"
              volume_id: "volume-1"
              volume_type: "EXTERNAL"
      - &get_4
        request:
          method: "GET"
          path: "/api/2.1/unity-catalog/volumes/main.schema-replay.name-abc"
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response: *response_5
      - *get_1
      - *get_2
      - *get_3
      - *get_4
  - name: "plan_after_create_is_empty"
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_create
    plan:
      expect: empty
      changes: {}
    calls:
      - *get_1
      - *get_2
      - *get_3
      - *get_4
  - name: "update_owner"
    sdk_implementations:
