# Runs volume/testdata/name_with_percent_fails_to_build_the_url.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same requests
# and behavior. The original's description:
#
# Pins a known defect: the refresh GET for a volume name with a "%" that doesn't start a
# valid escape. The classic client puts the full name in the path unescaped, so building
# the request fails with the exact URL-parse error and nothing is sent. Importing the
# full name is the only way replay can reach that GET: a created volume could never be
# refreshed, so the mandatory destroy would fail. The PATCH and the DELETE are pinned by
# TestVolumeUpdateWithPercentInNameFailsBeforeThePatch and
# TestVolumeDeleteWithPercentInNameFailsBeforeTheDelete in the catalog package. The
# planned existing-path escaping fix is expected to make this name work; update this
# journey and those tests with it.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: import_by_full_name_with_percent_fails_before_the_get
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "50%_raw"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    import:
      resource: databricks_volume.this
      id: main.replay.50%_raw
      persist: false
    expect_error: 'Error: cannot read volume: failed creating new request: parse
      "/api/2.1/unity-catalog/volumes/main\.replay\.50%_raw\?": invalid URL escape
      "%_r"\n'
    calls: []
destroy:
  calls: []
