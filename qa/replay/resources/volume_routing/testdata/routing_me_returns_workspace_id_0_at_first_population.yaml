# Pins SCIM /Me answering with X-Databricks-Org-Id 0 when create first populates
# provider_config, on a workspace-level provider whose host metadata has no workspace
# ID and without a provider_config block. The volume is created and read, then apply
# fails with the error for workspace ID 0 and Terraform keeps the volume in state as
# tainted, without a provider_config.workspace_id. While /Me keeps returning 0, the
# next plan's refresh reads the volume through the provider's workspace and fails the
# same way. Once /Me returns the real ID, the refresh stores it and the plan replaces
# the tainted volume. API responses are inferred from the Unity Catalog and SCIM API
# contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
steps:
  - name: create_fails_when_me_returns_workspace_id_0
    config: &config |
      resource "databricks_volume" "this" {
        name         = "me_zero_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    expect_error: 'cannot populate provider_config for volume: failed to resolve
      workspace_id: failed to get the workspace_id: SCIM /Me returned workspace ID 0 in
      the X-Databricks-Org-Id header'
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "me_zero_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "me_zero_volume",
                           "full_name": "main.replay.me_zero_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1909",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001909"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.me_zero_volume
          body: null
        response:
          status: 200
          body:
            json: *volume
      # provider_config population after create's read.
      - &me_zero
        request: &me_request
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          body: null
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: "0"
          body:
            json: &me_body {"id": "1001", "userName": "replay-admin@example.com",
                            "schemas": ["urn:ietf:params:scim:schemas:core:2.0:User"]}
  - name: next_plan_while_me_returns_0
    config: *config
    expect_error: 'Error running pre-apply plan: exit status 1\s+Error: cannot populate
      provider_config for volume: failed to resolve workspace_id: failed to get the
      workspace_id: SCIM /Me returned workspace ID 0 in the X-Databricks-Org-Id header'
    calls:
      # The refresh reads the volume without a workspace_id check, because state has
      # none, then populates provider_config.
      - *read_volume
      - *me_zero
  - name: next_plan_after_me_recovers
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete, create]
    calls:
      - *read_volume
      - &me
        request: *me_request
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: "12345"
          body:
            json: *me_body
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
destroy:
  calls:
    # The destroy plan's refresh.
    - *read_volume
    - *me
    # The apply.
    - *me
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.me_zero_volume
        body: null
      response:
        status: 200
        body:
          json: {}
