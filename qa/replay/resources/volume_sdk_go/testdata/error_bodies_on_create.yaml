# Runs volume_errors/testdata/error_bodies_on_create.yaml with databricks_volume on sdk-go
# uc/volumes/v1 in every step, and expects the same behavior. The volume POST request
# carries no Accept header, which an empty header expectation pins. The original's
# description:
#
# Pins how the classic SDK turns create POST error bodies into diagnostics. A failed
# POST leaves nothing in state, so each step plans the create again. API responses are
# inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_answered_404_with_empty_body_fails_with_status_text
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "create_errors_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    expect_error: 'Error: cannot create volume: Not Found\n'
    calls:
      - request: &create_request
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "create_errors_volume", "volume_type": "MANAGED"}
        response:
          status: 404
          body: null
  - name: create_answered_500_with_empty_body_fails_with_status_text
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: Internal Server Error\n'
    calls:
      - request: *create_request
        response:
          status: 500
          body: null
  - name: create_answered_html_fails_with_pre_message
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: Request processing failed\n'
    calls:
      - request: *create_request
        response:
          status: 500
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: "<html><head><title>Error 500</title></head><body><h2>HTTP ERROR
              500</h2><pre>Request processing failed.</pre></body></html>"
  - name: create_answered_plain_text_error_code_fails_with_message
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: Schema main\.replay is being deleted\.\n'
    calls:
      - request: *create_request
        response:
          status: 400
          body:
            text: "INVALID_STATE: Schema main.replay is being deleted."
  - name: create_answered_api_1_2_error_fails_with_error_field
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: Volume creation failed\.\n'
    calls:
      - request: *create_request
        response:
          status: 500
          body:
            json: {"error": "Volume creation failed."}
  - name: create_answered_integer_error_code_fails_with_message
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: Malformed volume request\.\n'
    calls:
      - request: *create_request
        response:
          status: 400
          body:
            json: {"error_code": 400, "message": "Malformed volume request."}
  - name: create_answered_error_details_fails_with_message_only
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: Volume name is not valid\.\n'
    calls:
      - request: *create_request
        response:
          status: 400
          body:
            json: {"error_code": "INVALID_PARAMETER_VALUE",
                   "message": "Volume name is not valid.",
                   "details": [{"@type": "type.googleapis.com/google.rpc.ErrorInfo",
                                "reason": "INVALID_VOLUME_NAME",
                                "domain": "unity-catalog.databricks.com",
                                "metadata": {"volume": "create_errors_volume"}},
                               {"@type": "type.googleapis.com/google.rpc.RetryInfo",
                                "retry_delay": "1s"}]}
  - name: create_answered_non_json_404_fails_with_body
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: 404 page not found\n'
    calls:
      - request: *create_request
        response:
          status: 404
          body:
            text: 404 page not found
  - name: create_answered_unparseable_json_fails_with_raw_body
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot create volume: \{"error_code": "INTERNAL_ERROR",
      "message": "Volume creation\n'
    calls:
      - request: *create_request
        response:
          status: 500
          headers:
            Content-Type: application/json
          body:
            text: '{"error_code": "INTERNAL_ERROR", "message": "Volume creation'
  - name: plan_after_failed_creates_plans_create
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls: []
destroy:
  calls: []
