# Runs volume_updates/testdata/update_shape_owner_change_and_clear_comment.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same requests
# and behavior. The original's description:
#
# Pins an owner change together with a cleared comment. The owner PATCH carries only
# owner; the PATCH after it carries only the forced "comment": "". API responses are
# inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_owner_and_comment
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "owner_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
        owner        = "data-engineers"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "owner_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "owner_volume", "full_name": "main.replay.owner_volume",
                   "volume_type": "MANAGED", "comment": "first comment",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-18907",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000018907"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "first comment", "owner": "data-engineers"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "owner_volume",
                            "full_name": "main.replay.owner_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "owner": "data-engineers",
                            "storage_location": "s3://replay-metastore/volume-18907",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000018907"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: owner_patch_then_forced_empty_comment_patch
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_updated |
      resource "databricks_volume" "this" {
        name         = "owner_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "analysts"
      }
    calls:
      - *read_created
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"owner": "analysts"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "owner_volume", "full_name": "main.replay.owner_volume",
                   "volume_type": "MANAGED", "comment": "first comment",
                   "owner": "analysts",
                   "storage_location": "s3://replay-metastore/volume-18907",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000018907"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": ""}
        response:
          status: 200
          body:
            json: &updated {"catalog_name": "main", "schema_name": "replay",
                            "name": "owner_volume",
                            "full_name": "main.replay.owner_volume",
                            "volume_type": "MANAGED", "owner": "analysts",
                            "storage_location": "s3://replay-metastore/volume-18907",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000018907"}
      - &read_updated
        request: *read_request
        response:
          status: 200
          body:
            json: *updated
      - *read_updated
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [owner]
              equals: analysts
            - path: [comment]
              equals: ""
  - name: plan_after_update_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_updated
destroy:
  calls:
    - *read_updated
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.owner_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
