# Engine regression: expected errors must allow later steps and cleanup.
version: 1
host_metadata:
  workspace_id: "12345"
steps:
  - name: reject_reserved_name
    config: |
      resource "databricks_group" "this" {
        display_name = "admins"
      }
    # SDKv2's StringNotInSlice rejects the reserved names "users" and "admins"
    # during local schema validation, before any HTTP request.
    expect_error: 'expected display_name to not be any of'
    calls: []
  - name: create
    config: |
      resource "databricks_group" "this" {
        display_name = "Example group"
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/preview/scim/v2/Groups
          body:
            json:
              displayName: Example group
              schemas: [urn:ietf:params:scim:schemas:core:2.0:Group]
              entitlements: [{}]
        response:
          status: 201
          body:
            json:
              id: group-id
              displayName: Example group
      - request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups/group-id
          query:
            attributes: ["displayName,externalId,entitlements"]
          body: null
        response:
          status: 200
          body:
            json:
              id: group-id
              displayName: Example group
      - request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups/group-id
          query:
            attributes: ["displayName,externalId,entitlements"]
          body: null
        response:
          status: 200
          body:
            json:
              id: group-id
              displayName: Example group
  - name: reject_reserved_update
    config: |
      resource "databricks_group" "this" {
        display_name = "users"
      }
    expect_error: 'expected display_name to not be any of'
    calls: []
destroy:
  calls:
    - request:
        method: GET
        path: /api/2.0/preview/scim/v2/Groups/group-id
        query:
          attributes: ["displayName,externalId,entitlements"]
        body: null
      response:
        status: 200
        body:
          json:
            id: group-id
            displayName: Example group
    - request:
        method: DELETE
        path: /api/2.0/preview/scim/v2/Groups/group-id
        body: null
      response:
        status: 204
        body: null
