# This journey pins an explicit oauth-m2m refresh whose token endpoint rejects the client
# with a 401. The token request fails in the GET's request visitor, which doesn't retry
# it, so the refresh fails before the GET is sent. The volume stays in state, so the
# next plan, with a token again, is empty. API responses are inferred from the OAuth
# and Unity Catalog API contracts, not recorded.
version: 1
enforce_call_order: true
provider_host: workspace
hosts:
  workspace:
    url: https://replay-workspace-12345.cloud.databricks.com
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
  oidc_endpoint: https://replay-workspace-12345.cloud.databricks.com/oidc
auth:
  type: oauth-m2m
  client_id: replay-sp
  client_secret: replay-secret
steps:
  - name: create
    config: |
      resource "databricks_volume" "this" {
        name         = "auth_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - &discovery
        request:
          method: GET
          path: /oidc/.well-known/oauth-authorization-server
          matchers:
            headers:
              Authorization: absent
              Metadata: absent
              X-Databricks-Azure-Sp-Management-Token: absent
              X-Databricks-Azure-Workspace-Resource-Id: absent
              X-Databricks-Gcp-Sa-Access-Token: absent
          body: null
        response:
          status: 200
          body:
            json: {"authorization_endpoint": "https://replay-workspace-12345.cloud.databricks.com/oidc/v1/authorize",
                   "token_endpoint": "https://replay-workspace-12345.cloud.databricks.com/oidc/v1/token"}
      - &token
        request: &token_request
          method: POST
          path: /oidc/v1/token
          headers:
            Authorization: Basic cmVwbGF5LXNwOnJlcGxheS1zZWNyZXQ=
          matchers: &no_cloud_credentials
            headers:
              Metadata: absent
              X-Databricks-Azure-Sp-Management-Token: absent
              X-Databricks-Azure-Workspace-Resource-Id: absent
              X-Databricks-Gcp-Sa-Access-Token: absent
          body:
            text: grant_type=client_credentials&scope=all-apis
        response: &token_issued
          status: 200
          body:
            json: {"access_token": "m2m-token", "token_type": "Bearer",
                   "expires_in": 3600}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Authorization: Bearer m2m-token
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          matchers: &bearer_m2m_token
            headers:
              Metadata: absent
              X-Databricks-Azure-Sp-Management-Token: absent
              X-Databricks-Azure-Workspace-Resource-Id: absent
              X-Databricks-Gcp-Sa-Access-Token: absent
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "auth_volume", "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "auth_volume", "full_name": "main.replay.auth_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-199",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000199"}
      - &read_volume
        request: &read
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.auth_volume
          headers:
            Authorization: Bearer m2m-token
            X-Databricks-Workspace-Id: "12345"
          matchers: *bearer_m2m_token
          body: null
        response: *volume
      # The post-apply plan configures a new provider, which fetches its own token.
      - *discovery
      - *token
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.auth_volume
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: refresh_fails_when_the_token_endpoint_rejects_the_client
    config: &config |
      resource "databricks_volume" "this" {
        name         = "auth_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    expect_error: 'Error: cannot read volume: failed during request visitor: error
      getting token: Post
      "https://replay-workspace-12345\.cloud\.databricks\.com/oidc/v1/token":
      \{"error":"invalid_client","error_description":"Bad secret"\}\n'
    calls:
      - *discovery
      - request: *token_request
        response:
          status: 401
          body:
            json: {"error": "invalid_client", "error_description": "Bad secret"}
  - name: plan_after_failed_refresh_keeps_the_volume
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.auth_volume
    calls:
      - *discovery
      - *token
      - *read_volume
destroy:
  calls:
    # The refresh, then the destroy.
    - *discovery
    - *token
    - *read_volume
    - *discovery
    - *token
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.auth_volume
        headers:
          Authorization: Bearer m2m-token
          X-Databricks-Workspace-Id: "12345"
        matchers: *bearer_m2m_token
        body: null
      response:
        status: 200
        body:
          json: {}
