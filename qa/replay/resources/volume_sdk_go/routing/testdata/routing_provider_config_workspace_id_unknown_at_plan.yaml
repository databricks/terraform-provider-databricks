# Runs volume_routing/testdata/routing_provider_config_workspace_id_unknown_at_plan.yaml
# with databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same
# requests and behavior. The original's description:
#
# Pins provider_config.workspace_id taken from another resource, so it is unknown at
# plan time, on an account-level provider without a provider-level workspace_id. On
# create the planned workspace_id is unknown, and apply looks up and routes through the
# resolved ID and stores it. When an existing volume's workspace_id becomes unknown,
# CustomizeDiff treats the block as absent: it calls SCIM /Me on the account host to
# find a fallback, and the plan fails, after the refresh through the old workspace,
# with the error for a removed workspace_id. API responses are inferred from the
# account, Unity Catalog and SCIM API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_with_unknown_workspace_id
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "terraform_data" "workspace" {
        input = "12345"
      }
      resource "databricks_volume" "this" {
        name         = "unknown_ws_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = terraform_data.workspace.output
        }
      }
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
          after:
            - path: [provider_config, 0, workspace_id]
              unknown: true
    calls:
      - &lookup_12345
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 12345,
                   "workspace_name": "replay-workspace-12345",
                   "deployment_name": "replay-workspace-12345",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "unknown_ws_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "unknown_ws_volume",
                           "full_name": "main.replay.unknown_ws_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1906",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001906"}
      - &read_in_12345
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.unknown_ws_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *lookup_12345
      - *read_in_12345
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: change_to_unknown_workspace_id
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "terraform_data" "workspace" {
        input = "67890"
      }
      resource "databricks_volume" "this" {
        name         = "unknown_ws_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = terraform_data.workspace.output
        }
      }
    expect_error: 'Error: managing a workspace-level resource requires a workspace_id,
      but the previously configured workspace_id was removed'
    calls:
      # The plan's refresh.
      - *lookup_12345
      - *read_in_12345
      # CustomizeDiff looks for a fallback workspace ID on the account host.
      - request:
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          body: null
        response:
          status: 404
          body:
            json: {"error_code": "ENDPOINT_NOT_FOUND",
                   "message": "No API found for 'GET /preview/scim/v2/Me'"}
destroy:
  calls:
    - *lookup_12345
    - *read_in_12345
    - *lookup_12345
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.unknown_ws_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
