# An integration created without token_access_policy. The API returns its default
# policy on GET (checked against a live account), which must not show up as a diff.
# API responses are inferred from the scenarios and API models, not recorded.
version: 1
host_metadata: # Dummy host metadata.
  host_type: "account"
  cloud: "AWS"
  account_id: "replay-account"
steps:
  - name: "create"
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_custom_app_integration" "this" {
        name          = "tf-replay-app-integration"
        redirect_urls = ["https://example.com"]
        scopes        = ["all-apis", "sql"]
      }
    calls:
      - request:
          method: "POST"
          path: "/api/2.0/accounts/replay-account/oauth2/custom-app-integrations"
          body:
            json:
              name: "tf-replay-app-integration"
              redirect_urls: ["https://example.com"]
              scopes: ["all-apis", "sql"]
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              client_id: "client-1"
              client_secret: "placeholder-secret"
              integration_id: "integration-1"
      - &get_1
        request:
          method: "GET"
          path: "/api/2.0/accounts/replay-account/oauth2/custom-app-integrations/integration-1"
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              client_id: "client-1"
              create_time: 1700000000000
              created_by: 100
              integration_id: "integration-1"
              name: "tf-replay-app-integration"
              redirect_urls: ["https://example.com"]
              scopes: ["all-apis", "sql"]
              token_access_policy:
                access_token_ttl_in_minutes: 60
                refresh_token_ttl_in_minutes: 10080
                enable_single_use_refresh_tokens: false
                absolute_session_lifetime_in_minutes: 129600
      - *get_1
destroy:
  calls:
    - *get_1
    - request:
        method: "DELETE"
        path: "/api/2.0/accounts/replay-account/oauth2/custom-app-integrations/integration-1"
        body: null
      response: # Inferred API response; not recorded.
        status: 200
        body: null
