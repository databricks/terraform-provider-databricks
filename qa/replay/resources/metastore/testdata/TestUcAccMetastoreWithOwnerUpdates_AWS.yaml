# API responses are placeholders based on the API models, not recorded.
version: 1
host_metadata:
  account_id: replay-account
  cloud: AWS
  host_type: account
steps:
- name: create
  config: |
    provider "databricks" {
      account_id = "replay-account"
    }
    resource "databricks_metastore" "this" {
      name          = "metastore-replay"
      owner         = "account users"
      force_destroy = true
      region        = "us-east-1"
      storage_root  = "s3://replay-bucket/test-1"
    }
  calls:
  - request:
      method: POST
      path: /api/2.0/accounts/replay-account/metastores
      body:
        json:
          metastore_info:
            name: metastore-replay
            region: us-east-1
            storage_root: s3://replay-bucket/test-1
    response:
      status: 200
      body:
        json:
          metastore_info:
            delta_sharing_recipient_token_lifetime_in_seconds: 31536000
            metastore_id: 11111111-1111-4111-8111-000000000001
            name: metastore-replay
            owner: account users
            region: us-east-1
            storage_root: s3://replay-bucket/test-1
  - request:
      method: PUT
      path: /api/2.0/accounts/replay-account/metastores/11111111-1111-4111-8111-000000000001
