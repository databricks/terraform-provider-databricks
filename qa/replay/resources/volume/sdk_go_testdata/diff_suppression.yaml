# Runs diff_suppression with reads through sdk-go uc/volumes/v1. A different letter case
# in name, catalog_name or schema_name, and a trailing slash in storage_location, each
# plan no changes. The GETs carry no Accept header, which the existing client sends.
# Writes stay on the existing path. API responses are inferred from the Unity Catalog API
# contract, not recorded. An empty header expectation matches only requests without that
# header.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_external
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name             = "suppressed_volume"
        catalog_name     = "main"
        schema_name      = "replay"
        volume_type      = "EXTERNAL"
        storage_location = "s3://replay-bucket/volumes/suppressed"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "suppressed_volume", "volume_type": "EXTERNAL",
                   "storage_location": "s3://replay-bucket/volumes/suppressed"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "suppressed_volume",
                           "full_name": "main.replay.suppressed_volume",
                           "volume_type": "EXTERNAL", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-bucket/volumes/suppressed",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000021"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.suppressed_volume
          headers:
            Accept: ""
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read_volume
  - name: plan_after_create_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_volume
  - name: name_in_different_case_plans_no_changes
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: |
      resource "databricks_volume" "this" {
        name             = "Suppressed_Volume"
        catalog_name     = "main"
        schema_name      = "replay"
        volume_type      = "EXTERNAL"
        storage_location = "s3://replay-bucket/volumes/suppressed"
      }
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_volume
  - name: catalog_name_in_different_case_plans_no_changes
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: |
      resource "databricks_volume" "this" {
        name             = "suppressed_volume"
        catalog_name     = "MAIN"
        schema_name      = "replay"
        volume_type      = "EXTERNAL"
        storage_location = "s3://replay-bucket/volumes/suppressed"
      }
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_volume
  - name: schema_name_in_different_case_plans_no_changes
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: |
      resource "databricks_volume" "this" {
        name             = "suppressed_volume"
        catalog_name     = "main"
        schema_name      = "Replay"
        volume_type      = "EXTERNAL"
        storage_location = "s3://replay-bucket/volumes/suppressed"
      }
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_volume
  - name: storage_location_with_trailing_slash_plans_no_changes
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: |
      resource "databricks_volume" "this" {
        name             = "suppressed_volume"
        catalog_name     = "main"
        schema_name      = "replay"
        volume_type      = "EXTERNAL"
        storage_location = "s3://replay-bucket/volumes/suppressed/"
      }
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_volume
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.suppressed_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
