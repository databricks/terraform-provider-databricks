                  is_default: true
                  allowed_compute_products:
                    lakebase: {}
                - compute_policy_id: 11111111-1111-4111-8111-000000000002
                  display_name: Default Automated Compute
                  is_default: true
                  allowed_compute_products:
                    automated: {}
      - request:
          method: PUT
          path: /api/2.0/permissions/serverless-compute/11111111-1111-4111-8111-000000000001
          body:
