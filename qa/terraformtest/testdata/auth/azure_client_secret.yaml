# Azure client secret auth asks Azure AD for two tokens, one for Azure Databricks
# and one for Azure management, and sends both with the workspace's resource ID.
# Azure AD needs a named host, and the provider host is an Azure workspace so that
# the SDK takes the Azure public cloud's login endpoint from its DNS zone.
version: 1
provider_host: workspace
hosts:
  workspace:
    url: https://adb-12345.6.azuredatabricks.net
  aad:
    url: https://login.microsoftonline.com
host_metadata:
  host_type: workspace
  cloud: Azure
  workspace_id: "12345"
auth:
  type: azure-client-secret
  azure_tenant_id: replay-tenant
  azure_client_id: replay-azure-sp
  azure_client_secret: replay-azure-secret
  azure_workspace_resource_id: /subscriptions/replay-subscription/resourceGroups/replay-group/providers/Microsoft.Databricks/workspaces/replay-workspace
steps:
  - name: create
    config: |
      resource "databricks_directory" "this" {
        path = "/Shared/replay-auth"
      }
    calls:
      - &databricks_token
        request:
          method: POST
          host: aad
          path: /replay-tenant/oauth2/token
          headers:
            Authorization: Basic cmVwbGF5LWF6dXJlLXNwOnJlcGxheS1henVyZS1zZWNyZXQ=
          body:
            text: grant_type=client_credentials&resource=2ff814a6-3304-4ab8-85cb-cd0e6f879c1d
        response:
          status: 200
          body:
            json:
              access_token: aad-token
              token_type: Bearer
              expires_in: 3600
      - &management_token
        request:
          method: POST
          host: aad
          path: /replay-tenant/oauth2/token
          headers:
            Authorization: Basic cmVwbGF5LWF6dXJlLXNwOnJlcGxheS1henVyZS1zZWNyZXQ=
          body:
            text: grant_type=client_credentials&resource=https%3A%2F%2Fmanagement.core.windows.net%2F
        response:
          status: 200
          body:
            json:
              access_token: management-token
              token_type: Bearer
              expires_in: 3600
      - request:
          method: POST
          path: /api/2.0/workspace/mkdirs
          headers:
            Authorization: Bearer aad-token
            X-Databricks-Azure-Sp-Management-Token: management-token
            X-Databricks-Azure-Workspace-Resource-Id: /subscriptions/replay-subscription/resourceGroups/replay-group/providers/Microsoft.Databricks/workspaces/replay-workspace
          body:
            json:
              path: /Shared/replay-auth
        response:
          status: 200
          body:
            json: {}
      - &read
        request:
          method: GET
          path: /api/2.0/workspace/get-status
          query:
            path: [/Shared/replay-auth]
          headers:
            Authorization: Bearer aad-token
            X-Databricks-Azure-Sp-Management-Token: management-token
            X-Databricks-Azure-Workspace-Resource-Id: /subscriptions/replay-subscription/resourceGroups/replay-group/providers/Microsoft.Databricks/workspaces/replay-workspace
          body: null
        response:
          status: 200
          body:
            json:
              path: /Shared/replay-auth
              object_type: DIRECTORY
              object_id: 2002
      # Terraform's post-apply plan.
      - *databricks_token
      - *management_token
      - *read
destroy:
  calls:
    # The refresh, then the destroy.
    - *databricks_token
    - *management_token
    - *read
    - *databricks_token
    - *management_token
    - request:
        method: POST
        path: /api/2.0/workspace/delete
        headers:
          Authorization: Bearer aad-token
          X-Databricks-Azure-Sp-Management-Token: management-token
          X-Databricks-Azure-Workspace-Resource-Id: /subscriptions/replay-subscription/resourceGroups/replay-group/providers/Microsoft.Databricks/workspaces/replay-workspace
        body:
          json:
            path: /Shared/replay-auth
      response:
        status: 200
        body:
          json: {}
