                  name: Default Interactive Compute
                  is_default: true
                  can_manage: true
      - &list_compute_policies
        request:
          method: GET
          path: /api/2.0/policies/compute
          body: null
        response: # Inferred API response; not recorded. The default Lakebase policy is skipped.
          status: 200
