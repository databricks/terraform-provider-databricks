# Pins import through an account-level provider. Import doesn't see the resource
# configuration, so a provider_config block there doesn't choose the workspace:
# without a provider-level workspace_id the import fails before any call. With one,
# import looks that workspace up through the account API, reads the model with its
# X-Databricks-Workspace-Id header and writes the ID to provider_config.workspace_id,
# and the next plan is empty. Fixtures are synthetic: API responses are inferred from
# the account and MLflow Model Registry API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: import_without_provider_workspace_id_fails_before_any_call
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "databricks_mlflow_model" "this" {
        name = "routing_import_model"
        provider_config {
          workspace_id = "12345"
        }
      }
    import:
      resource: databricks_mlflow_model.this
      id: routing_import_model
      persist: false
    expect_error: 'cannot read mlflow model: managing a workspace-level resource
      requires a workspace_id, but none was found'
    calls: []
  - name: import_falls_back_to_provider_workspace_id
    config: &config |
      provider "databricks" {
        account_id   = "replay-account"
        workspace_id = "12345"
      }
      resource "databricks_mlflow_model" "this" {
        name = "routing_import_model"
      }
    import:
      resource: databricks_mlflow_model.this
      id: routing_import_model
      persist: true
    calls:
      - &lookup_12345
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          headers:
            # An empty expected value matches only a request without the header.
            X-Databricks-Workspace-Id: ""
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 12345,
                   "workspace_name": "replay-workspace-12345",
                   "deployment_name": "replay-workspace-12345",
                   "workspace_status": "RUNNING"}
      - &read_model
        request:
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [routing_import_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "routing_import_model",
                     "id": "00000000000000000000000000000910",
                     "creation_timestamp": 1700000000010,
                     "last_updated_timestamp": 1700000000010,
                     "user_id": "replay-admin@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read_model
  - name: plan_after_import_is_empty
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      # The refresh plan.
      - *lookup_12345
      - *read_model
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: routing_import_model
            - path: [registered_model_id]
              equals: "00000000000000000000000000000910"
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
destroy:
  calls:
    # The destroy plan's refresh.
    - *lookup_12345
    - *read_model
    # The apply.
    - *lookup_12345
    - request:
        method: DELETE
        path: /api/2.0/mlflow/registered-models/delete
        query:
          name: [routing_import_model]
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
