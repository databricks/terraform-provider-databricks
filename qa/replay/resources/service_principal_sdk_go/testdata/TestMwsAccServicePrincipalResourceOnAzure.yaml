# Runs TestMwsAccServicePrincipalResourceOnAzure with reads and writes through sdk-go
# scim/v1. No sdk-go request carries an Accept header, and its GETs carry no Content-Type
# header. Reads by ID send no attributes query. Writes send Content-Type application/json.
# PATCH bodies also carry the ID. Account-level POST bodies have no schemas, entitlements
# or groups, which the account-level scim/v1 model doesn't have. An empty header
# expectation matches only requests without that header.
#
# API responses are inferred from the scenarios and API models, not recorded.
# The original template changes application_id between steps, replacing the service principal.
version: 1
host_metadata: # Dummy host metadata.
  host_type: "account"
  cloud: "Azure"
  account_id: "replay-account"
steps:
  - name: "create"
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_service_principal" "this" {
        application_id = "00000000-0000-4000-8000-000000000001"
        display_name = "SPN initial"
        force = true
      }
    calls:
      - request:
          method: "POST"
          path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals"
          headers:
            Content-Type: application/json
            Accept: ""
          body:
            json:
              displayName: "SPN initial"
              active: true
              applicationId: "00000000-0000-4000-8000-000000000001"
        response: # Inferred API response; not recorded.
          status: 201
          body:
            json:
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"]
              id: "201"
              displayName: "SPN initial"
              active: true
              entitlements: []
              applicationId: "00000000-0000-4000-8000-000000000001"
      - request:
          method: "GET"
          path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201"
          headers:
            Accept: ""
            Content-Type: ""
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"]
              id: "201"
              displayName: "SPN initial"
              active: true
              entitlements: []
              applicationId: "00000000-0000-4000-8000-000000000001"
      - request:
          method: "GET"
          path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201"
          headers:
            Accept: ""
            Content-Type: ""
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"]
              id: "201"
              displayName: "SPN initial"
              active: true
              entitlements: []
              applicationId: "00000000-0000-4000-8000-000000000001"
  - name: "replace_application"
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_service_principal" "this" {
        application_id = "00000000-0000-4000-8000-000000000002"
        display_name = "SPN Renamed updated"
        force = true
      }
    calls:
      - request:
          method: "GET"
          path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201"
          headers:
            Accept: ""
            Content-Type: ""
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"]
              id: "201"
              displayName: "SPN initial"
              active: true
              entitlements: []
              applicationId: "00000000-0000-4000-8000-000000000001"
      - request:
          method: "PATCH"
          path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201"
          headers:
            Content-Type: application/json
            Accept: ""
          body:
            json:
              id: "201"
              schemas: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
              Operations:
                - op: "replace"
                  path: "active"
                  value:
                    - value: "false"
        response: # Inferred API response; not recorded.
          status: 200
          body: null
      - request:
          method: "POST"
          path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals"
          headers:
            Content-Type: application/json
            Accept: ""
          body:
            json:
              displayName: "SPN Renamed updated"
              active: true
              applicationId: "00000000-0000-4000-8000-000000000002"
        response: # Inferred API response; not recorded.
          status: 201
          body:
            json:
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"]
              id: "202"
              displayName: "SPN Renamed updated"
              active: true
              entitlements: []
              applicationId: "00000000-0000-4000-8000-000000000002"
      - request:
          method: "GET"
          path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/202"
          headers:
            Accept: ""
            Content-Type: ""
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"]
              id: "202"
              displayName: "SPN Renamed updated"
              active: true
              entitlements: []
              applicationId: "00000000-0000-4000-8000-000000000002"
      - request:
          method: "GET"
          path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/202"
          headers:
            Accept: ""
            Content-Type: ""
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"]
              id: "202"
              displayName: "SPN Renamed updated"
              active: true
              entitlements: []
              applicationId: "00000000-0000-4000-8000-000000000002"
destroy:
  calls:
    - request:
        method: "GET"
        path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/202"
        headers:
          Accept: ""
          Content-Type: ""
        body: null
      response: # Inferred API response; not recorded.
        status: 200
        body:
          json:
            schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"]
            id: "202"
            displayName: "SPN Renamed updated"
            active: true
            entitlements: []
            applicationId: "00000000-0000-4000-8000-000000000002"
    - request:
        method: "PATCH"
        path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/202"
        headers:
          Content-Type: application/json
          Accept: ""
        body:
          json:
            id: "202"
            schemas: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
            Operations:
              - op: "replace"
                path: "active"
                value:
                  - value: "false"
      response: # Inferred API response; not recorded.
        status: 200
        body: null
