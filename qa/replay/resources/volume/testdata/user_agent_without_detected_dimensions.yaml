# Pins the whole User-Agent of every volume call when the environment adds no
# dimension. environment: {} clears every variable the SDK detects, so the header has the
# provider, SDK, Go, OS and Terraform dimensions, then the SDK implementation, the
# resource and the auth type of the fixture PAT, auth/pat, and nothing after them. The
# versions change with each build and toolchain, so they are matched by format.
# The folded pattern joins its lines with single spaces and must match the whole
# header. API responses are inferred from the Unity Catalog API contract, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
environment: {}
steps:
  - name: create_with_owner
    config: |
      resource "databricks_volume" "this" {
        name         = "user_agent_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "data-engineers"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          matchers: &user_agent
            headers:
              User-Agent:
                pattern: >-
                  databricks-tf-provider/\d+\.\d+\.\d+\S*
                  databricks-sdk-go/\d+\.\d+\.\d+\S* go/\d+\.\d+\.\d+ os/[a-z0-9]+
                  terraform/\d+\.\d+\.\d+\S*
                  sdk/sdkv2 resource/volume auth/pat
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "user_agent_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "user_agent_volume",
                   "full_name": "main.replay.user_agent_volume", "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-303",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000303"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.user_agent_volume
          matchers: *user_agent
          body:
            json: {"owner": "data-engineers"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "user_agent_volume",
                           "full_name": "main.replay.user_agent_volume",
                           "volume_type": "MANAGED", "owner": "data-engineers",
                           "storage_location": "s3://replay-metastore/volume-303",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000303"}
      - &read
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.user_agent_volume
          matchers: *user_agent
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.user_agent_volume
destroy:
  calls:
    - *read
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.user_agent_volume
        matchers: *user_agent
        body: null
      response:
        status: 200
        body:
          json: {}
