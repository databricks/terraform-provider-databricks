# Runs volume_schema/testdata/schema_storage_location_removed_from_config.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same behavior.
# The volume POST and GET requests carry no Accept header, which an empty header
# expectation pins. The original's description:
#
# Pins removing a configured storage_location from an EXTERNAL volume's configuration:
# diff suppression treats the empty value as no change, so the apply plans nothing,
# sends no PATCH and doesn't replace the volume, and state keeps the location. API
# responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_external_with_storage_location
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name             = "unlocated_volume"
        catalog_name     = "main"
        schema_name      = "replay"
        volume_type      = "EXTERNAL"
        storage_location = "s3://replay-bucket/volumes/unlocated"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "unlocated_volume", "volume_type": "EXTERNAL",
                   "storage_location": "s3://replay-bucket/volumes/unlocated"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "unlocated_volume",
                           "full_name": "main.replay.unlocated_volume",
                           "volume_type": "EXTERNAL", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-bucket/volumes/unlocated",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001884"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.unlocated_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read_volume
  - name: removing_storage_location_applies_no_change
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_without_location |
      resource "databricks_volume" "this" {
        name         = "unlocated_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "EXTERNAL"
      }
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_volume
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.unlocated_volume
            - path: [storage_location]
              equals: s3://replay-bucket/volumes/unlocated
  - name: plan_without_storage_location_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_without_location
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_volume
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.unlocated_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
