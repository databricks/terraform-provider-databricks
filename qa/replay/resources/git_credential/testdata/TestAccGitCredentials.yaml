# API responses are inferred from the scenarios and API models, not recorded.
version: 1
host_metadata: # Dummy host metadata.
  host_type: workspace
  cloud: AWS
  workspace_id: '12345'
steps:
  - name: create
    config: |
      resource "databricks_git_credential" "this" {
        git_username          = "test"
        git_provider          = "gitHub"
        personal_access_token = "test_token"
        force                 = true
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/git-credentials
          headers:
            X-Databricks-Workspace-Id: '12345'
          body:
            json:
              git_provider: gitHub
              git_username: test
              personal_access_token: test_token
        response: &response_1 # Inferred API response; not recorded.
          body:
            json:
              credential_id: 123
              git_provider: gitHub
              git_username: test
          status: 200
      - &call_1
        request:
          method: GET
          path: /api/2.0/git-credentials/123
          headers:
            X-Databricks-Workspace-Id: '12345'
          body: null
        response: *response_1 # Inferred API response; not recorded.
      - *call_1
    state:
      resources:
        databricks_git_credential.this:
          attributes:
            - path: [git_username]
              equals: test
destroy:
  calls:
    - *call_1
    - request:
        method: DELETE
        path: /api/2.0/git-credentials/123
        headers:
          X-Databricks-Workspace-Id: '12345'
        body: null
      response: # Inferred API response; not recorded.
        body: null
        status: 200
