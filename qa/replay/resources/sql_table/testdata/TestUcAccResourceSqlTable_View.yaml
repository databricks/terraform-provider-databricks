  calls:
    - *get_1
    - *get_2
    - *get_2
    - *get_3
    - *get_3
    - request:
        method: "POST"
        path: "/api/2.0/sql/statements"
        body:
          json:
            on_wait_timeout: "CANCEL"
            statement: "DROP VIEW `main`.`replay`.`bar_view`"
            wait_timeout: "50s"
            warehouse_id: "warehouse-1"
      response: *response_2
    - request:
        method: "POST"
        path: "/api/2.0/sql/statements"
        body:
          json:
            on_wait_timeout: "CANCEL"
            statement: "DROP TABLE `main`.`replay`.`bar`"
            wait_timeout: "50s"
            warehouse_id: "warehouse-1"
      response: *response_2
    - request: {method: "GET", path: "/api/2.1/unity-catalog/current-metastore-assignment", body: null}
      response: &response_5 # Inferred API response; not recorded.
        status: 200
        body:
          json:
            metastore_id: "11111111-1111-1111-1111-111111111111"
            workspace_id: 12345
    - request:
        method: "DELETE"
        path: "/api/2.1/unity-catalog/schemas/main.replay"
        body: null
      response: # Inferred API response; not recorded.
        status: 200
        body: null
