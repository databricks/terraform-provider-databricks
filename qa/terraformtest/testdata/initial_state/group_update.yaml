version: 1
host_metadata:
  workspace_id: "12345"
initial_state:
  checkpoint: checkpoints/group.tfstate
steps:
  - name: update_existing_group
    config: |
      resource "databricks_group" "this" {
        display_name = "Updated group"
      }
    calls:
      - request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups/group-id
          query:
            attributes: ["displayName,externalId,entitlements"]
          body: null
        response:
          status: 200
          body:
            json:
              id: group-id
              displayName: Example group
      - request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups/group-id
          query:
            attributes: ["displayName,entitlements,groups,members,externalId"]
          body: null
        response:
          status: 200
          body:
            json:
              id: group-id
              displayName: Example group
      - request:
          method: PUT
          path: /api/2.0/preview/scim/v2/Groups/group-id
          body:
            json:
              schemas: [urn:ietf:params:scim:schemas:core:2.0:Group]
              displayName: Updated group
              entitlements: [{}]
        response:
          status: 200
          body: null
      - request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups/group-id
          query:
            attributes: ["displayName,externalId,entitlements"]
          body: null
        response:
          status: 200
          body:
            json:
              id: group-id
              displayName: Updated group
      - request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups/group-id
          query:
            attributes: ["displayName,externalId,entitlements"]
          body: null
        response:
          status: 200
          body:
            json:
              id: group-id
              displayName: Updated group
    state:
      resources:
        databricks_group.this:
          attributes:
            - path: [id]
              equals: group-id
            - path: [acl_principal_id]
              equals: groups/Updated group
destroy:
  calls:
    - request:
        method: GET
        path: /api/2.0/preview/scim/v2/Groups/group-id
        query:
          attributes: ["displayName,externalId,entitlements"]
        body: null
      response:
        status: 200
        body:
          json:
            id: group-id
            displayName: Updated group
    - request:
        method: DELETE
        path: /api/2.0/preview/scim/v2/Groups/group-id
        body: null
      response:
        status: 204
        body: null
