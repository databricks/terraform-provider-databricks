# Pins creating a MANAGED volume with only the required fields: one POST, no owner
# PATCH, and refresh GETs by full name without a query. The response's managed
# storage_location is kept in state without a diff, and the destroy DELETE is answered
# 200. API responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_managed_with_required_fields_sends_no_patch
    config: &config |
      resource "databricks_volume" "this" {
        name         = "managed_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "managed_volume",
                   "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "managed_volume", "full_name": "main.replay.managed_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volumes/00000000-0000-4000-8000-000000000001",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000001"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.managed_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.managed_volume
            - path: [volume_path]
              equals: /Volumes/main/replay/managed_volume
            - path: [owner]
              equals: replay-admin@example.com
            - path: [storage_location]
              equals: s3://replay-metastore/volumes/00000000-0000-4000-8000-000000000001
  - name: plan_after_create_is_empty
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_volume
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.managed_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
