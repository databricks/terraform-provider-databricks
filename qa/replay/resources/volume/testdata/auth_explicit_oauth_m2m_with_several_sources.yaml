# This journey pins auth type oauth-m2m when the provider also has a PAT and a username
# and password. The SDK configures only the OAuth client: each Terraform command looks
# up the token endpoint without credentials, exchanges the client ID and secret, sent
# as basic auth, for a token, and sends that token as a bearer token on every volume
# call, with no cloud credential headers and auth/oauth-m2m in its User-Agent. API
# responses are inferred from the OAuth and Unity Catalog API contracts, not recorded.
# Credential headers use patterns, not samples, so that a repeated header fails.
version: 1
enforce_call_order: true
provider_host: workspace
hosts:
  workspace:
    url: https://replay-workspace-12345.cloud.databricks.com
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
  oidc_endpoint: https://replay-workspace-12345.cloud.databricks.com/oidc
auth:
  type: oauth-m2m
  token: replay-pat
  username: replay-user
  password: replay-password
  client_id: replay-sp
  client_secret: replay-secret
steps:
  - name: create_sends_only_the_m2m_token
    config: |
      resource "databricks_volume" "this" {
        name         = "auth_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - &discovery
        request:
          method: GET
          path: /oidc/.well-known/oauth-authorization-server
          matchers:
            headers:
              Authorization: absent
              Metadata: absent
              X-Databricks-Azure-Sp-Management-Token: absent
              X-Databricks-Azure-Workspace-Resource-Id: absent
              X-Databricks-Gcp-Sa-Access-Token: absent
          body: null
        response:
          status: 200
          body:
            json: {"authorization_endpoint": "https://replay-workspace-12345.cloud.databricks.com/oidc/v1/authorize",
                   "token_endpoint": "https://replay-workspace-12345.cloud.databricks.com/oidc/v1/token"}
      - &token
        request:
          method: POST
          path: /oidc/v1/token
          matchers: &client_secret_basic
            headers:
              Authorization: {pattern: 'Basic cmVwbGF5LXNwOnJlcGxheS1zZWNyZXQ='}
              Metadata: absent
              X-Databricks-Azure-Sp-Management-Token: absent
              X-Databricks-Azure-Workspace-Resource-Id: absent
              X-Databricks-Gcp-Sa-Access-Token: absent
          body:
            text: grant_type=client_credentials&scope=all-apis
        response:
          status: 200
          body:
            json: {"access_token": "m2m-token", "token_type": "Bearer",
                   "expires_in": 3600}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          matchers: &m2m_only
            headers:
              Authorization: {pattern: 'Bearer m2m-token'}
              User-Agent: {pattern: '.* resource/volume auth/oauth-m2m( .*)?'}
              Metadata: absent
              X-Databricks-Azure-Sp-Management-Token: absent
              X-Databricks-Azure-Workspace-Resource-Id: absent
              X-Databricks-Gcp-Sa-Access-Token: absent
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "auth_volume", "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "auth_volume", "full_name": "main.replay.auth_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-199",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000199"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.auth_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: *m2m_only
          body: null
        response: *volume
      # The post-apply plan configures a new provider, which fetches its own token.
      - *discovery
      - *token
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.auth_volume
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
destroy:
  calls:
    # The refresh, then the destroy.
    - *discovery
    - *token
    - *read_volume
    - *discovery
    - *token
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.auth_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        matchers: *m2m_only
        body: null
      response:
        status: 200
        body:
          json: {}
