# Runs account_import_verify with reads and writes through sdk-go scim/v1: importing into
# separate state reads the service principal twice. sdk-go's AccountServicePrincipal has
# no entitlements, so unlike the existing path import leaves allow_cluster_create unset
# although the response lists it. The GETs carry no attributes query, Accept or
# Content-Type header. Writes send Content-Type application/json and no Accept header,
# PATCH bodies also carry the ID, and account-level POST bodies have no schemas,
# entitlements or groups, which the account-level scim/v1 model doesn't have. API
# responses are inferred from the SCIM API contract, not recorded. An empty header
# expectation matches only requests without that header.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_service_principal" "this" {
        display_name         = "SPN import"
        external_id          = "external-201"
        allow_cluster_create = true
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: ""
            Accept: ""
          body:
            json: {"displayName": "SPN import", "active": true,
                   "externalId": "external-201"}
        response:
          status: 201
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN import", "active": true,
                   "externalId": "external-201",
                   "entitlements": [{"value": "allow-cluster-create"}]}
      - &read_created
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201
          headers:
            X-Databricks-Workspace-Id: ""
            Accept: ""
            Content-Type: ""
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN import", "active": true,
                   "externalId": "external-201",
                   "entitlements": [{"value": "allow-cluster-create"}]}
      - *read_created
  - name: import_into_separate_state_matches_created_state
    sdk_implementations:
      databricks_service_principal: sdk_go
    import:
      resource: databricks_service_principal.this
      persist: false
      verify: true
      # Import sets no entitlements at account level; created state holds them.
      ignore: [allow_cluster_create, allow_instance_pool_create, databricks_sql_access,
               workspace_access, workspace_consume]
    calls:
      - *read_created
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: PATCH
        path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201
        headers:
          Content-Type: application/json
          X-Databricks-Workspace-Id: ""
          Accept: ""
        body:
          json: {"id": "201",
                 "schemas": ["urn:ietf:params:scim:api:messages:2.0:PatchOp"],
                 "Operations": [{"op": "replace", "path": "active",
                                 "value": [{"value": "false"}]}]}
      response:
        status: 200
        body: null
