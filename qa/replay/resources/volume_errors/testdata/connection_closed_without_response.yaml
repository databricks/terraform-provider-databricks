# This journey pins a connection that the server closes without writing a response, on
# the create POST and on the refresh GET. The client sees EOF, which matches none of the
# SDK's transient URL error messages, so each call is sent once and not retried: a
# retry would be an unexpected call. The failed create stores no ID, so the next plan
# creates the volume. The failed refresh keeps the volume in state, so the next plan
# reads it again and plans no change. The replay transport opens one connection per
# request; on a reused connection, Go's client would resend the GET itself. API
# responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_post_closed_without_response
    config: &config |
      resource "databricks_volume" "this" {
        name         = "connection_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    expect_error: 'Error: cannot create volume: Post
      "http://[\d.:]+/api/2\.1/unity-catalog/volumes": EOF\n'
    calls:
      - request: &create
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "connection_volume", "volume_type": "MANAGED"}
        response:
          fault: close
  - name: plan_after_closed_create_creates_the_volume
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls: []
  - name: create
    config: *config
    calls:
      - request: *create
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "connection_volume",
                   "full_name": "main.replay.connection_volume",
                   "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-299",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000299"}
      - &read
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.connection_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *volume
      - *read
  # An apply refreshes first, so its plan fails at the refresh.
  - name: refresh_get_closed_without_response
    config: *config
    expect_error: 'Error: cannot read volume: Get
      "http://[\d.:]+/api/2\.1/unity-catalog/volumes/main\.replay\.connection_volume\?":
      EOF\n'
    calls:
      - request: *read_request
        response:
          fault: close
  - name: plan_after_closed_refresh_keeps_the_volume
    plan_only: true
    config: *config
    plan:
      expect: empty
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.connection_volume
    calls:
      - *read
destroy:
  calls:
    - *read
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.connection_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
