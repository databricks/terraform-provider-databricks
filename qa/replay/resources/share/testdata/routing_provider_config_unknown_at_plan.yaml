# Pins a provider_config block that is unknown at plan time, because it's a dynamic block
# whose for_each depends on another resource, on an account-level provider without a
# provider-level workspace_id. The workspace_id plan modifier doesn't run inside an
# unknown block. On create the plan leaves the block unknown without looking up a
# workspace client, and apply routes through the resolved ID. When the block becomes
# unknown again, the plan replaces the share, and apply deletes it from the old
# workspace and creates it in the new one. API responses are inferred from the account
# and Delta Sharing API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_with_unknown_provider_config
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "terraform_data" "workspace" {
        input = "12345"
      }
      resource "databricks_share" "this" {
        name = "unknown-pc-share"
        dynamic "provider_config" {
          for_each = terraform_data.workspace.output == "" ? [] : [terraform_data.workspace.output]
          content {
            workspace_id = provider_config.value
          }
        }
        object {
          name             = "sandbox.things"
          data_object_type = "SCHEMA"
        }
      }
    plan:
      expect: non_empty
      changes:
        databricks_share.this:
          actions: [create]
          after:
            - path: [provider_config]
              unknown: true
    calls:
      - &lookup_12345
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 12345,
                   "workspace_name": "replay-workspace-12345",
                   "deployment_name": "replay-workspace-12345",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/shares
          headers:
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "unknown-pc-share"}
        response:
          status: 200
          body:
            json: {"name": "unknown-pc-share", "owner": "replay-admin",
                   "created_at": 1700000000000, "created_by": "replay-admin"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/shares/unknown-pc-share
          headers:
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"updates": [{"action": "ADD",
                   "data_object": {"name": "sandbox.things", "data_object_type": "SCHEMA"}}]}
        response: &share_12345
          status: 200
          body:
            json: {"name": "unknown-pc-share", "owner": "replay-admin",
                   "created_at": 1700000000000, "created_by": "replay-admin",
                   "objects": [{"name": "sandbox.things", "data_object_type": "SCHEMA"}]}
      # The post-apply plan validates the resolved workspace_id, then the refresh plan reads.
      - *lookup_12345
      - *lookup_12345
      - &read_in_12345
        request:
          method: GET
          path: /api/2.1/unity-catalog/shares/unknown-pc-share
          query:
            include_shared_data: ["true"]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *share_12345
    state:
      resources:
        databricks_share.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: change_to_unknown_provider_config
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "terraform_data" "workspace" {
        input = "67890"
      }
      resource "databricks_share" "this" {
        name = "unknown-pc-share"
        dynamic "provider_config" {
          for_each = terraform_data.workspace.output == "" ? [] : [terraform_data.workspace.output]
          content {
            workspace_id = provider_config.value
          }
        }
        object {
          name             = "sandbox.things"
          data_object_type = "SCHEMA"
        }
      }
    plan:
      expect: non_empty
      changes:
        databricks_share.this:
          actions: [delete, create]
          before:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
          after:
            - path: [provider_config]
              unknown: true
    calls:
      # The plan's refresh.
      - *lookup_12345
      - *read_in_12345
      # The apply deletes the share from the old workspace.
      - *lookup_12345
      - request:
          method: DELETE
          path: /api/2.1/unity-catalog/shares/unknown-pc-share
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body: null
      # It creates the share in the new workspace.
      - &lookup_67890
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/67890
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 67890,
                   "workspace_name": "replay-workspace-67890",
                   "deployment_name": "replay-workspace-67890",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/shares
          headers:
            X-Databricks-Workspace-Id: "67890"
          body:
            json: {"name": "unknown-pc-share"}
        response:
          status: 200
          body:
            json: {"name": "unknown-pc-share", "owner": "replay-admin",
                   "created_at": 1700000000001, "created_by": "replay-admin"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/shares/unknown-pc-share
          headers:
            X-Databricks-Workspace-Id: "67890"
          body:
            json: {"updates": [{"action": "ADD",
                   "data_object": {"name": "sandbox.things", "data_object_type": "SCHEMA"}}]}
        response: &share_67890
          status: 200
          body:
            json: {"name": "unknown-pc-share", "owner": "replay-admin",
                   "created_at": 1700000000001, "created_by": "replay-admin",
                   "objects": [{"name": "sandbox.things", "data_object_type": "SCHEMA"}]}
      # The post-apply plan validates the resolved workspace_id, then the refresh plan reads.
      - *lookup_67890
      - *lookup_67890
      - &read_in_67890
        request:
          method: GET
          path: /api/2.1/unity-catalog/shares/unknown-pc-share
          query:
            include_shared_data: ["true"]
          headers:
            X-Databricks-Workspace-Id: "67890"
          body: null
        response: *share_67890
    state:
      resources:
        databricks_share.this:
          attributes:
            - path: [created_at]
              equals: 1700000000001
            - path: [provider_config, 0, workspace_id]
              equals: "67890"
destroy:
  calls:
    - *lookup_67890
    - *read_in_67890
    - *lookup_67890
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/shares/unknown-pc-share
        headers:
          X-Databricks-Workspace-Id: "67890"
        body: null
      response:
        status: 200
        body: null
