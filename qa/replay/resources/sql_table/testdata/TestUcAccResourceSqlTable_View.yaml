# API responses are inferred from the scenarios and API models, not recorded.
version: 1
host_metadata: # Dummy host metadata.
  host_type: "workspace"
  cloud: "AWS"
  workspace_id: "12345"
steps:
  - name: "create_table_and_view"
    config: |
      resource "databricks_schema" "this" {
        name         = "replay"
        catalog_name = "main"
      }

      resource "databricks_sql_table" "this" {
        name               = "bar"
        catalog_name       = "main"
        schema_name        = databricks_schema.this.name
        table_type         = "MANAGED"
        data_source_format = "DELTA"
        comment            = "this table is managed by terraform..."
        owner              = "account users"
        warehouse_id       = "warehouse-1"

        column {
          name = "id"
          type = "string"
        }

        column {
          name = "name"
          type = "string"
        }
      }

      resource "databricks_sql_table" "view" {
        name            = "bar_view"
        catalog_name    = "main"
        schema_name     = databricks_schema.this.name
        table_type      = "VIEW"
        comment         = "this view is managed by terraform..."
        view_definition = format("SELECT \n\n\n\tid, \tname FROM %s", databricks_sql_table.this.id)
        warehouse_id    = "warehouse-1"

        column {
          name = "id"
        }

        column {
          name    = "name"
          comment = "view column comment"
        }
      }
    calls:
      - request:
          method: "POST"
          path: "/api/2.1/unity-catalog/schemas"
          body:
            json:
              catalog_name: "main"
              name: "replay"
        response: &response_1 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              catalog_name: "main"
              enable_predictive_optimization: "INHERIT"
              full_name: "main.replay"
              metastore_id: "11111111-1111-1111-1111-111111111111"
              name: "replay"
              owner: "replay-admin"
              schema_id: "22222222-2222-2222-2222-222222222222"
      - &get_1
        request: {method: "GET", path: "/api/2.1/unity-catalog/schemas/main.replay", body: null}
        response: *response_1
      - request:
          method: "POST"
          path: "/api/2.0/sql/statements"
          body:
            json:
              on_wait_timeout: "CANCEL"
              statement: |-
                CREATE OR REPLACE TABLE `main`.`replay`.`bar` (`id` string, `name` string)
                USING DELTA
                COMMENT 'this table is managed by terraform...';
              wait_timeout: "50s"
              warehouse_id: "warehouse-1"
        response: &response_2 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              statement_id: "statement-1"
              status:
                state: "SUCCEEDED"
      - request:
          method: "PATCH"
          path: "/api/2.1/unity-catalog/tables/main.replay.bar"
          body:
            json:
              owner: "account users"
        response: # Inferred API response; not recorded.
          status: 200
          body: null
      - &get_2
        request: {method: "GET", path: "/api/2.1/unity-catalog/tables/main.replay.bar", body: null}
        response: &response_3 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              catalog_name: "main"
              columns:
                - name: "id"
                  nullable: true
                  type_text: "string"
                - name: "name"
                  nullable: true
                  type_text: "string"
              comment: "this table is managed by terraform..."
              data_source_format: "DELTA"
              full_name: "main.replay.bar"
              name: "bar"
              owner: "account users"
              schema_name: "replay"
              table_id: "table-bar"
              table_type: "MANAGED"
      - *get_2
      - request:
          method: "POST"
          path: "/api/2.0/sql/statements"
          body:
            json:
              on_wait_timeout: "CANCEL"
              statement: "CREATE VIEW `main`.`replay`.`bar_view` (`id` , `name`  COMMENT 'view column comment')\nCOMMENT 'this view is managed by terraform...'\nAS SELECT \n\n\n\tid, \tname FROM main.replay.bar;"
              wait_timeout: "50s"
              warehouse_id: "warehouse-1"
        response: *response_2
      - &get_3
        request: {method: "GET", path: "/api/2.1/unity-catalog/tables/main.replay.bar_view", body: null}
        response: &response_4 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              catalog_name: "main"
              columns:
                - name: "id"
                  nullable: true
                  type_text: "string"
                - comment: "view column comment"
                  name: "name"
                  nullable: true
                  type_text: "string"
              comment: "this view is managed by terraform..."
              data_source_format: "DELTA"
              full_name: "main.replay.bar_view"
              name: "bar_view"
              owner: "replay-admin"
              schema_name: "replay"
              table_id: "table-bar_view"
              table_type: "VIEW"
              view_definition: "SELECT \n\n\n\tid, \tname FROM main.replay.bar"
      - *get_3
      - *get_1
      - *get_2
      - *get_2
      - *get_3
      - *get_3
