# Pins a volume name with "#", which Unity Catalog allows. sdk-go escapes it in the path,
# so its GETs, its PATCH and its DELETE go to main.replay.raw%232, and plans with sdk-go
# have no changes. The PATCH body carries the unescaped full name as full_name_arg. The
# existing client puts the volume ID in the URL unescaped, so "#2" becomes a fragment that
# is never sent: on the existing path, the refresh GET reads main.replay.raw, whose 404
# plans to create the volume again. Destroy follows the last sdk-go apply, so its refresh
# and DELETE go through sdk-go. The sdk-go requests carry no Accept header. API responses
# are inferred from the Unity Catalog API contract, not recorded. An empty header
# expectation matches only requests without that header.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_sdk_go
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "raw#2"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "raw#2",
                   "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "raw#2", "full_name": "main.replay.raw#2",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-71",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000071"}
      - &read_sdk_go
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%232
          headers:
            Accept: ""
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read_sdk_go
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.raw#2
            - path: [volume_path]
              equals: /Volumes/main/replay/raw#2
  - name: plan_with_sdk_go_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_sdk_go
  - name: update_comment_with_sdk_go_patches_the_escaped_name
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_commented |
      resource "databricks_volume" "this" {
        name         = "raw#2"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "escaped"
      }
    calls:
      - *read_sdk_go
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%232
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.raw#2", "comment": "escaped"}
        response:
          status: 200
          body:
            json: &commented {"catalog_name": "main", "schema_name": "replay",
                              "name": "raw#2", "full_name": "main.replay.raw#2",
                              "volume_type": "MANAGED", "comment": "escaped",
                              "owner": "replay-admin@example.com",
                              "storage_location": "s3://replay-metastore/volume-71",
                              "metastore_id": "11111111-1111-1111-1111-111111111111",
                              "volume_id": "00000000-0000-4000-8000-000000000071"}
      - &read_commented
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%232
          headers:
            Accept: ""
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *commented
      - *read_commented
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.raw#2
            - path: [comment]
              equals: escaped
  - name: plan_on_existing_path_reads_the_name_before_the_hash
    sdk_implementations:
      databricks_volume: classic
    plan_only: true
    config: *config_commented
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls:
      - request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw
          headers:
            Accept: application/json
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 404
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Volume 'main.replay.raw' does not exist."}
destroy:
  calls:
    - *read_commented
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.raw%232
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
