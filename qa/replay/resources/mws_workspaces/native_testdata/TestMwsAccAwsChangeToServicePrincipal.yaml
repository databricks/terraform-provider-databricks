# API responses are placeholders based on the API models, not recorded.
version: 1
host_metadata:
  account_id: replay-account
  cloud: AWS
  host_type: account
steps:
- name: create_with_original_identity
  config: |
    provider "databricks" {
      account_id = "replay-account"
    }
    resource "databricks_mws_credentials" "this" {
      account_id       = "replay-account"
      credentials_name = "creds-test-replay"
      role_arn         = "arn:aws:iam::123456789012:role/replay-crossaccount"
    }

    resource "databricks_mws_customer_managed_keys" "this" {
      account_id = "replay-account"
      use_cases  = ["MANAGED_SERVICES"]
      aws_key_info {
        key_arn   = "arn:aws:kms:us-east-1:123456789012:key/replay-key"
        key_alias = "alias/replay"
      }
    }

    resource "databricks_mws_storage_configurations" "this" {
      account_id                 = "replay-account"
      storage_configuration_name = "terraform-replay"
      bucket_name                = "terraform-replay"
    }

    resource "databricks_mws_networks" "my_network" {
      account_id         = "replay-account"
      network_name       = "network-test-replay"
      vpc_id             = "vpc-11111111"
      subnet_ids         = ["subnet-11111111", "subnet-99999999"]
      security_group_ids = ["sg-99999999"]
    }
    resource "databricks_mws_workspaces" "this" {
      account_id                               = "replay-account"
      workspace_name                           = "terra-replay"
      aws_region                               = "us-east-1"
      network_id                               = databricks_mws_networks.my_network.network_id
      credentials_id                           = databricks_mws_credentials.this.credentials_id
      storage_configuration_id                 = databricks_mws_storage_configurations.this.storage_configuration_id
      managed_services_customer_managed_key_id = databricks_mws_customer_managed_keys.this.customer_managed_key_id
      custom_tags                              = { randomkey = "randomvalue" }
      token { comment = "Test replay" }
    }
    resource "databricks_service_principal" "this" {
      display_name             = "tf-new-sp-replay"
      disable_as_user_deletion = false
    }
    resource "databricks_service_principal_role" "this" {
      service_principal_id = databricks_service_principal.this.id
      role                 = "account_admin"
    }
    resource "databricks_service_principal_secret" "this" {
      service_principal_id = databricks_service_principal.this.id
    }
  calls:
  - request:
      method: POST
      path: /api/2.0/accounts/replay-account/storage-configurations
      headers:
        Authorization: Bearer fixture-token
      body:
        json:
          root_bucket_info:
            bucket_name: terraform-replay
          storage_configuration_name: terraform-replay
    response:
      status: 200
      body:
        json:
          account_id: replay-account
          creation_time: 1700000000000
          root_bucket_info:
            bucket_name: terraform-replay
          storage_configuration_id: storage-123
          storage_configuration_name: terraform-replay
  - request:
      method: POST
      path: /api/2.0/accounts/replay-account/credentials
      headers:
        Authorization: Bearer fixture-token
      body:
        json:
          aws_credentials:
            sts_role:
              role_arn: arn:aws:iam::123456789012:role/replay-crossaccount
          credentials_name: creds-test-replay
    response:
      status: 200
      body:
        json:
          account_id: replay-account
          aws_credentials:
            sts_role:
              role_arn: arn:aws:iam::123456789012:role/replay-crossaccount
          creation_time: 1700000000000
          credentials_id: credentials-123
          credentials_name: creds-test-replay
  - request:
      method: POST
      path: /api/2.0/accounts/replay-account/customer-managed-keys
      headers:
        Authorization: Bearer fixture-token
      body:
        json:
          account_id: replay-account
          aws_key_info:
            key_alias: alias/replay
            key_arn: arn:aws:kms:us-east-1:123456789012:key/replay-key
          use_cases:
          - MANAGED_SERVICES
    response:
      status: 200
      body:
        json:
          account_id: replay-account
