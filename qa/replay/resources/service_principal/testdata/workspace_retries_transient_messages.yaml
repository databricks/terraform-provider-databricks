# Pins that workspace-level refreshes on AWS retry an HTTP 500 whose message carries a
# transient error from the classic SDK client: one per entry of its transient message
# patterns, plus its REQUEST_LIMIT_EXCEEDED substring. Each refresh gets one 500 and
# then succeeds. A 500 without these messages is not retried. API responses are inferred
# from the SCIM API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_service_principal" "this" {
        display_name = "SPN transient errors"
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/preview/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/scim+json; charset=utf-8
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "displayName": "SPN transient errors", "active": true,
                   "entitlements": [{}]}
        response:
          status: 201
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN transient errors", "active": true}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.0/preview/scim/v2/ServicePrincipals/201
          query:
            attributes: ["userName,displayName,active,externalId,entitlements"]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN transient errors", "active": true}
      - *read_created
  - name: refresh_retries_unknown_worker_environment_exception
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            json:
              schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
              detail: >-
                com.databricks.backend.manager.util.UnknownWorkerEnvironmentException
              status: "500"
      - *read_created
  - name: refresh_retries_no_associated_worker_environments
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            json:
              schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
              detail: "Workspace does not have any associated worker environments."
              status: "500"
      - *read_created
  - name: refresh_retries_no_worker_environment_with_id
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            json:
              schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
              detail: "There is no worker environment with id workerenv-123."
              status: "500"
      - *read_created
  - name: refresh_retries_unknown_worker_environment
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            json:
              schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
              detail: "Unknown worker environment WorkerEnvId(workerenv-123)."
              status: "500"
      - *read_created
  - name: refresh_retries_cluster_not_ready_exception
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            json:
              schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
              detail: "ClusterNotReadyException: cluster is not ready."
              status: "500"
      - *read_created
  - name: refresh_retries_worker_env_not_found
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            json:
              schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
              detail: "worker env workerenv-123 not found"
              status: "500"
      - *read_created
  - name: refresh_retries_timed_out_after
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            json:
              schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
              detail: "Timed out after 30000 milliseconds."
              status: "500"
      - *read_created
  - name: refresh_retries_deadline_exceeded
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            json:
              schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
              detail: "context deadline exceeded"
              status: "500"
      - *read_created
  - name: refresh_retries_request_limit_exceeded
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            json:
              schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
              detail: "REQUEST_LIMIT_EXCEEDED: SCIM API rate limit reached."
              status: "500"
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.0/preview/scim/v2/ServicePrincipals/201
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 204
        body: null
