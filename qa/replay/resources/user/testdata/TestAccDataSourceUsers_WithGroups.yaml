    resources:
      data.databricks_users.this:
        attributes:
        - path:
          - users
          - 0
          - id
          equals: '84501'
        - path:
          - users
          - 0
          - groups
          - 0
          - value
          equals: '84201'
destroy:
  calls:
  - *id003
  - *id004
  - *id001
  - *id002
  - request:
      method: PATCH
      path: /api/2.0/accounts/replay-account/scim/v2/Groups/84201
      body:
        json:
          Operations:
          - op: remove
            path: members[value eq "84501"]
          schemas:
          - urn:ietf:params:scim:api:messages:2.0:PatchOp
    response:
      status: 200
      body: null
  - request:
      method: DELETE
      path: /api/2.0/accounts/replay-account/scim/v2/Groups/84201
      body: null
    response:
      status: 200
      body: null
  - request:
      method: PATCH
      path: /api/2.0/accounts/replay-account/scim/v2/Users/84501
      body:
        json:
          Operations:
          - op: replace
            path: active
            value:
            - value: 'false'
          schemas:
          - urn:ietf:params:scim:api:messages:2.0:PatchOp
    response:
      status: 200
      body: null
