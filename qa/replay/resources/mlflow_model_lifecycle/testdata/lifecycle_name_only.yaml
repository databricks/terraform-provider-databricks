# Pins the create of a model that sets only name. The POST body carries only name. The id
# is the name in the create response, and registered_model_id is the id in the GET that
# follows the create. The same config then plans no changes, and destroy reads the model
# and sends one DELETE with the name in the query and no body. API responses are
# synthetic, inferred from the MLflow Model Registry API, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_sends_only_name
    config: &config |
      resource "databricks_mlflow_model" "this" {
        name = "lifecycle-name-only"
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          body:
            json: {"name": "lifecycle-name-only"}
        response:
          status: 200
          body:
            json: {"registered_model": {"name": "lifecycle-name-only",
                                        "creation_timestamp": 1700000000101,
                                        "last_updated_timestamp": 1700000000101,
                                        "user_id": "replay-admin@example.com"}}
      - &read
        request:
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: ["lifecycle-name-only"]
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "lifecycle-name-only",
                     "id": "a1b2c3d4e5f60718293a4b5c6d7e8f01",
                     "creation_timestamp": 1700000000101,
                     "last_updated_timestamp": 1700000000101,
                     "user_id": "replay-admin@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: lifecycle-name-only
            - path: [registered_model_id]
              equals: a1b2c3d4e5f60718293a4b5c6d7e8f01
  - name: plan_after_create_is_empty
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read
destroy:
  calls:
    - *read
    - request:
        method: DELETE
        path: /api/2.0/mlflow/registered-models/delete
        query:
          name: ["lifecycle-name-only"]
        body: null
      response:
        status: 200
        body:
          json: {}
