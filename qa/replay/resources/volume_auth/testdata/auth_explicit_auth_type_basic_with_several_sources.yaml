# Pins that an explicit auth type selects one of several credential sources for
# databricks_volume calls. The provider has a PAT, a username and password, and OAuth
# client credentials, and auth type basic configures only the username and password. Every
# call sends Authorization: Basic with base64 of replay-user:replay-password, and no token
# request comes first. The User-Agent names the selected type as auth/basic. A pattern
# matcher requires exactly one value, so a lost or duplicated header fails. API responses
# are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
auth:
  type: basic
  token: replay-pat
  username: replay-user
  password: replay-password
  client_id: replay-sp
  client_secret: replay-secret
steps:
  - name: create
    config: |
      resource "databricks_volume" "this" {
        name         = "auth_type_basic_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: &credentials
            headers:
              Authorization: {pattern: 'Basic cmVwbGF5LXVzZXI6cmVwbGF5LXBhc3N3b3Jk'}
              User-Agent: {pattern: '.* auth/basic( .*)?'}
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "auth_type_basic_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "auth_type_basic_volume",
                            "full_name": "main.replay.auth_type_basic_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-302",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000302"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.auth_type_basic_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: *credentials
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.auth_type_basic_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        matchers: *credentials
        body: null
      response:
        status: 200
        body:
          json: {}
