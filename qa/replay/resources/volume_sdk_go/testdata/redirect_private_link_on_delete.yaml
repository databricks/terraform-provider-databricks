# Runs volume/testdata/redirect_private_link_on_delete.yaml with databricks_volume on sdk-
# go uc/volumes/v1 in every step, and expects the same behavior. The volume requests carry
# no Accept header, which an empty header expectation pins. The original's description:
#
# Pins a private-link login redirect on DELETE. The client follows the 302 with a GET,
# and apply fails with the exact AWS PrivateLink message. The PrivateLink error is not a
# missing-resource error, so the volume is not treated as removed: it stays in state,
# and the next plan with the volume's configuration is empty. API responses are
# inferred from the private-link redirect contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "redirect_delete_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "redirect_delete_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "redirect_delete_volume",
                            "full_name": "main.replay.redirect_delete_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-1934",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001934"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_delete_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: delete_redirected_to_login_fails_with_private_link_error
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {}
    expect_error: 'Error: cannot delete volume: The requested workspace has AWS
      PrivateLink enabled and is not accessible from the current network\. Ensure that
      AWS PrivateLink is properly configured and that your device has access to the AWS
      VPC endpoint\. For more information, see
      https://docs\.databricks\.com/en/security/network/classic/privatelink\.html\.\n'
    calls:
      - *read_created
      - request: &delete_request
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_delete_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 302
          headers:
            Location: /login.html?error=private-link-validation-error
          body: null
      - request:
          method: GET
          path: /login.html
          query:
            error: [private-link-validation-error]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: <html><body>Sign in</body></html>
  - name: plan_after_redirected_delete_keeps_volume
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.redirect_delete_volume
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request: *delete_request
      response:
        status: 200
        body:
          json: {}
