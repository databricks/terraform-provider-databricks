          body:
            json:
              active: true
              displayName: Replay runner
              groups:
                - display: admins
                  value: '901'
              id: '900'
              schemas: ['urn:ietf:params:scim:schemas:core:2.0:User']
              userName: 11111111-1111-4111-8111-000000000000
      - &list_serverless_computes
        request:
          method: GET
          path: /api/2.0/serverless-compute
          body: null
