version: 1
host_metadata: # Dummy host metadata.
  host_type: workspace
  cloud: AWS
  workspace_id: '12345'
steps:
  - name: create_token_for_admin_service_principal
    config: |
      resource "databricks_service_principal" "this" {
        display_name = "tf-replay"
      }

      data "databricks_group" "admins" {
        display_name = "admins"
      }

      resource "databricks_group_member" "this" {
        group_id  = data.databricks_group.admins.id
        member_id = databricks_service_principal.this.id
      }

      resource "databricks_obo_token" "this" {
        depends_on       = [databricks_group_member.this]
        application_id   = databricks_service_principal.this.application_id
        comment          = "PAT on behalf of ${databricks_service_principal.this.display_name}"
        lifetime_seconds = 3600
      }
    calls:
      - &call_1
        request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups
          body: null
          query:
            filter: [displayName eq "admins"]
