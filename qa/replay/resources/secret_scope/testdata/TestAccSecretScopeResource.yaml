# API responses are placeholders based on the API models, not recorded.
version: 1
host_metadata:
  cloud: AWS
  host_type: workspace
  workspace_id: '12345'
steps:
- name: create_scope
  config: |
    resource "databricks_secret_scope" "my_scope" {
      name = "tf-replay"
    }
  calls:
  - &id002
    request:
      method: POST
      path: /api/2.0/secrets/scopes/create
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          scope: tf-replay
          scope_backend_type: DATABRICKS
    response:
      status: 200
      body: null
  - &id001
    request:
      method: GET
      path: /api/2.0/secrets/scopes/list
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          scopes:
          - backend_type: DATABRICKS
            name: tf-replay
  - *id001
  state:
    resources:
      databricks_secret_scope.my_scope:
        attributes:
        - path:
          - name
          equals: tf-replay
        - path:
          - backend_type
          equals: DATABRICKS
- name: recreate_deleted_scope
  config: |
    resource "databricks_secret_scope" "my_scope" {
      name = "tf-replay"
    }
  calls:
  - request:
      method: GET
      path: /api/2.0/secrets/scopes/list
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          scopes: []
  - *id002
  - *id001
  - *id001
  state:
    resources:
      databricks_secret_scope.my_scope:
        attributes:
        - path:
          - name
          equals: tf-replay
        - path:
          - backend_type
          equals: DATABRICKS
destroy:
  calls:
  - *id001
  - request:
      method: POST
      path: /api/2.0/secrets/scopes/delete
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          scope: tf-replay
    response:
      status: 200
      body: null
