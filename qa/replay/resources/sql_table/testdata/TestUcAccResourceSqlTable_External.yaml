          body: null
        response: *response_3 # Inferred API response; not recorded.
      - request:
          method: POST
          path: /api/2.0/sql/statements
          headers:
            X-Databricks-Workspace-Id: '12345'
          body:
            json:
              on_wait_timeout: CANCEL
              statement: |-
                CREATE TABLE `main`.`replay`.`bar` (`id` int, `name` string)
                USING DELTA
                COMMENT 'this table is managed by terraform'
                LOCATION 's3://replay-bucket/somereplay';
              wait_timeout: 50s
              warehouse_id: warehouse-1
        response: &response_5 # Inferred API response; not recorded.
