# Pins that response fields outside the schema don't reach the state. The create
# response and both reads carry latest_versions, user_id, both timestamps and a field
# the classic client doesn't know; the first read has a known permission_level and the
# second one a value outside the SDK's enum, which the classic client keeps as a plain
# string without validating it. The state is the same as after a refresh answered
# without any of them, and both plan nothing. API responses are synthetic: inferred
# from the MLflow Model Registry API, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_answered_with_extra_fields_keeps_only_schema_attributes
    config: &config |
      resource "databricks_mlflow_model" "this" {
        name        = "decode_model"
        description = "first description"

        tags {
          key   = "team"
          value = "replay"
        }
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "decode_model", "description": "first description",
                   "tags": [{"key": "team", "value": "replay"}]}
        response:
          status: 200
          body:
            json: {"registered_model": {
                     "name": "decode_model",
                     "description": "first description",
                     "tags": [{"key": "team", "value": "replay"}],
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "latest_versions": [],
                     "field_added_later": {"nested": true}}}
      - request: &read_request
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [decode_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "decode_model",
                     "id": "0123456789abcdef0123456789abcdef",
                     "description": "first description",
                     "tags": [{"key": "team", "value": "replay"}],
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000003000,
                     "permission_level": "CAN_MANAGE",
                     "latest_versions": [{
                       "name": "decode_model",
                       "version": "1",
                       "creation_timestamp": 1700000001000,
                       "last_updated_timestamp": 1700000002000,
                       "current_stage": "None",
                       "source": "dbfs:/databricks/mlflow-tracking/1/abc/artifacts/model",
                       "run_id": "0123456789abcdef0123456789abcdef",
                       "status": "READY",
                       "user_id": "replay-admin@example.com"}],
                     "field_added_later": {"nested": true}}}
      - request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "decode_model",
                     "id": "0123456789abcdef0123456789abcdef",
                     "description": "first description",
                     "tags": [{"key": "team", "value": "replay"}],
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000003000,
                     "permission_level": "CAN_DO_SOMETHING_NEW",
                     "latest_versions": [],
                     "field_added_later": {"nested": true}}}
    state: &state
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: decode_model
            - path: [name]
              equals: decode_model
            - path: [registered_model_id]
              equals: 0123456789abcdef0123456789abcdef
            - path: [description]
              equals: first description
            - path: [tags, 0, key]
              equals: team
            - path: [tags, 0, value]
              equals: replay
  - name: refresh_answered_without_extra_fields_has_the_same_state_and_plans_nothing
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state: *state
    calls:
      - &read_without_extra_fields
        request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "decode_model",
                     "id": "0123456789abcdef0123456789abcdef",
                     "description": "first description",
                     "tags": [{"key": "team", "value": "replay"}]}}
destroy:
  calls:
    - *read_without_extra_fields
    - request:
        method: DELETE
        path: /api/2.0/mlflow/registered-models/delete
        query:
          name: [decode_model]
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
