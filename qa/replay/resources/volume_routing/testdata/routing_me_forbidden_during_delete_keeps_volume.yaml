# Pins SCIM /Me answering 403 while Delete builds the volume's workspace client, on a
# workspace-level provider whose host metadata has no workspace ID. Removing the volume
# from the configuration plans a delete, and the plan's refresh checks
# provider_config.workspace_id through /Me. Apply starts a fresh client whose /Me call
# fails, so Delete fails before any DELETE, and the volume stays in state with its
# workspace ID. routing_me_not_found_during_destroy_skips_delete.yaml pins the 404, which
# Delete treats as an already deleted volume instead. API responses are inferred from
# the Unity Catalog and SCIM API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
steps:
  - name: create_checks_workspace_id_through_me
    config: |
      resource "databricks_volume" "this" {
        name         = "me_delete_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - &me
        request: &me_request
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          body: null
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: "12345"
          body:
            json: {"id": "1001", "userName": "replay-admin@example.com",
                   "schemas": ["urn:ietf:params:scim:schemas:core:2.0:User"]}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "me_delete_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "me_delete_volume",
                           "full_name": "main.replay.me_delete_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1739",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001739"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.me_delete_volume
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *me
      - *read_volume
  - name: delete_fails_before_delete_call_when_me_is_forbidden
    config: &config_empty |
      provider "databricks" {}
    expect_error: 'Error: cannot delete volume: failed to validate workspace_id: failed to
      get the workspace_id: Caller cannot read /Me'
    calls:
      # The plan's refresh.
      - *me
      - *read_volume
      # The apply: no DELETE follows the failing /Me.
      - request: *me_request
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "Caller cannot read /Me"}
  - name: volume_stays_in_state_and_next_plan_deletes_it
    plan_only: true
    config: *config_empty
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete]
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.me_delete_volume
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
    calls:
      # The refresh plan.
      - *me
      - *read_volume
destroy:
  calls:
    - *me
    - *read_volume
    - *me
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.me_delete_volume
        body: null
      response:
        status: 200
        body:
          json: {}
