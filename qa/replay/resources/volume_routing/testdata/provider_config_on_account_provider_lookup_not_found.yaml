# Pins an account-level provider whose workspace lookup answers 404. The provider
# falls back to the account host and still sends each volume call with the
# X-Databricks-Workspace-Id header of provider_config.workspace_id. Every Terraform
# command that touches the volume makes the failing lookup once, as with a found
# workspace. TestVolumeAccountProviderWorkspaceHost in
# catalog/resource_volume_workspace_host_test.go pins that the fallback keeps the
# account host. API responses are inferred from the account and Unity Catalog API
# contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_after_lookup_not_found_routes_with_workspace_header
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "databricks_volume" "this" {
        name         = "lookup_not_found_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - &lookup_not_found
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          body: null
        response:
          status: 404
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Workspace 12345 does not exist"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "lookup_not_found_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "lookup_not_found_volume",
                           "full_name": "main.replay.lookup_not_found_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-76",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000076"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.lookup_not_found_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *lookup_not_found
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
destroy:
  calls:
    - *lookup_not_found
    - *read_volume
    - *lookup_not_found
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.lookup_not_found_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
