# Pins how the classic SDK parses an HTML error page whose status line has no reason
# phrase on a databricks_volume refresh GET. The SDK takes the error code from the reason
# phrase, so a bare "HTTP/1.1 404" gives the code UNKNOWN, which the SDK maps to an
# internal error rather than to a missing resource. The refresh then fails with the
# <pre> text, trimmed of spaces and dots, and keeps the volume, so the next step reads it
# again. The same page with the "Not Found" reason phrase gives the code NOT_FOUND, which
# the SDK does not map, so the 404 status removes the volume from state. Neither is
# retried. API responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_volume" "this" {
        name         = "html_404_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "html_404_volume", "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "html_404_volume", "full_name": "main.replay.html_404_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-304",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000304"}
      - &read_volume
        request: &read
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.html_404_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *volume
      - *read_volume
  - name: refresh_answered_html_404_without_reason_phrase_fails_and_keeps_volume
    config: *config
    expect_error: 'Error: cannot read volume: Volume main\.replay\.html_404_volume was
      not found\n'
    calls:
      - request: *read
        response:
          status: 404
          status_line: HTTP/1.1 404
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: &not_found_page "<html><head><title>Error 404</title></head><body>
              <h2>HTTP ERROR 404</h2><pre>Volume main.replay.html_404_volume was not
              found.</pre></body></html>"
  - name: refresh_answered_html_404_with_reason_phrase_plans_create
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls:
      - request: *read
        response:
          status: 404
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: *not_found_page
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.html_404_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
