# Pins a failed read after a successful create POST. A GET answered 403 or 500 fails the
# apply with its exact diagnostic, but the model is already in state and tainted: the
# next plan replaces it, and the next apply deletes it before it sends the POST again.
# API responses are synthetic: inferred from the MLflow Model Registry API, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: read_after_create_answered_403_fails
    config: &config |
      resource "databricks_mlflow_model" "this" {
        name        = "error_create_read_model"
        description = "Pins read-after-create errors"
      }
    expect_error: 'Error: cannot read mlflow model: User does not have permission
      ''CAN_READ'' on registered model ''error_create_read_model''\.\n'
    calls:
      - &create
        request:
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "error_create_read_model",
                   "description": "Pins read-after-create errors"}
        response:
          status: 200
          body:
            json: {"registered_model": {"name": "error_create_read_model",
                                        "description": "Pins read-after-create errors",
                                        "creation_timestamp": 1700000000000,
                                        "last_updated_timestamp": 1700000000000,
                                        "user_id": "tester@example.com"}}
      - request: &read_request
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [error_create_read_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "User does not have permission 'CAN_READ' on registered
                     model 'error_create_read_model'."}
  - name: plan_after_403_replaces_tainted_model
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [delete, create]
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: error_create_read_model
    calls:
      - &read_first
        request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "error_create_read_model",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e811",
                     "description": "Pins read-after-create errors",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "tester@example.com",
                     "permission_level": "CAN_MANAGE"}}
  - name: replace_deletes_model_then_read_after_create_answered_500_fails
    config: *config
    expect_error: 'Error: cannot read mlflow model: An internal error occurred while
      reading the registered model\.\n'
    calls:
      - *read_first
      - &delete
        request:
          method: DELETE
          path: /api/2.0/mlflow/registered-models/delete
          query:
            name: [error_create_read_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {}
      - *create
      - request: *read_request
        response:
          status: 500
          body:
            json: {"error_code": "INTERNAL_ERROR",
                   "message": "An internal error occurred while reading the registered
                     model."}
  - name: plan_after_500_replaces_tainted_model
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [delete, create]
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: error_create_read_model
    calls:
      - &read_second
        request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "error_create_read_model",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e812",
                     "description": "Pins read-after-create errors",
                     "creation_timestamp": 1700000100000,
                     "last_updated_timestamp": 1700000100000,
                     "user_id": "tester@example.com",
                     "permission_level": "CAN_MANAGE"}}
destroy:
  calls:
    - *read_second
    - *delete
