# Placeholder API responses; not recorded.
version: 1
host_metadata: {workspace_id: "12345"}
steps:
  - name: create
    config: |
      resource "databricks_group" "this" {
        display_name = "Example group"
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/preview/scim/v2/Groups
          body:
            json:
              displayName: Example group
              schemas: [urn:ietf:params:scim:schemas:core:2.0:Group]
              entitlements: [{}]
        response:
          status: 201
          body:
            json: {id: group-id}
      - &read_group
        request:
          method: GET
          path: /api/2.0/preview/scim/v2/Groups/group-id
          query:
            attributes: ["displayName,externalId,entitlements"]
          body: null
        response:
          status: 200
          body:
            json: {id: group-id, displayName: Example group, entitlements: []}
      - *read_group
  - name: import
    # Defaults to the existing resource ID and the last applied configuration.
    import:
      resource: databricks_group.this
    calls:
      # The SDKv2 importer reads once, then Terraform refreshes the imported state.
      - *read_group
      - *read_group
destroy:
  calls:
    - *read_group
    - request:
        method: DELETE
        path: /api/2.0/preview/scim/v2/Groups/group-id
        body: null
      response:
        status: 204
        body: null
