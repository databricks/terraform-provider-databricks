# This journey pins a refresh GET that gets a 429 until retry_timeout_seconds ends. The
# SDK backs off between attempts and, once the timeout ends, fails the refresh with the
# last 429's message. The volume stays in state, so the next plan is empty. With a 5 s
# timeout, attempts start at 0 s, 1.05-1.75 s and 3.1-4.5 s, so the refresh sends two or
# three GETs, each 1 to 4 s after the one before. API responses are inferred from the
# Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      provider "databricks" {
        retry_timeout_seconds = 5
      }
      resource "databricks_volume" "this" {
        name         = "retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "retry_volume", "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "retry_volume", "full_name": "main.replay.retry_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-191",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000191"}
      - &read_volume
        request: &read
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *volume
      - *read_volume
  - name: refresh_retries_429_until_the_retry_timeout_ends
    config: *config
    expect_error: 'Error: cannot read volume: Too many requests from fixture\n'
    calls:
      - request: *read
        response:
          status: 429
          body:
            json: {"error_code": "TOO_MANY_REQUESTS",
                   "message": "Too many requests from fixture"}
        times: {min: 2, max: 3}
        min_gap: 1s
        max_gap: 4s
  - name: plan_after_failed_refresh_keeps_the_volume
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.retry_volume
    calls:
      - *read_volume
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
