# Runs volume/testdata/update_shape_owner_set_to_empty.yaml with databricks_volume on sdk-
# go uc/volumes/v1 in every step, and expects the same behavior. The volume requests carry
# no Accept header, which an empty header expectation pins. Each PATCH body also carries
# full_name_arg, the full name in its path, because sdk-go serializes the path field into
# the body. The original's description:
#
# Pins changing only owner to "". SDKv2 treats an empty string for the computed owner
# as unset, so the plan is empty, apply sends no PATCH and state keeps the remote owner.
# API responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_owner
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "owner_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "data-engineers"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "owner_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "owner_volume", "full_name": "main.replay.owner_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-18901",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000018901"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.owner_volume",
                   "owner": "data-engineers"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "owner_volume",
                            "full_name": "main.replay.owner_volume",
                            "volume_type": "MANAGED", "owner": "data-engineers",
                            "storage_location": "s3://replay-metastore/volume-18901",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000018901"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: owner_set_to_empty_sends_no_patch
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_empty_owner |
      resource "databricks_volume" "this" {
        name         = "owner_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = ""
      }
    plan:
      expect: empty
      changes: {}
    calls:
      # The plan's refresh and the post-apply refresh plan.
      - *read_created
      - *read_created
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [owner]
              equals: data-engineers
  - name: plan_after_empty_owner_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_empty_owner
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.owner_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
          Accept: ""
        body: null
      response:
        status: 200
        body:
          json: {}
