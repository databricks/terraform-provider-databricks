# Pins a volume full name containing "/" on the existing path. The journey imports
# main.replay.raw/2, updates its comment and destroys it. The provider keeps "/" as a
# path separator, so the GET, the PATCH and the DELETE go to .../volumes/main.replay.raw/2,
# one segment deeper than a volume path, instead of escaping it as %2F. volume_path
# replaces every "." with "/" and keeps the slash, so it reads /Volumes/main/replay/raw/2,
# the path of a file "2" in the volume main.replay.raw. API responses are inferred from
# the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: import_by_full_name_reads_the_slash_unescaped
    config: &config_imported |
      resource "databricks_volume" "this" {
        name         = "raw/2"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    import:
      resource: databricks_volume.this
      id: main.replay.raw/2
      persist: true
    calls:
      - &read_imported
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw/2
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "raw/2",
                   "full_name": "main.replay.raw/2", "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-19801",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000019801"}
      - *read_imported
  - name: plan_after_import_is_empty
    plan_only: true
    config: *config_imported
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.raw/2
            - path: [volume_path]
              equals: /Volumes/main/replay/raw/2
    calls:
      - *read_imported
  - name: update_comment_patches_the_slash_unescaped
    config: |
      resource "databricks_volume" "this" {
        name         = "raw/2"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "slash"
      }
    calls:
      - *read_imported
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.raw/2
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "slash"}
        response:
          status: 200
          body:
            json: &commented {"catalog_name": "main", "schema_name": "replay",
                              "name": "raw/2", "full_name": "main.replay.raw/2",
                              "volume_type": "MANAGED", "comment": "slash",
                              "owner": "replay-admin@example.com",
                              "storage_location": "s3://replay-metastore/volume-19801",
                              "metastore_id": "11111111-1111-1111-1111-111111111111",
                              "volume_id": "00000000-0000-4000-8000-000000019801"}
      - &read_commented
        request: *read_request
        response:
          status: 200
          body:
            json: *commented
      - *read_commented
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.raw/2
            - path: [volume_path]
              equals: /Volumes/main/replay/raw/2
destroy:
  calls:
    - *read_commented
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.raw/2
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
