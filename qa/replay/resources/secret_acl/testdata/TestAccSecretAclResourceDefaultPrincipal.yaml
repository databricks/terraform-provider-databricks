# API responses are inferred from the scenarios and API models, not recorded.
version: 1
host_metadata: # Dummy host metadata.
  host_type: workspace
  cloud: AWS
  workspace_id: '12345'
steps:
  - name: overwrite_default_principal
    config: |
      resource "databricks_secret_scope" "app" {
        name                     = "app-replay"
        initial_manage_principal = "users"
      }
      resource "databricks_secret_acl" "ds_can_read_app" {
        principal  = "users"
        permission = "READ"
        scope      = databricks_secret_scope.app.name
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/secrets/scopes/create
          headers:
            X-Databricks-Workspace-Id: '12345'
          body:
            json:
              initial_manage_principal: users
              scope: app-replay
              scope_backend_type: DATABRICKS
        response: &response_1 # Inferred API response; not recorded.
          body: null
          status: 200
      - &call_1
        request:
          method: GET
          path: /api/2.0/secrets/scopes/list
          headers:
            X-Databricks-Workspace-Id: '12345'
          body: null
        response: # Inferred API response; not recorded.
          body:
            json:
              scopes:
                - backend_type: DATABRICKS
                  name: app-replay
          status: 200
      - request:
          method: POST
          path: /api/2.0/secrets/acls/put
          headers:
            X-Databricks-Workspace-Id: '12345'
          body:
            json:
              permission: READ
              principal: users
              scope: app-replay
        response: *response_1 # Inferred API response; not recorded.
      - &call_2
        request:
          method: GET
          path: /api/2.0/secrets/acls/get
          query:
            principal: [users]
            scope: [app-replay]
          headers:
            X-Databricks-Workspace-Id: '12345'
          body: null
        response: # Inferred API response; not recorded.
          body:
            json:
              permission: READ
              principal: users
          status: 200
      - *call_1
      - *call_2
    state:
      resources:
        databricks_secret_acl.ds_can_read_app:
          attributes:
            - path: [principal]
              equals: users
            - path: [permission]
              equals: READ
destroy:
  calls:
    - *call_1
    - *call_2
    - request:
        method: POST
        path: /api/2.0/secrets/acls/delete
        headers:
          X-Databricks-Workspace-Id: '12345'
        body:
          json:
            principal: users
            scope: app-replay
      response: *response_1 # Inferred API response; not recorded.
    - request:
        method: POST
        path: /api/2.0/secrets/scopes/delete
        headers:
          X-Databricks-Workspace-Id: '12345'
        body:
          json:
            scope: app-replay
      response: *response_1 # Inferred API response; not recorded.
