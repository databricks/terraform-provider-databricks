# This journey pins that an account-level provider on an AWS account domain sends the
# owner PATCH after create, and the owner and fields PATCHes of an update, to the
# workspace's deployment host that the account lookup finds, as it does the POST, GET
# and DELETE. Every command that touches the volume makes the lookup on the account
# host, without an X-Databricks-Workspace-Id header, and every volume call carries the
# workspace's X-Databricks-Workspace-Id header. API responses are inferred from the
# account and Unity Catalog API contracts, not recorded.
version: 1
enforce_call_order: true
provider_host: account
hosts:
  account:
    url: https://accounts.cloud.databricks.com
  workspace:
    url: https://replay-workspace-12345.cloud.databricks.com
    metadata:
      host_type: workspace
      cloud: AWS
      workspace_id: "12345"
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_sends_the_owner_patch_to_the_workspace_host
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "databricks_volume" "this" {
        name         = "routing_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "data-engineers"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - &lookup
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          matchers:
            headers:
              X-Databricks-Workspace-Id: absent
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 12345,
                   "workspace_name": "replay-workspace-12345",
                   "deployment_name": "replay-workspace-12345",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          host: workspace
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "routing_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "routing_volume", "full_name": "main.replay.routing_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-1920",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001920"}
      - request:
          method: PATCH
          host: workspace
          path: /api/2.1/unity-catalog/volumes/main.replay.routing_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"owner": "data-engineers"}
        response: &volume_data_engineers
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "routing_volume", "full_name": "main.replay.routing_volume",
                   "volume_type": "MANAGED", "owner": "data-engineers",
                   "storage_location": "s3://replay-metastore/volume-1920",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001920"}
      - &read_data_engineers
        request: &read
          method: GET
          host: workspace
          path: /api/2.1/unity-catalog/volumes/main.replay.routing_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *volume_data_engineers
      - *lookup
      - *read_data_engineers
  - name: update_sends_the_owner_and_fields_patches_to_the_workspace_host
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "databricks_volume" "this" {
        name         = "routing_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "data-stewards"
        comment      = "routed comment"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - *lookup
      - *read_data_engineers
      - *lookup
      - request:
          method: PATCH
          host: workspace
          path: /api/2.1/unity-catalog/volumes/main.replay.routing_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"owner": "data-stewards"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "routing_volume", "full_name": "main.replay.routing_volume",
                   "volume_type": "MANAGED", "owner": "data-stewards",
                   "storage_location": "s3://replay-metastore/volume-1920",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001920"}
      - request:
          method: PATCH
          host: workspace
          path: /api/2.1/unity-catalog/volumes/main.replay.routing_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "routed comment"}
        response: &volume_data_stewards
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "routing_volume", "full_name": "main.replay.routing_volume",
                   "volume_type": "MANAGED", "owner": "data-stewards",
                   "comment": "routed comment",
                   "storage_location": "s3://replay-metastore/volume-1920",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001920"}
      - &read_data_stewards
        request: *read
        response: *volume_data_stewards
      - *lookup
      - *read_data_stewards
destroy:
  calls:
    - *lookup
    - *read_data_stewards
    - *lookup
    - request:
        method: DELETE
        host: workspace
        path: /api/2.1/unity-catalog/volumes/main.replay.routing_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
