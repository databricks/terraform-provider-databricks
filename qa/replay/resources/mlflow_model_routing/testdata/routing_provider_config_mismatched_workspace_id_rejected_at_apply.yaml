# Pins provider_config.workspace_id different from the workspace of a workspace-level
# provider. The plan succeeds without any call, and apply fails on the mismatch before
# any model call. Host metadata supplies the provider's workspace ID, so no SCIM /Me
# call happens either. The journey makes no call, so it has no API fixtures; its host
# metadata is synthetic.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: plan_with_mismatched_workspace_id_succeeds
    plan_only: true
    config: &config |
      resource "databricks_mlflow_model" "this" {
        name = "routing_mismatched_ws_model"
        provider_config {
          workspace_id = "67890"
        }
      }
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [create]
          after:
            - path: [provider_config, 0, workspace_id]
              equals: "67890"
    calls: []
  - name: apply_with_mismatched_workspace_id_fails_before_model_call
    config: *config
    expect_error: 'cannot create mlflow model: failed to validate workspace_id:
      workspace_id mismatch: provider is configured for workspace 12345 but got 67890 in
      provider_config\. please check the workspace_id provided in provider_config'
    calls: []
destroy:
  calls: []
