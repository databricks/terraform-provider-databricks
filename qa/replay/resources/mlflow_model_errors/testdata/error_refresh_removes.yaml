# Pins the refresh errors that count as a missing model. A GET answered 404
# RESOURCE_DOES_NOT_EXIST, 404 with another error code or 400 RESOURCE_DOES_NOT_EXIST
# raises no diagnostic: the refresh drops the model from state, the plan creates it, and
# the same apply sends the POST again. Each recreated model gets a new id, which the
# state check reads back. API responses are synthetic: inferred from the MLflow Model
# Registry API, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_mlflow_model" "this" {
        name        = "error_refresh_removes_model"
        description = "Pins refresh errors that remove the model"
      }
    calls:
      - &create
        request:
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "error_refresh_removes_model",
                   "description": "Pins refresh errors that remove the model"}
        response:
          status: 200
          body:
            json: {"registered_model": {
                     "name": "error_refresh_removes_model",
                     "description": "Pins refresh errors that remove the model",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "tester@example.com"}}
      - &read_first
        request: &read_request
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [error_refresh_removes_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "error_refresh_removes_model",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e821",
                     "description": "Pins refresh errors that remove the model",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "tester@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read_first
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [registered_model_id]
              equals: 0a1b2c3d4e5f60718293a4b5c6d7e821
  - name: refresh_answered_404_resource_does_not_exist_removes_and_recreates
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [create]
    calls:
      - request: *read_request
        response:
          status: 404
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "RegisteredModel 'error_refresh_removes_model' does not
                     exist. It might have been deleted."}
      - *create
      - &read_second
        request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "error_refresh_removes_model",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e822",
                     "description": "Pins refresh errors that remove the model",
                     "creation_timestamp": 1700000100000,
                     "last_updated_timestamp": 1700000100000,
                     "user_id": "tester@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read_second
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [registered_model_id]
              equals: 0a1b2c3d4e5f60718293a4b5c6d7e822
  - name: refresh_answered_404_with_another_error_code_removes_and_recreates
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [create]
    calls:
      - request: *read_request
        response:
          status: 404
          body:
            json: {"error_code": "FEATURE_DISABLED",
                   "message": "Workspace Model Registry is disabled for this
                     workspace."}
      - *create
      - &read_third
        request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "error_refresh_removes_model",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e823",
                     "description": "Pins refresh errors that remove the model",
                     "creation_timestamp": 1700000200000,
                     "last_updated_timestamp": 1700000200000,
                     "user_id": "tester@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read_third
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [registered_model_id]
              equals: 0a1b2c3d4e5f60718293a4b5c6d7e823
  - name: refresh_answered_400_resource_does_not_exist_removes_and_recreates
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [create]
    calls:
      - request: *read_request
        response:
          status: 400
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "RegisteredModel 'error_refresh_removes_model' does not
                     exist. It might have been deleted."}
      - *create
      - &read_fourth
        request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "error_refresh_removes_model",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e824",
                     "description": "Pins refresh errors that remove the model",
                     "creation_timestamp": 1700000300000,
                     "last_updated_timestamp": 1700000300000,
                     "user_id": "tester@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read_fourth
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [registered_model_id]
              equals: 0a1b2c3d4e5f60718293a4b5c6d7e824
destroy:
  calls:
    - *read_fourth
    - request:
        method: DELETE
        path: /api/2.0/mlflow/registered-models/delete
        query:
          name: [error_refresh_removes_model]
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
