# Pins a GET that returns a name other than the one it was asked for. Read copies the
# returned name into the state and leaves the ID alone, so the refreshed state has the
# requested name as its ID and the returned name as its name. name forces replacement,
# so the next plan replaces the model, and that apply sends the DELETE with the ID, not
# with the name from the state. API responses are synthetic: inferred from the MLflow
# Model Registry API, not recorded; a registry isn't expected to answer a get by name
# with another name.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_mlflow_model" "this" {
        name        = "decode_model"
        description = "first description"
      }
    calls:
      - &create
        request:
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "decode_model", "description": "first description"}
        response:
          status: 200
          body:
            json: {"registered_model": {
                     "name": "decode_model",
                     "description": "first description",
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000}}
      - &read
        request: &read_request
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [decode_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "decode_model",
                     "id": "0123456789abcdef0123456789abcdef",
                     "description": "first description",
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "permission_level": "CAN_MANAGE"}}
      - *read
    state: &state
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: decode_model
            - path: [name]
              equals: decode_model
            - path: [registered_model_id]
              equals: 0123456789abcdef0123456789abcdef
  - name: refresh_answered_another_name_puts_it_in_state_and_plans_replacement
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [delete, create]
          before:
            - path: [id]
              equals: decode_model
            - path: [name]
              equals: another_model
          after:
            - path: [name]
              equals: decode_model
            - path: [id]
              unknown: true
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: decode_model
            - path: [name]
              equals: another_model
            - path: [registered_model_id]
              equals: 0123456789abcdef0123456789abcdef
    calls:
      - &read_another_name
        request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "another_model",
                     "id": "0123456789abcdef0123456789abcdef",
                     "description": "first description",
                     "user_id": "replay-admin@example.com",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "permission_level": "CAN_MANAGE"}}
  - name: apply_after_another_name_deletes_by_id_and_creates_the_model_again
    config: *config
    plan:
      changes:
        databricks_mlflow_model.this:
          actions: [delete, create]
    calls:
      - *read_another_name
      - &delete
        request:
          method: DELETE
          path: /api/2.0/mlflow/registered-models/delete
          query:
            name: [decode_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {}
      - *create
      - *read
      - *read
    state: *state
destroy:
  calls:
    - *read
    - *delete
