              id: 33333333-3333-3333-3333-333333333333
              isolation_mode: ISOLATION_MODE_OPEN
              metastore_id: 11111111-1111-4111-8111-111111111111
              name: cred-replay
              owner: replay-admin
          status: 200
      - &call_3
        request:
          method: GET
          path: /api/2.1/unity-catalog/storage-credentials/cred-replay
          headers:
            X-Databricks-Workspace-Id: '12345'
          body: null
        response: *response_2 # Inferred API response; not recorded.
      - request:
          method: POST
          path: /api/2.1/unity-catalog/external-locations
          headers:
            X-Databricks-Workspace-Id: '12345'
          body:
            json:
              comment: Managed by TF
              credential_name: cred-replay
              name: external-replay
              url: s3://replay-bucket/somereplay
        response: &response_3 # Inferred API response; not recorded.
          body:
