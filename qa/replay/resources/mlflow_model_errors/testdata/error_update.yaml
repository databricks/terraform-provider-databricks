# Pins update PATCH failures. A PATCH answered 400, 403 or 404 fails the apply with its
# exact diagnostic and is sent once. The model stays in state, and the next plan, whose
# refresh reads the unchanged description, plans the same update again. After the 404
# the model is gone, so the next refresh drops it and the plan creates it. API responses
# are synthetic: inferred from the MLflow Model Registry API, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: |
      resource "databricks_mlflow_model" "this" {
        name        = "error_update_model"
        description = "Before the update"
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "error_update_model", "description": "Before the update"}
        response:
          status: 200
          body:
            json: {"registered_model": {"name": "error_update_model",
                                        "description": "Before the update",
                                        "creation_timestamp": 1700000000000,
                                        "last_updated_timestamp": 1700000000000,
                                        "user_id": "tester@example.com"}}
      - &read_unchanged
        request: &read_request
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [error_update_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "error_update_model",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e841",
                     "description": "Before the update",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "tester@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read_unchanged
  - name: update_patch_answered_400_fails
    config: &config_updated |
      resource "databricks_mlflow_model" "this" {
        name        = "error_update_model"
        description = "After the update"
      }
    expect_error: 'Error: cannot update mlflow model: Invalid description for registered
      model ''error_update_model''\.\n'
    calls:
      - *read_unchanged
      - request: &update_request
          method: PATCH
          path: /api/2.0/mlflow/registered-models/update
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "error_update_model", "description": "After the update"}
        response:
          status: 400
          body:
            json: {"error_code": "INVALID_PARAMETER_VALUE",
                   "message": "Invalid description for registered model
                     'error_update_model'."}
  - name: plan_after_400_updates_again
    plan_only: true
    config: *config_updated
    plan: &plan_update
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [update]
          before:
            - path: [description]
              equals: Before the update
          after:
            - path: [description]
              equals: After the update
    state: &state_unchanged
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: error_update_model
            - path: [description]
              equals: Before the update
    calls:
      - *read_unchanged
  - name: update_patch_answered_403_fails
    config: *config_updated
    expect_error: 'Error: cannot update mlflow model: User does not have permission
      ''CAN_EDIT'' on registered model ''error_update_model''\.\n'
    calls:
      - *read_unchanged
      - request: *update_request
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "User does not have permission 'CAN_EDIT' on registered
                     model 'error_update_model'."}
  - name: plan_after_403_updates_again
    plan_only: true
    config: *config_updated
    plan: *plan_update
    state: *state_unchanged
    calls:
      - *read_unchanged
  - name: update_patch_answered_404_fails
    config: *config_updated
    expect_error: 'Error: cannot update mlflow model: RegisteredModel
      ''error_update_model'' does not exist\. It might have been deleted\.\n'
    calls:
      - *read_unchanged
      - request: *update_request
        response: &gone
          status: 404
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "RegisteredModel 'error_update_model' does not exist. It
                     might have been deleted."}
  - name: plan_after_404_drops_the_model_and_creates_it
    plan_only: true
    config: *config_updated
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [create]
    calls:
      - &read_gone
        request: *read_request
        response: *gone
destroy:
  calls:
    - *read_gone
