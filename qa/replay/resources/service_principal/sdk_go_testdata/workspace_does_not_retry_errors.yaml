# Runs workspace_does_not_retry_errors with reads and writes through sdk-go scim/v1.
# Errors without a transient message make one attempt and fail with the same diagnostics
# as on the existing path: 400 and 409 on create, 401, 500 and 502 on refresh, and 403 and
# 404 on the update PUT. The GETs carry no attributes query, Accept or Content-Type
# header, so the API returns the full object. Writes send Content-Type application/json
# and no Accept header, and PUT bodies also carry the ID. API responses are inferred from
# the SCIM API contract and a gateway error, not recorded. An empty header expectation
# matches only requests without that header.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_answered_400_fails
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: &config |
      resource "databricks_service_principal" "this" {
        display_name = "SPN errors"
      }
    expect_error: 'Error: cannot create service principal: Request violates the
      ServicePrincipal schema\.'
    calls:
      - request: &create_request
          method: POST
          path: /api/2.0/preview/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "displayName": "SPN errors", "active": true, "entitlements": [{}]}
        response:
          status: 400
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Request violates the ServicePrincipal schema.",
                   "status": "400"}
  - name: create_answered_409_fails
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: *config
    expect_error: 'Error: cannot create service principal: Service principal SPN errors
      already exists\.'
    calls:
      - request: *create_request
        response:
          status: 409
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Service principal SPN errors already exists.",
                   "status": "409"}
  - name: create
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: *config
    calls:
      - request: *create_request
        response:
          status: 201
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN errors", "active": true}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.0/preview/scim/v2/ServicePrincipals/201
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
            Content-Type: ""
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN errors", "active": true}
      - *read_created
  - name: refresh_answered_401_fails
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: *config
    expect_error: 'Error: cannot read service principal: Invalid access token\.'
    calls:
      - request: *read_request
        response:
          status: 401
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Invalid access token.", "status": "401"}
  - name: refresh_answered_500_fails
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: *config
    expect_error: 'Error: cannot read service principal: Internal server error\.'
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Internal server error.", "status": "500"}
  - name: refresh_answered_502_fails
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: *config
    expect_error: 'Error: cannot read service principal: Bad Gateway'
    calls:
      - request: *read_request
        response:
          status: 502
          body:
            text: Bad Gateway
  - name: update_put_answered_403_fails
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: &renamed_config |
      resource "databricks_service_principal" "this" {
        display_name = "SPN errors renamed"
      }
    expect_error: 'Error: cannot update service principal: User is not authorized to
      update this service principal\.'
    calls:
      - *read_created
      - &read_groups_and_roles
        request:
          method: GET
          path: /api/2.0/preview/scim/v2/ServicePrincipals/201
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
            Content-Type: ""
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN errors", "active": true}
      - request: &update_request
          method: PUT
          path: /api/2.0/preview/scim/v2/ServicePrincipals/201
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"id": "201",
                   "schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "displayName": "SPN errors renamed", "active": true,
                   "entitlements": [{}]}
        response:
          status: 403
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "User is not authorized to update this service principal.",
                   "status": "403"}
  - name: update_put_answered_404_fails
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: *renamed_config
    expect_error: 'Error: cannot update service principal: Service Principal with id 201
      not found\.'
    calls:
      - *read_created
      - *read_groups_and_roles
      - request: *update_request
        response:
          status: 404
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Service Principal with id 201 not found.", "status": "404"}
  - name: state_kept_after_failed_update
    sdk_implementations:
      databricks_service_principal: sdk_go
    plan_only: true
    config: *renamed_config
    plan:
      expect: non_empty
      changes:
        databricks_service_principal.this:
          actions: [update]
    state:
      resources:
        databricks_service_principal.this:
          attributes:
            - path: [id]
              equals: "201"
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.0/preview/scim/v2/ServicePrincipals/201
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 204
        body: null
