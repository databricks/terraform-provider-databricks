# Pins an account-level provider with provider_config.workspace_id. Every Terraform
# command that touches the volume first looks up the workspace through the account
# API, then sends each volume call with that workspace's X-Databricks-Workspace-Id
# header. Replay serves every host from one local server, so the SDK keeps the account
# host for the workspace client; TestVolumeAccountProviderWorkspaceHost in
# catalog/resource_volume_workspace_host_test.go pins the workspace host on a real
# account domain. Import doesn't see the resource configuration, so without a
# provider-level workspace_id it fails before any call. API responses are inferred from
# the account and Unity Catalog API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_routes_through_workspace_lookup
    config: &config |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "databricks_volume" "this" {
        name         = "account_routed_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - &lookup_12345
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 12345,
                   "workspace_name": "replay-workspace-12345",
                   "deployment_name": "replay-workspace-12345",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "account_routed_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "account_routed_volume",
                           "full_name": "main.replay.account_routed_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-75",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000075"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.account_routed_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *lookup_12345
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: import_without_provider_workspace_id_fails_before_any_call
    import:
      resource: databricks_volume.this
      persist: false
    expect_error: 'cannot read volume: managing a workspace-level resource requires a
      workspace_id, but none was found'
    calls: []
destroy:
  calls:
    - *lookup_12345
    - *read_volume
    - *lookup_12345
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.account_routed_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
