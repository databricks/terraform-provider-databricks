# This journey pins connection resets on the fields PATCH of an update that changes only
# the comment. The SDK retries "connection reset by peer" as a transient URL error,
# resending the same body, so an update whose first PATCH is reset succeeds on the retry.
# When every PATCH is reset, apply fails with the last reset once retry_timeout_seconds
# ends, the volume keeps its last applied comment, and the next plan shows the same
# update again. Three seconds allow exactly two attempts: the retry starts 1.05 to 1.75
# seconds after the first attempt, and a third attempt could start no sooner than 3.1
# seconds after it. API responses are inferred from the Unity Catalog API contract, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: |
      provider "databricks" {
        retry_timeout_seconds = 3
      }
      resource "databricks_volume" "this" {
        name         = "connection_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "connection_volume", "volume_type": "MANAGED",
                   "comment": "first"}
        response: &volume_first
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "connection_volume",
                   "full_name": "main.replay.connection_volume",
                   "volume_type": "MANAGED", "comment": "first",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-299",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000299"}
      - &read_first
        request: &read
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.connection_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *volume_first
      - *read_first
  - name: update_patch_retried_once_after_a_reset
    config: |
      provider "databricks" {
        retry_timeout_seconds = 3
      }
      resource "databricks_volume" "this" {
        name         = "connection_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second"
      }
    calls:
      - *read_first
      - request: &patch_second
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.connection_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "second"}
        response:
          fault: reset
      # The retry carries the same body as the reset attempt.
      - request: *patch_second
        response: &volume_second
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "connection_volume",
                   "full_name": "main.replay.connection_volume",
                   "volume_type": "MANAGED", "comment": "second",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-299",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000299"}
        min_gap: 1s
        max_gap: 3s
      - &read_second
        request: *read
        response: *volume_second
      - *read_second
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [comment]
              equals: second
  - name: update_patch_reset_until_the_retry_timeout_ends
    config: &config_third |
      provider "databricks" {
        retry_timeout_seconds = 3
      }
      resource "databricks_volume" "this" {
        name         = "connection_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "third"
      }
    expect_error: 'Error: cannot update volume: Patch
      "http://[\d.:]+/api/2\.1/unity-catalog/volumes/main\.replay\.connection_volume":
      read tcp [\d.:]+->[\d.:]+: read: connection reset by peer\n'
    calls:
      - *read_second
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.connection_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "third"}
        response:
          fault: reset
        times: 2
        min_gap: 1s
        max_gap: 3s
  - name: plan_after_exhausted_update_shows_the_same_update
    plan_only: true
    config: *config_third
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [comment]
              equals: second
          after:
            - path: [comment]
              equals: third
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.connection_volume
            - path: [comment]
              equals: second
    calls:
      - *read_second
destroy:
  calls:
    - *read_second
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.connection_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
