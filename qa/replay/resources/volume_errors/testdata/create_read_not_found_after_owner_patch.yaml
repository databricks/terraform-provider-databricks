# Pins a read after create that answers 404 RESOURCE_DOES_NOT_EXIST, with owner. The
# POST and the owner PATCH succeed, the GET fails, and apply fails with the GET's error.
# Terraform keeps the volume in state under its full name and marks it tainted, so the
# next plan refreshes it and plans a replacement. API responses are inferred from the
# Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: read_not_found_after_owner_patch_fails_apply
    config: &config |
      resource "databricks_volume" "this" {
        name         = "unread_owned_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "data-engineers"
      }
    expect_error: 'Error: cannot read volume: Volume ''main\.replay\.unread_owned_volume''
      does not exist\.'
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "unread_owned_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "unread_owned_volume",
                   "full_name": "main.replay.unread_owned_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-1731",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001731"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.unread_owned_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"owner": "data-engineers"}
        response:
          status: 200
          body:
            json: &owned {"catalog_name": "main", "schema_name": "replay",
                          "name": "unread_owned_volume",
                          "full_name": "main.replay.unread_owned_volume",
                          "volume_type": "MANAGED", "owner": "data-engineers",
                          "storage_location": "s3://replay-metastore/volume-1731",
                          "metastore_id": "11111111-1111-1111-1111-111111111111",
                          "volume_id": "00000000-0000-4000-8000-000000001731"}
      - request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.unread_owned_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 404
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Volume 'main.replay.unread_owned_volume' does not exist."}
  - name: next_plan_replaces_tainted_volume
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete, create]
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.unread_owned_volume
            - path: [owner]
              equals: data-engineers
    calls:
      - &read_volume
        request: *read_request
        response:
          status: 200
          body:
            json: *owned
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.unread_owned_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
