# This journey pins an owner PATCH after a successful create POST whose response is held
# past http_timeout_seconds. The SDK fails the PATCH with its inactivity timeout and
# doesn't retry it: a second PATCH would be an unexpected call. Apply fails, but the
# volume stays in state under its full name and is tainted, so the next plan replaces
# it. API responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: owner_patch_after_create_past_the_http_timeout_is_not_retried
    config: &config |
      provider "databricks" {
        http_timeout_seconds = 1
      }
      resource "databricks_volume" "this" {
        name         = "retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "owner-a@example.com"
      }
    expect_error: 'Error: cannot create volume: Patch
      "http://[^"]+/api/2\.1/unity-catalog/volumes/main\.replay\.retry_volume": request
      timed out after 1s of inactivity\n'
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "retry_volume", "volume_type": "MANAGED"}
        response: &created
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "retry_volume", "full_name": "main.replay.retry_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-191",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000191"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"owner": "owner-a@example.com"}
        response:
          delay: 10s
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "retry_volume", "full_name": "main.replay.retry_volume",
                   "volume_type": "MANAGED", "owner": "owner-a@example.com",
                   "storage_location": "s3://replay-metastore/volume-191",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000191"}
  - name: plan_after_timed_out_owner_patch_replaces_the_tainted_volume
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete, create]
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.retry_volume
    calls:
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
