# Pins that state doesn't recover empty catalog_name, schema_name and name. The first
# read after the create omits them, so state holds empty values and the plan right
# after the apply isn't empty. A later read returns the values, but a refresh skips
# fields that are empty in state, so state keeps the empty values and the plan replaces
# the volume. This is a suspected defect, pinned as-is. API responses are inferred from
# the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_reads_back_empty_names
    config: &config |
      resource "databricks_volume" "this" {
        name         = "named_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    expect_error: 'After applying this test step, the non-refresh plan was not empty\.'
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "named_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "named_volume",
                            "full_name": "main.replay.named_volume",
                            "volume_type": "MANAGED",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-18912",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000018912"}
      - request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.named_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"full_name": "main.replay.named_volume", "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-18912",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000018912"}
  - name: refresh_keeps_empty_names_and_plans_replacement
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete, create]
          before:
            - path: [catalog_name]
              equals: ""
            - path: [schema_name]
              equals: ""
            - path: [name]
              equals: ""
          after:
            - path: [catalog_name]
              equals: main
            - path: [schema_name]
              equals: replay
            - path: [name]
              equals: named_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.named_volume
            - path: [catalog_name]
              equals: ""
            - path: [schema_name]
              equals: ""
            - path: [name]
              equals: ""
    calls:
      - &read_created
        request: *read_request
        response:
          status: 200
          body:
            json: *created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.named_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
