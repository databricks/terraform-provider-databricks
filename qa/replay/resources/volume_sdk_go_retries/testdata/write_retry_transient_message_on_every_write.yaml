# Runs volume_retries/testdata/write_retry_transient_message_on_every_write.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same behavior.
# The volume requests carry no Accept header, which an empty header expectation pins; the
# existing client sends one on POST, GET and PATCH. Each PATCH body also carries
# full_name_arg, the full name in its path, because sdk-go serializes the path field into
# the body. The original's description:
#
# This journey pins that the classic SDK client retries every databricks_volume write
# once when a 400's message matches one of its transient patterns: the create POST, the
# owner PATCH after create, the update PATCH, the rollback PATCH and the DELETE. Each
# "Timed out after" error is followed by exactly one identical request that succeeds,
# so a create POST that the server had already applied is sent again. API responses are
# inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_owner_retries_post_and_owner_patch
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "write_retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first"
        owner        = "owner-a@example.com"
      }
    calls:
      - request: &create
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "write_retry_volume", "volume_type": "MANAGED",
                   "comment": "first"}
        response: &transient_error
          status: 400
          body:
            json: {"error_code": "BAD_REQUEST",
                   "message": "Timed out after 30 seconds waiting for the metastore"}
      - request: *create
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "write_retry_volume",
                   "full_name": "main.replay.write_retry_volume",
                   "volume_type": "MANAGED", "comment": "first",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volumes/write_retry_volume",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000194"}
      - request: &owner_patch_on_create
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.write_retry_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.write_retry_volume",
                   "comment": "first", "owner": "owner-a@example.com"}
        response: *transient_error
      - request: *owner_patch_on_create
        response: &volume_owner_a
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "write_retry_volume",
                   "full_name": "main.replay.write_retry_volume",
                   "volume_type": "MANAGED", "comment": "first",
                   "owner": "owner-a@example.com",
                   "storage_location": "s3://replay-metastore/volumes/write_retry_volume",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000194"}
      - request: &read
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.write_retry_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response: *volume_owner_a
      - request: *read
        response: *volume_owner_a
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.write_retry_volume
            - path: [owner]
              equals: owner-a@example.com
  - name: update_owner_and_comment_retries_update_patch
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_owner_b |
      resource "databricks_volume" "this" {
        name         = "write_retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second"
        owner        = "owner-b@example.com"
      }
    calls:
      - request: *read
        response: *volume_owner_a
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.write_retry_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.write_retry_volume",
                   "owner": "owner-b@example.com"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "write_retry_volume",
                   "full_name": "main.replay.write_retry_volume",
                   "volume_type": "MANAGED", "comment": "first",
                   "owner": "owner-b@example.com",
                   "storage_location": "s3://replay-metastore/volumes/write_retry_volume",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000194"}
      # The retried update PATCH succeeds, so the owner change is not rolled back.
      - request: &update_patch
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.write_retry_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.write_retry_volume",
                   "comment": "second"}
        response: *transient_error
      - request: *update_patch
        response: &volume_owner_b
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "write_retry_volume",
                   "full_name": "main.replay.write_retry_volume",
                   "volume_type": "MANAGED", "comment": "second",
                   "owner": "owner-b@example.com",
                   "storage_location": "s3://replay-metastore/volumes/write_retry_volume",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000194"}
      - request: *read
        response: *volume_owner_b
      - request: *read
        response: *volume_owner_b
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [owner]
              equals: owner-b@example.com
            - path: [comment]
              equals: second
  # A rejected update PATCH after an owner change makes the provider restore the previous
  # owner. The rollback PATCH is retried like any other write, and apply reports the
  # update PATCH's own error.
  - name: rejected_update_retries_rollback_patch
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_owner_c |
      resource "databricks_volume" "this" {
        name         = "write_retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "third"
        owner        = "owner-c@example.com"
      }
    expect_error: 'Error: cannot update volume: Comment rejected by fixture\n'
    calls:
      - request: *read
        response: *volume_owner_b
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.write_retry_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.write_retry_volume",
                   "owner": "owner-c@example.com"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "write_retry_volume",
                   "full_name": "main.replay.write_retry_volume",
                   "volume_type": "MANAGED", "comment": "second",
                   "owner": "owner-c@example.com",
                   "storage_location": "s3://replay-metastore/volumes/write_retry_volume",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000194"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.write_retry_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.write_retry_volume",
                   "comment": "third"}
        response:
          status: 400
          body:
            json: {"error_code": "INVALID_PARAMETER_VALUE",
                   "message": "Comment rejected by fixture"}
      - request: &rollback_patch
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.write_retry_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.write_retry_volume",
                   "owner": "owner-b@example.com"}
        response: *transient_error
      - request: *rollback_patch
        response: *volume_owner_b
  - name: plan_after_retried_rollback_shows_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_owner_c
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [owner]
              equals: owner-b@example.com
            - path: [comment]
              equals: second
          after:
            - path: [owner]
              equals: owner-c@example.com
            - path: [comment]
              equals: third
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.write_retry_volume
    calls:
      - request: *read
        response: *volume_owner_b
destroy:
  calls:
    - request: *read
      response: *volume_owner_b
    - request: &delete
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.write_retry_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
          Accept: ""
        body: null
      response: *transient_error
    - request: *delete
      response:
        status: 200
        body:
          json: {}
