# Runs volume/testdata/routing_resource_workspace_id_overrides_provider_workspace_id.yaml
# with databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same
# behavior. The volume requests carry no Accept header, which an empty header expectation
# pins. The original's description:
#
# Pins an account-level provider whose provider-level workspace_id differs from the
# resource's provider_config.workspace_id. Create, refresh and delete look up and route
# through the resource's workspace, and state keeps the resource's ID. Import doesn't
# see the resource configuration, so it looks up and routes through the provider-level
# workspace instead. API responses are inferred from the account and Unity Catalog API
# contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_routes_through_resource_workspace_id
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {
        account_id   = "replay-account"
        workspace_id = "12345"
      }
      resource "databricks_volume" "this" {
        name         = "override_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "67890"
        }
      }
    calls:
      - &lookup_67890
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/67890
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 67890,
                   "workspace_name": "replay-workspace-67890",
                   "deployment_name": "replay-workspace-67890",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "67890"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "override_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "override_volume",
                           "full_name": "main.replay.override_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1902",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001902"}
      - &read_in_67890
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.override_volume
          headers:
            X-Databricks-Workspace-Id: "67890"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *lookup_67890
      - *read_in_67890
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "67890"
  - name: import_routes_through_provider_workspace_id
    sdk_implementations:
      databricks_volume: sdk_go
    import:
      resource: databricks_volume.this
      persist: false
    calls:
      - request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 12345,
                   "workspace_name": "replay-workspace-12345",
                   "deployment_name": "replay-workspace-12345",
                   "workspace_status": "RUNNING"}
      - &read_in_12345
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.override_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read_in_12345
destroy:
  calls:
    - *lookup_67890
    - *read_in_67890
    - *lookup_67890
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.override_volume
        headers:
          X-Databricks-Workspace-Id: "67890"
          Accept: ""
        body: null
      response:
        status: 200
        body:
          json: {}
