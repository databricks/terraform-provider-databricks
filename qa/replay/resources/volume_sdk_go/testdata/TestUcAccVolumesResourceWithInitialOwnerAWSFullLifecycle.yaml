              name: "name-def"
              owner: "replay-test_metastore_admin_group_name"
              schema_name: "schema-replay"
              storage_location: "s3://replay-bucket/somepath-replay"
              volume_id: "volume-1"
              volume_type: "EXTERNAL"
      - &get_6
        request:
          method: "GET"
          path: "/api/2.1/unity-catalog/volumes/main.schema-replay.name-def"
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response: *response_8
      - *get_1
      - *get_2
      - *get_3
