# Runs volume/testdata/schema_name_with_dot.yaml with databricks_volume on sdk-go
# uc/volumes/v1 in every step, and expects the same behavior. The volume POST and GET
# requests carry no Accept header, which an empty header expectation pins. The original's
# description:
#
# Pins a volume whose name contains a dot. Create sends the name as is, the ID is the
# four-part full name, refreshes and the DELETE put it in the path unchanged, and
# volume_path turns every dot into a slash. An update fails with the exact invalid id
# error before any PATCH, yet state keeps the unapplied comment: SDKv2 saves the
# planned values when Update fails, and Read doesn't clear a comment the API omits. So
# the next plan is empty and the update is never retried. The fixtures are synthetic:
# whether Unity Catalog accepts a dot in a volume name isn't known.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_dot_in_name_keeps_the_four_part_id
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "a.b"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "a.b", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "a.b", "full_name": "main.replay.a.b",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1885",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001885"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.a.b
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.a.b
            - path: [name]
              equals: a.b
            - path: [volume_path]
              equals: /Volumes/main/replay/a/b
  - name: plan_after_create_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_volume
  - name: update_fails_with_invalid_id_before_any_patch
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_commented |
      resource "databricks_volume" "this" {
        name         = "a.b"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "dotted"
      }
    expect_error: 'Error: cannot update volume: invalid id <main\.replay\.a\.b>: id
      should be in the format catalog\.schema\.volume\n'
    calls:
      - *read_volume
  - name: plan_after_failed_update_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_commented
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.a.b
            - path: [comment]
              equals: dotted
            - path: [volume_path]
              equals: /Volumes/main/replay/a/b
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.a.b
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
