# Pins create POST failures. A POST answered 400 RESOURCE_ALREADY_EXISTS, 403
# PERMISSION_DENIED or 404 FEATURE_DISABLED fails with its exact diagnostic and leaves
# nothing in state: the next plan creates the model without reading it, and the next
# apply sends the POST again. API responses are synthetic: inferred from the MLflow Model
# Registry API, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_answered_400_resource_already_exists_fails
    config: &config |
      resource "databricks_mlflow_model" "this" {
        name        = "error_create_model"
        description = "Pins create errors"
      }
    expect_error: 'Error: cannot create mlflow model: Registered model
      ''error_create_model'' already exists\.\n'
    calls:
      - request: &create_request
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "error_create_model", "description": "Pins create errors"}
        response:
          status: 400
          body:
            json: {"error_code": "RESOURCE_ALREADY_EXISTS",
                   "message": "Registered model 'error_create_model' already exists."}
  - name: plan_after_400_creates_again
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [create]
    calls: []
  - name: create_answered_403_permission_denied_fails
    config: *config
    expect_error: 'Error: cannot create mlflow model: User does not have permission to
      create registered models\.\n'
    calls:
      - request: *create_request
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "User does not have permission to create registered
                     models."}
  - name: plan_after_403_creates_again
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [create]
    calls: []
  - name: create_answered_404_feature_disabled_fails
    config: *config
    expect_error: 'Error: cannot create mlflow model: Workspace Model Registry is
      disabled for this workspace\.\n'
    calls:
      - request: *create_request
        response:
          status: 404
          body:
            json: {"error_code": "FEATURE_DISABLED",
                   "message": "Workspace Model Registry is disabled for this
                     workspace."}
  - name: plan_after_404_creates_again
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [create]
    calls: []
  - name: create_after_failures_sends_post_again
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_mlflow_model.this:
          actions: [create]
    calls:
      - request: *create_request
        response:
          status: 200
          body:
            json: {"registered_model": {"name": "error_create_model",
                                        "description": "Pins create errors",
                                        "creation_timestamp": 1700000000000,
                                        "last_updated_timestamp": 1700000000000,
                                        "user_id": "tester@example.com"}}
      - &read_created
        request:
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [error_create_model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "error_create_model",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e801",
                     "description": "Pins create errors",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "tester@example.com",
                     "permission_level": "CAN_MANAGE"}}
      - *read_created
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: error_create_model
            - path: [registered_model_id]
              equals: 0a1b2c3d4e5f60718293a4b5c6d7e801
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.0/mlflow/registered-models/delete
        query:
          name: [error_create_model]
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
