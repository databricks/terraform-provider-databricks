# Pins a failing SCIM /Me call after an import reads the volume, on a workspace-level
# provider whose host metadata has no workspace ID and without a provider_config block.
# The importer's GET succeeds and its /Me call answers 403, but the importer drops that
# error, so Terraform's refresh of the imported volume repeats both calls and fails
# with the provider_config diagnostic. Nothing is imported: the next plan creates the
# volume without any call. API responses are inferred from the Unity Catalog and SCIM
# API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
steps:
  - name: me_failure_after_import_read_fails_import
    config: &config |
      resource "databricks_volume" "this" {
        name         = "me_import_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    import:
      resource: databricks_volume.this
      id: main.replay.me_import_volume
      persist: true
    expect_error: 'Error: cannot populate provider_config for volume: failed to resolve
      workspace_id: failed to get the workspace_id: Caller cannot read /Me'
    calls:
      # The importer.
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.me_import_volume
          body: null
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "me_import_volume",
                   "full_name": "main.replay.me_import_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-1734",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001734"}
      - &me_forbidden
        request:
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          body: null
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "Caller cannot read /Me"}
      # Terraform's refresh of the imported volume.
      - *read_volume
      - *me_forbidden
  - name: state_has_no_volume_after_failed_import
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls: []
destroy:
  calls: []
