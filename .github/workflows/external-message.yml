name: PR Comment

# WARNING:
# THIS WORKFLOW ALWAYS RUNS FOR EXTERNAL CONTRIBUTORS WITHOUT ANY APPROVAL.
# THIS WORKFLOW RUNS FROM MAIN BRANCH, NOT FROM THE PR BRANCH.
# DO NOT PULL THE PR OR EXECUTE ANY CODE FROM THE PR.

on:
  pull_request_target:
    types: [opened, reopened]
    branches:
      - main

jobs:
  comment-on-pr:
    # Release sync PRs come from branches in this repository; only PRs from forks get the notice.
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on:
      group: databricks-deco-testing-runner-group
      labels: ubuntu-latest-deco

    permissions:
      pull-requests: write

    steps:
      - name: Delete old comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete previous notices (including the retired fork-testing notice) if they exist
          previous_comment_ids=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select((.body | startswith("<!-- READ_ONLY_MIRROR -->")) or (.body | startswith("<!-- INTEGRATION_TESTS_MANUAL -->"))) | .id')
          echo "Previous comment IDs: $previous_comment_ids"
          if [ ! -z "$previous_comment_ids" ]; then
            echo "$previous_comment_ids" | while read -r comment_id; do
              echo "Deleting comment with ID: $comment_id"
              gh api "repos/${{ github.repository }}/issues/comments/$comment_id" -X DELETE
            done
          fi

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --body \
          "<!-- READ_ONLY_MIRROR -->
          ### This repository is a read-only mirror

          Thank you for your interest in the Databricks Terraform provider. This repository is a read-only mirror of the provider's source, published with each release, and it does not accept pull requests. This pull request will not be merged.

          To report a bug or request a feature, please open an issue: https://github.com/${{ github.repository }}/issues

          See [CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md#this-repository-is-a-mirror) for details.
          "
