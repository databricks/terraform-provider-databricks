# Runs volume_call_sites/testdata/call_site_update_owner_patch_errors.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same requests
# and behavior, except that an owner PATCH answered 200 with malformed JSON fails update
# with the same unmarshal error, but without the existing client's request log, so its
# pattern ends at the error. The original's description:
#
# Pins Update's first PATCH, the one that changes only the owner, failing with errors the
# classic SDK does not retry: 400 INVALID_PARAMETER_VALUE, 401, 403, 404, 409, 502, 504
# with a message that matches no transient pattern, and 200 with malformed JSON. Each
# update also renames the volume and changes its comment. Every failure fails apply with
# the owner PATCH's error and sends no fields PATCH, no owner rollback and no read. The
# volume keeps its old ID, so the next plan refreshes the old name and plans the same
# update again. API responses are inferred from the Unity Catalog API contract, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_owner
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "owner_update_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first"
        owner        = "owner-a@example.com"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "owner_update_volume", "volume_type": "MANAGED",
                   "comment": "first"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "owner_update_volume",
                   "full_name": "main.replay.owner_update_volume",
                   "volume_type": "MANAGED", "comment": "first",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-1923",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001923"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_update_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "first", "owner": "owner-a@example.com"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "owner_update_volume",
                            "full_name": "main.replay.owner_update_volume",
                            "volume_type": "MANAGED", "comment": "first",
                            "owner": "owner-a@example.com",
                            "storage_location": "s3://replay-metastore/volume-1923",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001923"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_update_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: owner_patch_400_fails_update_without_fields_patch_rollback_or_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_updated |
      resource "databricks_volume" "this" {
        name         = "owner_update_renamed"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second"
        owner        = "owner-b@example.com"
      }
    expect_error: 'Error: cannot update volume: Could not find principal with name
      owner-b@example\.com\.\n'
    calls:
      - *read_created
      - request: &owner_patch_request
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.owner_update_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"owner": "owner-b@example.com"}
        response:
          status: 400
          body:
            json: {"error_code": "INVALID_PARAMETER_VALUE",
                   "message": "Could not find principal with name owner-b@example.com."}
  - name: plan_after_400_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: &plans_the_same_update
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [name]
              equals: owner_update_volume
            - path: [comment]
              equals: first
            - path: [owner]
              equals: owner-a@example.com
          after:
            - path: [name]
              equals: owner_update_renamed
            - path: [comment]
              equals: second
            - path: [owner]
              equals: owner-b@example.com
    state: &old_id
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.owner_update_volume
    calls:
      - *read_created
  - name: owner_patch_401_fails_update_without_fields_patch_rollback_or_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Credential was not sent or was of an
      unsupported type for this API\.\n'
    calls:
      - *read_created
      - request: *owner_patch_request
        response:
          status: 401
          body:
            json: {"error_code": "UNAUTHENTICATED",
                   "message": "Credential was not sent or was of an unsupported type for
                     this API."}
  - name: plan_after_401_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: *plans_the_same_update
    state: *old_id
    calls:
      - *read_created
  - name: owner_patch_403_fails_update_without_fields_patch_rollback_or_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: User does not have MANAGE on Volume
      ''main\.replay\.owner_update_volume''\.\n'
    calls:
      - *read_created
      - request: *owner_patch_request
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "User does not have MANAGE on Volume
                     'main.replay.owner_update_volume'."}
  - name: plan_after_403_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: *plans_the_same_update
    state: *old_id
    calls:
      - *read_created
  - name: owner_patch_404_fails_update_without_fields_patch_rollback_or_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Volume
      ''main\.replay\.owner_update_volume'' does not exist\.\n'
    calls:
      - *read_created
      - request: *owner_patch_request
        response:
          status: 404
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Volume 'main.replay.owner_update_volume' does not exist."}
  - name: plan_after_404_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: *plans_the_same_update
    state: *old_id
    calls:
      - *read_created
  - name: owner_patch_409_fails_update_without_fields_patch_rollback_or_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Volume
      ''main\.replay\.owner_update_volume'' was modified concurrently\.\n'
    calls:
      - *read_created
      - request: *owner_patch_request
        response:
          status: 409
          body:
            json: {"error_code": "RESOURCE_CONFLICT",
                   "message": "Volume 'main.replay.owner_update_volume' was modified
                     concurrently."}
  - name: plan_after_409_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: *plans_the_same_update
    state: *old_id
    calls:
      - *read_created
  - name: owner_patch_502_fails_update_without_fields_patch_rollback_or_read
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Bad gateway\.\n'
    calls:
      - *read_created
      - request: *owner_patch_request
        response:
          status: 502
          body:
            json: {"error_code": "BAD_GATEWAY", "message": "Bad gateway."}
  - name: plan_after_502_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: *plans_the_same_update
    state: *old_id
    calls:
      - *read_created
  - name: owner_patch_504_with_a_non_transient_message_fails_update_without_retry
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Upstream request timeout\.\n'
    calls:
      - *read_created
      - request: *owner_patch_request
        response:
          status: 504
          body:
            json: {"error_code": "DEADLINE_EXCEEDED",
                   "message": "Upstream request timeout."}
  - name: plan_after_504_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: *plans_the_same_update
    state: *old_id
    calls:
      - *read_created
  - name: owner_patch_200_with_malformed_json_fails_update_without_fields_patch
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: failed to unmarshal response body:
      unexpected end of JSON input\n'
    calls:
      - *read_created
      - request: *owner_patch_request
        response:
          status: 200
          headers:
            Content-Type: application/json
          body:
            text: '{"full_name": "main.replay.owner_update_volume",'
  - name: plan_after_malformed_json_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: *plans_the_same_update
    state: *old_id
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.owner_update_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
