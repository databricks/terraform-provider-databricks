# Runs volume/testdata/retry_on_transient_error_messages.yaml with databricks_volume on
# sdk-go uc/volumes/v1 in every step, and expects the same behavior. The volume POST and
# GET requests carry no Accept header, which an empty header expectation pins. The
# original's description:
#
# Pins that the classic SDK client retries the refresh GET once when the error message
# matches one of its transient patterns, even with a 400, which it never retries by
# status. Each pattern gets one error followed by one identical GET that succeeds. The
# first eight are the SDK's transient message patterns; REQUEST_LIMIT_EXCEEDED is the
# substring its workspace client adds. API responses are inferred from the Unity Catalog
# API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: unknown_worker_environment_exception_and_no_associated_worker_environments
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "retry_volume",
                   "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "retry_volume",
                   "full_name": "main.replay.retry_volume", "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volumes/00000000-0000-4000-8000-000000000002",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000002"}
      - request: &read
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 400
          body:
            json: {"error_code": "BAD_REQUEST",
                   "message": "com.databricks.backend.manager.util.UnknownWorkerEnvironmentException: from fixture"}
      - request: *read
        response: *volume
      - request: *read
        response:
          status: 400
          body:
            json: {"error_code": "BAD_REQUEST",
                   "message": "Workspace does not have any associated worker environments"}
      - request: *read
        response: *volume
  - name: no_worker_environment_with_id
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: &empty_plan
      expect: empty
      changes: {}
    calls:
      - request: *read
        response:
          status: 400
          body:
            json: {"error_code": "BAD_REQUEST",
                   "message": "There is no worker environment with id 42"}
      - request: *read
        response: *volume
  - name: unknown_worker_environment
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *empty_plan
    calls:
      - request: *read
        response:
          status: 400
          body:
            json: {"error_code": "BAD_REQUEST", "message": "Unknown worker environment 42"}
      - request: *read
        response: *volume
  - name: cluster_not_ready_exception
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *empty_plan
    calls:
      - request: *read
        response:
          status: 400
          body:
            json: {"error_code": "BAD_REQUEST", "message": "ClusterNotReadyException: from fixture"}
      - request: *read
        response: *volume
  - name: worker_env_not_found
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *empty_plan
    calls:
      - request: *read
        response:
          status: 400
          body:
            json: {"error_code": "BAD_REQUEST", "message": "worker env 42 not found"}
      - request: *read
        response: *volume
  - name: timed_out_after
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *empty_plan
    calls:
      - request: *read
        response:
          status: 400
          body:
            json: {"error_code": "BAD_REQUEST", "message": "Timed out after 30 seconds"}
      - request: *read
        response: *volume
  - name: deadline_exceeded
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *empty_plan
    calls:
      - request: *read
        response:
          status: 400
          body:
            json: {"error_code": "BAD_REQUEST", "message": "context deadline exceeded"}
      - request: *read
        response: *volume
  - name: request_limit_exceeded_in_message
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan: *empty_plan
    calls:
      - request: *read
        response:
          status: 400
          body:
            json: {"error_code": "BAD_REQUEST",
                   "message": "REQUEST_LIMIT_EXCEEDED: from fixture"}
      - request: *read
        response: *volume
destroy:
  calls:
    - request: *read
      response: *volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
