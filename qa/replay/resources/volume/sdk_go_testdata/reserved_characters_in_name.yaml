# Pins a volume name with "#", which Unity Catalog allows. sdk-go escapes it, so its GETs
# read main.replay.raw%232 and plan no changes. The existing client puts the volume ID in
# the URL unescaped, so "#2" becomes a fragment that is never sent: on the existing path,
# the refresh GET reads main.replay.raw, whose 404 plans to create the volume again, and
# the DELETE also goes to main.replay.raw. Destroy follows the sdk-go create step, so its
# refresh reads through sdk-go and its DELETE, a write, through the existing client.
# API responses are inferred from the Unity Catalog API contract, not recorded. An empty
# header expectation matches only requests without that header.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_sdk_go_reads
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "raw#2"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "raw#2",
                   "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "raw#2", "full_name": "main.replay.raw#2",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-71",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000071"}
      - &read_sdk_go
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%232
          headers:
            Accept: ""
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read_sdk_go
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.raw#2
            - path: [volume_path]
              equals: /Volumes/main/replay/raw#2
  - name: plan_with_sdk_go_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_sdk_go
  - name: plan_on_existing_path_reads_the_name_before_the_hash
    sdk_implementations:
      databricks_volume: classic
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls:
      - request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw
          headers:
            Accept: application/json
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 404
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Volume 'main.replay.raw' does not exist."}
destroy:
  calls:
    - *read_sdk_go
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.raw
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 404
        body:
          json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                 "message": "Volume 'main.replay.raw' does not exist."}
