      body:
        json:
          catalog_name: main
          enable_predictive_optimization: INHERIT
          full_name: main.replay
          name: replay
          owner: replay-admin
  - request:
      method: POST
      path: /api/2.0/sql/statements
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          on_wait_timeout: CANCEL
          statement: |-
            CREATE TABLE `main`.`replay`.`bar` (`id` int, `name` string)
            COMMENT 'this table is managed by terraform'
            TBLPROPERTIES ('something'='else', 'this'='that');
          wait_timeout: 50s
          warehouse_id: warehouse-1
    response:
      status: 200
      body:
        json:
          statement_id: statement-1
          status:
            state: SUCCEEDED
  - request:
      method: PATCH
      path: /api/2.1/unity-catalog/tables/main.replay.bar
      headers:
