# Source: aws/service_principal_role_provider_config_test.go#TestAccServicePrincipalRole_ProviderConfig_EmptyID
# Generic provider_config validation; the resource is only a schema carrier.
# Random names are fixed because replay has no shared server.
# The original plan-only case fails in validation, before any apply or API call.
version: 1
# Inferred host metadata, not captured from a live workspace.
host_metadata:
  workspace_id: "12345"
steps:
  - name: reject_empty_workspace_id
    config: |
      resource "databricks_service_principal" "this" {
        display_name = "tf-test-sp"
      }
      resource "databricks_service_principal_role" "this" {
        service_principal_id = databricks_service_principal.this.id
        role                 = "arn:aws:iam::999999999999:role/fake-role"
        provider_config {
          workspace_id = ""
        }
      }
    expect_error: 'expected "provider_config.0.workspace_id" to not be an empty string'
    calls: []
destroy:
  calls: []
