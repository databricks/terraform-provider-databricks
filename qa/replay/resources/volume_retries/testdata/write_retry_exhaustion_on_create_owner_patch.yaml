# This journey pins an owner PATCH after a successful create POST that gets a 429 until
# retry_timeout_seconds ends. One second is shorter than the SDK's first backoff (1.05
# to 1.75 seconds), so exactly one PATCH is sent. Apply fails with the 429's message,
# but the volume stays in state under its full name and is tainted, so the next plan
# replaces it. API responses are inferred from the Unity Catalog API contract, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: owner_patch_after_create_retries_until_the_retry_timeout_ends
    config: &config |
      provider "databricks" {
        retry_timeout_seconds = 1
      }
      resource "databricks_volume" "this" {
        name         = "write_retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "owner-a@example.com"
      }
    expect_error: 'Error: cannot create volume: Too many requests\. Please wait a moment
      and try again\.\n'
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "write_retry_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "write_retry_volume",
                            "full_name": "main.replay.write_retry_volume",
                            "volume_type": "MANAGED",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-194",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000194"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.write_retry_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"owner": "owner-a@example.com"}
        response:
          status: 429
          body:
            json: {"error_code": "TOO_MANY_REQUESTS",
                   "message": "Too many requests. Please wait a moment and try again."}
  - name: plan_after_exhausted_owner_patch_replaces_the_tainted_volume
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete, create]
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.write_retry_volume
            - path: [owner]
              equals: replay-admin@example.com
    calls:
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.write_retry_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.write_retry_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
