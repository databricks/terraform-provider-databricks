# Runs volume_routing/testdata/routing_me_forbidden_during_refresh_keeps_volume.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same behavior.
# The volume POST requests carry no Accept header, which an empty header expectation pins.
# The original's description:
#
# Pins SCIM /Me answering 403 while a refresh builds the volume's workspace client, on
# a workspace-level provider whose host metadata has no workspace ID. The refresh checks
# provider_config.workspace_id against the provider's workspace through /Me, so the
# plan fails before the volume GET and state keeps the volume and its workspace ID. API
# responses are inferred from the Unity Catalog and SCIM API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
steps:
  - name: create_checks_workspace_id_through_me
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "me_forbidden_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - &me
        request: &me_request
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          body: null
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: "12345"
          body:
            json: {"id": "1001", "userName": "replay-admin@example.com",
                   "schemas": ["urn:ietf:params:scim:schemas:core:2.0:User"]}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "me_forbidden_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "me_forbidden_volume",
                           "full_name": "main.replay.me_forbidden_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1912",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001912"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.me_forbidden_volume
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *me
      - *read_volume
  - name: refresh_fails_when_me_is_forbidden
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'cannot read volume: failed to validate workspace_id: failed to get
      the workspace_id: Caller cannot read /Me'
    calls:
      - request: *me_request
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "Caller cannot read /Me"}
  - name: state_keeps_volume_and_workspace_id
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      # The refresh plan.
      - *me
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.me_forbidden_volume
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
destroy:
  calls:
    - *me
    - *read_volume
    - *me
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.me_forbidden_volume
        body: null
      response:
        status: 200
        body:
          json: {}
