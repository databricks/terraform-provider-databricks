# API responses are inferred from the scenarios and API models, not recorded.
# Switching from personal_access_token to personal_access_token_wo must remove the
# previously stored token from state. Also run this with GITHUB_TOKEN set: the
# env-var default must not replace the old token either.
version: 1
host_metadata: # Dummy host metadata.
  host_type: workspace
  cloud: AWS
  workspace_id: '12345'
steps:
  - name: plain_token
    config: |
      resource "databricks_git_credential" "this" {
        git_username          = "test"
        git_provider          = "gitHub"
        personal_access_token = "plain_token"
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/git-credentials
          headers:
            X-Databricks-Workspace-Id: '12345'
          body:
            json:
              git_provider: gitHub
              git_username: test
              personal_access_token: plain_token
        response: &credential # Inferred API response; not recorded.
          body:
            json:
              credential_id: 123
              git_provider: gitHub
              git_username: test
          status: 200
      - &get_credential
        request:
          method: GET
          path: /api/2.0/git-credentials/123
          headers:
            X-Databricks-Workspace-Id: '12345'
          body: null
        response: *credential # Inferred API response; not recorded.
      - *get_credential
  - name: switch_to_write_only
    config: |
      resource "databricks_git_credential" "this" {
        git_username                     = "test"
        git_provider                     = "gitHub"
        personal_access_token_wo         = "write_only_token"
        personal_access_token_wo_version = 1
      }
    plan:
      changes:
        databricks_git_credential.this:
          actions: [update]
          after:
            - path: [personal_access_token_wo_version]
              equals: 1
    calls:
      - *get_credential
      - request:
          method: PATCH
          path: /api/2.0/git-credentials/123
          headers:
            X-Databricks-Workspace-Id: '12345'
          body:
            json:
              git_provider: gitHub
              git_username: test
              personal_access_token: write_only_token
        response: # Inferred API response; not recorded.
          body: null
          status: 200
      - *get_credential
      - *get_credential
    state:
      resources:
        databricks_git_credential.this:
          attributes:
            # The token stored by the previous step is gone.
            - path: [personal_access_token]
              equals: ''
            - path: [personal_access_token_wo]
              equals: null
destroy:
  calls:
    - *get_credential
    - request:
        method: DELETE
        path: /api/2.0/git-credentials/123
        headers:
          X-Databricks-Workspace-Id: '12345'
        body: null
      response: # Inferred API response; not recorded.
        body: null
        status: 200
