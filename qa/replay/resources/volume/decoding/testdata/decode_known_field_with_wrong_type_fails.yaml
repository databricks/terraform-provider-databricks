# Pins that a refresh fails when a field the SDK defines but the resource doesn't map has a
# value of the wrong type: "browse_only": "true" is a string for a boolean. The SDK first
# decodes the value, then retries it as a quoted string, and reports the retry's error with
# a request log. The pattern checks its message, request line and echoed body, and skips
# the generated headers in between. The failed refresh leaves the state as it was, so the
# next plan is empty. API responses are inferred from the Unity Catalog API contract, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_volume" "this" {
        name         = "wrong_type_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "wrong_type_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "wrong_type_volume",
                            "full_name": "main.replay.wrong_type_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-197"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.wrong_type_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_with_browse_only_as_a_string_fails_with_request_log
    config: *config
    expect_error: 'Error: cannot read volume: failed to unmarshal response body: json:
      cannot unmarshal string into Go value of type bool\. This is likely a bug in the
      Databricks SDK for Go or the underlying REST API\. Please report this issue with the
      following debugging information to the SDK issue tracker at
      https://github\.com/databricks/databricks-sdk-go/issues\. Request log:\n```\nGET
      /api/2\.1/unity-catalog/volumes/main\.replay\.wrong_type_volume\n(?s:.*)<
      \{\n<   "browse_only": "true",\n<   "catalog_name": "main",\n'
    calls:
      - request: *read_request
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "wrong_type_volume",
                   "full_name": "main.replay.wrong_type_volume",
                   "volume_type": "MANAGED", "comment": "first comment",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-197",
                   "browse_only": "true"}
  - name: plan_after_the_failed_refresh_is_empty
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.wrong_type_volume
            - path: [volume_path]
              equals: /Volumes/main/replay/wrong_type_volume
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.wrong_type_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
