# Runs workspace_delete_with_disable_as_user_deletion with reads and writes through sdk-go
# scim/v1. No sdk-go request carries an Accept header, and its GETs carry no Content-Type
# header. Reads by ID send no attributes query. Writes send Content-Type application/json.
# PATCH bodies also carry the ID. An empty header expectation matches only requests
# without that header.
#
# Pins workspace-level deletion with disable_as_user_deletion = true on AWS: the
# provider deactivates the service principal with a PATCH instead of a DELETE. API
# responses are inferred from the SCIM API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_disable_as_user_deletion
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: |
      resource "databricks_service_principal" "this" {
        display_name             = "SPN disable"
        disable_as_user_deletion = true
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/preview/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "displayName": "SPN disable", "active": true, "entitlements": [{}]}
        response:
          status: 201
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN disable", "active": true}
      - &read_created
        request:
          method: GET
          path: /api/2.0/preview/scim/v2/ServicePrincipals/201
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
            Content-Type: ""
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN disable", "active": true}
      - *read_created
  - name: plan_after_create_is_empty
    sdk_implementations:
      databricks_service_principal: sdk_go
    plan_only: true
    config: |
      resource "databricks_service_principal" "this" {
        display_name             = "SPN disable"
        disable_as_user_deletion = true
      }
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_created
  - name: delete_disables_with_patch
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: |
      provider "databricks" {}
    calls:
      - *read_created
      - request:
          method: PATCH
          path: /api/2.0/preview/scim/v2/ServicePrincipals/201
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"id": "201",
                   "schemas": ["urn:ietf:params:scim:api:messages:2.0:PatchOp"],
                   "Operations": [{"op": "replace", "path": "active",
                                   "value": [{"value": "false"}]}]}
        response:
          status: 200
          body: null
  - name: plan_after_delete_disables_with_patch_is_empty
    sdk_implementations:
      databricks_service_principal: sdk_go
    plan_only: true
    config: |
      provider "databricks" {}
    plan:
      expect: empty
      changes: {}
    calls: []
destroy:
  calls: []
