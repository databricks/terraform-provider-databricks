      body:
        json:
          account_id: replay-account
          connection_state: ESTABLISHED
          deactivated: false
          enabled: true
          group_id: blob
          network_connectivity_config_id: ncc-1
          resource_id: /subscriptions/2a5a4578-9ca9-47e2-ba46-f6ee6cc731f2/resourceGroups/deco-prod-azure-eastus2-rg/providers/Microsoft.Storage/storageAccounts/decotestprodunity
          rule_id: rule-1
  - *id001
  - *id002
  state:
    resources:
      databricks_mws_ncc_private_endpoint_rule.this:
        attributes:
        - path:
          - connection_state
          equals: ESTABLISHED
- name: import
  provider_implementations:
    databricks_mws_ncc_private_endpoint_rule: plugin_framework
  calls:
  - *id002
