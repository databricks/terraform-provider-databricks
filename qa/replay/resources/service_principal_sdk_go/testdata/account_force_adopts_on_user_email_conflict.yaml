# Runs account_force_adopts_on_user_email_conflict with reads and writes through sdk-go
# scim/v1. No sdk-go request carries an Accept header, and its GETs carry no Content-Type
# header. Reads by ID send no attributes query, and the read before each PUT returns the
# full object. Writes send Content-Type application/json. PATCH and PUT bodies also carry
# the ID. Account-level POST and PUT bodies have no schemas, entitlements or groups, which
# the account-level scim/v1 model doesn't have. An empty header expectation matches only
# requests without that header.
#
# Pins account-level force = true on AWS when create answers 409 with the "User with
# email ... already exists in this account" SCIM detail and no scimType: the provider
# lists by applicationId, adopts the match and updates it with a PUT that carries
# applicationId. API responses are inferred from the SCIM API contract, not recorded. An
# empty X-Databricks-Workspace-Id expectation matches only requests without that header.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: force_adopts_existing_on_user_email_conflict
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: &config |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_service_principal" "this" {
        application_id = "00000000-0000-4000-8000-000000000001"
        display_name   = "SPN forced"
        force          = true
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: ""
            Accept: ""
          body:
            json: {"applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN forced", "active": true}
        response:
          status: 409
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "User with email 00000000-0000-4000-8000-000000000001
                              already exists in this account", "status": "409"}
      - request:
          method: GET
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals
          query:
            filter: ['applicationId eq "00000000-0000-4000-8000-000000000001"']
            excludedAttributes: [roles]
          headers:
            X-Databricks-Workspace-Id: ""
            Accept: ""
            Content-Type: ""
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:ListResponse"],
                   "totalResults": 1, "startIndex": 1, "itemsPerPage": 1,
                   "Resources": [{"id": "301",
                                  "applicationId": "00000000-0000-4000-8000-000000000001",
                                  "displayName": "SPN manual", "active": true,
                                  "groups": [{"display": "data-engineers",
                                              "type": "direct", "value": "401",
                                              "$ref": "Groups/401"}]}]}
      - request:
          method: GET
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/301
          headers:
            X-Databricks-Workspace-Id: ""
            Accept: ""
            Content-Type: ""
          body: null
        response:
          status: 200
          body:
            json: {"groups": [{"display": "data-engineers", "type": "direct",
                               "value": "401", "$ref": "Groups/401"}],
                   "roles": [{"type": "direct",
                              "value": "arn:aws:iam::123456789012:instance-profile/sp"}]}
      - request:
          method: PUT
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/301
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: ""
            Accept: ""
          body:
            json: {"id": "301", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN forced", "active": true,
                   "roles": [{"type": "direct",
                              "value": "arn:aws:iam::123456789012:instance-profile/sp"}]}
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "301", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN forced", "active": true}
      - &read_adopted
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/301
          headers:
            X-Databricks-Workspace-Id: ""
            Accept: ""
            Content-Type: ""
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "301", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN forced", "active": true}
      - *read_adopted
    state:
      resources:
        databricks_service_principal.this:
          attributes:
            - path: [id]
              equals: "301"
  - name: plan_after_force_adopt_is_empty
    sdk_implementations:
      databricks_service_principal: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_adopted
destroy:
  calls:
    - *read_adopted
    - request:
        method: PATCH
        path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/301
        headers:
          Content-Type: application/json
          X-Databricks-Workspace-Id: ""
          Accept: ""
        body:
          json: {"id": "301",
                 "schemas": ["urn:ietf:params:scim:api:messages:2.0:PatchOp"],
                 "Operations": [{"op": "replace", "path": "active",
                                 "value": [{"value": "false"}]}]}
      response:
        status: 200
        body: null
