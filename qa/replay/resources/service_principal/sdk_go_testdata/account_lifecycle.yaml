# Runs TestMwsAccServicePrincipalResourceOnAws with reads through sdk-go scim/v1:
# create, rename and the plans after them. The GETs carry no attributes query, Accept or
# Content-Type header, so the API returns the full object; writes stay on the existing
# path. API responses are inferred from the scenarios and API models, not recorded. An
# empty header expectation matches only requests without that header.
version: 1
enforce_call_order: true
host_metadata: # Dummy host metadata.
  host_type: "account"
  cloud: "AWS"
  account_id: "replay-account"
steps:
  - name: "create"
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_service_principal" "this" {
        display_name = "SPN initial"
      }
    calls:
      - request:
          method: "POST"
          path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals"
          headers:
            Content-Type: application/scim+json; charset=utf-8
            X-Databricks-Workspace-Id: ""
          body:
            json:
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"]
              displayName: "SPN initial"
              active: true
              entitlements:
                - {}
        response: # Inferred API response; not recorded.
          status: 201
          body:
            json:
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"]
              id: "201"
              displayName: "SPN initial"
              active: true
              entitlements: []
              applicationId: "00000000-0000-4000-8000-000000000001"
      - request:
          method: "GET"
          path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201"
          headers:
            X-Databricks-Workspace-Id: ""
            Accept: ""
            Content-Type: ""
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
