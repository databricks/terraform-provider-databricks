# API responses are inferred from the scenarios and API models, not recorded.
version: 1
host_metadata: # Dummy host metadata.
  host_type: "account"
  cloud: "AWS"
  account_id: "replay-account"
steps:
  - name: "assign"
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_service_principal" "this" {
        display_name = "TF replay1"
      }
      resource "databricks_mws_permission_assignment" "this" {
        workspace_id = 12345
        principal_id = databricks_service_principal.this.id
        permissions  = ["USER"]
      }
    calls:
      - request:
          method: "POST"
          path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals"
          body:
            json:
              active: true
              displayName: "TF replay1"
              entitlements:
                - {}
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"]
        response: &response_1 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              active: true
              applicationId: "11111111-1111-4111-8111-111111111111"
              displayName: "TF replay1"
              id: "201"
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"]
      - &get_1
        request:
          method: "GET"
          path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201"
          query:
            attributes: ["userName,displayName,active,externalId,entitlements"]
          body: null
        response: *response_1
      - request:
          method: "PUT"
          path: "/api/2.0/accounts/replay-account/workspaces/12345/permissionassignments/principals/201"
          body:
            json:
              permissions: ["USER"]
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              permissions: ["USER"]
      - &get_2
        request:
          method: "GET"
          path: "/api/2.0/accounts/replay-account/workspaces/12345/permissionassignments"
          body: null
        response: &response_2 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              permission_assignments:
                - permissions: ["USER"]
                  principal:
                    principal_id: 201
      - *get_1
      - *get_2
destroy:
  calls:
    - *get_1
    - *get_2
    - request:
        method: "DELETE"
        path: "/api/2.0/accounts/replay-account/workspaces/12345/permissionassignments/principals/201"
        body: null
      response: # Inferred API response; not recorded.
        status: 200
        body: null
    - request:
        method: "PATCH"
        path: "/api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201"
        body:
          json:
            Operations:
              - op: "replace"
                path: "active"
                value:
                  - value: "false"
            schemas: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
      response: # Inferred API response; not recorded.
        status: 200
        body: null
