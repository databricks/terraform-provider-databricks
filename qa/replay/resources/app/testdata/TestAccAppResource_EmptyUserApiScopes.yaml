  calls:
    - *call_1
    - *call_2
    - *call_3
    - request:
        method: DELETE
        path: /api/2.0/apps/tf-replay
        body: null
      response: *response_2 # Inferred API response; not recorded.
    - request:
        method: POST
        path: /api/2.0/secrets/delete
        body:
          json:
            key: tf-replay
            scope: tf-replay
      response: *response_1 # Inferred API response; not recorded.
    - request:
        method: POST
        path: /api/2.0/secrets/scopes/delete
        body:
          json:
            scope: tf-replay
      response: *response_1 # Inferred API response; not recorded.
