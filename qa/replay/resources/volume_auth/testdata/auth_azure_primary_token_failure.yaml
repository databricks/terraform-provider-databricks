# Pins a failing primary token on a databricks_volume refresh with an Azure client
# secret. Azure AD rejects the Azure Databricks token request, and the OAuth client
# sends it once more with the client ID and secret in the body instead of basic auth,
# which Azure AD rejects too. The refresh fails with the visitor's "inner token" error
# before the GET is sent, so no volume request and no management token request is made.
# The SDK cuts Azure AD's description at ". Trace ID" and appends its error URI. The
# volume stays in state, and the next plan is empty. Token and API responses are
# inferred from the Azure AD and Unity Catalog API contracts, not recorded.
version: 1
enforce_call_order: true
provider_host: workspace
hosts:
  workspace:
    url: https://adb-12345.6.azuredatabricks.net
  aad:
    url: https://login.microsoftonline.com
host_metadata:
  host_type: workspace
  cloud: Azure
  workspace_id: "12345"
auth:
  type: azure-client-secret
  azure_tenant_id: replay-tenant
  azure_client_id: replay-azure-sp
  azure_client_secret: replay-azure-secret
  azure_workspace_resource_id: /subscriptions/replay-subscription/resourceGroups/replay-group/providers/Microsoft.Databricks/workspaces/replay-workspace
steps:
  - name: create
    config: &config |
      resource "databricks_volume" "this" {
        name         = "auth_azure_primary_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - &databricks_token
        request: &databricks_token_request
          method: POST
          host: aad
          path: /replay-tenant/oauth2/token
          headers:
            Content-Type: application/x-www-form-urlencoded
          matchers: &client_secret
            headers:
              # base64 of replay-azure-sp:replay-azure-secret.
              Authorization: {pattern: 'Basic cmVwbGF5LWF6dXJlLXNwOnJlcGxheS1henVyZS1zZWNyZXQ='}
          body:
            text: grant_type=client_credentials&resource=2ff814a6-3304-4ab8-85cb-cd0e6f879c1d
        response:
          status: 200
          body:
            json: {"access_token": "aad-token", "token_type": "Bearer",
                   "expires_in": 3600}
      - &management_token
        request:
          method: POST
          host: aad
          path: /replay-tenant/oauth2/token
          headers:
            Content-Type: application/x-www-form-urlencoded
          matchers: *client_secret
          body:
            text: grant_type=client_credentials&resource=https%3A%2F%2Fmanagement.core.windows.net%2F
        response:
          status: 200
          body:
            json: {"access_token": "management-token", "token_type": "Bearer",
                   "expires_in": 3600}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: &credentials
            headers:
              Authorization: {pattern: 'Bearer aad-token'}
              X-Databricks-Azure-Sp-Management-Token: {pattern: 'management-token'}
              X-Databricks-Azure-Workspace-Resource-Id:
                pattern: '/subscriptions/replay-subscription/resourceGroups/replay-group/providers/Microsoft\.Databricks/workspaces/replay-workspace'
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "auth_azure_primary_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "auth_azure_primary_volume",
                            "full_name": "main.replay.auth_azure_primary_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "abfss://metastore@replaystorage.dfs.core.windows.net/volume-302",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000302"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.auth_azure_primary_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: *credentials
          body: null
        response:
          status: 200
          body:
            json: *created
      # Terraform's post-apply plan.
      - *databricks_token
      - *management_token
      - *read_created
  - name: refresh_fails_on_the_primary_token
    config: *config
    expect_error: 'Error: cannot read volume: failed during request visitor: inner token:
      Post "https://login\.microsoftonline\.com/replay-tenant/oauth2/token":
      AADSTS7000215: Invalid client secret provided\. Ensure the secret being sent in the
      request is the client secret value, not the client secret ID, for a secret added to
      app ''replay-azure-sp''\. See
      https://login\.microsoftonline\.com/error\?code=7000215\n'
    calls:
      - request: *databricks_token_request
        response: &invalid_client
          status: 401
          body:
            json: {"error": "invalid_client",
                   "error_description": "AADSTS7000215: Invalid client secret provided.
                     Ensure the secret being sent in the request is the client secret
                     value, not the client secret ID, for a secret added to app
                     'replay-azure-sp'. Trace ID: 00000000-0000-4000-8000-000000000001
                     Correlation ID: 00000000-0000-4000-8000-000000000002 Timestamp:
                     2026-11-19 00:00:00Z",
                   "error_codes": [7000215], "timestamp": "2026-11-19 00:00:00Z",
                   "trace_id": "00000000-0000-4000-8000-000000000001",
                   "correlation_id": "00000000-0000-4000-8000-000000000002",
                   "error_uri": "https://login.microsoftonline.com/error?code=7000215"}
      # The OAuth client's second attempt sends the client ID and secret in the body.
      - request:
          method: POST
          host: aad
          path: /replay-tenant/oauth2/token
          headers:
            Content-Type: application/x-www-form-urlencoded
          matchers:
            headers:
              Authorization: absent
          body:
            text: client_id=replay-azure-sp&client_secret=replay-azure-secret&grant_type=client_credentials&resource=2ff814a6-3304-4ab8-85cb-cd0e6f879c1d
        response: *invalid_client
  - name: state_kept_after_the_failed_refresh
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.auth_azure_primary_volume
            - path: [storage_location]
              equals: abfss://metastore@replaystorage.dfs.core.windows.net/volume-302
    calls:
      - *databricks_token
      - *management_token
      - *read_created
destroy:
  calls:
    # The refresh, then the destroy.
    - *databricks_token
    - *management_token
    - *read_created
    - *databricks_token
    - *management_token
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.auth_azure_primary_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        matchers: *credentials
        body: null
      response:
        status: 200
        body:
          json: {}
