version: 1
host_metadata: # Dummy host metadata.
  host_type: "account"
  cloud: "AWS"
  account_id: "replay-account"
steps:
  - name: "create"
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_budget" "this" {
        display_name = "tf-replay1"

        alert_configurations {
          time_period        = "MONTH"
          trigger_type       = "CUMULATIVE_SPENDING_EXCEEDED"
          quantity_type      = "LIST_PRICE_DOLLARS_USD"
          quantity_threshold = "840"

          action_configurations {
            action_type = "EMAIL_NOTIFICATION"
            target      = "me@databricks.com"
          }
        }

        filter {
          tags {
            key = "Environment"
            value {
              operator = "IN"
              values   = ["Testing"]
            }
          }

          workspace_id {
            operator = "IN"
            values = [
              12345
            ]
          }
        }
      }
    calls:
      - request:
          method: "POST"
          path: "/api/2.1/accounts/replay-account/budgets"
          body:
            json:
              budget:
                alert_configurations:
                  - action_configurations:
                      - action_type: "EMAIL_NOTIFICATION"
                        target: "me@databricks.com"
                    quantity_threshold: "840"
                    quantity_type: "LIST_PRICE_DOLLARS_USD"
                    time_period: "MONTH"
                    trigger_type: "CUMULATIVE_SPENDING_EXCEEDED"
                display_name: "tf-replay1"
                filter:
                  tags:
                    - key: "Environment"
                      value:
                        operator: "IN"
                        values: ["Testing"]
                  workspace_id:
                    operator: "IN"
                    values: [12345]
        response: &response_1 # Inferred API response; not recorded.
          status: 200
