# Pins how sdk-go handles a create POST or an update PATCH answered 200 with a body it
# can't decode. An empty body fails with "unexpected end of JSON input", where the existing
# client decodes it as a volume without fields and takes its empty full name as the ID. A
# body that isn't JSON fails with the existing client's message, without its request and
# response dump. A failed create leaves nothing in state, and a failed update keeps the
# volume under its ID, so the next plan shows the update again. The sdk-go requests carry
# no Accept header, which an empty header expectation pins, and the PATCH bodies also carry
# full_name_arg, the full name in their path. API responses are inferred from the Unity
# Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_answered_200_with_empty_body_fails
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_created |
      resource "databricks_volume" "this" {
        name         = "decode_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first"
      }
    expect_error: 'Error: cannot create volume: failed to unmarshal response body:
      unexpected end of JSON input'
    calls:
      - request: &create_request
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "decode_volume", "volume_type": "MANAGED", "comment": "first"}
        response:
          status: 200
          body: null
  - name: create_answered_200_with_undecodable_body_fails
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_created
    expect_error: 'Error: cannot create volume: failed to unmarshal response body: invalid
      character ''o'' in literal null \(expecting ''u''\)'
    calls:
      - request: *create_request
        response:
          status: 200
          body:
            text: not json
  - name: create_succeeds
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_created
    calls:
      - request: *create_request
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "decode_volume",
                            "full_name": "main.replay.decode_volume",
                            "volume_type": "MANAGED", "comment": "first",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-95",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000095"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.decode_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.decode_volume
  - name: update_answered_200_with_empty_body_fails
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_updated |
      resource "databricks_volume" "this" {
        name         = "decode_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second"
      }
    expect_error: 'Error: cannot update volume: failed to unmarshal response body:
      unexpected end of JSON input'
    calls:
      - *read_created
      - request: &update_request
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.decode_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.decode_volume", "comment": "second"}
        response:
          status: 200
          body: null
  - name: update_answered_200_with_undecodable_body_fails
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: failed to unmarshal response body: invalid
      character ''o'' in literal null \(expecting ''u''\)'
    calls:
      - *read_created
      - request: *update_request
        response:
          status: 200
          body:
            text: not json
  - name: plan_after_failed_updates_shows_the_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          after:
            - path: [comment]
              equals: second
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.decode_volume
            - path: [comment]
              equals: first
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.decode_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
