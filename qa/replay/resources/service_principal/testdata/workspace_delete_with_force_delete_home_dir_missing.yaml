# Pins workspace-level deletion with force_delete_home_dir = true on AWS when the home
# directory is already gone: the provider ignores the 404 for /Users/<application_id>.
# TestAccServicePrincipalHomeDeleteSuccess pins the 200 case. API responses are inferred
# from the SCIM API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_force_delete_home_dir
    config: |
      resource "databricks_service_principal" "this" {
        display_name          = "SPN cleanup"
        force_delete_home_dir = true
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/preview/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/scim+json; charset=utf-8
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "displayName": "SPN cleanup", "active": true, "entitlements": [{}]}
        response:
          status: 201
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN cleanup", "active": true}
      - &read_created
        request:
          method: GET
          path: /api/2.0/preview/scim/v2/ServicePrincipals/201
          query:
            attributes: ["userName,displayName,active,externalId,entitlements"]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN cleanup", "active": true}
      - *read_created
  - name: plan_after_create_with_force_delete_home_dir_is_empty
    plan_only: true
    config: |
      resource "databricks_service_principal" "this" {
        display_name          = "SPN cleanup"
        force_delete_home_dir = true
      }
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_created
  - name: delete_ignores_missing_home_dir_answered_404
    config: |
      provider "databricks" {}
    calls:
      - *read_created
      - request:
          method: DELETE
          path: /api/2.0/preview/scim/v2/ServicePrincipals/201
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 204
          body: null
      - request:
          method: POST
          path: /api/2.0/workspace/delete
          headers:
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"path": "/Users/00000000-0000-4000-8000-000000000001",
                   "recursive": true}
        response:
          status: 404
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Path (/Users/00000000-0000-4000-8000-000000000001)
                               doesn't exist."}
  - name: plan_after_delete_ignores_missing_home_dir_is_empty
    plan_only: true
    config: |
      provider "databricks" {}
    plan:
      expect: empty
      changes: {}
    calls: []
destroy:
  calls: []
