# This journey pins auth type basic when the provider also has a PAT and an OAuth client.
# The SDK configures only the username and password: every volume call sends them as
# basic auth, with no cloud credential headers, and reports auth/basic in its
# User-Agent. API responses are inferred from the Unity Catalog API contract, not
# recorded.
version: 1
enforce_call_order: true
provider_host: workspace
hosts:
  workspace:
    url: https://replay-workspace-12345.cloud.databricks.com
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
  oidc_endpoint: https://replay-workspace-12345.cloud.databricks.com/oidc
auth:
  type: basic
  token: replay-pat
  username: replay-user
  password: replay-password
  client_id: replay-sp
  client_secret: replay-secret
steps:
  - name: create_sends_only_basic_auth
    config: |
      resource "databricks_volume" "this" {
        name         = "auth_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Authorization: Basic cmVwbGF5LXVzZXI6cmVwbGF5LXBhc3N3b3Jk
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          matchers: &basic_only
            headers:
              User-Agent: {pattern: '.* resource/volume auth/basic( .*)?'}
              Metadata: absent
              X-Databricks-Azure-Sp-Management-Token: absent
              X-Databricks-Azure-Workspace-Resource-Id: absent
              X-Databricks-Gcp-Sa-Access-Token: absent
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "auth_volume", "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "auth_volume", "full_name": "main.replay.auth_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-199",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000199"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.auth_volume
          headers:
            Authorization: Basic cmVwbGF5LXVzZXI6cmVwbGF5LXBhc3N3b3Jk
            X-Databricks-Workspace-Id: "12345"
          matchers: *basic_only
          body: null
        response: *volume
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.auth_volume
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.auth_volume
        headers:
          Authorization: Basic cmVwbGF5LXVzZXI6cmVwbGF5LXBhc3N3b3Jk
          X-Databricks-Workspace-Id: "12345"
        matchers: *basic_only
        body: null
      response:
        status: 200
        body:
          json: {}
