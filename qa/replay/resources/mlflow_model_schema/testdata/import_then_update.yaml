# Pins adopting an existing model by importing it into the journey's state by name, then
# changing its description with a PATCH that carries the name and the new description.
# API responses are inferred from the MLflow Model Registry API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: import_existing_model
    config: &config_imported |
      resource "databricks_mlflow_model" "this" {
        name        = "existing-model"
        description = "created outside terraform"
      }
    import:
      resource: databricks_mlflow_model.this
      id: existing-model
      persist: true
    calls:
      # The importer's GET, then the refresh GET after import.
      - &read_existing
        request: &read_request
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [existing-model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "existing-model",
                     "description": "created outside terraform",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "replay-admin@example.com",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e8f2",
                     "permission_level": "CAN_MANAGE"}}
      - *read_existing
  - name: plan_after_import_is_empty
    plan_only: true
    config: *config_imported
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: existing-model
            - path: [name]
              equals: existing-model
            - path: [description]
              equals: created outside terraform
            - path: [registered_model_id]
              equals: 0a1b2c3d4e5f60718293a4b5c6d7e8f2
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
    calls:
      - *read_existing
  - name: update_description_after_import
    config: &config_updated |
      resource "databricks_mlflow_model" "this" {
        name        = "existing-model"
        description = "managed by terraform"
      }
    plan:
      changes:
        databricks_mlflow_model.this:
          actions: [update]
          before:
            - path: [description]
              equals: created outside terraform
          after:
            - path: [description]
              equals: managed by terraform
    calls:
      - *read_existing
      - request:
          method: PATCH
          path: /api/2.0/mlflow/registered-models/update
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "existing-model", "description": "managed by terraform"}
        response:
          status: 200
          body:
            json: {"registered_model": {"name": "existing-model",
                                        "description": "managed by terraform",
                                        "creation_timestamp": 1700000000000,
                                        "last_updated_timestamp": 1700000600000,
                                        "user_id": "replay-admin@example.com"}}
      - &read_updated
        request: *read_request
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "existing-model",
                     "description": "managed by terraform",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000600000,
                     "user_id": "replay-admin@example.com",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e8f2",
                     "permission_level": "CAN_MANAGE"}}
      - *read_updated
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [description]
              equals: managed by terraform
            - path: [registered_model_id]
              equals: 0a1b2c3d4e5f60718293a4b5c6d7e8f2
  - name: plan_after_update_is_empty
    plan_only: true
    config: *config_updated
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_updated
destroy:
  calls:
    - *read_updated
    - request:
        method: DELETE
        path: /api/2.0/mlflow/registered-models/delete
        query:
          name: [existing-model]
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
