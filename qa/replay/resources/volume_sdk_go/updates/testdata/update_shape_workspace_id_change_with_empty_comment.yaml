# Runs volume_updates/testdata/update_shape_workspace_id_change_with_empty_comment.yaml
# with databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same
# requests and behavior. The original's description:
#
# Pins a change of only provider_config.workspace_id on an account-level provider while
# comment is unset and null in state. The update is in place, and the PATCH to the new
# workspace has the body {} because nothing else changed and an unchanged empty comment
# isn't forced. API responses are inferred from the account and Unity Catalog API
# contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_in_workspace_12345
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "databricks_volume" "this" {
        name         = "moving_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - &lookup_12345
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 12345,
                   "workspace_name": "replay-workspace-12345",
                   "deployment_name": "replay-workspace-12345",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "moving_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "moving_volume",
                           "full_name": "main.replay.moving_volume",
                           "volume_type": "MANAGED",
                           "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-18908",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000018908"}
      - &read_in_12345
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.moving_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *lookup_12345
      - *read_in_12345
  - name: workspace_id_change_sends_empty_patch
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "databricks_volume" "this" {
        name         = "moving_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "67890"
        }
      }
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
          after:
            - path: [provider_config, 0, workspace_id]
              equals: "67890"
    calls:
      # The plan's refresh.
      - *lookup_12345
      - *read_in_12345
      # The apply.
      - &lookup_67890
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/67890
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 67890,
                   "workspace_name": "replay-workspace-67890",
                   "deployment_name": "replay-workspace-67890",
                   "workspace_status": "RUNNING"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.moving_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "67890"
          body:
            json: {}
        response:
          status: 200
          body:
            json: *volume
      - &read_in_67890
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.moving_volume
          headers:
            X-Databricks-Workspace-Id: "67890"
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *lookup_67890
      - *read_in_67890
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.moving_volume
            - path: [comment]
              equals: null
            - path: [provider_config, 0, workspace_id]
              equals: "67890"
destroy:
  calls:
    - *lookup_67890
    - *read_in_67890
    - *lookup_67890
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.moving_volume
        headers:
          X-Databricks-Workspace-Id: "67890"
        body: null
      response:
        status: 200
        body:
          json: {}
