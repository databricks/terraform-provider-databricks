# Runs volume/testdata/retry_after_header_is_ignored.yaml with databricks_volume on sdk-go
# uc/volumes/v1 in every step, and expects the same behavior. The volume POST and GET
# requests carry no Accept header, which an empty header expectation pins. The original's
# description:
#
# Pins that the classic SDK client ignores Retry-After. A 429 on the refresh GET asks for
# an hour's wait, yet the identical retry follows after the SDK's own short backoff and
# succeeds. A client that honored the header would wait an hour and the test would time
# out. API responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: read_after_create_retries_429_without_waiting_for_retry_after
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "retry_volume",
                   "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "retry_volume",
                   "full_name": "main.replay.retry_volume", "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volumes/00000000-0000-4000-8000-000000000002",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000002"}
      - request: &read
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 429
          headers:
            Retry-After: "3600"
          body:
            json: {"error_code": "TOO_MANY_REQUESTS",
                   "message": "Too many requests. Please wait a moment and try again."}
      - request: *read
        response: *volume
      - request: *read
        response: *volume
destroy:
  calls:
    - request: *read
      response: *volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.retry_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
