# Pins the account-level importer on AWS: importing into separate state reads the
# service principal twice and matches the created state. API responses are inferred from
# the SCIM API contract, not recorded. An empty X-Databricks-Workspace-Id expectation
# matches only requests without that header.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_service_principal" "this" {
        display_name         = "SPN import"
        external_id          = "external-201"
        allow_cluster_create = true
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/scim+json; charset=utf-8
            X-Databricks-Workspace-Id: ""
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "displayName": "SPN import", "active": true,
                   "externalId": "external-201",
                   "entitlements": [{"value": "allow-cluster-create"}]}
        response:
          status: 201
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN import", "active": true,
                   "externalId": "external-201",
                   "entitlements": [{"value": "allow-cluster-create"}]}
      - &read_created
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201
          query:
            attributes: ["userName,displayName,active,externalId,entitlements"]
          headers:
            X-Databricks-Workspace-Id: ""
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN import", "active": true,
                   "externalId": "external-201",
                   "entitlements": [{"value": "allow-cluster-create"}]}
      - *read_created
  - name: import_into_separate_state_matches_created_state
    import:
      resource: databricks_service_principal.this
      persist: false
      verify: true
      # Import only sets entitlements present in the response; created state holds
      # false for the others.
      ignore: [allow_instance_pool_create, databricks_sql_access, workspace_access,
               workspace_consume]
    calls:
      - *read_created
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: PATCH
        path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals/201
        headers:
          Content-Type: application/scim+json; charset=utf-8
          X-Databricks-Workspace-Id: ""
        body:
          json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:PatchOp"],
                 "Operations": [{"op": "replace", "path": "active",
                                 "value": [{"value": "false"}]}]}
      response:
        status: 200
        body: null
