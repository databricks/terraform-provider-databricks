# Runs volume/testdata/provider_config_matching_workspace_id.yaml with databricks_volume
# on sdk-go uc/volumes/v1 in every step, and expects the same behavior. The volume POST
# and GET requests carry no Accept header, which an empty header expectation pins. The
# original's description:
#
# Pins provider_config.workspace_id equal to the workspace of a workspace-level
# provider: create, refresh, import and delete make the same calls as without the
# block, with no SCIM /Me call because host metadata supplies the provider's workspace
# ID. The import runs with the block in the configuration and matches the created
# state. API responses are inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_matching_workspace_id
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "matching_ws_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "12345"
        }
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "matching_ws_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "matching_ws_volume",
                           "full_name": "main.replay.matching_ws_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-74",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000074"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.matching_ws_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: refresh_with_matching_workspace_id_is_empty
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_volume
  - name: import_with_provider_config_matches_created_state
    sdk_implementations:
      databricks_volume: sdk_go
    import:
      resource: databricks_volume.this
      persist: false
      verify: true
    calls:
      - *read_volume
      - *read_volume
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.matching_ws_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
