# Clearing values on update: turning single-use refresh tokens off, removing
# user_authorized_scopes (rejected at plan time) and removing token_access_policy.
# API responses are inferred from the scenarios and API models, not recorded; the
# behavior they model was checked against a live account (empty lists are ignored
# by the PATCH, and GET returns the default policy for an integration without one).
version: 1
host_metadata: # Dummy host metadata.
  host_type: "account"
  cloud: "AWS"
  account_id: "replay-account"
steps:
  - name: "create"
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_custom_app_integration" "this" {
        name                   = "tf-replay-app-integration"
        redirect_urls          = ["https://example.com"]
        scopes                 = ["all-apis", "sql"]
        user_authorized_scopes = ["sql"]
        token_access_policy {
          access_token_ttl_in_minutes          = 30
          refresh_token_ttl_in_minutes         = 720
          enable_single_use_refresh_tokens     = true
          absolute_session_lifetime_in_minutes = 1440
        }
      }
    calls:
      - request:
          method: "POST"
          path: "/api/2.0/accounts/replay-account/oauth2/custom-app-integrations"
          body:
            json:
              name: "tf-replay-app-integration"
              redirect_urls: ["https://example.com"]
              scopes: ["all-apis", "sql"]
              user_authorized_scopes: ["sql"]
              token_access_policy:
                access_token_ttl_in_minutes: 30
                refresh_token_ttl_in_minutes: 720
                enable_single_use_refresh_tokens: true
                absolute_session_lifetime_in_minutes: 1440
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              client_id: "client-1"
              client_secret: "placeholder-secret"
              integration_id: "integration-1"
      - &get_1
        request:
          method: "GET"
          path: "/api/2.0/accounts/replay-account/oauth2/custom-app-integrations/integration-1"
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              client_id: "client-1"
              create_time: 1700000000000
              created_by: 100
              integration_id: "integration-1"
              name: "tf-replay-app-integration"
              redirect_urls: ["https://example.com"]
              scopes: ["all-apis", "sql"]
              user_authorized_scopes: ["sql"]
              token_access_policy:
                access_token_ttl_in_minutes: 30
                refresh_token_ttl_in_minutes: 720
                enable_single_use_refresh_tokens: true
                absolute_session_lifetime_in_minutes: 1440
      - *get_1
  - name: "disable_single_use_refresh_tokens"
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_custom_app_integration" "this" {
        name                   = "tf-replay-app-integration"
        redirect_urls          = ["https://example.com"]
        scopes                 = ["all-apis", "sql"]
        user_authorized_scopes = ["sql"]
        token_access_policy {
          access_token_ttl_in_minutes      = 30
          refresh_token_ttl_in_minutes     = 720
          enable_single_use_refresh_tokens = false
        }
      }
    calls:
      - *get_1
      - request:
          method: "PATCH"
          path: "/api/2.0/accounts/replay-account/oauth2/custom-app-integrations/integration-1"
          body:
            json:
              redirect_urls: ["https://example.com"]
              scopes: ["all-apis", "sql"]
              user_authorized_scopes: ["sql"]
              token_access_policy:
                access_token_ttl_in_minutes: 30
                refresh_token_ttl_in_minutes: 720
                enable_single_use_refresh_tokens: false
        response: # Inferred API response; not recorded.
          status: 200
          body: null
      - &get_2
        request:
          method: "GET"
          path: "/api/2.0/accounts/replay-account/oauth2/custom-app-integrations/integration-1"
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              client_id: "client-1"
              create_time: 1700000000000
              created_by: 100
              integration_id: "integration-1"
              name: "tf-replay-app-integration"
              redirect_urls: ["https://example.com"]
              scopes: ["all-apis", "sql"]
              user_authorized_scopes: ["sql"]
              token_access_policy:
                access_token_ttl_in_minutes: 30
                refresh_token_ttl_in_minutes: 720
                enable_single_use_refresh_tokens: false
                absolute_session_lifetime_in_minutes: 1440
      - *get_2
  - name: "remove_user_authorized_scopes"
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_custom_app_integration" "this" {
        name          = "tf-replay-app-integration"
        redirect_urls = ["https://example.com"]
        scopes        = ["all-apis", "sql"]
        token_access_policy {
          access_token_ttl_in_minutes      = 30
          refresh_token_ttl_in_minutes     = 720
          enable_single_use_refresh_tokens = false
        }
      }
    expect_error: "user_authorized_scopes can't be removed from an existing custom app integration"
    calls:
      - *get_2
  - name: "remove_token_access_policy"
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_custom_app_integration" "this" {
        name                   = "tf-replay-app-integration"
        redirect_urls          = ["https://example.com"]
        scopes                 = ["all-apis", "sql"]
        user_authorized_scopes = ["sql"]
      }
    calls:
      - *get_2
      - request:
          method: "PATCH"
          path: "/api/2.0/accounts/replay-account/oauth2/custom-app-integrations/integration-1"
          body:
            json:
              redirect_urls: ["https://example.com"]
              scopes: ["all-apis", "sql"]
              user_authorized_scopes: ["sql"]
              token_access_policy:
                access_token_ttl_in_minutes: 60
                refresh_token_ttl_in_minutes: 10080
        response: # Inferred API response; not recorded.
          status: 200
          body: null
      - &get_3
        request:
          method: "GET"
          path: "/api/2.0/accounts/replay-account/oauth2/custom-app-integrations/integration-1"
          body: null
        response: # Inferred API response; not recorded.
          status: 200
          body:
            json:
              client_id: "client-1"
              create_time: 1700000000000
              created_by: 100
              integration_id: "integration-1"
              name: "tf-replay-app-integration"
              redirect_urls: ["https://example.com"]
              scopes: ["all-apis", "sql"]
              user_authorized_scopes: ["sql"]
              token_access_policy:
                access_token_ttl_in_minutes: 60
                refresh_token_ttl_in_minutes: 10080
                enable_single_use_refresh_tokens: false
                absolute_session_lifetime_in_minutes: 1440
      - *get_3
destroy:
  calls:
    - *get_3
    - request:
        method: "DELETE"
        path: "/api/2.0/accounts/replay-account/oauth2/custom-app-integrations/integration-1"
        body: null
      response: # Inferred API response; not recorded.
        status: 200
        body: null
