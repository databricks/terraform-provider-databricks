# Pins where the classic SDK stops detecting a private-link login redirect on a refresh.
# It looks for the literal error=private-link-validation-error in the final URL's raw
# query and for the path /login.html, so a percent-encoded query value or another path
# is not detected: the login page's 200 HTML then fails as an HTML response. A login URL
# that answers an HTTP error goes through normal error parsing instead of the
# PrivateLink message. Every failed refresh keeps the volume in state, and the next plan
# is empty. API responses are inferred from the private-link redirect contract, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_volume" "this" {
        name         = "redirect_edges_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "redirect_edges_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "redirect_edges_volume",
                            "full_name": "main.replay.redirect_edges_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-1935",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001935"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_edges_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_redirected_with_percent_encoded_value_fails_with_html_error
    config: *config
    expect_error: 'Error: cannot read volume: received HTML response instead of JSON\n'
    calls:
      - request: *read_request
        response:
          status: 302
          headers:
            Location: /login.html?error=private%2Dlink%2Dvalidation%2Derror
          body: null
      - request:
          method: GET
          path: /login.html
          query:
            error: [private-link-validation-error]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: &login_page
          status: 200
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: <html><body>Sign in</body></html>
  - name: plan_after_percent_encoded_redirect_is_empty
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_created
  - name: refresh_redirected_to_other_path_fails_with_html_error
    config: *config
    expect_error: 'Error: cannot read volume: received HTML response instead of JSON\n'
    calls:
      - request: *read_request
        response:
          status: 302
          headers:
            Location: /login?error=private-link-validation-error
          body: null
      - request:
          method: GET
          path: /login
          query:
            error: [private-link-validation-error]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *login_page
  - name: plan_after_other_path_redirect_is_empty
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_created
  - name: refresh_redirected_to_login_answering_403_fails_with_its_error
    config: *config
    expect_error: 'Error: cannot read volume: Access from this network is not
      allowed\.\n'
    calls:
      - request: *read_request
        response:
          status: 302
          headers:
            Location: /login.html?error=private-link-validation-error
          body: null
      - request:
          method: GET
          path: /login.html
          query:
            error: [private-link-validation-error]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 403
          body:
            json: {"error_code": "PERMISSION_DENIED",
                   "message": "Access from this network is not allowed."}
  - name: plan_after_login_error_is_empty
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.redirect_edges_volume
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.redirect_edges_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
