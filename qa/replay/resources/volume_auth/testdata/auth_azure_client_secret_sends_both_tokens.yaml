# Pins the token calls and credentials of every databricks_volume call with an Azure
# client secret. Each Terraform operation configures a new provider, whose first volume
# call asks Azure AD for a token for Azure Databricks and then for one for Azure
# management, with the service principal's ID and secret as basic auth. The POST, GET,
# PATCH and DELETE then send the first token as Authorization: Bearer, the second as
# X-Databricks-Azure-SP-Management-Token, and the configured workspace resource ID as
# X-Databricks-Azure-Workspace-Resource-Id. A pattern matcher requires exactly one
# value, so a lost or duplicated header fails. Azure AD is a named host, and the
# provider host is an Azure workspace so that the SDK takes the Azure public cloud's
# login endpoint from its DNS zone. Token and API responses are inferred from the Azure
# AD and Unity Catalog API contracts, not recorded.
version: 1
enforce_call_order: true
provider_host: workspace
hosts:
  workspace:
    url: https://adb-12345.6.azuredatabricks.net
  aad:
    url: https://login.microsoftonline.com
host_metadata:
  host_type: workspace
  cloud: Azure
  workspace_id: "12345"
auth:
  type: azure-client-secret
  azure_tenant_id: replay-tenant
  azure_client_id: replay-azure-sp
  azure_client_secret: replay-azure-secret
  azure_workspace_resource_id: /subscriptions/replay-subscription/resourceGroups/replay-group/providers/Microsoft.Databricks/workspaces/replay-workspace
steps:
  - name: create
    config: |
      resource "databricks_volume" "this" {
        name         = "auth_azure_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      # The Azure Databricks application ID is the token's resource.
      - &databricks_token
        request:
          method: POST
          host: aad
          path: /replay-tenant/oauth2/token
          headers:
            Content-Type: application/x-www-form-urlencoded
          matchers: &client_secret
            headers:
              # base64 of replay-azure-sp:replay-azure-secret.
              Authorization: {pattern: 'Basic cmVwbGF5LWF6dXJlLXNwOnJlcGxheS1henVyZS1zZWNyZXQ='}
          body:
            text: grant_type=client_credentials&resource=2ff814a6-3304-4ab8-85cb-cd0e6f879c1d
        response:
          status: 200
          body:
            json: {"access_token": "aad-token", "token_type": "Bearer",
                   "expires_in": 3600}
      - &management_token
        request:
          method: POST
          host: aad
          path: /replay-tenant/oauth2/token
          headers:
            Content-Type: application/x-www-form-urlencoded
          matchers: *client_secret
          body:
            text: grant_type=client_credentials&resource=https%3A%2F%2Fmanagement.core.windows.net%2F
        response:
          status: 200
          body:
            json: {"access_token": "management-token", "token_type": "Bearer",
                   "expires_in": 3600}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: &credentials
            headers:
              Authorization: {pattern: 'Bearer aad-token'}
              X-Databricks-Azure-Sp-Management-Token: {pattern: 'management-token'}
              X-Databricks-Azure-Workspace-Resource-Id:
                pattern: '/subscriptions/replay-subscription/resourceGroups/replay-group/providers/Microsoft\.Databricks/workspaces/replay-workspace'
              X-Databricks-Gcp-Sa-Access-Token: absent
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "auth_azure_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "auth_azure_volume",
                            "full_name": "main.replay.auth_azure_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "abfss://metastore@replaystorage.dfs.core.windows.net/volume-302",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000302"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.auth_azure_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: *credentials
          body: null
        response:
          status: 200
          body:
            json: *created
      # Terraform's post-apply plan.
      - *databricks_token
      - *management_token
      - *read_created
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.auth_azure_volume
  - name: update
    config: |
      resource "databricks_volume" "this" {
        name         = "auth_azure_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "azure"
      }
    calls:
      # The plan's refresh.
      - *databricks_token
      - *management_token
      - *read_created
      # The apply.
      - *databricks_token
      - *management_token
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.auth_azure_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          matchers: *credentials
          body:
            json: {"comment": "azure"}
        response:
          status: 200
          body:
            json: &commented {"catalog_name": "main", "schema_name": "replay",
                              "name": "auth_azure_volume",
                              "full_name": "main.replay.auth_azure_volume",
                              "volume_type": "MANAGED", "comment": "azure",
                              "owner": "replay-admin@example.com",
                              "storage_location": "abfss://metastore@replaystorage.dfs.core.windows.net/volume-302",
                              "metastore_id": "11111111-1111-1111-1111-111111111111",
                              "volume_id": "00000000-0000-4000-8000-000000000302"}
      - &read_commented
        request: *read_request
        response:
          status: 200
          body:
            json: *commented
      # Terraform's post-apply plan.
      - *databricks_token
      - *management_token
      - *read_commented
destroy:
  calls:
    # The refresh, then the destroy.
    - *databricks_token
    - *management_token
    - *read_commented
    - *databricks_token
    - *management_token
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.auth_azure_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        matchers: *credentials
        body: null
      response:
        status: 200
        body:
          json: {}
