# Pins provider_config.workspace_id taken from another resource, so it is unknown at
# plan time, on an account-level provider without a provider-level workspace_id. On
# create the planned workspace_id is unknown, and apply looks up and routes through the
# resolved ID and stores it. When an existing volume's workspace_id becomes unknown, the
# plan is an in-place update that leaves it unknown without looking up a fallback, and
# apply looks up the new workspace, sends it the PATCH and the read, and stores its ID.
# API responses are inferred from the account and Unity Catalog API contracts, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_with_unknown_workspace_id
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "terraform_data" "workspace" {
        input = "12345"
      }
      resource "databricks_volume" "this" {
        name         = "unknown_ws_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = terraform_data.workspace.output
        }
      }
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
          after:
            - path: [provider_config, 0, workspace_id]
              unknown: true
    calls:
      - &lookup_12345
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 12345,
                   "workspace_name": "replay-workspace-12345",
                   "deployment_name": "replay-workspace-12345",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "unknown_ws_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "unknown_ws_volume",
                           "full_name": "main.replay.unknown_ws_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1906",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001906"}
      - &read_in_12345
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.unknown_ws_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *lookup_12345
      - *read_in_12345
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: change_to_unknown_workspace_id
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "terraform_data" "workspace" {
        input = "67890"
      }
      resource "databricks_volume" "this" {
        name         = "unknown_ws_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = terraform_data.workspace.output
        }
      }
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
          after:
            - path: [provider_config, 0, workspace_id]
              unknown: true
    calls:
      # The plan's refresh.
      - *lookup_12345
      - *read_in_12345
      # The apply.
      - &lookup_67890
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/67890
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 67890,
                   "workspace_name": "replay-workspace-67890",
                   "deployment_name": "replay-workspace-67890",
                   "workspace_status": "RUNNING"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.unknown_ws_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "67890"
          body:
            json: {}
        response:
          status: 200
          body:
            json: *volume
      - &read_in_67890
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.unknown_ws_volume
          headers:
            X-Databricks-Workspace-Id: "67890"
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *lookup_67890
      - *read_in_67890
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "67890"
destroy:
  calls:
    - *lookup_67890
    - *read_in_67890
    - *lookup_67890
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.unknown_ws_volume
        headers:
          X-Databricks-Workspace-Id: "67890"
        body: null
      response:
        status: 200
        body:
          json: {}
