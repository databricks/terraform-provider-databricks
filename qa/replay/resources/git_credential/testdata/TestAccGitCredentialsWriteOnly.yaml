# API responses are inferred from the scenarios and API models, not recorded.
# personal_access_token_wo must be sent to the API but never stored in state;
# bumping personal_access_token_wo_version re-sends the new token in place.
version: 1
host_metadata: # Dummy host metadata.
  host_type: workspace
  cloud: AWS
  workspace_id: '12345'
steps:
  - name: create
    config: |
      resource "databricks_git_credential" "this" {
        git_username                     = "test"
        git_provider                     = "gitHub"
        personal_access_token_wo         = "write_only_token_v1"
        personal_access_token_wo_version = 1
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/git-credentials
          headers:
            X-Databricks-Workspace-Id: '12345'
          body:
            json:
              git_provider: gitHub
              git_username: test
              personal_access_token: write_only_token_v1
        response: &credential # Inferred API response; not recorded.
          body:
            json:
              credential_id: 123
              git_provider: gitHub
              git_username: test
          status: 200
      - &get_credential
        request:
          method: GET
          path: /api/2.0/git-credentials/123
          headers:
            X-Databricks-Workspace-Id: '12345'
          body: null
        response: *credential # Inferred API response; not recorded.
      - *get_credential
    state:
      resources:
        databricks_git_credential.this:
          attributes:
            - path: [id]
              equals: '123'
            # Neither the write-only token nor a token from the environment is stored.
            - path: [personal_access_token]
              equals: ''
            - path: [personal_access_token_wo]
              equals: null
            - path: [personal_access_token_wo_version]
              equals: 1
  - name: bump_version
    config: |
      resource "databricks_git_credential" "this" {
        git_username                     = "test"
        git_provider                     = "gitHub"
        personal_access_token_wo         = "write_only_token_v2"
        personal_access_token_wo_version = 2
      }
    plan:
      changes:
        databricks_git_credential.this:
          actions: [update]
          after:
            - path: [personal_access_token_wo_version]
              equals: 2
            - path: [personal_access_token_wo]
              equals: null
    calls:
      - *get_credential
      - request:
          method: PATCH
          path: /api/2.0/git-credentials/123
          headers:
            X-Databricks-Workspace-Id: '12345'
          body:
            json:
              git_provider: gitHub
              git_username: test
              personal_access_token: write_only_token_v2
        response: # Inferred API response; not recorded.
          body: null
          status: 200
      - *get_credential
      - *get_credential
    state:
      resources:
        databricks_git_credential.this:
          attributes:
            - path: [personal_access_token]
              equals: ''
            - path: [personal_access_token_wo]
              equals: null
            - path: [personal_access_token_wo_version]
              equals: 2
destroy:
  calls:
    - *get_credential
    - request:
        method: DELETE
        path: /api/2.0/git-credentials/123
        headers:
          X-Databricks-Workspace-Id: '12345'
        body: null
      response: # Inferred API response; not recorded.
        body: null
        status: 200
