# Pins the importer: importing into separate state reads the model twice by its name,
# the import ID, and matches the created state. API responses are inferred from the
# MLflow Model Registry API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_description
    config: |
      resource "databricks_mlflow_model" "this" {
        name        = "import-verify-model"
        description = "created by terraform"
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/mlflow/registered-models/create
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"name": "import-verify-model", "description": "created by terraform"}
        response:
          status: 200
          body:
            json: {"registered_model": {"name": "import-verify-model",
                                        "description": "created by terraform",
                                        "creation_timestamp": 1700000000000,
                                        "last_updated_timestamp": 1700000000000,
                                        "user_id": "replay-admin@example.com"}}
      - &read_model
        request:
          method: GET
          path: /api/2.0/mlflow/databricks/registered-models/get
          query:
            name: [import-verify-model]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"registered_model_databricks": {
                     "name": "import-verify-model",
                     "description": "created by terraform",
                     "creation_timestamp": 1700000000000,
                     "last_updated_timestamp": 1700000000000,
                     "user_id": "replay-admin@example.com",
                     "id": "0a1b2c3d4e5f60718293a4b5c6d7e8f1",
                     "permission_level": "CAN_MANAGE"}}
      - *read_model
    state:
      resources:
        databricks_mlflow_model.this:
          attributes:
            - path: [id]
              equals: import-verify-model
            - path: [registered_model_id]
              equals: 0a1b2c3d4e5f60718293a4b5c6d7e8f1
  - name: import_into_separate_state_matches_created_state
    import:
      resource: databricks_mlflow_model.this
      persist: false
      verify: true
    calls:
      - *read_model
      - *read_model
destroy:
  calls:
    - *read_model
    - request:
        method: DELETE
        path: /api/2.0/mlflow/registered-models/delete
        query:
          name: [import-verify-model]
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
