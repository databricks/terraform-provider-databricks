# Pins 200 responses with HTML bodies. The SDK reports its HTML error only when the body
# isn't JSON and starts with "<". A create POST answered with HTML fails, stores nothing, and
# the next plan creates the volume again. A refresh GET answered with HTML after leading
# whitespace fails with the plain unmarshal error and a request log instead; the pattern
# checks its message, request line and echoed body, and skips the generated headers in
# between. A fields PATCH answered with HTML fails, keeps the ID, and the next plan updates
# the comment again. The existing response_decoding_errors journey pins a GET answered with
# HTML that starts with "<". API responses are inferred from the Unity Catalog API
# contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_answered_200_with_html_fails_with_html_error
    config: &config |
      resource "databricks_volume" "this" {
        name         = "html_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first comment"
      }
    expect_error: 'Error: cannot create volume: received HTML response instead of JSON\n'
    calls:
      - &create_html
        request: &create_request
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "html_volume", "volume_type": "MANAGED",
                   "comment": "first comment"}
        response:
          status: 200
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: <html><body>Sign in</body></html>
  - name: plan_after_the_failed_create_plans_a_create
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls: []
  - name: create
    config: *config
    calls:
      - request: *create_request
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "html_volume", "full_name": "main.replay.html_volume",
                            "volume_type": "MANAGED", "comment": "first comment",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-197"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.html_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_answered_200_with_html_after_whitespace_fails_with_unmarshal_error
    config: *config
    expect_error: 'Error: cannot read volume: failed to unmarshal response body: invalid
      character ''<'' looking for beginning of value\. This is likely a bug in the
      Databricks SDK for Go or the underlying REST API\. Please report this issue with the
      following debugging information to the SDK issue tracker at
      https://github\.com/databricks/databricks-sdk-go/issues\. Request log:\n```\nGET
      /api/2\.1/unity-catalog/volumes/main\.replay\.html_volume\n(?s:.*)\n<
      \n< {3}<!DOCTYPE html>\n< <html><body>Sign in</body></html>\n```\n'
    calls:
      - request: *read_request
        response:
          status: 200
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: "\n  <!DOCTYPE html>\n<html><body>Sign in</body></html>"
  - &plan_after_failed_refresh
    name: plan_after_the_failed_refresh_is_empty
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state: &created_state
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.html_volume
            - path: [volume_path]
              equals: /Volumes/main/replay/html_volume
    calls:
      - *read_created
  - name: update_answered_200_with_html_fails_with_html_error
    config: &config_commented |
      resource "databricks_volume" "this" {
        name         = "html_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second comment"
      }
    expect_error: 'Error: cannot update volume: received HTML response instead of JSON\n'
    calls:
      - *read_created
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.html_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"comment": "second comment"}
        response:
          status: 200
          headers:
            Content-Type: text/html; charset=utf-8
          body:
            text: <html><body>Sign in</body></html>
  - name: plan_after_the_failed_update_keeps_the_id_and_plans_the_same_update
    plan_only: true
    config: *config_commented
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [comment]
              equals: first comment
          after:
            - path: [comment]
              equals: second comment
    state: *created_state
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.html_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
