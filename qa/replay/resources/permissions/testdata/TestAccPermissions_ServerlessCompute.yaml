    config: |
      resource "databricks_permissions" "interactive" {
        default_serverless_compute = "INTERACTIVE"
        access_control {
          group_name       = "permissions-replay-0"
          permission_level = "CAN_USE"
        }
      }
      resource "databricks_permissions" "automated" {
        default_compute_policy = "AUTOMATED"
        access_control {
          group_name       = "users"
          permission_level = "CAN_USE"
        }
      }
      resource "databricks_permissions" "custom" {
        compute_policy_id = "11111111-1111-4111-8111-000000000003"
        access_control {
          group_name       = "permissions-replay-0"
          permission_level = "CAN_USE"
        }
      }
    state:
      resources:
        databricks_permissions.interactive:
          attributes:
            - path: [id]
              equals: /serverless-compute/11111111-1111-4111-8111-000000000001
            - path: [default_serverless_compute]
              equals: INTERACTIVE
            - path: [serverless_compute_id]
              equals: null
        databricks_permissions.automated:
          attributes:
            - path: [id]
              equals: /compute-policy/11111111-1111-4111-8111-000000000002
            - path: [default_compute_policy]
              equals: AUTOMATED
            - path: [compute_policy_id]
              equals: null
        databricks_permissions.custom:
