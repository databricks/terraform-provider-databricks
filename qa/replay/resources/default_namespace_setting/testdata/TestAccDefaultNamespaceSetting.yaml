      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          etag: setting-v1
          namespace:
            value: namespace_value
          setting_name: default
  - *id001
  state:
    resources:
      databricks_default_namespace_setting.this:
        attributes:
        - path:
