name: PR Comment

# WARNING:
# THIS WORKFLOW ALWAYS RUNS FOR EXTERNAL CONTRIBUTORS WITHOUT ANY APPROVAL.
# THIS WORKFLOW RUNS FROM MAIN BRANCH, NOT FROM THE PR BRANCH.
# DO NOT PULL THE PR OR EXECUTE ANY CODE FROM THE PR.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - main

jobs:
  comment-on-pr:
    runs-on:
      group: databricks-deco-testing-runner-group
      labels: ubuntu-latest-deco

    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Delete old comments
        env:
           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            # Delete previous comment if it exists
            previous_comment_ids=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --jq '.[] | select(.body | startswith("<!-- INTEGRATION_TESTS_MANUAL -->")) | .id')
            echo "Previous comment IDs: $previous_comment_ids"
            # Iterate over each comment ID and delete the comment
            if [ ! -z "$previous_comment_ids" ]; then
              echo "$previous_comment_ids" | while read -r comment_id; do
                echo "Deleting comment with ID: $comment_id"
                gh api "repos/${{ github.repository }}/issues/comments/$comment_id" -X DELETE
              done
            fi

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body \
          "<!-- INTEGRATION_TESTS_MANUAL -->
          ### Unit and replay tests, and CodeQL

          For fork and Dependabot PRs, the \`tests\` and \`Analyze (go)\` checks run offline against a pre-warmed Go module cache because these PRs cannot authenticate to the internal Go module proxy.

          If this PR changes \`go.mod\` or \`go.sum\`, both checks will fail until a maintainer warms the cache for it:

          Actions -> Warm Go Cache -> Run workflow -> pr_number = ${{github.event.pull_request.number}}

          Re-run the failed checks once the cache warming completes.

          ### Replay tests

          Add YAML replay tests for provider behavior changes. These run Terraform and the real provider against local HTTP fixtures without Databricks credentials. See [Writing YAML replay tests](https://github.com/databricks/terraform-provider-databricks/blob/main/qa/terraformtest/AUTHORING.md).

          Existing live integration tests run nightly.
          "
