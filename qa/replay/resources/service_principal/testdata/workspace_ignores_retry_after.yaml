# Pins that workspace-level calls on AWS ignore Retry-After: a refresh answered with a
# 429 and Retry-After: 3600 is retried after the client's own short backoff, well
# before the hour the header asks for and before the 5-minute default retry timeout.
# API responses are inferred from the SCIM API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_service_principal" "this" {
        display_name = "SPN Retry-After"
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/preview/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/scim+json; charset=utf-8
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "displayName": "SPN Retry-After", "active": true, "entitlements": [{}]}
        response:
          status: 201
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN Retry-After", "active": true}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.0/preview/scim/v2/ServicePrincipals/201
          query:
            attributes: ["userName,displayName,active,externalId,entitlements"]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN Retry-After", "active": true}
      - *read_created
  - name: refresh_retries_429_without_waiting_for_retry_after
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - request: *read_request
        response:
          status: 429
          headers:
            Retry-After: "3600"
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Too many requests.", "status": "429"}
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.0/preview/scim/v2/ServicePrincipals/201
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 204
        body: null
