# Runs account_force_conflict_errors with reads and writes through sdk-go scim/v1. No
# sdk-go request carries an Accept header, and its GETs carry no Content-Type header.
# Writes send Content-Type application/json. Account-level POST bodies have no schemas,
# entitlements or groups, which the account-level scim/v1 model doesn't have. An empty
# header expectation matches only requests without that header.
#
# Pins account-level force = true failures on AWS. The provider compares the SCIM detail
# in the response with its two known texts, and a known detail with a scimType doesn't
# match. API responses are inferred from the SCIM API contract, not recorded. An empty
# X-Databricks-Workspace-Id expectation matches only requests without that header.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: force_fails_on_other_conflict_without_scim_type
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: &config |
      provider "databricks" {
        account_id = "replay-account"
      }

      resource "databricks_service_principal" "this" {
        application_id = "00000000-0000-4000-8000-000000000001"
        display_name   = "SPN forced"
        force          = true
      }
    expect_error: 'Error: cannot create service principal: Service principal is locked by
      another operation\.'
    calls:
      - request: &create_request
          method: POST
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: ""
            Accept: ""
          body:
            json: {"applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN forced", "active": true}
        response:
          status: 409
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Service principal is locked by another operation.",
                   "status": "409"}
  - name: force_fails_on_other_conflict_with_scim_type
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: *config
    expect_error: 'Error: cannot create service principal: mutability Service principal is
      locked by another operation\.'
    calls:
      - request: *create_request
        response:
          status: 409
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Service principal is locked by another operation.",
                   "status": "409", "scimType": "mutability"}
  - name: force_fails_on_known_conflict_with_scim_type
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: *config
    expect_error: 'Error: cannot create service principal: uniqueness Service principal
      with application ID 00000000-0000-4000-8000-000000000001 already exists\.'
    calls:
      - request: *create_request
        response:
          status: 409
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Service principal with application ID
                              00000000-0000-4000-8000-000000000001 already exists.",
                   "status": "409", "scimType": "uniqueness"}
  - name: force_fails_when_conflicting_service_principal_is_not_listed
    sdk_implementations:
      databricks_service_principal: sdk_go
    config: *config
    expect_error: 'Error: cannot create service principal: cannot find SP with ID
      00000000-0000-4000-8000-000000000001 for force import'
    calls:
      - request: *create_request
        response:
          status: 409
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Service principal with application ID
                              00000000-0000-4000-8000-000000000001 already exists.",
                   "status": "409"}
      - request:
          method: GET
          path: /api/2.0/accounts/replay-account/scim/v2/ServicePrincipals
          query:
            filter: ['applicationId eq "00000000-0000-4000-8000-000000000001"']
            excludedAttributes: [roles]
          headers:
            X-Databricks-Workspace-Id: ""
            Accept: ""
            Content-Type: ""
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:ListResponse"],
                   "totalResults": 0, "startIndex": 1, "itemsPerPage": 0}
destroy:
  calls: []
