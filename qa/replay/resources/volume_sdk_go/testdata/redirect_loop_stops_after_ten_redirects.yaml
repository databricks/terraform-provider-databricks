# Runs volume/testdata/redirect_loop_stops_after_ten_redirects.yaml with databricks_volume
# on sdk-go uc/volumes/v1 in every step. The volume requests carry no Accept header, which
# an empty header expectation pins. The modes differ in one place, pinned as it is today:
# the redirect-limit error names the original request URL, not the last Location, because
# sdk-go's HTTP client wraps the bridge's error in a url.Error of its own request. The ten
# requests, the missing retry and the kept state match the original. The original's
# description:
#
# Pins a refresh caught in a redirect loop. The GET is redirected to /loop, which keeps
# redirecting to itself. Go's client sends ten requests, then stops with its
# redirect-limit error, which names the last Location. The SDK does not retry that
# error, so the refresh fails once, the volume stays in state and the next plan is
# empty. API responses are inferred from the HTTP redirect contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "redirect_loop_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "redirect_loop_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "redirect_loop_volume",
                            "full_name": "main.replay.redirect_loop_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-1939",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001939"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.redirect_loop_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: refresh_in_redirect_loop_fails_after_ten_requests
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'Error: cannot read volume: Get
      "http://[^"/]+/api/2\.1/unity-catalog/volumes/main\.replay\.redirect_loop_volume":
      stopped after 10 redirects\n'
    calls:
      - request: *read_request
        response: &redirect_to_loop
          status: 302
          headers:
            Location: /loop
          body: null
      - &loop
        request:
          method: GET
          path: /loop
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *redirect_to_loop
      - *loop
      - *loop
      - *loop
      - *loop
      - *loop
      - *loop
      - *loop
      - *loop
  - name: plan_after_redirect_loop_keeps_volume
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.redirect_loop_volume
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.redirect_loop_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
          Accept: ""
        body: null
      response:
        status: 200
        body:
          json: {}
