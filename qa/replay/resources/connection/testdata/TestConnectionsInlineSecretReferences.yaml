# Inferred API responses, not recorded. All secret names are synthetic references.
version: 1
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_inline_reference
    config: &inline_config |
      resource "databricks_connection" "this" {
        name            = "tf-test-inline-secrets"
        connection_type = "MYSQL"
        options = {
          host     = "mysql.example.com"
          password = "{{uc_secrets/main.default.password}}"
        }
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/connections
          body:
            json:
              name: tf-test-inline-secrets
              connection_type: MYSQL
              options:
                host: mysql.example.com
                password: "{{uc_secrets/main.default.password}}"
        response: &connection
          status: 200
          body:
            json: &connection_body
              name: tf-test-inline-secrets
              full_name: tf-test-inline-secrets
              metastore_id: "11111111-1111-1111-1111-111111111111"
              connection_id: connection-inline-secrets
              connection_type: MYSQL
              owner: replay-admin
              provisioning_info:
                state: ACTIVE
              options:
                host: mysql.example.com
                password: "{{uc_secrets/main.default.password}}"
      - &get_connection
        request: &get_request
          method: GET
          path: /api/2.1/unity-catalog/connections/tf-test-inline-secrets
          body: null
        response: *connection
      - *get_connection
    state:
      resources:
        databricks_connection.this:
          attributes:
            - path: [options, password]
              equals: "{{uc_secrets/main.default.password}}"
            - path: [options, host]
              equals: mysql.example.com
  - name: reference_name_case_does_not_cause_an_update
    config: |
      resource "databricks_connection" "this" {
        name            = "tf-test-inline-secrets"
        connection_type = "MYSQL"
        options = {
          host     = "mysql.example.com"
          password = "{{uc_secrets/MAIN.DEFAULT.Password}}"
        }
      }
    plan_only: true
    plan:
      expect: empty
      changes: {}
    calls:
      - *get_connection
  - name: changed_reference_is_detected
    config: *inline_config
    plan_only: true
    plan:
      expect: non_empty
      changes:
        databricks_connection.this:
          actions: [update]
          before:
            - path: [options, password]
              equals: "{{uc_secrets/main.default.changed_password}}"
          after:
            - path: [options, password]
              equals: "{{uc_secrets/main.default.password}}"
    calls:
      - request: *get_request
        response:
          status: 200
          body:
            json:
              <<: *connection_body
              options:
                host: mysql.example.com
                password: "{{uc_secrets/main.default.changed_password}}"
destroy:
  calls:
    - *get_connection
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/connections/tf-test-inline-secrets
        body: null
      response:
        status: 200
        body: null
