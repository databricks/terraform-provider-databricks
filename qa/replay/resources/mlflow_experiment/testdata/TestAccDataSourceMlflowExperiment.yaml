              experiment:
                artifact_location: "dbfs:/tmp/my-experiment"
                experiment_id: "123"
                lifecycle_stage: "active"
                name: "/Users/replay@example.com/experiment-replay-2"
      - *get_5
      - *get_1
      - *get_5
      - *get_1
      - *get_5
      - *get_5
    state:
      resources:
        data.databricks_mlflow_experiment.by_id:
