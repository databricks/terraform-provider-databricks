# Runs volume/testdata/routing_leading_zero_workspace_id_on_account_provider.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same behavior.
# The volume POST and GET requests carry no Accept header, which an empty header
# expectation pins. The original's description:
#
# Pins a leading-zero provider_config.workspace_id on an account-level provider. The
# workspace lookup parses the ID as a number and asks for workspace 123, and the volume
# calls carry the lookup response's workspace_id, 123, in the X-Databricks-Workspace-Id
# header. State keeps the literal "0123" from the configuration, so the plans stay
# empty. API responses are inferred from the account and Unity Catalog API contracts,
# not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_looks_up_workspace_123
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {
        account_id = "replay-account"
      }
      resource "databricks_volume" "this" {
        name         = "account_leading_zero_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        provider_config {
          workspace_id = "0123"
        }
      }
    calls:
      - &lookup_123
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/123
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 123,
                   "workspace_name": "replay-workspace-123",
                   "deployment_name": "replay-workspace-123",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "123"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "account_leading_zero_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "account_leading_zero_volume",
                           "full_name": "main.replay.account_leading_zero_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1910",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001910"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.account_leading_zero_volume
          headers:
            X-Databricks-Workspace-Id: "123"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *lookup_123
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "0123"
destroy:
  calls:
    - *lookup_123
    - *read_volume
    - *lookup_123
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.account_leading_zero_volume
        headers:
          X-Databricks-Workspace-Id: "123"
        body: null
      response:
        status: 200
        body:
          json: {}
