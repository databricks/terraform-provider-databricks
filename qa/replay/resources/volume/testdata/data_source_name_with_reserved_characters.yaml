# Pins the data source's read of volume names with "#", "?" and "%", which Unity Catalog
# names may contain. Each GET puts them in the URL as "%23", "%3F" and "%25". Unescaped,
# "#2" becomes a fragment and "?2" a query, so both reads would go to main.replay.raw,
# and "%41" is decoded to "A", so that read would go to main.replay.rawA. The ID and
# volume_info keep the unescaped name. Terraform reads each data source three times in the
# step and once more on destroy. API responses are inferred from the Unity Catalog API
# contract, not recorded.
version: 1
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: read_requests_the_escaped_names
    config: |
      data "databricks_volume" "hash" {
        name = "main.replay.raw#2"
      }
      data "databricks_volume" "question_mark" {
        name = "main.replay.raw?2"
      }
      data "databricks_volume" "percent" {
        name = "main.replay.raw%41"
      }
    calls:
      - &read_hash
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%232
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "raw#2",
                   "full_name": "main.replay.raw#2", "volume_type": "MANAGED",
                   "owner": "data-engineers",
                   "storage_location": "s3://replay-metastore/volume-75",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000075"}
      - &read_question_mark
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%3F2
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "raw?2",
                   "full_name": "main.replay.raw?2", "volume_type": "MANAGED",
                   "owner": "data-engineers",
                   "storage_location": "s3://replay-metastore/volume-76",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000076"}
      - &read_percent
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%2541
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "raw%41",
                   "full_name": "main.replay.raw%41", "volume_type": "MANAGED",
                   "owner": "data-engineers",
                   "storage_location": "s3://replay-metastore/volume-77",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000077"}
      - *read_hash
      - *read_question_mark
      - *read_percent
      - *read_hash
      - *read_question_mark
      - *read_percent
    state:
      resources:
        data.databricks_volume.hash:
          attributes:
            - path: [id]
              equals: main.replay.raw#2
            - path: [volume_info, 0, full_name]
              equals: main.replay.raw#2
        data.databricks_volume.question_mark:
          attributes:
            - path: [id]
              equals: main.replay.raw?2
            - path: [volume_info, 0, full_name]
              equals: main.replay.raw?2
        data.databricks_volume.percent:
          attributes:
            - path: [id]
              equals: main.replay.raw%41
            - path: [volume_info, 0, full_name]
              equals: main.replay.raw%41
destroy:
  calls:
    - *read_hash
    - *read_question_mark
    - *read_percent
