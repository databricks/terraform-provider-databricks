# Runs volume/testdata/name_with_hash_is_percent_encoded.yaml with databricks_volume on
# sdk-go uc/volumes/v1 in every step, and expects the same behavior. The volume requests
# carry no Accept header, which an empty header expectation pins. The PATCH bodies also
# carry full_name_arg, the full name in their path, because sdk-go serializes the path
# field into the body. The original's description:
#
# Pins the request paths for a volume name with "#". The provider escapes the full name
# before the classic client puts it in the path, so the GET, the PATCH and the DELETE
# send "#" as %23. Unescaped, "#2" becomes a URL fragment that is never sent, and the
# calls would go to main.replay.raw. API responses are inferred from the Unity Catalog
# API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "raw#2"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay", "name": "raw#2",
                   "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "raw#2", "full_name": "main.replay.raw#2",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-165",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000165"}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%232
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.raw#2
            - path: [volume_path]
              equals: /Volumes/main/replay/raw#2
  - name: update_comment_patches_the_encoded_path
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "raw#2"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "encoded"
      }
    calls:
      - *read_created
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%232
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.raw#2",
                   "comment": "encoded"}
        response:
          status: 200
          body:
            json: &commented {"catalog_name": "main", "schema_name": "replay",
                              "name": "raw#2", "full_name": "main.replay.raw#2",
                              "volume_type": "MANAGED", "comment": "encoded",
                              "owner": "replay-admin@example.com",
                              "storage_location": "s3://replay-metastore/volume-165",
                              "metastore_id": "11111111-1111-1111-1111-111111111111",
                              "volume_id": "00000000-0000-4000-8000-000000000165"}
      - &read_commented
        request: *read_request
        response:
          status: 200
          body:
            json: *commented
      - *read_commented
  - name: delete_deletes_the_encoded_path
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {}
    calls:
      - *read_commented
      - request:
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.raw%232
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: {}
destroy:
  calls: []
