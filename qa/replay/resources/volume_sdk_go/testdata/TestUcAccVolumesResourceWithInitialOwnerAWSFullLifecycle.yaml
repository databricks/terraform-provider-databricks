          headers:
            Content-Type: "application/json"
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json:
              full_name_arg: "main.schema-replay.name-abc"
              owner: "replay-test_data_eng_group"
        response: &response_6 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              catalog_name: "main"
              comment: "comment-abc"
              full_name: "main.schema-replay.name-abc"
              metastore_id: "11111111-1111-1111-1111-111111111111"
              name: "name-abc"
              owner: "replay-test_data_eng_group"
              schema_name: "schema-replay"
              storage_location: "s3://replay-bucket/somepath-replay"
              volume_id: "volume-1"
              volume_type: "EXTERNAL"
      - &get_5
        request:
          method: "GET"
          path: "/api/2.1/unity-catalog/volumes/main.schema-replay.name-abc"
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response: *response_6
      - *get_1
      - *get_2
      - *get_3
      - *get_5
  - name: "plan_after_update_owner_is_empty"
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_update_owner
    plan:
      expect: empty
      changes: {}
    calls:
      - *get_1
      - *get_2
      - *get_3
      - *get_5
  - name: "rename_and_update_owner"
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_rename_and_update_owner |
      resource "databricks_schema" "this" {
        name         = "schema-replay"
        catalog_name = "main"
      }

      resource "databricks_storage_credential" "external" {
        name = "cred-replay"
        aws_iam_role {
          role_arn = "arn:aws:iam::123456789012:role/replay-storage"
        }
        comment = "Managed by TF"
      }

      resource "databricks_external_location" "some" {
        name            = "external-replay"
        url             = "s3://replay-bucket/somepath-replay"
