# API responses are placeholders based on the API models, not recorded.
version: 1
host_metadata:
  cloud: AWS
  host_type: workspace
  workspace_id: '12345'
steps:
- name: apply_policy_defaults
  config: |
    data "databricks_current_user" "me" {}
    data "databricks_spark_version" "latest" {}
    data "databricks_node_type" "smallest" {
      local_disk = true
    }
    resource "databricks_notebook" "this" {
      path           = "${data.databricks_current_user.me.home}/Terraformpolicy"
      language       = "PYTHON"
      content_base64 = base64encode("# replay\n")
    }
    resource "databricks_cluster_policy" "this" {
      name       = "test-policy-replay"
      definition = jsonencode({ spark_version = { type = "fixed", value = data.databricks_spark_version.latest.id } })
    }
    resource "databricks_job" "this" {
      name = "test-job-policy-replay"
      job_cluster {
        job_cluster_key = "test-cluster"
        new_cluster {
          num_workers                 = 0
          node_type_id                = data.databricks_node_type.smallest.id
          custom_tags                 = { ResourceClass = "SingleNode" }
          spark_conf                  = { "spark.databricks.cluster.profile" = "singleNode", "spark.master" = "local[*,4]" }
          policy_id                   = databricks_cluster_policy.this.id
          apply_policy_default_values = true
        }
      }
      task {
        task_key        = "test-task"
        job_cluster_key = "test-cluster"
        notebook_task { notebook_path = databricks_notebook.this.path }
      }
    }
  calls:
  - &id002
    request:
      method: GET
      path: /api/2.0/preview/scim/v2/Me
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      headers:
        X-Databricks-Org-Id: '12345'
      body:
        json:
          displayName: Replay tester
          groups:
          - display: admins
            value: admins
          id: '100'
          userName: replay@example.com
  - &id001
    request:
      method: GET
      path: /api/2.1/clusters/spark-versions
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          versions:
          - key: 17.3.x-scala2.13
            name: 17.3 LTS (includes Apache Spark 4.0.0, Scala 2.13)
  - &id003
    request:
      method: GET
      path: /api/2.1/clusters/list-node-types
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          node_types:
          - memory_mb: 30500
            node_instance_type:
              instance_type_id: i3.xlarge
              local_disk_size_gb: 950
              local_disks: 1
            node_type_id: i3.xlarge
            num_cores: 4
  - request:
      method: POST
      path: /api/2.0/workspace/import
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          content: IyByZXBsYXkK
          format: SOURCE
          language: PYTHON
          overwrite: true
          path: /Users/replay@example.com/Terraformpolicy
    response:
      status: 200
      body: null
  - request:
      method: POST
      path: /api/2.0/policies/clusters/create
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          definition: '{"spark_version":{"type":"fixed","value":"17.3.x-scala2.13"}}'
          name: test-policy-replay
    response:
      status: 200
      body:
        json:
          policy_id: policy-replay
  - &id004
    request:
      method: GET
      path: /api/2.0/policies/clusters/get
      query:
        policy_id:
        - policy-replay
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          definition: '{"spark_version":{"type":"fixed","value":"17.3.x-scala2.13"}}'
          name: test-policy-replay
          policy_id: policy-replay
  - request:
      method: POST
      path: /api/2.2/jobs/create
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          job_clusters:
          - job_cluster_key: test-cluster
            new_cluster:
              apply_policy_default_values: true
              custom_tags:
                ResourceClass: SingleNode
              node_type_id: i3.xlarge
              num_workers: 0
              policy_id: policy-replay
              spark_conf:
                spark.databricks.cluster.profile: singleNode
                spark.master: local[*,4]
          max_concurrent_runs: 1
          name: test-job-policy-replay
          queue:
            enabled: false
          tasks:
          - job_cluster_key: test-cluster
            notebook_task:
              notebook_path: /Users/replay@example.com/Terraformpolicy
            task_key: test-task
    response:
      status: 200
      body:
        json:
          job_id: 701
  - &id005
    request:
      method: GET
      path: /api/2.2/jobs/get
      query:
        job_id:
        - '701'
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          creator_user_name: replay@example.com
          job_id: 701
          settings:
            format: MULTI_TASK
            job_clusters:
            - job_cluster_key: test-cluster
              new_cluster:
                apply_policy_default_values: true
                custom_tags:
                  ResourceClass: SingleNode
                node_type_id: i3.xlarge
                num_workers: 0
                policy_id: policy-replay
                spark_conf:
                  spark.databricks.cluster.profile: singleNode
                  spark.master: local[*,4]
            max_concurrent_runs: 1
            name: test-job-policy-replay
            tasks:
            - job_cluster_key: test-cluster
              notebook_task:
                notebook_path: /Users/replay@example.com/Terraformpolicy
                source: WORKSPACE
              task_key: test-task
  - *id001
  - *id002
  - *id003
  - *id002
  - *id001
  - *id003
  - &id006
    request:
      method: GET
      path: /api/2.0/preview/scim/v2/Me
      query:
        excludedAttributes:
        - entitlements
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      headers:
        X-Databricks-Org-Id: '12345'
      body:
        json:
          displayName: Replay tester
          groups:
          - display: admins
            value: admins
          id: '100'
          userName: replay@example.com
  - *id004
  - &id007
    request:
      method: GET
      path: /api/2.0/workspace/get-status
      query:
        path:
        - /Users/replay@example.com/Terraformpolicy
      headers:
        X-Databricks-Workspace-Id: '12345'
      body: null
    response:
      status: 200
      body:
        json:
          language: PYTHON
          object_id: 211
          object_type: NOTEBOOK
          path: /Users/replay@example.com/Terraformpolicy
  - *id005
  state:
    resources:
      databricks_job.this:
        attributes:
        - path:
          - job_cluster
          - 0
          - new_cluster
          - 0
          - apply_policy_default_values
          equals: true
destroy:
  calls:
  - *id002
  - *id001
  - *id003
  - *id004
  - *id006
  - *id007
  - *id005
  - request:
      method: POST
      path: /api/2.2/jobs/delete
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          job_id: 701
    response:
      status: 200
      body: null
  - request:
      method: POST
      path: /api/2.0/workspace/delete
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          path: /Users/replay@example.com/Terraformpolicy
    response:
      status: 200
      body: null
  - request:
      method: POST
      path: /api/2.0/policies/clusters/delete
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          policy_id: policy-replay
    response:
      status: 200
      body: null
