# Pins replacement. Changing catalog_name, schema_name, storage_location or volume_type
# deletes the volume by its old full name, then creates it again. API responses are
# inferred from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_external
    config: &config_first |
      resource "databricks_volume" "this" {
        name             = "replaced_volume"
        catalog_name     = "main"
        schema_name      = "replay"
        volume_type      = "EXTERNAL"
        storage_location = "s3://replay-bucket/volumes/first"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "replaced_volume", "volume_type": "EXTERNAL",
                   "storage_location": "s3://replay-bucket/volumes/first"}
        response:
          status: 200
          body:
            json: &first {"catalog_name": "main", "schema_name": "replay",
                          "name": "replaced_volume",
                          "full_name": "main.replay.replaced_volume",
                          "volume_type": "EXTERNAL", "owner": "replay-admin@example.com",
                          "storage_location": "s3://replay-bucket/volumes/first",
                          "metastore_id": "11111111-1111-1111-1111-111111111111",
                          "volume_id": "00000000-0000-4000-8000-000000000011"}
      - &read_first
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.replaced_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *first
      - *read_first
  - name: plan_after_create_is_empty
    plan_only: true
    config: *config_first
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_first
  - name: changing_catalog_name_replaces
    config: &config_catalog |
      resource "databricks_volume" "this" {
        name             = "replaced_volume"
        catalog_name     = "other_catalog"
        schema_name      = "replay"
        volume_type      = "EXTERNAL"
        storage_location = "s3://replay-bucket/volumes/first"
      }
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete, create]
          before:
            - path: [catalog_name]
              equals: main
          after:
            - path: [catalog_name]
              equals: other_catalog
    calls:
      - *read_first
      - request:
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/main.replay.replaced_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "other_catalog", "schema_name": "replay",
                   "name": "replaced_volume", "volume_type": "EXTERNAL",
                   "storage_location": "s3://replay-bucket/volumes/first"}
        response:
          status: 200
          body:
            json: &catalog {"catalog_name": "other_catalog", "schema_name": "replay",
                            "name": "replaced_volume",
                            "full_name": "other_catalog.replay.replaced_volume",
                            "volume_type": "EXTERNAL",
                            "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-bucket/volumes/first",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000012"}
      - &read_catalog
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/other_catalog.replay.replaced_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *catalog
      - *read_catalog
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: other_catalog.replay.replaced_volume
            - path: [volume_path]
              equals: /Volumes/other_catalog/replay/replaced_volume
  - name: plan_after_catalog_name_replacement_is_empty
    plan_only: true
    config: *config_catalog
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_catalog
  - name: changing_schema_name_replaces
    config: &config_schema |
      resource "databricks_volume" "this" {
        name             = "replaced_volume"
        catalog_name     = "other_catalog"
        schema_name      = "other_schema"
        volume_type      = "EXTERNAL"
        storage_location = "s3://replay-bucket/volumes/first"
      }
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete, create]
          before:
            - path: [schema_name]
              equals: replay
          after:
            - path: [schema_name]
              equals: other_schema
    calls:
      - *read_catalog
      - request:
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/other_catalog.replay.replaced_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "other_catalog", "schema_name": "other_schema",
                   "name": "replaced_volume", "volume_type": "EXTERNAL",
                   "storage_location": "s3://replay-bucket/volumes/first"}
        response:
          status: 200
          body:
            json: &schema {"catalog_name": "other_catalog", "schema_name": "other_schema",
                           "name": "replaced_volume",
                           "full_name": "other_catalog.other_schema.replaced_volume",
                           "volume_type": "EXTERNAL", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-bucket/volumes/first",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000013"}
      - &read_schema
        request: &read_schema_request
          method: GET
          path: /api/2.1/unity-catalog/volumes/other_catalog.other_schema.replaced_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: *schema
      - *read_schema
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: other_catalog.other_schema.replaced_volume
  - name: plan_after_schema_name_replacement_is_empty
    plan_only: true
    config: *config_schema
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_schema
  - name: changing_storage_location_replaces
    config: &config_location |
      resource "databricks_volume" "this" {
        name             = "replaced_volume"
        catalog_name     = "other_catalog"
        schema_name      = "other_schema"
        volume_type      = "EXTERNAL"
        storage_location = "s3://replay-bucket/volumes/second"
      }
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete, create]
          before:
            - path: [storage_location]
              equals: s3://replay-bucket/volumes/first
          after:
            - path: [storage_location]
              equals: s3://replay-bucket/volumes/second
    calls:
      - *read_schema
      - &delete_schema
        request:
          method: DELETE
          path: /api/2.1/unity-catalog/volumes/other_catalog.other_schema.replaced_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "other_catalog", "schema_name": "other_schema",
                   "name": "replaced_volume", "volume_type": "EXTERNAL",
                   "storage_location": "s3://replay-bucket/volumes/second"}
        response:
          status: 200
          body:
            json: &location {"catalog_name": "other_catalog",
                             "schema_name": "other_schema", "name": "replaced_volume",
                             "full_name": "other_catalog.other_schema.replaced_volume",
                             "volume_type": "EXTERNAL",
                             "owner": "replay-admin@example.com",
                             "storage_location": "s3://replay-bucket/volumes/second",
                             "metastore_id": "11111111-1111-1111-1111-111111111111",
                             "volume_id": "00000000-0000-4000-8000-000000000014"}
      - &read_location
        request: *read_schema_request
        response:
          status: 200
          body:
            json: *location
      - *read_location
  - name: plan_after_storage_location_replacement_is_empty
    plan_only: true
    config: *config_location
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_location
  - name: changing_volume_type_replaces
    config: &config_type |
      resource "databricks_volume" "this" {
        name         = "replaced_volume"
        catalog_name = "other_catalog"
        schema_name  = "other_schema"
        volume_type  = "MANAGED"
      }
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [delete, create]
          before:
            - path: [volume_type]
              equals: EXTERNAL
          after:
            - path: [volume_type]
              equals: MANAGED
    calls:
      - *read_location
      - *delete_schema
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "other_catalog", "schema_name": "other_schema",
                   "name": "replaced_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &managed {"catalog_name": "other_catalog",
                            "schema_name": "other_schema", "name": "replaced_volume",
                            "full_name": "other_catalog.other_schema.replaced_volume",
                            "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                            "storage_location": "s3://replay-metastore/volume-15",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000000015"}
      - &read_managed
        request: *read_schema_request
        response:
          status: 200
          body:
            json: *managed
      - *read_managed
  - name: plan_after_volume_type_replacement_is_empty
    plan_only: true
    config: *config_type
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_managed
destroy:
  calls:
    - *read_managed
    - *delete_schema
