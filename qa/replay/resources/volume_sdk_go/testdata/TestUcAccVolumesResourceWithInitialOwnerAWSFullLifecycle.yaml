        storage_location = databricks_external_location.some.url
      }
    calls:
      - *get_1
      - *get_2
      - *get_3
      - *get_5
      - request:
          method: "PATCH"
          path: "/api/2.1/unity-catalog/volumes/main.schema-replay.name-abc"
          headers:
            Content-Type: "application/json"
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json:
              full_name_arg: "main.schema-replay.name-abc"
              owner: "replay-test_metastore_admin_group_name"
        response: &response_7 # Inferred API response; not recorded.
          status: 200
          body:
            json:
              catalog_name: "main"
              comment: "comment-abc"
              full_name: "main.schema-replay.name-abc"
              metastore_id: "11111111-1111-1111-1111-111111111111"
              name: "name-abc"
              owner: "replay-test_metastore_admin_group_name"
              schema_name: "schema-replay"
              storage_location: "s3://replay-bucket/somepath-replay"
              volume_id: "volume-1"
              volume_type: "EXTERNAL"
      - request:
          method: "PATCH"
          path: "/api/2.1/unity-catalog/volumes/main.schema-replay.name-abc"
          headers:
            Content-Type: "application/json"
