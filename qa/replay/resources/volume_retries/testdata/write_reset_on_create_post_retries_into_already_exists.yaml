# This journey pins a create POST that reaches the server, which creates the volume and
# then resets the connection before responding. The SDK retries the reset with the same
# body, and the server rejects the retry because the volume now exists. Apply fails
# with the conflict's message and no ID is stored, so destroy has nothing to delete,
# although the first POST created the volume. API responses are inferred from the Unity
# Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_post_retried_after_a_reset_fails_with_already_exists
    config: |
      resource "databricks_volume" "this" {
        name         = "retry_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "owner-a@example.com"
      }
    expect_error: 'Error: cannot create volume: Volume ''main\.replay\.retry_volume''
      already exists\n'
    calls:
      - request: &create
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "retry_volume", "volume_type": "MANAGED"}
        response:
          fault: reset
      - request: *create
        response:
          status: 409
          body:
            json: {"error_code": "RESOURCE_ALREADY_EXISTS",
                   "message": "Volume 'main.replay.retry_volume' already exists"}
destroy:
  calls: []
