# Supplies volume calls for TestVolumeSdkGoUserAgent, which checks their User-Agent in Go
# with reads and writes through sdk-go uc/volumes/v1. It has the requests of
# volume/native_testdata/user_agent.yaml, except that the volume POST, GET and PATCH
# requests carry no Accept header, which an empty header expectation pins, and the PATCH
# body also carries full_name_arg, the full name in its path. API responses are inferred
# from the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_owner
    config: |
      resource "databricks_volume" "this" {
        name         = "user_agent_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        owner        = "data-engineers"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "user_agent_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "user_agent_volume",
                   "full_name": "main.replay.user_agent_volume", "volume_type": "MANAGED",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-81",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000081"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.user_agent_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.user_agent_volume",
                   "owner": "data-engineers"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "user_agent_volume",
                           "full_name": "main.replay.user_agent_volume",
                           "volume_type": "MANAGED", "owner": "data-engineers",
                           "storage_location": "s3://replay-metastore/volume-81",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000000081"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.user_agent_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *volume
      - *read_volume
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.user_agent_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
