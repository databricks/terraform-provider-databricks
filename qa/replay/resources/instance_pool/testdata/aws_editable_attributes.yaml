# API responses are inferred from the API models, not recorded.
version: 1
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: '12345'
steps:
  - name: create_with_fallback
    config: |
      resource "databricks_instance_pool" "this" {
        instance_pool_name                    = "editable-pool"
        node_type_id                          = "i3.xlarge"
        idle_instance_autotermination_minutes = 10
        max_capacity                          = 1
        aws_attributes {
          availability           = "SPOT_WITH_FALLBACK"
          zone_id                = "auto"
          spot_bid_price_percent = 100
        }
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/instance-pools/create
          body:
            json:
              instance_pool_name: editable-pool
              node_type_id: i3.xlarge
              idle_instance_autotermination_minutes: 10
              max_capacity: 1
              enable_elastic_disk: true
              custom_tags: null
              aws_attributes: &id001
                availability: SPOT_WITH_FALLBACK
                zone_id: auto
                spot_bid_price_percent: 100
        response:
          status: 200
          body:
            json:
              instance_pool_id: pool-1
      - &id002
        request:
          method: GET
          path: /api/2.0/instance-pools/get
          query:
            instance_pool_id:
              - pool-1
          body: null
        response:
