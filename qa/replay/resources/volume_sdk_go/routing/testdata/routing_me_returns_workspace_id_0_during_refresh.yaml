# Runs volume_routing/testdata/routing_me_returns_workspace_id_0_during_refresh.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same behavior.
# The volume POST requests carry no Accept header, which an empty header expectation pins.
# The original's description:
#
# Pins SCIM /Me answering with X-Databricks-Org-Id 0 during a refresh, on a
# workspace-level provider whose host metadata has no workspace ID and without a
# provider_config block. The volume's state holds the ID that /Me returned at create.
# The refresh checks that ID against the provider's workspace through /Me, caches 0 and
# fails with a workspace_id mismatch before the volume GET. API responses are inferred
# from the Unity Catalog and SCIM API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
steps:
  - name: create_resolves_workspace_id_through_me
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config |
      resource "databricks_volume" "this" {
        name         = "me_zero_refresh_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "me_zero_refresh_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "me_zero_refresh_volume",
                           "full_name": "main.replay.me_zero_refresh_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1908",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001908"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.me_zero_refresh_volume
          body: null
        response:
          status: 200
          body:
            json: *volume
      # provider_config population after create's read.
      - &me
        request: &me_request
          method: GET
          path: /api/2.0/preview/scim/v2/Me
          query:
            excludedAttributes: [entitlements]
          body: null
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: "12345"
          body:
            json: &me_body {"id": "1001", "userName": "replay-admin@example.com",
                            "schemas": ["urn:ietf:params:scim:schemas:core:2.0:User"]}
      # The post-apply plan without refresh.
      - *me
      # The post-apply refresh plan.
      - *me
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: refresh_fails_when_me_returns_workspace_id_0
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config
    expect_error: 'cannot read volume: failed to validate workspace_id: workspace_id
      mismatch: provider is configured for workspace 0 but got 12345 in
      provider_config\. please check the workspace_id provided in provider_config'
    calls:
      - request: *me_request
        response:
          status: 200
          headers:
            X-Databricks-Org-Id: "0"
          body:
            json: *me_body
destroy:
  calls:
    - *me
    - *read_volume
    - *me
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.me_zero_refresh_volume
        body: null
      response:
        status: 200
        body:
          json: {}
