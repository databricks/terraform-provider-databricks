# Runs volume_routing/testdata/routing_provider_workspace_id_on_account_provider.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same behavior.
# The volume POST, GET and PATCH requests carry no Accept header, which an empty header
# expectation pins. Each PATCH body also carries full_name_arg, the full name in its path,
# because sdk-go serializes the path field into the body. The original's description:
#
# Pins an account-level provider whose only workspace ID is the provider-level
# workspace_id. Without a provider_config block, create, import, update and delete all
# fall back to that ID: every Terraform command that touches the volume looks the
# workspace up through the account API once, then sends each volume call with its
# X-Databricks-Workspace-Id header, and create and import write the ID to
# provider_config.workspace_id. API responses are inferred from the account and Unity
# Catalog API contracts, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: account
  cloud: AWS
  account_id: replay-account
steps:
  - name: create_falls_back_to_provider_workspace_id
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {
        account_id   = "replay-account"
        workspace_id = "12345"
      }
      resource "databricks_volume" "this" {
        name         = "provider_ws_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - &lookup_12345
        request:
          method: GET
          path: /api/2.0/accounts/replay-account/workspaces/12345
          body: null
        response:
          status: 200
          body:
            json: {"account_id": "replay-account", "workspace_id": 12345,
                   "workspace_name": "replay-workspace-12345",
                   "deployment_name": "replay-workspace-12345",
                   "workspace_status": "RUNNING"}
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "provider_ws_volume", "volume_type": "MANAGED"}
        response:
          status: 200
          body:
            json: &volume {"catalog_name": "main", "schema_name": "replay",
                           "name": "provider_ws_volume",
                           "full_name": "main.replay.provider_ws_volume",
                           "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                           "storage_location": "s3://replay-metastore/volume-1901",
                           "metastore_id": "11111111-1111-1111-1111-111111111111",
                           "volume_id": "00000000-0000-4000-8000-000000001901"}
      - &read_volume
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.provider_ws_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *volume
      # The post-apply refresh plan.
      - *lookup_12345
      - *read_volume
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
  - name: import_falls_back_to_provider_workspace_id
    sdk_implementations:
      databricks_volume: sdk_go
    import:
      resource: databricks_volume.this
      persist: false
      verify: true
    calls:
      - *lookup_12345
      - *read_volume
      - *read_volume
  - name: update_falls_back_to_provider_workspace_id
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      provider "databricks" {
        account_id   = "replay-account"
        workspace_id = "12345"
      }
      resource "databricks_volume" "this" {
        name         = "provider_ws_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "routed by the provider"
      }
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          after:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
    calls:
      # The plan's refresh.
      - *lookup_12345
      - *read_volume
      # The apply.
      - *lookup_12345
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.provider_ws_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.provider_ws_volume",
                   "comment": "routed by the provider"}
        response:
          status: 200
          body:
            json: &commented {"catalog_name": "main", "schema_name": "replay",
                              "name": "provider_ws_volume",
                              "full_name": "main.replay.provider_ws_volume",
                              "volume_type": "MANAGED",
                              "comment": "routed by the provider",
                              "owner": "replay-admin@example.com",
                              "storage_location": "s3://replay-metastore/volume-1901",
                              "metastore_id": "11111111-1111-1111-1111-111111111111",
                              "volume_id": "00000000-0000-4000-8000-000000001901"}
      - &read_commented
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.provider_ws_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *commented
      # The post-apply refresh plan.
      - *lookup_12345
      - *read_commented
    state:
      resources:
        databricks_volume.this:
          attributes:
            - path: [provider_config, 0, workspace_id]
              equals: "12345"
destroy:
  calls:
    - *lookup_12345
    - *read_commented
    - *lookup_12345
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.provider_ws_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
