# API responses are placeholders based on the API models, not recorded.
version: 1
host_metadata:
  cloud: AWS
  host_type: workspace
  workspace_id: '12345'
steps:
- name: create
  config: |
    resource "databricks_schema" "this" {
      name         = "replay"
      catalog_name = "main"
    }

    resource "databricks_sql_table" "this" {
      name         = "bar"
      catalog_name = "main"
      schema_name  = databricks_schema.this.name
      table_type   = "MANAGED"
      warehouse_id = "warehouse-1"
      properties = {
        this      = "that"
        something = "else"
      }

      column {
        name = "id"
        type = "int"
      }
      column {
        name = "name"
        type = "string"
      }
      comment = "this table is managed by terraform"
      owner   = "account users"
    }
  calls:
  - request:
      method: POST
      path: /api/2.1/unity-catalog/schemas
      headers:
        X-Databricks-Workspace-Id: '12345'
      body:
        json:
          catalog_name: main
          name: replay
    response:
      status: 200
      body:
        json:
          catalog_name: main
          enable_predictive_optimization: INHERIT
          full_name: main.replay
          name: replay
          owner: replay-admin
  - &id002
    request:
      method: GET
