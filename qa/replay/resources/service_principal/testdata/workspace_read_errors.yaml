# Pins workspace-level refresh error handling on AWS. A 403 and a 500 with a non-JSON
# body fail with their exact diagnostics and keep the resource in state; a 404 removes
# it, and the same apply recreates it. API responses are inferred from the SCIM API
# contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_service_principal" "this" {
        display_name = "SPN read errors"
      }
    calls:
      - request:
          method: POST
          path: /api/2.0/preview/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/scim+json; charset=utf-8
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "displayName": "SPN read errors", "active": true, "entitlements": [{}]}
        response:
          status: 201
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN read errors", "active": true}
      - &read_created
        request: &read_request
          method: GET
          path: /api/2.0/preview/scim/v2/ServicePrincipals/201
          query:
            attributes: ["userName,displayName,active,externalId,entitlements"]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "201", "applicationId": "00000000-0000-4000-8000-000000000001",
                   "displayName": "SPN read errors", "active": true}
      - *read_created
  - name: refresh_answered_403_fails
    config: *config
    expect_error: 'Error: cannot read service principal: User is not authorized to access
      this service principal\.'
    calls:
      - request: *read_request
        response:
          status: 403
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "User is not authorized to access this service principal.",
                   "status": "403"}
  - name: state_kept_after_403
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_service_principal.this:
          attributes:
            - path: [id]
              equals: "201"
    calls:
      - *read_created
  - name: refresh_answered_500_with_non_json_body_fails
    config: *config
    expect_error: 'Error: cannot read service principal: upstream connect error or
      disconnect/reset before headers'
    calls:
      - request: *read_request
        response:
          status: 500
          body:
            text: upstream connect error or disconnect/reset before headers
  - name: state_kept_after_500
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    state:
      resources:
        databricks_service_principal.this:
          attributes:
            - path: [id]
              equals: "201"
    calls:
      - *read_created
  - name: refresh_answered_404_removes_and_recreates
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_service_principal.this:
          actions: [create]
    calls:
      - request: *read_request
        response:
          status: 404
          body:
            json: {"schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"],
                   "detail": "Service Principal with id 201 not found.", "status": "404"}
      - request:
          method: POST
          path: /api/2.0/preview/scim/v2/ServicePrincipals
          headers:
            Content-Type: application/scim+json; charset=utf-8
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "displayName": "SPN read errors", "active": true, "entitlements": [{}]}
        response:
          status: 201
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "202", "applicationId": "00000000-0000-4000-8000-000000000002",
                   "displayName": "SPN read errors", "active": true}
      - &read_recreated
        request:
          method: GET
          path: /api/2.0/preview/scim/v2/ServicePrincipals/202
          query:
            attributes: ["userName,displayName,active,externalId,entitlements"]
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response:
          status: 200
          body:
            json: {"schemas": ["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
                   "id": "202", "applicationId": "00000000-0000-4000-8000-000000000002",
                   "displayName": "SPN read errors", "active": true}
      - *read_recreated
    state:
      resources:
        databricks_service_principal.this:
          attributes:
            - path: [id]
              equals: "202"
            - path: [application_id]
              equals: 00000000-0000-4000-8000-000000000002
  - name: plan_after_recreate_is_empty
    plan_only: true
    config: *config
    plan:
      expect: empty
      changes: {}
    calls:
      - *read_recreated
destroy:
  calls:
    - *read_recreated
    - request:
        method: DELETE
        path: /api/2.0/preview/scim/v2/ServicePrincipals/202
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 204
        body: null
