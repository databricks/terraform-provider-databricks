# Runs volume_call_sites/testdata/call_site_fields_patch_after_owner_patch.yaml with
# databricks_volume on sdk-go uc/volumes/v1 in every step, and expects the same behavior,
# except where noted. The volume POST, GET, PATCH and DELETE requests carry no Accept
# header, which an empty header expectation pins. Each PATCH body also carries
# full_name_arg, the full name in its path, because sdk-go serializes the path field into
# the body. A fields PATCH answered 200 with malformed JSON fails apply with the same
# unmarshal error, but without the existing client's request log, so its pattern ends at
# the error. The original's description:
#
# Pins the fields PATCH that follows a successful owner PATCH in Update, failing with 404,
# 401, 502, 504 with a message that matches no transient pattern, and 200 with malformed
# JSON. Each update renames the volume, changes its comment and changes its owner. After
# every failure a PATCH to the old name restores the old owner, and apply fails with the
# fields PATCH's error without a read. The volume keeps its old ID, so the next plan
# refreshes the old name and plans the same update again. API responses are inferred from
# the Unity Catalog API contract, not recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create_with_owner
    sdk_implementations:
      databricks_volume: sdk_go
    config: |
      resource "databricks_volume" "this" {
        name         = "fields_owner_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "first"
        owner        = "owner-a@example.com"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "fields_owner_volume", "volume_type": "MANAGED",
                   "comment": "first"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "fields_owner_volume",
                   "full_name": "main.replay.fields_owner_volume",
                   "volume_type": "MANAGED", "comment": "first",
                   "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-1925",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001925"}
      - request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.fields_owner_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.fields_owner_volume",
                   "comment": "first", "owner": "owner-a@example.com"}
        response: &owner_a
          status: 200
          body:
            json: &created {"catalog_name": "main", "schema_name": "replay",
                            "name": "fields_owner_volume",
                            "full_name": "main.replay.fields_owner_volume",
                            "volume_type": "MANAGED", "comment": "first",
                            "owner": "owner-a@example.com",
                            "storage_location": "s3://replay-metastore/volume-1925",
                            "metastore_id": "11111111-1111-1111-1111-111111111111",
                            "volume_id": "00000000-0000-4000-8000-000000001925"}
      - &read_created
        request:
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.fields_owner_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body: null
        response:
          status: 200
          body:
            json: *created
      - *read_created
  - name: fields_patch_404_rolls_back_the_owner_on_the_old_name
    sdk_implementations:
      databricks_volume: sdk_go
    config: &config_updated |
      resource "databricks_volume" "this" {
        name         = "fields_owner_renamed"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
        comment      = "second"
        owner        = "owner-b@example.com"
      }
    expect_error: 'Error: cannot update volume: Volume
      ''main\.replay\.fields_owner_volume'' does not exist\.\n'
    calls:
      - *read_created
      - &owner_patch
        request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.fields_owner_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.fields_owner_volume",
                   "owner": "owner-b@example.com"}
        response:
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "fields_owner_volume",
                   "full_name": "main.replay.fields_owner_volume",
                   "volume_type": "MANAGED", "comment": "first",
                   "owner": "owner-b@example.com",
                   "storage_location": "s3://replay-metastore/volume-1925",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000001925"}
      - request: &fields_patch_request
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.fields_owner_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.fields_owner_volume",
                   "new_name": "fields_owner_renamed", "comment": "second"}
        response:
          status: 404
          body:
            json: {"error_code": "RESOURCE_DOES_NOT_EXIST",
                   "message": "Volume 'main.replay.fields_owner_volume' does not exist."}
      - &rollback_patch
        request:
          method: PATCH
          path: /api/2.1/unity-catalog/volumes/main.replay.fields_owner_volume
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
            Accept: ""
          body:
            json: {"full_name_arg": "main.replay.fields_owner_volume",
                   "owner": "owner-a@example.com"}
        response: *owner_a
  - name: plan_after_404_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: &plans_the_same_update
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [update]
          before:
            - path: [name]
              equals: fields_owner_volume
            - path: [comment]
              equals: first
            - path: [owner]
              equals: owner-a@example.com
          after:
            - path: [name]
              equals: fields_owner_renamed
            - path: [comment]
              equals: second
            - path: [owner]
              equals: owner-b@example.com
    state: &old_id
      resources:
        databricks_volume.this:
          attributes:
            - path: [id]
              equals: main.replay.fields_owner_volume
    calls:
      - *read_created
  - name: fields_patch_401_rolls_back_the_owner_on_the_old_name
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Credential was not sent or was of an
      unsupported type for this API\.\n'
    calls:
      - *read_created
      - *owner_patch
      - request: *fields_patch_request
        response:
          status: 401
          body:
            json: {"error_code": "UNAUTHENTICATED",
                   "message": "Credential was not sent or was of an unsupported type for
                     this API."}
      - *rollback_patch
  - name: plan_after_401_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: *plans_the_same_update
    state: *old_id
    calls:
      - *read_created
  - name: fields_patch_502_rolls_back_the_owner_on_the_old_name
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Bad gateway\.\n'
    calls:
      - *read_created
      - *owner_patch
      - request: *fields_patch_request
        response:
          status: 502
          body:
            json: {"error_code": "BAD_GATEWAY", "message": "Bad gateway."}
      - *rollback_patch
  - name: plan_after_502_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: *plans_the_same_update
    state: *old_id
    calls:
      - *read_created
  - name: fields_patch_504_with_a_non_transient_message_rolls_back_without_retry
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: Upstream request timeout\.\n'
    calls:
      - *read_created
      - *owner_patch
      - request: *fields_patch_request
        response:
          status: 504
          body:
            json: {"error_code": "DEADLINE_EXCEEDED",
                   "message": "Upstream request timeout."}
      - *rollback_patch
  - name: plan_after_504_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: *plans_the_same_update
    state: *old_id
    calls:
      - *read_created
  - name: fields_patch_200_with_malformed_json_rolls_back_the_owner_on_the_old_name
    sdk_implementations:
      databricks_volume: sdk_go
    config: *config_updated
    expect_error: 'Error: cannot update volume: failed to unmarshal response body:
      unexpected end of JSON input\n'
    calls:
      - *read_created
      - *owner_patch
      - request: *fields_patch_request
        response:
          status: 200
          headers:
            Content-Type: application/json
          body:
            text: '{"full_name": "main.replay.fields_owner_renamed",'
      - *rollback_patch
  - name: plan_after_malformed_json_keeps_the_old_id_and_plans_the_same_update
    sdk_implementations:
      databricks_volume: sdk_go
    plan_only: true
    config: *config_updated
    plan: *plans_the_same_update
    state: *old_id
    calls:
      - *read_created
destroy:
  calls:
    - *read_created
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.fields_owner_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
          Accept: ""
        body: null
      response:
        status: 200
        body:
          json: {}
