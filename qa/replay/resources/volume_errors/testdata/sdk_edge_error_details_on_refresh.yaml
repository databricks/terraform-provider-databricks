# Pins how the classic SDK handles an error body that carries every error detail type it
# knows (ErrorInfo, RequestInfo, RetryInfo, DebugInfo, QuotaFailure, PreconditionFailure,
# BadRequest, ResourceInfo and Help) plus one it does not (LocalizedMessage), on a
# databricks_volume refresh GET. The diagnostic shows only the message. The details do
# not change the outcome: the 400 fails without a retry, despite RetryInfo, and keeps the
# volume, so the next step reads it again; the 404 removes the volume from state, also
# without a retry. API responses are inferred from the Unity Catalog API contract, not
# recorded.
version: 1
enforce_call_order: true
host_metadata:
  host_type: workspace
  cloud: AWS
  workspace_id: "12345"
steps:
  - name: create
    config: &config |
      resource "databricks_volume" "this" {
        name         = "details_volume"
        catalog_name = "main"
        schema_name  = "replay"
        volume_type  = "MANAGED"
      }
    calls:
      - request:
          method: POST
          path: /api/2.1/unity-catalog/volumes
          headers:
            Content-Type: application/json
            X-Databricks-Workspace-Id: "12345"
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "details_volume", "volume_type": "MANAGED"}
        response: &volume
          status: 200
          body:
            json: {"catalog_name": "main", "schema_name": "replay",
                   "name": "details_volume", "full_name": "main.replay.details_volume",
                   "volume_type": "MANAGED", "owner": "replay-admin@example.com",
                   "storage_location": "s3://replay-metastore/volume-305",
                   "metastore_id": "11111111-1111-1111-1111-111111111111",
                   "volume_id": "00000000-0000-4000-8000-000000000305"}
      - &read_volume
        request: &read
          method: GET
          path: /api/2.1/unity-catalog/volumes/main.replay.details_volume
          headers:
            X-Databricks-Workspace-Id: "12345"
          body: null
        response: *volume
      - *read_volume
  - name: refresh_answered_400_with_every_detail_type_fails_with_message_only
    config: *config
    expect_error: 'Error: cannot read volume: Volume details_volume cannot be read\.\n'
    calls:
      - request: *read
        response:
          status: 400
          body:
            json:
              error_code: INVALID_PARAMETER_VALUE
              message: Volume details_volume cannot be read.
              details: &details
                - "@type": type.googleapis.com/google.rpc.ErrorInfo
                  reason: VOLUME_READ_FAILED
                  domain: unity-catalog.databricks.com
                  metadata: {volume: main.replay.details_volume}
                - "@type": type.googleapis.com/google.rpc.RequestInfo
                  request_id: 00000000-0000-4000-8000-0000000003a1
                  serving_data: fixture-serving-data
                - "@type": type.googleapis.com/google.rpc.RetryInfo
                  retry_delay: 1s
                - "@type": type.googleapis.com/google.rpc.DebugInfo
                  stack_entries: [VolumeService.get, UnityCatalogServer.handle]
                  detail: Volume lookup failed in the fixture.
                - "@type": type.googleapis.com/google.rpc.QuotaFailure
                  violations:
                    - subject: workspace:12345
                      description: Daily volume reads exceeded.
                - "@type": type.googleapis.com/google.rpc.PreconditionFailure
                  violations:
                    - type: VOLUME_STATE
                      subject: main.replay.details_volume
                      description: Volume is being moved.
                - "@type": type.googleapis.com/google.rpc.BadRequest
                  field_violations:
                    - field: full_name
                      description: Volume name is not valid.
                - "@type": type.googleapis.com/google.rpc.ResourceInfo
                  resource_type: volume
                  resource_name: main.replay.details_volume
                  owner: replay-admin@example.com
                  description: Volume cannot be read.
                - "@type": type.googleapis.com/google.rpc.Help
                  links:
                    - description: Volume documentation
                      url: https://docs.example.com/volumes
                - "@type": type.googleapis.com/google.rpc.LocalizedMessage
                  locale: en-US
                  message: Volume details_volume cannot be read.
  - name: refresh_answered_404_with_every_detail_type_plans_create
    plan_only: true
    config: *config
    plan:
      expect: non_empty
      changes:
        databricks_volume.this:
          actions: [create]
    calls:
      - request: *read
        response:
          status: 404
          body:
            json:
              error_code: NOT_FOUND
              message: Volume main.replay.details_volume does not exist.
              details: *details
destroy:
  calls:
    - *read_volume
    - request:
        method: DELETE
        path: /api/2.1/unity-catalog/volumes/main.replay.details_volume
        headers:
          X-Databricks-Workspace-Id: "12345"
        body: null
      response:
        status: 200
        body:
          json: {}
